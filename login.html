<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>লগইন | শাহমাহমুদপুর বাজার</title><link rel="stylesheet" href="style.css"></head><body><main class="auth"><div class="authbox"><a class="brand" href="index.html"><b>শাহমাহমুদপুর</b><strong>বাজার</strong><small>LOCAL MARKETPLACE</small></a><h1>স্বাগতম 👋</h1><p class="muted">আপনার account-এ login করুন।</p><form id="form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><button class="btn green" style="width:100%">LOGIN →</button></form><p id="msg" class="msg"></p><p class="center"><a href="register.html">নতুন account তৈরি করুন →</a></p><p class="center"><a href="index.html">← Homepage</a></p></div></main><script>const USERS_KEY="smb_users_v1",USER_KEY="smb_user_v1";form.onsubmit=e=>{e.preventDefault();let u=JSON.parse(localStorage.getItem(USERS_KEY)||"[]").find(x=>x.email===email.value.trim().toLowerCase()&&x.password===password.value);if(!u){msg.textContent="Email অথবা password সঠিক নয়।";return}localStorage.setItem(USER_KEY,JSON.stringify(u));location.href=new URLSearchParams(location.search).get("next")||"index.html"}</script></body></html>
