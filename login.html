<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>
Login | শাহমাহমুদপুর বাজার
</title>

<link
  rel="stylesheet"
  href="style.css">


<style>

/* ============================================================
   LOGIN PAGE - WHITE MARKETPLACE DESIGN
============================================================ */

:root{

  --green:#0b8f4b;
  --green-dark:#05743a;
  --green-light:#e9f8ef;

  --text:#1d2923;
  --muted:#758078;

  --border:#e6ece8;

  --bg:#f8faf9;

  --card:#ffffff;

  --shadow:
    0 18px 50px
    rgba(30,55,42,.10);

}


/* ============================================================
   BODY
============================================================ */

body{

  margin:0;

  color:var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:

    radial-gradient(
      circle at 15% 20%,
      rgba(192,244,207,.45),
      transparent 28%
    ),

    radial-gradient(
      circle at 85% 80%,
      rgba(211,244,217,.55),
      transparent 30%
    ),

    linear-gradient(
      180deg,
      #f8faf9 0%,
      #ffffff 50%,
      #f4faf6 100%
    );

}


/* ============================================================
   LOGIN PAGE
============================================================ */

.login-page{

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:24px 16px;

}


/* ============================================================
   LOGIN BOX
============================================================ */

.login-box{

  width:100%;

  max-width:430px;

  padding:
    40px
    30px
    32px;

  text-align:center;

  border:
    1px solid
    rgba(11,143,75,.10);

  border-radius:24px;

  background:
    rgba(255,255,255,.94);

  box-shadow:
    var(--shadow);

  position:relative;

  overflow:hidden;

}


/* TOP SOFT GREEN GLOW */

.login-box:before{

  content:"";

  position:absolute;

  width:260px;

  height:260px;

  top:-150px;

  left:50%;

  transform:
    translateX(-50%);

  border-radius:50%;

  background:

    radial-gradient(
      circle,
      rgba(192,244,207,.55),
      rgba(192,244,207,0)
    );

  pointer-events:none;

}


/* ============================================================
   BRAND
============================================================ */

.login-brand{

  position:relative;

  z-index:2;

  display:inline-flex;

  flex-direction:column;

  align-items:center;

  line-height:1;

  margin-bottom:30px;

}


.login-brand:before{

  content:"🛍";

  width:50px;

  height:50px;

  margin-bottom:13px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:15px;

  background:

    linear-gradient(
      135deg,
      #0d9b55,
      #05743a
    );

  font-size:27px;

  box-shadow:

    0 10px 22px
    rgba(11,143,75,.20);

}


.login-brand b{

  color:#27352e;

  font-size:22px;

  font-weight:900;

  letter-spacing:-.5px;

}


.login-brand strong{

  margin-top:3px;

  color:var(--green);

  font-size:22px;

  font-weight:900;

}


.login-brand small{

  margin-top:9px;

  color:#7d8981;

  font-family:
    Arial,
    sans-serif;

  font-size:7px;

  font-weight:800;

  letter-spacing:3px;

}


/* ============================================================
   TITLE
============================================================ */

.login-box h1{

  position:relative;

  z-index:2;

  margin:0;

  color:#213129;

  font-size:27px;

  font-weight:900;

  letter-spacing:-.5px;

}


.login-subtitle{

  position:relative;

  z-index:2;

  margin:
    9px
    0
    27px;

  color:#718078;

  font-size:11px;

  line-height:1.7;

}


/* ============================================================
   GOOGLE BUTTON
============================================================ */

.google-btn{

  position:relative;

  z-index:2;

  width:100%;

  height:54px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:11px;

  border:
    1px solid
    #dfe8e2;

  border-radius:14px;

  background:#fff;

  color:#202822;

  font-family:
    Arial,
    sans-serif;

  font-size:14px;

  font-weight:800;

  cursor:pointer;

  box-shadow:

    0 6px 18px
    rgba(30,55,42,.06);

  transition:
    .25s ease;

}


.google-btn:hover{

  transform:
    translateY(-2px);

  border-color:
    rgba(11,143,75,.30);

  box-shadow:

    0 12px 28px
    rgba(11,143,75,.12);

}


.google-btn:disabled{

  opacity:.65;

  cursor:wait;

}


.google-icon{

  width:21px;

  height:21px;

  flex-shrink:0;

}


/* ============================================================
   MESSAGE
============================================================ */

.login-message{

  position:relative;

  z-index:2;

  min-height:20px;

  margin-top:14px;

  color:#e64a4a;

  font-size:10px;

  font-weight:700;

}


/* ============================================================
   SECURITY INFO
============================================================ */

.secure{

  position:relative;

  z-index:2;

  margin-top:20px;

  padding:
    13px
    15px;

  border-radius:13px;

  background:
    #f4fbf6;

  border:
    1px solid
    rgba(11,143,75,.08);

  color:#718078;

  font-size:9px;

  line-height:1.8;

}


.secure span{

  color:var(--green);

  font-weight:800;

}


/* ============================================================
   BACK HOME
============================================================ */

.back-home{

  position:relative;

  z-index:2;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  margin-top:22px;

  color:#6f7d75;

  font-size:10px;

  font-weight:700;

  transition:.2s;

}


.back-home:hover{

  color:var(--green);

  transform:
    translateX(-2px);

}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:600px){

  .login-page{

    align-items:center;

    padding:
      18px
      14px;

  }


  .login-box{

    padding:
      34px
      20px
      28px;

    border-radius:21px;

  }


  .login-brand{

    margin-bottom:26px;

  }


  .login-brand:before{

    width:46px;

    height:46px;

    margin-bottom:11px;

    border-radius:14px;

    font-size:24px;

  }


  .login-brand b{

    font-size:20px;

  }


  .login-brand strong{

    font-size:20px;

  }


  .login-box h1{

    font-size:25px;

  }


  .login-subtitle{

    font-size:10px;

    margin-bottom:24px;

  }


  .google-btn{

    height:52px;

    font-size:13px;

    border-radius:13px;

  }


  .secure{

    font-size:8px;

  }

}

</style>

</head>


<body>


<main class="login-page">


<section class="login-box">


<a
  href="/"
  class="login-brand">

  <b>
    শাহমাহমুদপুর
  </b>

  <strong>
    বাজার
  </strong>

  <small>
    LOCAL MARKETPLACE
  </small>

</a>


<h1>

  স্বাগতম 👋

</h1>


<p class="login-subtitle">

  আপনার Google account দিয়ে

  <br>

  নিরাপদে Login করুন।

</p>


<button
  id="googleLogin"
  class="google-btn"
  type="button">


<svg
  class="google-icon"
  viewBox="0 0 24 24">

<path
fill="#4285F4"
d="M21.35 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"/>

<path
fill="#34A853"
d="M12 21.6c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.7-1.72-5.47-4.04H3.29v2.52A9.74 9.74 0 0 0 12 21.6z"/>

<path
fill="#FBBC05"
d="M6.53 13.68A5.85 5.85 0 0 1 6.22 12c0-.58.1-1.15.31-1.68V7.8H3.29A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.06 1.04 4.2l3.24-2.52z"/>

<path
fill="#EA4335"
d="M12 6.28c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.31 14.63 2.4 12 2.4a9.74 9.74 0 0 0-8.71 5.4l3.24 2.52C7.3 8 9.46 6.28 12 6.28z"/>

</svg>


Continue with Google


</button>


<p
  id="loginMessage"
  class="login-message">

</p>


<div class="secure">

🔒

<span>
Secure Google Login
</span>

<br>

আপনার Google password এই সাইটে সংরক্ষণ করা হয় না।

</div>


<a
  href="/"
  class="back-home">

← Homepage

</a>


</section>


</main>


<script src="supabase.js?v=9"></script>


<script>

(function(){

  const button =
    document.getElementById(
      "googleLogin"
    );

  const message =
    document.getElementById(
      "loginMessage"
    );


  /*
   * যে page-এ user যেতে চেয়েছিল
   *
   * উদাহরণ:
   * login.html?next=post-ad.html
   */

  const params =
    new URLSearchParams(
      window.location.search
    );


  let next =
    params.get("next");


  /*
   * Security:
   * শুধু আমাদের নিজের HTML page allow করছি।
   */

  if(
    !next ||
    next.startsWith("http") ||
    next.startsWith("//")
  ){

    next = "index.html";

  }


  /*
   * Existing logged-in user check
   */

  async function checkExistingLogin(){

    try{

      /*
       * প্রথমে local profile
       */

      const saved =
        localStorage.getItem(
          "smb_user_v1"
        );


      if(saved){

        const user =
          JSON.parse(saved);


        if(
          user &&
          user.email
        ){

          window.location.replace(
            next
          );

          return true;

        }

      }


      /*
       * তারপর Supabase session
       */

      if(
        typeof getCurrentUser ===
        "function"
      ){

        const user =
          await getCurrentUser();


        if(user){

          const metadata =
            user.user_metadata || {};


          localStorage.setItem(
            "smb_user_v1",
            JSON.stringify({

              id:
                user.id || "",

              name:
                metadata.full_name ||
                metadata.name ||
                "",

              email:
                user.email || "",

              phone:
                metadata.phone ||
                "",

              avatar:
                metadata.avatar_url ||
                metadata.picture ||
                ""

            })
          );


          window.location.replace(
            next
          );

          return true;

        }

      }

    }catch(error){

      console.error(
        "Existing login check:",
        error
      );

    }


    return false;

  }


  /*
   * Google Login
   */

  button.addEventListener(
    "click",
    function(){

      button.disabled =
        true;

      button.textContent =
        "Google Login হচ্ছে...";

      message.textContent =
        "";


      /*
       * Google থেকে ফিরে আসার পর
       * requested page-এ যাবে।
       *
       * এখন callback homepage নয়,
       * login.html-এ আসবে।
       */

      const callback =
        window.location.origin +
        "/login.html?next=" +
        encodeURIComponent(
          next
        );


      const googleUrl =
        SUPABASE_URL +
        "/auth/v1/authorize" +
        "?provider=google" +
        "&redirect_to=" +
        encodeURIComponent(
          callback
        );


      window.location.href =
        googleUrl;

    }
  );


  /*
   * Page load
   */

  checkExistingLogin();


})();

</script>


</body>
</html>
