<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>Messages | শাহমাহমুদপুর বাজার</title>

<link
  rel="stylesheet"
  href="style.css">

<style>

.messages-page{
  max-width:760px;
  padding:30px 16px 110px;
}

.chat-box{
  margin-top:25px;
  overflow:hidden;
  border:1px solid rgba(105,245,165,.12);
  border-radius:18px;
  background:rgba(5,14,10,.72);
}

.chat-header{
  padding:17px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.chat-header small{
  display:block;
  color:#69f5a5;
  font-size:8px;
  font-weight:800;
  letter-spacing:1.5px;
}

.chat-header h2{
  margin:6px 0 3px;
  color:#edf7f1;
  font-size:17px;
}

.chat-header p{
  margin:0;
  color:#718078;
  font-size:9px;
}

.messages-list{
  height:390px;
  overflow-y:auto;
  padding:16px;
}

.message-empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#718078;
  font-size:11px;
}

.message-row{
  display:flex;
  margin-bottom:12px;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message-bubble{
  max-width:78%;
  padding:10px 12px;
  border-radius:14px;
  font-size:11px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}

.mine .message-bubble{
  color:#031009;
  background:#69f5a5;
  border-bottom-right-radius:4px;
}

.theirs .message-bubble{
  color:#dce9e1;
  background:#14231b;
  border:1px solid rgba(255,255,255,.06);
  border-bottom-left-radius:4px;
}

.message-time{
  display:block;
  margin-top:4px;
  font-size:7px;
  opacity:.65;
}

.chat-form{
  display:flex;
  gap:8px;
  padding:13px;
  border-top:1px solid rgba(255,255,255,.06);
}

.chat-form input{
  flex:1;
  min-width:0;
}

.chat-form button{
  flex:0 0 auto;
}

.chat-error{
  margin:15px;
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(255,90,90,.16);
  background:rgba(255,90,90,.04);
  color:#ff9d9d;
  font-size:10px;
  line-height:1.6;
}

.login-box{
  margin-top:25px;
  padding:30px 20px;
  text-align:center;
}

@media(max-width:500px){

  .messages-list{
    height:360px;
  }

  .message-bubble{
    max-width:85%;
  }

}

</style>

</head>


<body>


<main class="container messages-page">


<a
  href="index.html"
  class="brand">

  <b>
    শাহমাহমুদপুর
  </b>

  <strong>
    বাজার
  </strong>

  <small>
    LOCAL MARKETPLACE
  </small>

</a>



<section
  id="loginBox"
  class="authbox login-box"
  style="display:none">

  <h2>
    মেসেজ করতে Login করুন
  </h2>

  <p class="muted">
    বিক্রেতার সাথে যোগাযোগ করতে আপনার account-এ Login করতে হবে।
  </p>

  <br>

  <a
    href="login.html"
    class="btn green">

    Google দিয়ে Login করুন

  </a>

</section>



<section
  id="chatBox"
  class="chat-box"
  style="display:none">


  <div class="chat-header">

    <small>
      PRIVATE MESSAGE
    </small>

    <h2 id="adTitle">
      বিজ্ঞাপন
    </h2>

    <p id="sellerInfo">
      বিক্রেতার সাথে যোগাযোগ
    </p>

  </div>



  <div
    id="chatError"
    style="display:none">
  </div>



  <div
    id="messagesList"
    class="messages-list">

    <div class="message-empty">
      মেসেজ লোড হচ্ছে...
    </div>

  </div>



  <form
    id="chatForm"
    class="chat-form">

    <input
      id="messageInput"
      type="text"
      autocomplete="off"
      maxlength="2000"
      placeholder="বিক্রেতাকে মেসেজ লিখুন...">

    <button
      id="sendButton"
      type="submit"
      class="btn green">

      Send

    </button>

  </form>


</section>


</main>

<script src="supabase.js?v=12"></script>

<script>

(function(){

"use strict";


/* ============================================================
   CONFIG
============================================================ */

const SUPA_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";



/* ============================================================
   ELEMENTS
============================================================ */

const loginBox =
  document.getElementById(
    "loginBox"
  );


const chatBox =
  document.getElementById(
    "chatBox"
  );


const messagesList =
  document.getElementById(
    "messagesList"
  );


const chatForm =
  document.getElementById(
    "chatForm"
  );


const messageInput =
  document.getElementById(
    "messageInput"
  );


const sendButton =
  document.getElementById(
    "sendButton"
  );


const chatError =
  document.getElementById(
    "chatError"
  );


const adTitle =
  document.getElementById(
    "adTitle"
  );


const sellerInfo =
  document.getElementById(
    "sellerInfo"
  );



/* ============================================================
   URL
============================================================ */

const params =
  new URLSearchParams(
    window.location.search
  );


const adId =
  params.get("id") || "";



/* ============================================================
   STATE
============================================================ */

let currentUser = null;

let ad = null;

let otherUserId = null;

let loadingMessages = false;



/* ============================================================
   ESCAPE
============================================================ */

function esc(value){

  return String(
    value ?? ""
  )

  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}



/* ============================================================
   ERROR
============================================================ */

function showError(text){

  chatError.style.display =
    "block";

  chatError.className =
    "chat-error";

  chatError.textContent =
    text;

}



function clearError(){

  chatError.style.display =
    "none";

  chatError.textContent =
    "";

}



/* ============================================================
   SESSION
============================================================ */

async function getSession(){

  try{

    if(
      typeof getSbSession ===
      "function"
    ){

      const session =
        await getSbSession();

      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }

  }catch(error){

    console.error(
      "Session error:",
      error
    );

  }

  return null;

}



/* ============================================================
   CURRENT USER
============================================================ */

async function getUser(){

  try{

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        await getCurrentUser();

      if(user){

        return user;

      }

    }

  }catch(error){

    console.error(
      "User error:",
      error
    );

  }


  try{

    const stored =
      JSON.parse(
        localStorage.getItem(
          "smb_user_v1"
        ) || "null"
      );

    if(
      stored &&
      stored.id
    ){

      return {
        id:stored.id,
        email:stored.email || "",
        user_metadata:{
          full_name:
            stored.name || ""
        }
      };

    }

  }catch(error){}


  return null;

}



/* ============================================================
   GET AD
============================================================ */

async function getAd(){

  if(!adId){

    throw new Error(
      "বিজ্ঞাপনের ID পাওয়া যায়নি।"
    );

  }


  if(
    typeof window.getAdById ===
    "function"
  ){

    const result =
      await window.getAdById(
        adId
      );

    if(result){

      return result;

    }

  }


  const session =
    await getSession();


  if(!session){

    return null;

  }


  const response =
    await fetch(

      SUPA_URL +
      "/rest/v1/ads" +
      "?id=eq." +
      encodeURIComponent(adId) +
      "&select=*",

      {

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token

        }

      }

    );


  if(!response.ok){

    return null;

  }


  const data =
    await response.json();


  return (
    Array.isArray(data) &&
    data.length
  )
  ? data[0]
  : null;

}



/* ============================================================
   LOAD MESSAGES
============================================================ */

async function loadMessages(){

  if(
    loadingMessages ||
    !adId ||
    !currentUser
  ){

    return;

  }


  loadingMessages =
    true;


  try{

    const session =
      await getSession();


    if(!session){

      throw new Error(
        "Login session পাওয়া যায়নি।"
      );

    }


    /*
     * এই বিজ্ঞাপনের সব messages
     */

    const url =
      SUPA_URL +
      "/rest/v1/messages" +
      "?ad_id=eq." +
      encodeURIComponent(adId) +
      "&order=created_at.asc";


    const response =
      await fetch(
        url,
        {

          headers:{

            "apikey":
              SUPA_KEY,

            "Authorization":
              "Bearer " +
              session.access_token,

            "Content-Type":
              "application/json"

          }

        }
      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const messages =
      await response.json();


    /*
     * কার সাথে conversation
     */

    if(
      Array.isArray(messages)
    ){

      const firstOther =
        messages.find(
          function(item){

            return String(
              item.sender_id
            ) !== String(
              currentUser.id
            );

          }
        );


      if(firstOther){

        otherUserId =
          firstOther.sender_id;

      }

    }


    /*
     * যদি Buyer হয়
     */

    if(
      !otherUserId &&
      ad &&
      ad.seller_id
    ){

      if(
        String(ad.seller_id) !==
        String(currentUser.id)
      ){

        otherUserId =
          ad.seller_id;

      }

    }


    renderMessages(
      Array.isArray(messages)
      ? messages
      : []
    );


  }catch(error){

    console.error(
      "Messages load error:",
      error
    );

    showError(
      "মেসেজ লোড করা যাচ্ছে না।"
    );

  }finally{

    loadingMessages =
      false;

  }

}



/* ============================================================
   RENDER MESSAGES
============================================================ */

function renderMessages(
  messages
){

  if(
    !messages.length
  ){

    messagesList.innerHTML = `

      <div class="message-empty">

        এখনো কোনো মেসেজ নেই।<br>
        নিচে লিখে বিক্রেতার সাথে যোগাযোগ করুন।

      </div>

    `;

    return;

  }


  messagesList.innerHTML =
    messages
      .map(
        function(item){

          const mine =
            String(
              item.sender_id
            ) === String(
              currentUser.id
            );


          const date =
            item.created_at
            ?
            new Date(
              item.created_at
            ).toLocaleString(
              "bn-BD",
              {
                day:"numeric",
                month:"short",
                hour:"numeric",
                minute:"2-digit"
              }
            )
            :
            "";


          return `

            <div
              class="
                message-row
                ${mine
                  ? "mine"
                  : "theirs"}
              ">

              <div
                class="message-bubble">

                ${esc(
                  item.message
                )}

                ${
                  date
                  ?
                  `
                  <span class="message-time">
                    ${esc(date)}
                  </span>
                  `
                  :
                  ""
                }

              </div>

            </div>

          `;

        }
      )
      .join("");


  messagesList.scrollTop =
    messagesList.scrollHeight;

}



/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage(
  text
){

  const session =
    await getSession();


  if(!session){

    throw new Error(
      "Login session পাওয়া যায়নি।"
    );

  }


  if(!otherUserId){

    throw new Error(
      "বিক্রেতার User ID পাওয়া যায়নি।"
    );

  }


  if(
    String(otherUserId) ===
    String(currentUser.id)
  ){

    throw new Error(
      "নিজের বিজ্ঞাপনে নিজেকে মেসেজ করা যাবে না।"
    );

  }


  const response =
    await fetch(
      SUPA_URL +
      "/rest/v1/messages",

      {

        method:"POST",

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body:
          JSON.stringify({

            ad_id:
              adId,

            sender_id:
              currentUser.id,

            receiver_id:
              otherUserId,

            message:
              text

          })

      }

    );


  if(!response.ok){

    const text =
      await response.text();

    throw new Error(
      text
    );

  }


  return await response.json();

}



/* ============================================================
   FORM
============================================================ */

chatForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    clearError();


    const text =
      messageInput.value.trim();


    if(!text){

      return;

    }


    if(!currentUser){

      return;

    }


    sendButton.disabled =
      true;

    sendButton.textContent =
      "Sending...";


    try{

      await sendMessage(
        text
      );


      messageInput.value =
        "";


      await loadMessages();


    }catch(error){

      console.error(
        "Send message error:",
        error
      );


      showError(
        error.message ||
        "মেসেজ পাঠানো যায়নি।"
      );


    }finally{

      sendButton.disabled =
        false;

      sendButton.textContent =
        "Send";

      messageInput.focus();

    }

  }
);



/* ============================================================
   INITIALIZE
============================================================ */

async function initialize(){

  try{

    currentUser =
      await getUser();


    if(!currentUser){

      loginBox.style.display =
        "block";

      return;

    }


    if(!adId){

      throw new Error(
        "বিজ্ঞাপন পাওয়া যায়নি।"
      );

    }


    ad =
      await getAd();


    if(!ad){

      throw new Error(
        "এই বিজ্ঞাপনটি পাওয়া যায়নি।"
      );

    }


    /*
     * নিজের বিজ্ঞাপন হলে Seller view
     */

    const isSeller =
      String(
        ad.seller_id || ""
      ) === String(
        currentUser.id
      );


    if(isSeller){

      sellerInfo.textContent =
        "আপনার বিজ্ঞাপন • ক্রেতার মেসেজ";

    }else{

      sellerInfo.textContent =
        "বিক্রেতার সাথে সরাসরি যোগাযোগ করুন";

    }


    adTitle.textContent =
      ad.title ||
      "বিজ্ঞাপন";


    chatBox.style.display =
      "block";


    await loadMessages();


    /*
     * নতুন মেসেজের জন্য প্রতি ৩ সেকেন্ডে
     * refresh হবে।
     */

    setInterval(
      loadMessages,
      3000
    );


  }catch(error){

    console.error(
      "Messages initialize error:",
      error
    );


    chatBox.style.display =
      "block";


    messagesList.innerHTML =
      "";


    showError(
      error.message ||
      "Chat চালু করা যাচ্ছে না।"
    );

  }

}


initialize();


})();

</script>


</body>
