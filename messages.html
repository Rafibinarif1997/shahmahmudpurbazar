<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Messages | শাহমাহমুদপুর বাজার</title>

<link rel="stylesheet"
      href="style.css">

<style>

/* =========================
   HEADER
========================= */

.header{
  padding:18px 0 20px;
  border-bottom:1px solid rgba(105,245,165,.10);
  background:linear-gradient(
    180deg,
    rgba(5,14,10,.98),
    rgba(5,14,10,.88)
  );
}

.head{
  display:flex;
  align-items:center;
}

.brand{
  text-decoration:none;
  line-height:1;
  min-width:145px;
}

.brand b,
.brand strong{
  display:block;
}

.brand b{
  font-size:19px;
  letter-spacing:-.5px;
  color:#f2f8f5;
}

.brand strong{
  font-size:22px;
  color:#69f5a5;
  margin-top:2px;
}

.brand small{
  display:block;
  margin-top:7px;
  font-size:7px;
  letter-spacing:3px;
  color:#60736a;
}


/* =========================
   MESSAGES PAGE
========================= */

.messages-page{
  max-width:760px;
  padding:30px 16px 110px;
}

.inbox{
  margin-top:5px;
}

.inbox-head small{
  color:#69f5a5;
  font-size:9px;
  font-weight:800;
  letter-spacing:2px;
}

.inbox-head h1{
  margin:7px 0 5px;
  color:#edf7f1;
  font-size:30px;
  letter-spacing:-1px;
}

.inbox-head p{
  color:#718078;
  font-size:11px;
}

.refresh{
  margin:18px 0;
  text-align:right;
}

.conversation-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.conversation{
  display:block;
  padding:16px;
  border:1px solid rgba(105,245,165,.12);
  border-radius:16px;
  background:rgba(5,14,10,.72);
  text-decoration:none;
  transition:.2s ease;
}

.conversation:hover{
  border-color:rgba(105,245,165,.35);
  transform:translateY(-1px);
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.ad-title{
  color:#edf7f1;
  font-size:14px;
  font-weight:800;
}

.person{
  margin-top:6px;
  color:#69f5a5;
  font-size:9px;
  font-weight:800;
  letter-spacing:1px;
}

.last-message{
  margin-top:10px;
  color:#87978f;
  font-size:11px;
  line-height:1.6;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.time{
  color:#64746c;
  font-size:9px;
  white-space:nowrap;
}

.loading,
.empty{
  padding:60px 20px;
  text-align:center;
  color:#718078;
  font-size:11px;
}

.empty{
  border:1px solid rgba(105,245,165,.12);
  border-radius:18px;
  background:rgba(5,14,10,.55);
}

.error{
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,90,90,.18);
  color:#ff9d9d;
  font-size:10px;
  line-height:1.7;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .header{
    padding:14px 0 15px;
  }

  .brand{
    min-width:0;
  }

  .brand b{
    font-size:17px;
  }

  .brand strong{
    font-size:20px;
  }

  .brand small{
    font-size:6px;
    letter-spacing:2px;
  }

  .messages-page{
    padding-top:24px;
  }

  .inbox-head h1{
    font-size:28px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="container head">

    <a
      class="brand"
      href="index.html">

      <b>শাহমাহমুদপুর</b>

      <strong>বাজার</strong>

      <small>LOCAL MARKETPLACE</small>

    </a>

  </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="container messages-page">


<section class="inbox">


<div class="inbox-head">

  <small>PRIVATE MESSAGES</small>

  <h1>Messages</h1>

  <p>
    আপনার Buyer ও Seller কথোপকথন
  </p>

</div>


<div class="refresh">

  <button
    id="refreshBtn"
    class="btn">

    ↻ Refresh

  </button>

</div>


<div id="result">

  <div class="loading">
    মেসেজ লোড হচ্ছে...
  </div>

</div>


</section>


</main>



<!-- =========================
     MOBILE NAVIGATION
========================= -->

<nav class="mobile-nav">

<a href="index.html">

  <span>⌂</span>

  Home

</a>


<a href="favorites.html">

  <span>♡</span>

  Saved

</a>


<a href="post-ad.html">

  <span>⊞</span>

  Sell

</a>


<a class="active"
   href="messages.html">

  <span>▤</span>

  Messages

</a>


<a href="profile.html">

  <span>♙</span>

  Profile

</a>

</nav>



<script src="supabase.js?v=30"></script>


<script>

(function(){

"use strict";


const SUPA_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


const result =
  document.getElementById("result");


const refreshBtn =
  document.getElementById("refreshBtn");


let currentUser = null;



function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



async function getSession(){

  if(typeof getSbSession === "function"){

    try{

      const session =
        await getSbSession();

      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }catch(e){

      console.error(e);

    }

  }

  return null;

}



async function getUser(){

  if(typeof getCurrentUser === "function"){

    try{

      const user =
        await getCurrentUser();

      if(user){

        return user;

      }

    }catch(e){

      console.error(e);

    }

  }


  try{

    const saved =
      JSON.parse(
        localStorage.getItem("smb_user_v1") ||
        "null"
      );

    if(saved && saved.id){

      return {
        id:saved.id,
        email:saved.email || ""
      };

    }

  }catch(e){}


  return null;

}



async function api(
  url,
  session
){

  const response =
    await fetch(
      url,
      {

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    throw new Error(
      await response.text()
    );

  }


  return await response.json();

}



async function loadInbox(){

  result.innerHTML = `

    <div class="loading">
      মেসেজ লোড হচ্ছে...
    </div>

  `;


  try{

    currentUser =
      await getUser();


    if(!currentUser){

      result.innerHTML = `

        <div class="empty">

          🔐<br><br>

          আগে Login করুন।

          <br><br>

          <a
            href="login.html"
            class="btn green">

            Google দিয়ে Login করুন

          </a>

        </div>

      `;

      return;

    }


    const session =
      await getSession();


    if(!session){

      throw new Error(
        "Login session পাওয়া যায়নি।"
      );

    }


    const uid =
      encodeURIComponent(
        currentUser.id
      );


    const conversationUrl =

      SUPA_URL +
      "/rest/v1/conversations" +

      "?or=(" +

      "buyer_id.eq." +
      uid +

      ",seller_id.eq." +
      uid +

      ")" +

      "&select=*" +

      "&order=created_at.desc";


    const conversations =
      await api(
        conversationUrl,
        session
      );


    if(
      !Array.isArray(conversations) ||
      !conversations.length
    ){

      result.innerHTML = `

        <div class="empty">

          💬<br><br>

          এখনো কোনো কথোপকথন নেই।

          <br><br>

          কোনো পণ্যের ভিতর থেকে
          বিক্রেতাকে মেসেজ করুন।

        </div>

      `;

      return;

    }


    const conversationIds =
      conversations
        .map(
          c => String(c.id)
        );


    const idList =
      conversationIds
        .map(
          id =>
            encodeURIComponent(id)
        )
        .join(",");


    const messageUrl =

      SUPA_URL +
      "/rest/v1/messages" +

      "?conversation_id=in.(" +
      idList +
      ")" +

      "&select=*" +

      "&order=created_at.desc";


    const allMessages =
      await api(
        messageUrl,
        session
      );


    const lastMessages = {};


    if(Array.isArray(allMessages)){

      allMessages.forEach(
        function(message){

          const cid =
            String(
              message.conversation_id
            );


          if(!lastMessages[cid]){

            lastMessages[cid] =
              message;

          }

        }
      );

    }


    const adIds =
      conversations
        .map(
          c =>
            String(c.ad_id)
        )
        .filter(Boolean);


    let ads = [];


    if(adIds.length){

      const uniqueAdIds =
        [...new Set(adIds)];


      const adList =
        uniqueAdIds
          .map(
            id =>
              encodeURIComponent(id)
          )
          .join(",");


      const adsUrl =

        SUPA_URL +
        "/rest/v1/ads" +

        "?id=in.(" +
        adList +
        ")" +

        "&select=id,title,seller_name";


      try{

        ads =
          await api(
            adsUrl,
            session
          );

      }catch(e){

        console.error(
          "Ads load error:",
          e
        );

      }

    }


    const adMap = {};


    ads.forEach(
      function(ad){

        adMap[
          String(ad.id)
        ] = ad;

      }
    );


    const html =
      conversations
        .map(
          function(conversation){

            const cid =
              String(
                conversation.id
              );


            const last =
              lastMessages[cid];


            const ad =
              adMap[
                String(
                  conversation.ad_id
                )
              ];


            const title =
              ad?.title ||
              "বিজ্ঞাপন";


            let otherId = "";


            let role = "";


            if(
              String(
                conversation.buyer_id
              ) ===
              String(
                currentUser.id
              )
            ){

              otherId =
                conversation.seller_id;

              role =
                "SELLER";

            }else{

              otherId =
                conversation.buyer_id;

              role =
                "BUYER";

            }


            const time =
              last?.created_at

              ?

              new Date(
                last.created_at
              ).toLocaleString(
                "bn-BD",
                {
                  day:"numeric",
                  month:"short",
                  hour:"numeric",
                  minute:"2-digit"
                }
              )

              :

              new Date(
                conversation.created_at
              ).toLocaleString(
                "bn-BD",
                {
                  day:"numeric",
                  month:"short",
                  hour:"numeric",
                  minute:"2-digit"
                }
              );


            const preview =
              last?.body ||
              "কথোপকথন শুরু হয়েছে।";


            return `

              <a
                class="conversation"
                href="chat.html?conversation=${encodeURIComponent(cid)}">

                <div
                  class="conversation-top">

                  <div>

                    <div class="ad-title">

                      ${esc(title)}

                    </div>

                    <div class="person">

                      ${role}

                    </div>

                  </div>

                  <div class="time">

                    ${esc(time)}

                  </div>

                </div>


                <div class="last-message">

                  ${esc(preview)}

                </div>

              </a>

            `;

          }
        )
        .join("");


    result.innerHTML = `

      <div class="conversation-list">

        ${html}

      </div>

    `;


  }catch(error){

    console.error(
      "INBOX ERROR:",
      error
    );


    result.innerHTML = `

      <div class="error">

        Messages লোড করা যাচ্ছে না।

        <br><br>

        ${esc(
          error.message ||
          "Unknown error"
        )}

      </div>

    `;

  }

}



refreshBtn.addEventListener(
  "click",
  loadInbox
);


loadInbox();


setInterval(
  loadInbox,
  10000
);


})();

</script>


</body>

</html>
