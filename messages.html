.message-time{

}

@media(max-width:500px){

  .messages-list{
    height:360px;
  }

  .message-bubble{
    max-width:85%;
  }

}

<script src="supabase.js?v=12"></script>


<script>

(function(){

"use strict";


/* ============================================================
   CONFIG
============================================================ */

const SUPA_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";



/* ============================================================
   ELEMENTS
============================================================ */

const loginBox =
  document.getElementById("loginBox");

const chatBox =
  document.getElementById("chatBox");

const messagesList =
  document.getElementById("messagesList");

const chatForm =
  document.getElementById("chatForm");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const chatError =
  document.getElementById("chatError");

const adTitle =
  document.getElementById("adTitle");

const sellerInfo =
  document.getElementById("sellerInfo");



/* ============================================================
   URL
============================================================ */

const params =
  new URLSearchParams(
    window.location.search
  );


const adId =
  params.get("id") || "";


/*
 * Optional:
 * messages.html?id=AD_ID&conversation=CONVERSATION_ID
 */

const conversationIdFromUrl =
  params.get("conversation") || "";



/* ============================================================
   STATE
============================================================ */

let currentUser = null;

let ad = null;

let conversation = null;

let otherUserId = null;

let loadingMessages = false;



/* ============================================================
   ESCAPE
============================================================ */

function esc(value){

  return String(
    value ?? ""
  )

  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}



/* ============================================================
   ERROR
============================================================ */

function showError(text){

  chatError.style.display =
    "block";

  chatError.className =
    "chat-error";

  chatError.textContent =
    text;

}


function clearError(){

  chatError.style.display =
    "none";

  chatError.textContent =
    "";

}



/* ============================================================
   SESSION
============================================================ */

async function getSession(){

  try{

    if(
      typeof getSbSession ===
      "function"
    ){

      const session =
        await getSbSession();


      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }

  }catch(error){

    console.error(
      "Session error:",
      error
    );

  }


  return null;

}



/* ============================================================
   USER
============================================================ */

async function getUser(){

  try{

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        await getCurrentUser();


      if(user){

        return user;

      }

    }

  }catch(error){

    console.error(
      "User error:",
      error
    );

  }


  try{

    const stored =
      JSON.parse(
        localStorage.getItem(
          "smb_user_v1"
        ) || "null"
      );


    if(
      stored &&
      stored.id
    ){

      return {

        id:
          stored.id,

        email:
          stored.email || "",

        user_metadata:{

          full_name:
            stored.name || ""

        }

      };

    }

  }catch(error){}


  return null;

}



/* ============================================================
   GET AD
============================================================ */

async function getAd(){

  if(!adId){

    throw new Error(
      "বিজ্ঞাপনের ID পাওয়া যায়নি।"
    );

  }


  /*
   * প্রথমে app.js-এর function
   */

  if(
    typeof window.getAdById ===
    "function"
  ){

    try{

      const result =
        await window.getAdById(
          adId
        );


      if(result){

        return result;

      }

    }catch(error){

      console.error(
        error
      );

    }

  }


  const session =
    await getSession();


  if(!session){

    return null;

  }


  const response =
    await fetch(

      SUPA_URL +
      "/rest/v1/ads" +
      "?id=eq." +
      encodeURIComponent(adId) +
      "&select=*",

      {

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token

        }

      }

    );


  if(!response.ok){

    return null;

  }


  const data =
    await response.json();


  return (
    Array.isArray(data) &&
    data.length
  )
  ?
  data[0]
  :
  null;

}



/* ============================================================
   FIND EXISTING CONVERSATION
============================================================ */

async function findConversation(){

  const session =
    await getSession();


  if(!session){

    throw new Error(
      "Login session পাওয়া যায়নি।"
    );

  }


  /*
   * URL-এ conversation ID থাকলে
   * সেটাই ব্যবহার
   */

  if(conversationIdFromUrl){

    const response =
      await fetch(

        SUPA_URL +
        "/rest/v1/conversations" +
        "?id=eq." +
        encodeURIComponent(
          conversationIdFromUrl
        ) +
        "&select=*",

        {

          headers:{

            "apikey":
              SUPA_KEY,

            "Authorization":
              "Bearer " +
              session.access_token

          }

        }

      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const data =
      await response.json();


    if(
      Array.isArray(data) &&
      data.length
    ){

      return data[0];

    }

  }



  /*
   * Buyer-এর নিজের conversation খুঁজি
   */

  const buyerResponse =
    await fetch(

      SUPA_URL +
      "/rest/v1/conversations" +
      "?ad_id=eq." +
      encodeURIComponent(adId) +
      "&buyer_id=eq." +
      encodeURIComponent(
        currentUser.id
      ) +
      "&select=*" +
      "&order=created_at.desc" +
      "&limit=1",

      {

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token

        }

      }

    );


  if(!buyerResponse.ok){

    throw new Error(
      await buyerResponse.text()
    );

  }


  const buyerData =
    await buyerResponse.json();


  if(
    Array.isArray(buyerData) &&
    buyerData.length
  ){

    return buyerData[0];

  }



  /*
   * Seller হলে তার ad-এর
   * সর্বশেষ conversation খুঁজি
   */

  if(
    ad &&
    String(ad.seller_id) ===
    String(currentUser.id)
  ){

    const sellerResponse =
      await fetch(

        SUPA_URL +
        "/rest/v1/conversations" +
        "?ad_id=eq." +
        encodeURIComponent(adId) +
        "&seller_id=eq." +
        encodeURIComponent(
          currentUser.id
        ) +
        "&select=*" +
        "&order=created_at.desc" +
        "&limit=1",

        {

          headers:{

            "apikey":
              SUPA_KEY,

            "Authorization":
              "Bearer " +
              session.access_token

          }

        }

      );


    if(!sellerResponse.ok){

      throw new Error(
        await sellerResponse.text()
      );

    }


    const sellerData =
      await sellerResponse.json();


    if(
      Array.isArray(sellerData) &&
      sellerData.length
    ){

      return sellerData[0];

    }

  }


  return null;

}



/* ============================================================
   CREATE CONVERSATION
============================================================ */

async function createConversation(){

  const session =
    await getSession();


  if(!session){

    throw new Error(
      "Login session পাওয়া যায়নি।"
    );

  }


  if(
    !ad ||
    !ad.seller_id
  ){

    throw new Error(
      "বিক্রেতার তথ্য পাওয়া যায়নি।"
    );

  }


  if(
    String(ad.seller_id) ===
    String(currentUser.id)
  ){

    throw new Error(
      "নিজের বিজ্ঞাপনে conversation তৈরি করা যাবে না।"
    );

  }


  const data = {

    ad_id:
      adId,

    buyer_id:
      currentUser.id,

    seller_id:
      ad.seller_id

  };


  const response =
    await fetch(

      SUPA_URL +
      "/rest/v1/conversations",

      {

        method:"POST",

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body:
          JSON.stringify(data)

      }

    );


  if(!response.ok){

    const text =
      await response.text();


    throw new Error(
      "Conversation তৈরি করা যায়নি: " +
      text
    );

  }


  const result =
    await response.json();


  if(
    !Array.isArray(result) ||
    !result.length
  ){

    throw new Error(
      "Conversation তৈরি হয়েছে কিন্তু ID পাওয়া যায়নি।"
    );

  }


  return result[0];

}



/* ============================================================
   LOAD MESSAGES
============================================================ */

async function loadMessages(){

  if(
    loadingMessages ||
    !conversation ||
    !currentUser
  ){

    return;

  }


  loadingMessages =
    true;


  try{

    const session =
      await getSession();


    if(!session){

      throw new Error(
        "Login session পাওয়া যায়নি।"
      );

    }


    const url =
      SUPA_URL +
      "/rest/v1/messages" +
      "?conversation_id=eq." +
      encodeURIComponent(
        conversation.id
      ) +
      "&select=*" +
      "&order=created_at.asc";


    const response =
      await fetch(
        url,
        {

          headers:{

            "apikey":
              SUPA_KEY,

            "Authorization":
              "Bearer " +
              session.access_token,

            "Content-Type":
              "application/json"

          }

        }
      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const messages =
      await response.json();


    renderMessages(
      Array.isArray(messages)
      ? messages
      : []
    );


  }catch(error){

    console.error(
      "Messages load error:",
      error
    );


    showError(
      "মেসেজ লোড করা যাচ্ছে না। " +
      (error.message || "")
    );

  }finally{

    loadingMessages =
      false;

  }

}



/* ============================================================
   RENDER
============================================================ */

function renderMessages(
  messages
){

  if(
    !messages.length
  ){

    messagesList.innerHTML = `

      <div class="message-empty">

        এখনো কোনো মেসেজ নেই।<br>

        নিচে লিখে যোগাযোগ শুরু করুন।

      </div>

    `;

    return;

  }


  messagesList.innerHTML =
    messages
      .map(
        function(item){

          const mine =
            String(
              item.sender_id
            ) === String(
              currentUser.id
            );


          const date =
            item.created_at
            ?
            new Date(
              item.created_at
            ).toLocaleString(
              "bn-BD",
              {
                day:"numeric",
                month:"short",
                hour:"numeric",
                minute:"2-digit"
              }
            )
            :
            "";


          return `

            <div
              class="
                message-row
                ${
                  mine
                  ? "mine"
                  : "theirs"
                }
              ">

              <div
                class="message-bubble">

                ${esc(
                  item.body || ""
                )}

                ${
                  date
                  ?
                  `
                  <span class="message-time">

                    ${esc(date)}

                  </span>
                  `
                  :
                  ""
                }

              </div>

            </div>

          `;

        }
      )
      .join("");


  messagesList.scrollTop =
    messagesList.scrollHeight;

}



/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage(
  text
){

  const session =
    await getSession();


  if(!session){

    throw new Error(
      "Login session পাওয়া যায়নি।"
    );

  }


  /*
   * Conversation না থাকলে
   * Buyer-এর জন্য তৈরি করব
   */

  if(!conversation){

    conversation =
      await createConversation();

  }


  /*
   * অন্য user
   */

  if(
    !otherUserId
  ){

    if(
      String(
        conversation.buyer_id
      ) ===
      String(
        currentUser.id
      )
    ){

      otherUserId =
        conversation.seller_id;

    }else{

      otherUserId =
        conversation.buyer_id;

    }

  }


  if(!otherUserId){

    throw new Error(
      "অন্য user-এর ID পাওয়া যায়নি।"
    );

  }


  if(
    String(otherUserId) ===
    String(currentUser.id)
  ){

    throw new Error(
      "নিজেকে মেসেজ করা যাবে না।"
    );

  }


  /*
   * IMPORTANT:
   *
   * messages table-এ
   * conversation_id + sender_id
   * + receiver_id + body
   */

  const messageData = {

    conversation_id:
      conversation.id,

    sender_id:
      currentUser.id,

    receiver_id:
      otherUserId,

    body:
      text

  };


  const response =
    await fetch(

      SUPA_URL +
      "/rest/v1/messages",

      {

        method:"POST",

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body:
          JSON.stringify(
            messageData
          )

      }

    );


  if(!response.ok){

    const text =
      await response.text();


    throw new Error(
      "Message send failed: " +
      text
    );

  }


  return await response.json();

}



/* ============================================================
   SEND FORM
============================================================ */

chatForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    clearError();


    const text =
      messageInput.value.trim();


    if(!text){

      return;

    }


    if(!currentUser){

      showError(
        "আগে Login করুন।"
      );

      return;

    }


    sendButton.disabled =
      true;

    messageInput.disabled =
      true;

    sendButton.textContent =
      "Sending...";


    try{

      await sendMessage(
        text
      );


      messageInput.value =
        "";


      await loadMessages();


    }catch(error){

      console.error(
        "Send error:",
        error
      );


      showError(
        error.message ||
        "মেসেজ পাঠানো যায়নি।"
      );


    }finally{

      sendButton.disabled =
        false;

      messageInput.disabled =
        false;

      sendButton.textContent =
        "Send";

      messageInput.focus();

    }

  }
);



/* ============================================================
   INITIALIZE
============================================================ */

async function initialize(){

  try{

    currentUser =
      await getUser();


    /*
     * Login নেই
     */

    if(!currentUser){

      loginBox.style.display =
        "block";

      return;

    }


    /*
     * Ad ID নেই
     */

    if(!adId){

      throw new Error(
        "বিজ্ঞাপনের ID পাওয়া যায়নি।"
      );

    }


    /*
     * Ad load
     */

    ad =
      await getAd();


    if(!ad){

      throw new Error(
        "এই বিজ্ঞাপনটি পাওয়া যায়নি।"
      );

    }


    /*
     * নিজের বিজ্ঞাপন?
     */

    const isSeller =
      String(
        ad.seller_id || ""
      ) ===
      String(
        currentUser.id
      );


    /*
     * Header
     */

    adTitle.textContent =
      ad.title ||
      "বিজ্ঞাপন";


    if(isSeller){

      sellerInfo.textContent =
        "আপনার বিজ্ঞাপন • ক্রেতার মেসেজ";

    }else{

      sellerInfo.textContent =
        "বিক্রেতার সাথে সরাসরি যোগাযোগ করুন";

    }


    /*
     * Existing conversation
     */

    conversation =
      await findConversation();


    /*
     * Existing conversation থাকলে
     * other user বের করি
     */

    if(conversation){

      if(
        String(
          conversation.buyer_id
        ) ===
        String(
          currentUser.id
        )
      ){

        otherUserId =
          conversation.seller_id;

      }else{

        otherUserId =
          conversation.buyer_id;

      }

    }


    /*
     * Seller কিন্তু কোনো conversation নেই
     */

    if(
      isSeller &&
      !conversation
    ){

      messagesList.innerHTML = `

        <div class="message-empty">

          এখনো কোনো Buyer মেসেজ করেনি।<br><br>

          Buyer মেসেজ করলে এখানে conversation দেখা যাবে।

        </div>

      `;

    }


    /*
     * Buyer হলে conversation না থাকলেও
     * message box থাকবে।
     *
     * Send চাপলে conversation তৈরি হবে।
     */

    chatBox.style.display =
      "block";


    if(
      !isSeller ||
      conversation
    ){

      await loadMessages();

    }


    /*
     * প্রতি ৩ সেকেন্ডে নতুন message check
     */

    setInterval(
      async function(){

        /*
         * Conversation এখনো না থাকলে
         * Buyer-এর জন্য নতুন message
         * পাঠানো পর্যন্ত কিছু করার নেই।
         */

        if(conversation){

          await loadMessages();

        }

      },
      3000
    );


  }catch(error){

    console.error(
      "Messages initialize error:",
      error
    );


    chatBox.style.display =
      "block";


    messagesList.innerHTML =
      "";


    showError(
      error.message ||
      "Chat চালু করা যাচ্ছে না।"
    );

  }

}


initialize();


})();

</script>

</body>

</html>
