<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | শাহমাহমুদপুর বাজার</title><link rel="stylesheet" href="style.css"></head><body><main class="container" style="padding:25px 0 80px"><a class="brand" href="index.html"><b>শাহমাহমুদপুর</b><strong>বাজার</strong></a><div class="detail-layout" style="grid-template-columns:.7fr 1.3fr"><section class="authbox"><h2>Conversations</h2><div id="convs">লোড হচ্ছে...</div></section><section class="authbox"><h2 id="chatTitle">মেসেজ</h2><div id="chat" style="min-height:280px;max-height:430px;overflow:auto"></div><form id="send" style="display:none;margin-top:10px"><input id="body" placeholder="মেসেজ লিখুন..." required><button class="btn green">Send</button></form></section></div></main><nav class="mobile-nav"><a href="index.html"><span>⌂</span>হোম</a><a href="favorites.html"><span>♡</span>সেভড</a><a href="post-ad.html"><span>＋</span>বিজ্ঞাপন</a><a class="active" href="messages.html"><span>▤</span>মেসেজ</a><a href="profile.html"><span>♙</span>প্রোফাইল</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>let uid=null,cid=new URLSearchParams(location.search).get('id');async function boot(){const u=await marketplace.user();if(!u){location.href='login.html?next=messages.html';return}uid=u.id;const {data,error}=await sb.from('conversations').select('*,ads(title),buyer:profiles!conversations_buyer_id_fkey(name),seller:profiles!conversations_seller_id_fkey(name)').or(`buyer_id.eq.${uid},seller_id.eq.${uid}`).order('created_at',{ascending:false});if(error){convs.textContent=error.message;return}convs.innerHTML=(data||[]).map(c=>`<button class="btn" style="width:100%;margin:4px 0;text-align:left" onclick="openChat('${c.id}')">${marketplace.esc(c.ads?.title||'Conversation')}</button>`).join('')||'<p class="muted">কোনো conversation নেই।</p>';if(cid)openChat(cid)}async function openChat(id){cid=id;send.style.display='flex';const {data:c}=await sb.from('conversations').select('*,ads(title)').eq('id',id).single();chatTitle.textContent=c?.ads?.title||'Conversation';const {data,error}=await sb.from('messages').select('*').eq('conversation_id',id).order('created_at');chat.innerHTML=error?'<p>'+marketplace.esc(error.message)+'</p>':(data||[]).map(m=>`<div style="padding:8px;margin:5px 0;border-radius:9px;background:${m.sender_id===uid?'rgba(105,245,165,.12)':'rgba(255,255,255,.04)'};text-align:${m.sender_id===uid?'right':'left'}">${marketplace.esc(m.body)}</div>`).join('');chat.scrollTop=chat.scrollHeight}send.onsubmit=async e=>{e.preventDefault();if(!cid)return;const {error}=await sb.from('messages').insert({conversation_id:cid,sender_id:uid,body:body.value.trim()});if(!error){body.value='';openChat(cid)}};boot()</script></body></html>
