<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Messages | শাহমাহমুদপুর বাজার</title>

<link rel="stylesheet"
      href="style.css">

<style>

.messages-page{
  max-width:760px;
  padding:30px 16px 110px;
}

.inbox{
  margin-top:25px;
}

.inbox-head{
  margin-bottom:18px;
}

.inbox-head small{
  color:#69f5a5;
  font-size:8px;
  font-weight:800;
  letter-spacing:2px;
}

.inbox-head h1{
  margin:7px 0 5px;
  color:#edf7f1;
  font-size:30px;
}

.inbox-head p{
  margin:0;
  color:#718078;
  font-size:10px;
}

.refresh{
  margin-top:15px;
}

.conversation-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.conversation{
  display:block;
  padding:16px;
  border:1px solid rgba(105,245,165,.12);
  border-radius:16px;
  background:rgba(5,14,10,.72);
  text-decoration:none;
  transition:.2s;
}

.conversation:hover{
  border-color:rgba(105,245,165,.3);
  transform:translateY(-1px);
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.ad-title{
  color:#edf7f1;
  font-size:14px;
  font-weight:800;
}

.role{
  display:inline-block;
  margin-top:5px;
  color:#69f5a5;
  font-size:8px;
  font-weight:800;
  letter-spacing:1px;
}

.last-message{
  margin-top:10px;
  color:#87978f;
  font-size:10px;
  line-height:1.6;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.time{
  flex:0 0 auto;
  color:#64746c;
  font-size:8px;
}

.empty{
  padding:65px 20px;
  text-align:center;
  border:1px solid rgba(105,245,165,.12);
  border-radius:18px;
  background:rgba(5,14,10,.55);
}

.empty-icon{
  width:58px;
  height:58px;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#69f5a5;
  background:rgba(105,245,165,.06);
  border:1px solid rgba(105,245,165,.15);
  font-size:25px;
}

.empty h2{
  margin-bottom:8px;
  color:#edf7f1;
  font-size:18px;
}

.empty p{
  color:#718078;
  font-size:10px;
  line-height:1.8;
}

.error{
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,90,90,.18);
  background:rgba(255,90,90,.04);
  color:#ff9d9d;
  font-size:10px;
  line-height:1.7;
}

.loading{
  padding:50px 20px;
  text-align:center;
  color:#718078;
  font-size:10px;
}

</style>

</head>


<body>


<main class="container messages-page">


<a href="index.html"
   class="brand">

  <b>শাহমাহমুদপুর</b>

  <strong>বাজার</strong>

  <small>LOCAL MARKETPLACE</small>

</a>



<section class="inbox">


<div class="inbox-head">

  <small>PRIVATE MESSAGES</small>

  <h1>Messages</h1>

  <p>
    আপনার ক্রেতা ও বিক্রেতার সাথে কথোপকথন
  </p>

  <button
    id="refresh"
    class="btn refresh"
    type="button">

    ↻ Refresh

  </button>

</div>



<div id="result">

  <div class="loading">

    মেসেজ লোড হচ্ছে...

  </div>

</div>


</section>


</main>



<nav class="mobile-nav">

<a href="index.html">
  <span>⌂</span>
  Home
</a>

<a href="favorites.html">
  <span>♡</span>
  Saved
</a>

<a href="post-ad.html">
  <span>⊞</span>
  Sell
</a>

<a class="active"
   href="messages.html">

  <span>▤</span>
  Messages

</a>

<a href="profile.html">
  <span>♙</span>
  Profile
</a>

</nav>



<script src="supabase.js?v=15"></script>

<script src="app.js?v=15"></script>


<script>

(function(){

"use strict";


/* ============================================================
   CONFIG
============================================================ */

const SUPA_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";

const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


/* ============================================================
   ELEMENTS
============================================================ */

const result =
  document.getElementById("result");

const refresh =
  document.getElementById("refresh");


/* ============================================================
   STATE
============================================================ */

let currentUser = null;


/* ============================================================
   ESCAPE
============================================================ */

function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ============================================================
   SESSION
============================================================ */

async function getSession(){

  try{

    if(typeof getSbSession === "function"){

      const s =
        await getSbSession();

      if(s && s.access_token){

        return s;

      }

    }

  }catch(e){

    console.error(e);

  }

  return null;

}


/* ============================================================
   USER
============================================================ */

async function getUser(){

  try{

    if(typeof getCurrentUser === "function"){

      const u =
        await getCurrentUser();

      if(u){

        return u;

      }

    }

  }catch(e){

    console.error(e);

  }


  try{

    const stored =
      JSON.parse(
        localStorage.getItem(
          "smb_user_v1"
        ) || "null"
      );

    if(stored && stored.id){

      return {
        id:stored.id,
        email:stored.email || ""
      };

    }

  }catch(e){}


  return null;

}


/* ============================================================
   GET CONVERSATIONS
============================================================ */

async function getConversations(session){

  /*
   * Seller হলে seller_id
   * Buyer হলে buyer_id
   *
   * দুটোই check করা হচ্ছে।
   */

  const userId =
    encodeURIComponent(
      currentUser.id
    );


  const url =

    SUPA_URL +

    "/rest/v1/conversations" +

    "?or=(" +

      "buyer_id.eq." +
      userId +

      ",seller_id.eq." +
      userId +

    ")" +

    "&select=*" +

    "&order=created_at.desc";


  const response =
    await fetch(
      url,
      {
        headers:{
          "apikey":SUPA_KEY,
          "Authorization":
            "Bearer " +
            session.access_token,
          "Content-Type":
            "application/json"
        }
      }
    );


  if(!response.ok){

    const text =
      await response.text();

    throw new Error(text);

  }


  return await response.json();

}


/* ============================================================
   GET AD
============================================================ */

async function getAd(adId,session){

  const response =
    await fetch(

      SUPA_URL +
      "/rest/v1/ads" +

      "?id=eq." +
      encodeURIComponent(adId) +

      "&select=id,title",

      {
        headers:{
          "apikey":SUPA_KEY,
          "Authorization":
            "Bearer " +
            session.access_token
        }
      }

    );


  if(!response.ok){

    return null;

  }


  const data =
    await response.json();


  return data.length
    ? data[0]
    : null;

}


/* ============================================================
   GET LAST MESSAGE
============================================================ */

async function getLastMessage(
  conversationId,
  session
){

  const response =
    await fetch(

      SUPA_URL +
      "/rest/v1/messages" +

      "?conversation_id=eq." +
      encodeURIComponent(
        conversationId
      ) +

      "&select=body,created_at" +

      "&order=created_at.desc" +

      "&limit=1",

      {
        headers:{
          "apikey":SUPA_KEY,
          "Authorization":
            "Bearer " +
            session.access_token
        }
      }

    );


  if(!response.ok){

    return null;

  }


  const data =
    await response.json();


  return data.length
    ? data[0]
    : null;

}


/* ============================================================
   FORMAT TIME
============================================================ */

function formatTime(value){

  if(!value){

    return "";

  }


  try{

    return new Date(
      value
    ).toLocaleString(
      "bn-BD",
      {
        day:"numeric",
        month:"short",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch(e){

    return "";

  }

}


/* ============================================================
   RENDER
============================================================ */

function renderEmpty(){

  result.innerHTML = `

    <div class="empty">

      <div class="empty-icon">
        💬
      </div>

      <h2>
        এখনো কোনো মেসেজ নেই
      </h2>

      <p>
        কোনো বিজ্ঞাপনের ভিতর থেকে
        Buyer বা Seller-কে মেসেজ করলে
        সেই কথোপকথন এখানে দেখা যাবে।
      </p>

    </div>

  `;

}


function renderConversations(items){

  if(!items.length){

    renderEmpty();

    return;

  }


  result.innerHTML = `

    <div class="conversation-list">

      ${items.map(item => `

        <a
          class="conversation"
          href="chat.html?id=${encodeURIComponent(
            item.ad_id
          )}">

          <div class="conversation-top">

            <div>

              <div class="ad-title"
                   data-ad-id="${esc(item.ad_id)}">

                বিজ্ঞাপন লোড হচ্ছে...

              </div>

              <span class="role">

                ${
                  String(item.seller_id)
                  ===
                  String(currentUser.id)

                  ? "BUYER"

                  : "SELLER"
                }

              </span>

            </div>

            <span
              class="time"
              data-time-id="${esc(item.id)}">

              ${formatTime(
                item.created_at
              )}

            </span>

          </div>


          <div
            class="last-message"
            data-msg-id="${esc(item.id)}">

            মেসেজ লোড হচ্ছে...

          </div>

        </a>

      `).join("")}

    </div>

  `;

}


/* ============================================================
   LOAD INBOX
============================================================ */

async function loadInbox(){

  result.innerHTML = `

    <div class="loading">

      মেসেজ লোড হচ্ছে...

    </div>

  `;


  try{

    currentUser =
      await getUser();


    if(!currentUser){

      result.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🔐
          </div>

          <h2>
            Login করুন
          </h2>

          <p>
            আপনার Messages দেখতে
            আগে Login করতে হবে।
          </p>

          <br>

          <a
            href="login.html"
            class="btn green">

            Google দিয়ে Login করুন

          </a>

        </div>

      `;

      return;

    }


    const session =
      await getSession();


    if(!session){

      throw new Error(
        "Login session পাওয়া যায়নি।"
      );

    }


    /*
     * মূল inbox:
     * conversations table
     */

    const conversations =
      await getConversations(
        session
      );


    if(
      !Array.isArray(
        conversations
      ) ||
      !conversations.length
    ){

      renderEmpty();

      return;

    }


    renderConversations(
      conversations
    );


    /*
     * প্রতিটি conversation-এর
     * বিজ্ঞাপনের title + last message
     */

    for(
      const conversation
      of conversations
    ){

      const ad =
        await getAd(
          conversation.ad_id,
          session
        );


      const titleElement =
        document.querySelector(
          `[data-ad-id="${CSS.escape(
            String(
              conversation.ad_id
            )
          )}"]`
        );


      if(titleElement){

        titleElement.textContent =
          ad?.title ||
          "বিজ্ঞাপন";

      }


      const lastMessage =
        await getLastMessage(
          conversation.id,
          session
        );


      const messageElement =
        document.querySelector(
          `[data-msg-id="${CSS.escape(
            String(
              conversation.id
            )
          )}"]`
        );


      if(messageElement){

        messageElement.textContent =

          lastMessage?.body ||

          "কথোপকথন শুরু হয়েছে";

      }


      const timeElement =
        document.querySelector(
          `[data-time-id="${CSS.escape(
            String(
              conversation.id
            )
          )}"]`
        );


      if(
        timeElement &&
        lastMessage
      ){

        timeElement.textContent =
          formatTime(
            lastMessage.created_at
          );

      }

    }


  }catch(error){

    console.error(
      "INBOX ERROR:",
      error
    );


    result.innerHTML = `

      <div class="error">

        Messages লোড করা যাচ্ছে না।

        <br><br>

        ${esc(
          error.message ||
          "Unknown error"
        )}

      </div>

    `;

  }

}


/* ============================================================
   REFRESH
============================================================ */

refresh.addEventListener(
  "click",
  loadInbox
);


/* ============================================================
   INITIALIZE
============================================================ */

loadInbox();


/*
 * প্রতি ৫ সেকেন্ডে inbox refresh
 */

setInterval(
  loadInbox,
  5000
);


})();

</script>

</body>
</html>
