<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>Messages | শাহমাহমুদপুর বাজার</title>

<link
  rel="stylesheet"
  href="style.css">

<style>

/* ============================================================
   PAGE
============================================================ */

.messages-page{

  max-width:760px;

  padding:
    30px
    16px
    110px;

}


/* ============================================================
   HEADER
============================================================ */

.messages-header{

  margin-top:28px;

  margin-bottom:22px;

}


.messages-header small{

  color:#69f5a5;

  font-size:8px;

  font-weight:800;

  letter-spacing:2px;

}


.messages-header h1{

  margin:6px 0 5px;

  color:#edf7f1;

  font-size:28px;

}


.messages-header p{

  margin:0;

  color:#718078;

  font-size:10px;

}


/* ============================================================
   LOGIN
============================================================ */

.login-box{

  margin-top:25px;

  padding:35px 20px;

  text-align:center;

}


/* ============================================================
   ERROR
============================================================ */

.error-box{

  margin-bottom:15px;

  padding:13px 15px;

  border:

    1px solid

    rgba(255,90,90,.18);

  border-radius:12px;

  background:

    rgba(255,90,90,.04);

  color:#ff9d9d;

  font-size:10px;

  line-height:1.7;

}


/* ============================================================
   LOADING
============================================================ */

.loading-box{

  padding:55px 20px;

  text-align:center;

  color:#718078;

  font-size:11px;

}


/* ============================================================
   INBOX
============================================================ */

.inbox{

  display:flex;

  flex-direction:column;

  gap:10px;

}


/* ============================================================
   CONVERSATION CARD
============================================================ */

.conversation{

  display:flex;

  align-items:center;

  gap:13px;

  width:100%;

  padding:15px;

  border:

    1px solid

    rgba(105,245,165,.10);

  border-radius:16px;

  background:

    linear-gradient(

      145deg,

      rgba(10,22,16,.92),

      rgba(4,10,7,.96)

    );

  cursor:pointer;

  text-decoration:none;

  transition:.2s ease;

}


.conversation:hover{

  border-color:

    rgba(105,245,165,.25);

  transform:translateY(-1px);

}


/* ============================================================
   IMAGE
============================================================ */

.conversation-image{

  flex:

    0 0 58px;

  width:58px;

  height:58px;

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:13px;

  background:#07110c;

  border:

    1px solid

    rgba(105,245,165,.10);

  color:#69f5a5;

  font-size:18px;

}


.conversation-image img{

  width:100%;

  height:100%;

  object-fit:cover;

}


/* ============================================================
   CONTENT
============================================================ */

.conversation-content{

  flex:1;

  min-width:0;

}


.conversation-top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

}


.conversation-title{

  overflow:hidden;

  color:#edf7f1;

  font-size:14px;

  font-weight:800;

  white-space:nowrap;

  text-overflow:ellipsis;

}


.conversation-time{

  flex:0 0 auto;

  color:#627169;

  font-size:7px;

}


.conversation-person{

  margin-top:4px;

  color:#69f5a5;

  font-size:8px;

  font-weight:800;

}


.conversation-message{

  overflow:hidden;

  margin-top:5px;

  color:#819089;

  font-size:9px;

  white-space:nowrap;

  text-overflow:ellipsis;

}


/* ============================================================
   ARROW
============================================================ */

.conversation-arrow{

  flex:0 0 auto;

  color:#69f5a5;

  font-size:18px;

  opacity:.65;

}


/* ============================================================
   EMPTY
============================================================ */

.empty-box{

  padding:55px 20px;

  text-align:center;

  border:

    1px solid

    rgba(105,245,165,.10);

  border-radius:17px;

  background:

    rgba(5,14,10,.65);

}


.empty-icon{

  width:48px;

  height:48px;

  margin:

    0 auto
    14px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:

    rgba(105,245,165,.07);

  border:

    1px solid

    rgba(105,245,165,.14);

  color:#69f5a5;

  font-size:21px;

}


.empty-box strong{

  color:#eaf5ef;

  font-size:13px;

}


.empty-box p{

  margin:

    8px
    0
    0;

  color:#718078;

  font-size:9px;

  line-height:1.7;

}


/* ============================================================
   REFRESH
============================================================ */

.refresh-row{

  display:flex;

  justify-content:flex-end;

  margin-bottom:10px;

}


.refresh-btn{

  padding:

    7px
    11px;

  border:

    1px solid

    rgba(105,245,165,.13);

  border-radius:9px;

  background:

    rgba(105,245,165,.035);

  color:#69f5a5;

  font-size:8px;

  font-weight:800;

  cursor:pointer;

}


.refresh-btn:disabled{

  opacity:.5;

}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:500px){

  .messages-page{

    padding-top:25px;

  }


  .messages-header h1{

    font-size:25px;

  }


  .conversation{

    padding:13px;

  }


  .conversation-image{

    flex-basis:54px;

    width:54px;

    height:54px;

  }

}

</style>

</head>


<body>


<main class="container messages-page">

<a

  <strong>

<!-- ==========================================================

<header class="messages-header">

  </small>

  <h1>

  <p>
    আপনার ক্রেতা ও বিক্রেতার সাথে কথোপকথন

</header>



<!-- ==========================================================
     ERROR
=========================================================== -->

<div
  id="errorBox"
  class="error-box"
  style="display:none">
</div>



<!-- ==========================================================
     LOGIN BOX
=========================================================== -->

<section
  id="loginBox"
  class="authbox login-box"
  style="display:none">

  <h2>
    মেসেজ দেখতে Login করুন

  <p class="muted">

    account-এ Login করতে হবে।
  </p>

  <br>

  <a
    href="login.html?next=messages.html"
    class="btn green">

    Google দিয়ে Login করুন

  </a>

</section>



<!-- ==========================================================
     INBOX
=========================================================== -->

<section
  id="inboxBox"
  style="display:none">


  <div class="refresh-row">

    <button
      id="refreshBtn"
      class="refresh-btn"
      type="button">

      ↻ Refresh

    </button>

  </div>


  <div
    id="inbox"
    class="inbox">

  </div>


</section>

<script src="supabase.js?v=12"></script>


<script>

(function(){

"use strict";


/* ============================================================
   CONFIG
============================================================ */

const SUPA_URL =

  window.SUPABASE_URL ||

  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =

  window.SUPABASE_ANON_KEY ||

  window.supabaseAnonKey ||

  "";



/* ============================================================
   ELEMENTS
============================================================ */

const loginBox =
  document.getElementById(
    "loginBox"
  );


const inboxBox =
  document.getElementById(
    "inboxBox"
  );


const inbox =
  document.getElementById(
    "inbox"
  );


const errorBox =
  document.getElementById(
    "errorBox"
  );


const refreshBtn =
  document.getElementById(
    "refreshBtn"
  );



/* ============================================================
   STATE
============================================================ */

let currentUser = null;

let adsCache = {};

let loading = false;



/* ============================================================
   ESCAPE
============================================================ */

function esc(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}



/* ============================================================
   ERROR
============================================================ */

function showError(text){

  errorBox.style.display =
    "block";

  errorBox.textContent =
    text;

}


function clearError(){

  errorBox.style.display =
    "none";

  errorBox.textContent =
    "";

}



/* ============================================================
   SESSION
============================================================ */

async function getSession(){

  try{

    if(
      typeof getSbSession ===
      "function"
    ){

      const session =
        await getSbSession();


      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }

  }catch(error){

    console.error(
      "Session error:",
      error
    );

  }


  return null;

}



/* ============================================================
   USER
============================================================ */

async function getUser(){

  try{

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        await getCurrentUser();


      if(user){

        return user;

      }

    }

  }catch(error){

    console.error(
      "User error:",
      error
    );

  }


  try{

    const stored =
      JSON.parse(

        localStorage.getItem(
          "smb_user_v1"
        )

        || "null"

      );


    if(
      stored &&
      stored.id
    ){

      return {

        id:
          stored.id,

        email:
          stored.email || ""

      };

    }

  }catch(error){}


  return null;

}



/* ============================================================
   DATE
============================================================ */

function formatDate(value){

  if(!value){

    return "";

  }


  try{

    return new Date(
      value
    ).toLocaleString(
      "bn-BD",
      {
        day:"numeric",
        month:"short",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch(error){

    return "";

  }

}



/* ============================================================
   GET IMAGE
============================================================ */

function getImage(ad){

  if(!ad){

    return "";

  }


  const images =
    ad.image_urls;


  if(
    Array.isArray(images) &&
    images.length
  ){

    return images[0];

  }


  if(
    typeof images ===
    "string"
  ){

    try{

      const parsed =
        JSON.parse(
          images
        );


      if(
        Array.isArray(parsed) &&
        parsed.length
      ){

        return parsed[0];

      }

    }catch(error){

      if(
        images.startsWith(
          "http"
        )
      ){

        return images;

      }

    }

  }


  return "";

}



/* ============================================================
   LOAD ADS
============================================================ */

async function getAds(
  ids,
  session
){

  const missing =
    ids.filter(
      id =>
        !adsCache[id]
    );


  if(!missing.length){

    return;

  }


  const idList =
    missing
      .map(
        id =>
          '"' +
          id.replace(
            /"/g,
            '\\"'
          ) +
          '"'
      )
      .join(",");


  const url =

    SUPA_URL +

    "/rest/v1/ads" +

    "?select=*" +

    "&id=in.(" +

    idList +

    ")";


  const response =
    await fetch(
      url,
      {

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    throw new Error(
      "বিজ্ঞাপনের তথ্য লোড করা যায়নি।"
    );

  }


  const data =
    await response.json();


  if(
    Array.isArray(data)
  ){

    data.forEach(
      ad => {

        adsCache[
          String(ad.id)
        ] = ad;

      }
    );

  }

}



/* ============================================================
   LOAD INBOX
============================================================ */

async function loadInbox(){

  if(loading){

    return;

  }


  loading = true;

  clearError();


  refreshBtn.disabled =
    true;

  refreshBtn.textContent =
    "Loading...";


  inbox.innerHTML = `

    <div class="loading-box">

      Messages লোড হচ্ছে...

    </div>

  `;


  try{

    const session =
      await getSession();


    if(!session){

      throw new Error(
        "Login session পাওয়া যায়নি।"
      );

    }


    /*
     * --------------------------------------------------------
     * IMPORTANT
     *
     * conversations table নয়।
     *
     * সরাসরি messages table থেকে
     * Buyer/Seller-এর সব message নেওয়া হচ্ছে।
     * --------------------------------------------------------
     */

    const userId =
      encodeURIComponent(
        currentUser.id
      );


    const url =

      SUPA_URL +

      "/rest/v1/messages" +

      "?select=*" +

      "&or=(" +

      "sender_id.eq." +
      userId +

      ",receiver_id.eq." +
      userId +

      ")" +

      "&order=created_at.desc";


    const response =
      await fetch(
        url,
        {

          headers:{

            "apikey":
              SUPA_KEY,

            "Authorization":
              "Bearer " +
              session.access_token,

            "Content-Type":
              "application/json"

          }

        }
      );


    if(!response.ok){

      const text =
        await response.text();

      throw new Error(
        "Messages load failed: " +
        text
      );

    }


    const messages =
      await response.json();


    if(
      !Array.isArray(messages) ||
      !messages.length
    ){

      showEmpty();

      return;

    }


    /*
     * --------------------------------------------------------
     * প্রতিটি ad-এর জন্য শুধু সর্বশেষ message রাখবো
     * --------------------------------------------------------
     */

    const conversations = {};


    messages.forEach(
      function(message){

        const adId =
          message.ad_id;


        if(!adId){

          return;

        }


        if(
          !conversations[adId]
        ){

          conversations[adId] =
            message;

        }

      }
    );


    const adIds =
      Object.keys(
        conversations
      );


    if(!adIds.length){

      showEmpty();

      return;

    }


    /*
     * Ads-এর তথ্য আনি
     */

    await getAds(
      adIds,
      session
    );


    /*
     * যেসব ad পাওয়া গেছে সেগুলোই দেখাবো
     */

    const list =
      adIds
        .map(
          function(adId){

            return {

              adId:
                adId,

              message:
                conversations[adId],

              ad:
                adsCache[adId]

            };

          }
        )
        .filter(
          item =>
            item.ad
        );


    if(!list.length){

      showEmpty();

      return;

    }


    renderInbox(
      list
    );


  }catch(error){

    console.error(
      "INBOX ERROR:",
      error
    );


    inbox.innerHTML = "";


    showError(
      error.message ||
      "Messages লোড করা যাচ্ছে না।"
    );


  }finally{

    loading = false;

    refreshBtn.disabled =
      false;

    refreshBtn.textContent =
      "↻ Refresh";

  }

}



/* ============================================================
   RENDER INBOX
============================================================ */

function renderInbox(
  list
){

  inbox.innerHTML =

    list
      .map(
        function(item){

          const ad =
            item.ad;


          const message =
            item.message;


          const image =
            getImage(ad);


          const senderId =
            String(
              message.sender_id ||
              ""
            );


          const receiverId =
            String(
              message.receiver_id ||
              ""
            );


          let person =
            "কথোপকথন";


          if(
            senderId ===
            String(
              currentUser.id
            )
          ){

            person =
              "আপনি → বিক্রেতা";

          }else{

            person =
              "ক্রেতার মেসেজ";

          }


          /*
           * নিজের ad হলে incoming message
           * buyer থেকে এসেছে।
           */

          if(
            ad.seller_id &&
            String(
              ad.seller_id
            ) === String(
              currentUser.id
            )
          ){

            if(
              senderId !==
              String(
                currentUser.id
              )
            ){

              person =
                "ক্রেতার মেসেজ";

            }else{

              person =
                "আপনি → ক্রেতা";

            }

          }


          const imageHTML =

            image

            ?

            `

              <div
                class="conversation-image">

                <img
                  src="${esc(image)}"
                  alt="${esc(
                    ad.title ||
                    "বিজ্ঞাপন"
                  )}"
                  loading="lazy"
                >

              </div>

            `

            :

            `

              <div
                class="conversation-image">

                💬

              </div>

            `;


          return `

            <a

              class="conversation"

              href="chat.html?id=${encodeURIComponent(
                item.adId
              )}"

            >


              ${imageHTML}


              <div
                class="conversation-content">


                <div
                  class="conversation-top">

                  <div
                    class="conversation-title">

                    ${esc(
                      ad.title ||
                      "বিজ্ঞাপন"
                    )}

                  </div>


                  <div
                    class="conversation-time">

                    ${esc(
                      formatDate(
                        message.created_at
                      )
                    )}

                  </div>

                </div>


                <div
                  class="conversation-person">

                  ${esc(
                    person
                  )}

                </div>


                <div
                  class="conversation-message">

                  ${esc(
                    message.message ||
                    ""
                  )}

                </div>


              </div>


              <div
                class="conversation-arrow">

                ›

              </div>


            </a>

          `;

        }
      )
      .join("");

}



/* ============================================================
   EMPTY
============================================================ */

function showEmpty(){

  inbox.innerHTML = `

    <div class="empty-box">


      <div class="empty-icon">

        💬

      </div>


      <strong>

        এখনো কোনো মেসেজ নেই

      </strong>


      <p>

        কোনো বিজ্ঞাপনের ভিতর থেকে
        বিক্রেতা বা ক্রেতাকে মেসেজ করলে
        সেই কথোপকথন এখানে দেখা যাবে।

      </p>


    </div>

  `;

}



/* ============================================================
   REFRESH
============================================================ */

refreshBtn.addEventListener(
  "click",
  function(){

    loadInbox();

  }
);



/* ============================================================
   INITIALIZE
============================================================ */

async function initialize(){

  try{

    currentUser =
      await getUser();


    if(!currentUser){

      loginBox.style.display =
        "block";

      return;

    }


    inboxBox.style.display =
      "block";


    await loadInbox();


    /*
     * প্রতি 5 সেকেন্ডে Inbox refresh
     */

    setInterval(
      function(){

        loadInbox();

      },
      5000
    );


  }catch(error){

    console.error(
      "Messages initialize error:",
      error
    );


    showError(
      error.message ||
      "Messages চালু করা যাচ্ছে না।"
    );

  }

}


initialize();


})();

</script>
