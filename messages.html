<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages</title><link rel="stylesheet" href="style.css"></head><body><main class="container" style="padding:35px 0;max-width:760px"><a class="brand" href="index.html"><b>শাহমাহমুদপুর</b><strong>বাজার</strong></a><section class="authbox" style="margin-top:25px"><h1 style="font-size:26px">Messages</h1><div id="chat" style="height:280px;overflow:auto;border:1px solid #18251e;padding:12px;margin:15px 0;color:#82958a">এখানে Buyer ও Seller-এর chat interface থাকবে।</div><form id="f" style="display:flex;gap:8px"><input id="m" placeholder="Message লিখুন..." style="flex:1"><button class="btn green">Send</button></form></section></main><script>f.onsubmit=e=>{e.preventDefault();if(!m.value.trim())return;chat.innerHTML+=`<p style="color:#69f5a5">আপনি: ${escapeHtml(m.value)}</p>`;m.value=""}</script><script src="app.js"></script></body></html>
