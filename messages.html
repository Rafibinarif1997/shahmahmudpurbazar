<script src="supabase.js?v=30"></script>


<script>

(function(){

"use strict";


/* ==========================================================
   CONFIG
========================================================== */

const SUPA_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


/* ==========================================================
   ELEMENTS
========================================================== */

const result =
  document.getElementById(
    "result"
  );


const pageTitle =
  document.getElementById(
    "pageTitle"
  );


const pageSubtitle =
  document.getElementById(
    "pageSubtitle"
  );


/* ==========================================================
   URL
========================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const adId =
  params.get("id") || "";


/* ==========================================================
   STATE
========================================================== */

let currentUser =
  null;

let currentSession =
  null;

let currentAd =
  null;

let currentConversation =
  null;

let chatInterval =
  null;

let inboxInterval =
  null;

let sending =
  false;


/* ==========================================================
   ESCAPE
========================================================== */

function esc(value){

  return String(
    value ?? ""
  )

  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")

  .replace(/>/g,"&gt;")

  .replace(/"/g,"&quot;")

  .replace(/'/g,"&#039;");

}


/* ==========================================================
   SHOW ERROR
========================================================== */

function showError(message){

  result.innerHTML = `

    <div class="error">

      ${esc(
        message ||
        "একটি সমস্যা হয়েছে।"
      )}

    </div>

  `;

}


/* ==========================================================
   SESSION
========================================================== */

async function getSession(){

  try{

    if(
      typeof getSbSession ===
      "function"
    ){

      const session =
        await getSbSession();

      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }

  }catch(error){

    console.error(
      "SESSION ERROR:",
      error
    );

  }


  return null;

}


/* ==========================================================
   USER
========================================================== */

async function getUser(){

  try{

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        await getCurrentUser();

      if(user){

        return user;

      }

    }

  }catch(error){

    console.error(
      "USER ERROR:",
      error
    );

  }


  /* fallback */

  try{

    const stored =
      JSON.parse(
        localStorage.getItem(
          "smb_user_v1"
        ) || "null"
      );


    if(
      stored &&
      stored.id
    ){

      return {

        id:
          stored.id,

        email:
          stored.email || "",

        user_metadata:{
          full_name:
            stored.name || ""
        }

      };

    }

  }catch(error){}


  return null;

}


/* ==========================================================
   SUPABASE GET
========================================================== */

async function supaGet(
  path
){

  const response =
    await fetch(
      SUPA_URL +
      path,
      {

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            currentSession.access_token,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    const text =
      await response.text();

    throw new Error(
      text ||
      "Supabase request failed."
    );

  }


  return await response.json();

}


/* ==========================================================
   SUPABASE POST
========================================================== */

async function supaPost(
  path,
  data
){

  const response =
    await fetch(
      SUPA_URL +
      path,
      {

        method:"POST",

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            currentSession.access_token,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body:
          JSON.stringify(data)

      }
    );


  if(!response.ok){

    const text =
      await response.text();

    throw new Error(
      text ||
      "Supabase insert failed."
    );

  }


  return await response.json();

}


/* ==========================================================
   GET AD
========================================================== */

async function getAd(){

  if(!adId){

    return null;

  }


  if(
    typeof window.getAdById ===
    "function"
  ){

    try{

      const ad =
        await window.getAdById(
          adId
        );

      if(ad){

        return ad;

      }

    }catch(error){

      console.error(
        "getAdById ERROR:",
        error
      );

    }

  }


  const data =
    await supaGet(

      "/rest/v1/ads" +

      "?id=eq." +
      encodeURIComponent(adId) +

      "&select=*"

    );


  if(
    Array.isArray(data) &&
    data.length
  ){

    return data[0];

  }


  return null;

}


/* ==========================================================
   FIND MY CONVERSATION FOR THIS AD
========================================================== */

async function findConversation(){

  const buyerId =
    encodeURIComponent(
      currentUser.id
    );


  const sellerId =
    encodeURIComponent(
      String(
        currentAd.seller_id
      )
    );


  /*
   * প্রথমে Buyer + Seller + Ad
   */

  const url =

    "/rest/v1/conversations" +

    "?ad_id=eq." +
    encodeURIComponent(
      adId
    ) +

    "&buyer_id=eq." +
    buyerId +

    "&seller_id=eq." +
    sellerId +

    "&select=id,ad_id,buyer_id,seller_id,created_at" +

    "&order=created_at.asc";


  const data =
    await supaGet(
      url
    );


  if(
    Array.isArray(data) &&
    data.length
  ){

    return data[0];

  }


  /*
   * fallback:
   * current user buyer/seller যেকোনো role-এ থাকলে
   */

  const fallbackUrl =

    "/rest/v1/conversations" +

    "?ad_id=eq." +
    encodeURIComponent(
      adId
    ) +

    "&or=(" +

      "buyer_id.eq." +
      buyerId +

      ",seller_id.eq." +
      buyerId +

    ")" +

    "&select=id,ad_id,buyer_id,seller_id,created_at" +

    "&order=created_at.asc";


  const fallback =
    await supaGet(
      fallbackUrl
    );


  if(
    Array.isArray(fallback) &&
    fallback.length
  ){

    return fallback[0];

  }


  return null;

}


/* ==========================================================
   CREATE CONVERSATION
========================================================== */

async function createConversation(){

  if(
    !currentAd ||
    !currentAd.seller_id
  ){

    throw new Error(
      "এই বিজ্ঞাপনের Seller ID পাওয়া যায়নি।"
    );

  }


  const sellerId =
    String(
      currentAd.seller_id
    );


  /*
   * Seller নিজের product-এ conversation শুরু করতে পারবে না।
   */

  if(
    sellerId ===
    String(
      currentUser.id
    )
  ){

    throw new Error(
      "এটি আপনার নিজের বিজ্ঞাপন।"
    );

  }


  const data = {

    ad_id:
      adId,

    buyer_id:
      currentUser.id,

    seller_id:
      sellerId

  };


  const created =
    await supaPost(
      "/rest/v1/conversations",
      data
    );


  if(
    Array.isArray(created) &&
    created.length
  ){

    return created[0];

  }


  throw new Error(
    "Conversation তৈরি করা যায়নি।"
  );

}


/* ==========================================================
   GET OR CREATE CONVERSATION
========================================================== */

async function getOrCreateConversation(){

  let conversation =
    await findConversation();


  if(conversation){

    return conversation;

  }


  /*
   * Seller নিজের ad খুললে
   * conversation তৈরি করবে না।
   */

  if(
    String(
      currentAd.seller_id
    ) ===
    String(
      currentUser.id
    )
  ){

    return null;

  }


  conversation =
    await createConversation();


  return conversation;

}


/* ==========================================================
   LOAD INBOX
========================================================== */

async function loadInbox(){

  pageTitle.textContent =
    "Messages";

  pageSubtitle.textContent =
    "আপনার Buyer ও Seller কথোপকথন";


  result.innerHTML = `

    <div class="loading">
      মেসেজ লোড হচ্ছে...
    </div>

  `;


  try{

    currentUser =
      await getUser();


    if(!currentUser){

      result.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🔐
          </div>

          <h2>
            Login করুন
          </h2>

          <p>
            আপনার Messages দেখতে
            আগে Login করতে হবে।
          </p>

          <br>

          <a
            href="login.html"
            class="btn green">

            Google দিয়ে Login করুন

          </a>

        </div>

      `;

      return;

    }


    currentSession =
      await getSession();


    if(!currentSession){

      throw new Error(
        "Login session পাওয়া যায়নি। আবার Login করুন।"
      );

    }


    const userId =
      encodeURIComponent(
        currentUser.id
      );


    /* ======================================================
       MY CONVERSATIONS
    ====================================================== */

    const conversations =
      await supaGet(

        "/rest/v1/conversations" +

        "?or=(" +

          "buyer_id.eq." +
          userId +

          ",seller_id.eq." +
          userId +

        ")" +

        "&select=id,ad_id,buyer_id,seller_id,created_at" +

        "&order=created_at.desc"

      );


    if(
      !Array.isArray(conversations) ||
      conversations.length === 0
    ){

      result.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            💬
          </div>

          <h2>
            এখনো কোনো মেসেজ নেই
          </h2>

          <p>
            কোনো পণ্যের ভিতর থেকে
            Buyer অথবা Seller-কে মেসেজ করলে
            এখানে কথোপকথন দেখা যাবে।
          </p>

        </div>

      `;

      return;

    }


    /* ======================================================
       MESSAGE DATA
    ====================================================== */

    const conversationIds =
      conversations
        .map(
          function(c){

            return String(
              c.id
            );

          }
        )
        .filter(Boolean);


    const messageMap = {};


    if(
      conversationIds.length
    ){

      const query =
        conversationIds
          .map(
            function(id){

              return encodeURIComponent(
                id
              );

            }
          )
          .join(",");


      const messages =
        await supaGet(

          "/rest/v1/messages" +

          "?conversation_id=in.(" +
          query +
          ")" +

          "&select=id,conversation_id,sender_id,receiver_id,body,created_at" +

          "&order=created_at.desc"

        );


      if(
        Array.isArray(messages)
      ){

        messages.forEach(
          function(message){

            const cid =
              String(
                message.conversation_id
              );


            /*
             * order desc
             * তাই প্রথমটাই latest
             */

            if(
              !messageMap[cid]
            ){

              messageMap[cid] =
                message;

            }

          }
        );

      }

    }


    /* ======================================================
       ADS
    ====================================================== */

    const adIds =
      [
        ...new Set(

          conversations
            .map(
              function(c){

                return String(
                  c.ad_id || ""
                );

              }
            )
            .filter(Boolean)

        )
      ];


    const adMap = {};


    if(adIds.length){

      const adQuery =
        adIds
          .map(
            function(id){

              return encodeURIComponent(
                id
              );

            }
          )
          .join(",");


      const ads =
        await supaGet(

          "/rest/v1/ads" +

          "?id=in.(" +
          adQuery +
          ")" +

          "&select=id,title"

        );


      if(
        Array.isArray(ads)
      ){

        ads.forEach(
          function(ad){

            adMap[
              String(ad.id)
            ] =
              ad;

          }
        );

      }

    }


    /* ======================================================
       RENDER INBOX
    ====================================================== */

    result.innerHTML = `

      <div class="conversation-list">

        ${
          conversations
            .map(
              function(conversation){

                const cid =
                  String(
                    conversation.id
                  );


                const last =
                  messageMap[cid];


                const ad =
                  adMap[
                    String(
                      conversation.ad_id
                    )
                  ];


                const title =
                  ad?.title ||
                  "বিজ্ঞাপন";


                const isSeller =
                  String(
                    conversation.seller_id
                  ) ===
                  String(
                    currentUser.id
                  );


                const role =
                  isSeller
                  ? "SELLER"
                  : "BUYER";


                const body =
                  last?.body ||
                  "কথোপকথন শুরু করুন";


                const time =
                  last?.created_at

                  ?

                  new Date(
                    last.created_at
                  ).toLocaleString(
                    "bn-BD",
                    {
                      day:"numeric",
                      month:"short",
                      hour:"numeric",
                      minute:"2-digit"
                    }
                  )

                  :

                  new Date(
                    conversation.created_at
                  ).toLocaleString(
                    "bn-BD",
                    {
                      day:"numeric",
                      month:"short",
                      hour:"numeric",
                      minute:"2-digit"
                    }
                  );


                return `

                  <a
                    class="conversation"
                    href="messages.html?id=${encodeURIComponent(
                      conversation.ad_id
                    )}">

                    <div
                      class="conversation-top">

                      <div>

                        <div class="ad-title">

                          ${esc(
                            title
                          )}

                        </div>

                        <span class="role">

                          ${role}

                        </span>

                      </div>


                      <span class="time">

                        ${esc(
                          time
                        )}

                      </span>

                    </div>


                    <div class="last-message">

                      ${esc(
                        body
                      )}

                    </div>

                  </a>

                `;

              }
            )
            .join("")
        }

      </div>

    `;


  }catch(error){

    console.error(
      "INBOX ERROR:",
      error
    );


    showError(
      "Messages লোড করা যাচ্ছে না। " +
      (
        error.message ||
        ""
      )
    );

  }

}


/* ==========================================================
   LOAD CHAT
========================================================== */

async function loadChat(){

  pageTitle.textContent =
    "Private Message";

  pageSubtitle.textContent =
    "বিক্রেতার সাথে সরাসরি যোগাযোগ করুন";


  result.innerHTML = `

    <div class="loading">
      Chat লোড হচ্ছে...
    </div>

  `;


  try{

    currentUser =
      await getUser();


    if(!currentUser){

      result.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🔐
          </div>

          <h2>
            Login করুন
          </h2>

          <p>
            মেসেজ করতে আগে Login করতে হবে।
          </p>

          <br>

          <a
            href="login.html"
            class="btn green">

            Google দিয়ে Login করুন

          </a>

        </div>

      `;

      return;

    }


    currentSession =
      await getSession();


    if(!currentSession){

      throw new Error(
        "Login session পাওয়া যায়নি। আবার Login করুন।"
      );

    }


    /* ======================================================
       AD
    ====================================================== */

    currentAd =
      await getAd();


    if(!currentAd){

      throw new Error(
        "এই বিজ্ঞাপনটি পাওয়া যায়নি।"
      );

    }


    /* ======================================================
       SELLER CHECK
    ====================================================== */

    const isSeller =
      String(
        currentAd.seller_id
      ) ===
      String(
        currentUser.id
      );


    /* ======================================================
       CONVERSATION
    ====================================================== */

    currentConversation =
      await getOrCreateConversation();


    /*
     * Seller-এর নিজের ad হলে conversation না থাকতেই পারে।
     */

    if(
      !currentConversation &&
      isSeller
    ){

      renderChat(
        [],
        true
      );

      return;

    }


    if(!currentConversation){

      throw new Error(
        "Conversation তৈরি করা যায়নি।"
      );

    }


    await refreshChat();


    /*
     * প্রতি ৩ সেকেন্ডে নতুন message
     */

    if(chatInterval){

      clearInterval(
        chatInterval
      );

    }


    chatInterval =
      setInterval(
        refreshChat,
        3000
      );


  }catch(error){

    console.error(
      "CHAT ERROR:",
      error
    );


    showError(
      error.message ||
      "Chat চালু করা যাচ্ছে না।"
    );

  }

}


/* ==========================================================
   REFRESH CHAT
========================================================== */

async function refreshChat(){

  if(
    !currentConversation ||
    !currentSession
  ){

    return;

  }


  try{

    const cid =
      encodeURIComponent(
        currentConversation.id
      );


    const messages =
      await supaGet(

        "/rest/v1/messages" +

        "?conversation_id=eq." +
        cid +

        "&select=id,conversation_id,sender_id,receiver_id,body,created_at" +

        "&order=created_at.asc"

      );


    renderChat(
      Array.isArray(messages)
      ? messages
      : [],
      false
    );


  }catch(error){

    console.error(
      "CHAT REFRESH ERROR:",
      error
    );

  }

}


/* ==========================================================
   RENDER CHAT
========================================================== */

function renderChat(
  messages,
  sellerOnly
){

  const sellerName =
    currentAd?.seller_name ||
    currentAd?.seller ||
    currentAd?.seller_email ||
    "বিক্রেতা";


  const isSeller =
    currentAd &&
    String(
      currentAd.seller_id
    ) ===
    String(
      currentUser.id
    );


  result.innerHTML = `

    <div class="chat-box">

      <div class="chat-header">

        <a
          href="messages.html"
          class="back-button">

          ← Messages

        </a>


        <small>
          PRIVATE MESSAGE
        </small>


        <h2>

          ${esc(
            currentAd?.title ||
            "বিজ্ঞাপন"
          )}

        </h2>


        <p>

          ${
            isSeller

            ?

            "আপনার বিজ্ঞাপন • ক্রেতার মেসেজ"

            :

            "বিক্রেতা: " +
            esc(
              sellerName
            )

          }

        </p>

      </div>


      <div
        id="chatMessages"
        class="messages-list">

        ${
          messages.length

          ?

          messages
            .map(
              function(message){

                const mine =
                  String(
                    message.sender_id
                  ) ===
                  String(
                    currentUser.id
                  );


                const time =
                  message.created_at

                  ?

                  new Date(
                    message.created_at
                  ).toLocaleString(
                    "bn-BD",
                    {
                      day:"numeric",
                      month:"short",
                      hour:"numeric",
                      minute:"2-digit"
                    }
                  )

                  :

                  "";


                return `

                  <div
                    class="
                      message-row
                      ${
                        mine
                        ? "mine"
                        : "theirs"
                      }
                    ">

                    <div
                      class="message-bubble">

                      ${esc(
                        message.body
                      )}

                      ${
                        time

                        ?

                        `
                        <span
                          class="message-time">

                          ${esc(
                            time
                          )}

                        </span>
                        `

                        :

                        ""

                      }

                    </div>

                  </div>

                `;

              }
            )
            .join("")

          :

          `

          <div class="message-empty">

            ${
              sellerOnly

              ?

              "কোনো ক্রেতা এখনো মেসেজ করেনি।"

              :

              "এখনো কোনো মেসেজ নেই।<br>নিচে মেসেজ লিখে কথোপকথন শুরু করুন।"

            }

          </div>

          `

        }

      </div>


      ${
        sellerOnly

        ?

        ""

        :

        `

        <form
          id="chatForm"
          class="chat-form">

          <input
            id="messageInput"
            type="text"
            autocomplete="off"
            maxlength="2000"
            placeholder="মেসেজ লিখুন...">

          <button
            id="sendButton"
            type="submit"
            class="btn green">

            Send

          </button>

        </form>

        `

      }

    </div>

  `;


  const chatMessages =
    document.getElementById(
      "chatMessages"
    );


  if(chatMessages){

    chatMessages.scrollTop =
      chatMessages.scrollHeight;

  }


  const chatForm =
    document.getElementById(
      "chatForm"
    );


  if(chatForm){

    chatForm.addEventListener(
      "submit",
      sendMessage
    );

  }

}


/* ==========================================================
   SEND MESSAGE
========================================================== */

async function sendMessage(
  event
){

  event.preventDefault();


  if(sending){

    return;

  }


  const input =
    document.getElementById(
      "messageInput"
    );


  const button =
    document.getElementById(
      "sendButton"
    );


  if(!input){

    return;

  }


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  if(
    !currentConversation
  ){

    return;

  }


  const isSeller =
    String(
      currentConversation.seller_id
    ) ===
    String(
      currentUser.id
    );


  const receiverId =
    isSeller

    ?

    currentConversation.buyer_id

    :

    currentConversation.seller_id;


  if(!receiverId){

    alert(
      "Receiver ID পাওয়া যায়নি।"
    );

    return;

  }


  if(
    String(
      receiverId
    ) ===
    String(
      currentUser.id
    )
  ){

    alert(
      "নিজেকে মেসেজ করা যাবে না।"
    );

    return;

  }


  sending = true;


  if(button){

    button.disabled =
      true;

    button.textContent =
      "Sending...";

  }


  try{

    await supaPost(

      "/rest/v1/messages",

      {

        conversation_id:
          currentConversation.id,

        sender_id:
          currentUser.id,

        receiver_id:
          receiverId,

        body:
          text

      }

    );


    input.value = "";


    await refreshChat();


  }catch(error){

    console.error(
      "SEND MESSAGE ERROR:",
      error
    );


    alert(
      "মেসেজ পাঠানো যায়নি:\n\n" +
      (
        error.message ||
        "Unknown error"
      )
    );

  }finally{

    sending = false;


    if(button){

      button.disabled =
        false;

      button.textContent =
        "Send";

    }


    input.focus();

  }

}


/* ==========================================================
   START
========================================================== */

async function initialize(){

  /*
   * আগের chat interval বন্ধ
   */

  if(chatInterval){

    clearInterval(
      chatInterval
    );

    chatInterval =
      null;

  }


  if(inboxInterval){

    clearInterval(
      inboxInterval
    );

    inboxInterval =
      null;

  }


  /*
   * URL-এ id থাকলে CHAT
   */

  if(adId){

    await loadChat();

  }

  else{

    await loadInbox();


    /*
     * Inbox প্রতি ৫ সেকেন্ডে refresh
     */

    inboxInterval =
      setInterval(
        loadInbox,
        5000
      );

  }

}


initialize();


})();
</script>
