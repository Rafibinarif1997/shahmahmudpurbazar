<style>

.messages-page{
  max-width:760px;
  padding:30px 16px 110px;
}

.inbox{
  margin-top:25px;
}

.inbox-head{
  margin-bottom:18px;
}

.inbox-head small{
  color:#69f5a5;
  font-size:8px;
  font-weight:800;
  letter-spacing:2px;
}

.inbox-head h1{
  margin:7px 0 5px;
  color:#edf7f1;
  font-size:30px;
}

.inbox-head p{
  margin:0;
  color:#718078;
  font-size:10px;
}

.conversation-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.conversation{
  display:block;
  padding:16px;
  border:1px solid rgba(105,245,165,.12);
  border-radius:16px;
  background:rgba(5,14,10,.72);
  text-decoration:none;
}

.conversation:hover{
  border-color:rgba(105,245,165,.3);
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.ad-title{
  color:#edf7f1;
  font-size:14px;
  font-weight:800;
}

.role{
  display:inline-block;
  margin-top:6px;
  color:#69f5a5;
  font-size:8px;
  font-weight:800;
  letter-spacing:1px;
}

.last-message{
  margin-top:10px;
  color:#87978f;
  font-size:10px;
  line-height:1.6;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.time{
  color:#64746c;
  font-size:8px;
  white-space:nowrap;
}

.empty{
  padding:60px 20px;
  text-align:center;
  border:1px solid rgba(105,245,165,.12);
  border-radius:18px;
  background:rgba(5,14,10,.55);
}

.empty-icon{
  width:58px;
  height:58px;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#69f5a5;
  background:rgba(105,245,165,.06);
  border:1px solid rgba(105,245,165,.15);
  font-size:25px;
}

.empty h2{
  margin-bottom:8px;
  color:#edf7f1;
  font-size:18px;
}

.empty p{
  color:#718078;
  font-size:10px;
  line-height:1.8;
}

.error{
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,90,90,.18);
  background:rgba(255,90,90,.04);
  color:#ff9d9d;
  font-size:10px;
  line-height:1.7;
}

.loading{
  padding:50px 20px;
  text-align:center;
  color:#718078;
  font-size:10px;
}

</style>

</head>


<body>


<main class="container messages-page">


<a href="index.html"
   class="brand">

  <b>শাহমাহমুদপুর</b>

  <strong>বাজার</strong>

  <small>LOCAL MARKETPLACE</small>

</a>


<section class="inbox">


<div class="inbox-head">

  <small>PRIVATE MESSAGES</small>

  <h1>Messages</h1>

  <p>
    আপনার সব Buyer ও Seller কথোপকথন
  </p>

</div>


<div id="result">

  <div class="loading">
    মেসেজ লোড হচ্ছে...
  </div>

</div>


</section>

</main>



<nav class="mobile-nav">

  Saved

  Sell

<a class="active"
   href="messages.html">
  <span>▤</span>
  Messages
</a>

<a href="profile.html">
  <span>♙</span>
  Profile
</a>

<script src="supabase.js?v=20"></script>


<script>

(function(){

"use strict";


const SUPA_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


const result =
  document.getElementById("result");


let currentUser = null;


/* ==========================================================
   ESCAPE
========================================================== */

function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==========================================================
   SESSION
========================================================== */

async function getSession(){

  try{

    if(
      typeof getSbSession ===
      "function"
    ){

      const session =
        await getSbSession();

      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }

  }catch(error){

    console.error(error);

  }

  return null;

}


/* ==========================================================
   USER
========================================================== */

async function getUser(){

  try{

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        await getCurrentUser();

      if(user){

        return user;

      }

    }

  }catch(error){

    console.error(error);

  }


  try{

    const stored =
      JSON.parse(
        localStorage.getItem(
          "smb_user_v1"
        ) || "null"
      );

    if(
      stored &&
      stored.id
    ){

      return {
        id:stored.id,
        email:stored.email || ""
      };

    }

  }catch(error){}


  return null;

}


/* ==========================================================
   LOAD MY MESSAGES
========================================================== */

async function loadMessages(){

  result.innerHTML = `

    <div class="loading">
      মেসেজ লোড হচ্ছে...
    </div>

  `;


  try{

    currentUser =
      await getUser();


    if(!currentUser){

      result.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🔐
          </div>

          <h2>
            Login করুন
          </h2>

          <p>
            আপনার Messages দেখতে
            আগে Login করতে হবে।
          </p>

          <br>

          <a
            href="login.html"
            class="btn green">

            Google দিয়ে Login করুন

          </a>

        </div>

      `;

      return;

    }


    const session =
      await getSession();


    if(!session){

      throw new Error(
        "Login session পাওয়া যায়নি।"
      );

    }


    /*
     * IMPORTANT
     *
     * conversations table ব্যবহার করছি না।
     *
     * সরাসরি messages table থেকে
     * যেসব message আমি পাঠিয়েছি
     * অথবা আমাকে পাঠানো হয়েছে
     * সেগুলো নেওয়া হচ্ছে।
     */

    const userId =
      encodeURIComponent(
        currentUser.id
      );


    const url =

      SUPA_URL +

      "/rest/v1/messages" +

      "?or=(" +

        "sender_id.eq." +
        userId +

        ",receiver_id.eq." +
        userId +

      ")" +

      "&select=*" +

      "&order=created_at.desc";


    const response =
      await fetch(
        url,
        {

          headers:{

            "apikey":
              SUPA_KEY,

            "Authorization":
              "Bearer " +
              session.access_token,

            "Content-Type":
              "application/json"

          }

        }
      );


    if(!response.ok){

      const text =
        await response.text();

      throw new Error(
        text
      );

    }


    const messages =
      await response.json();


    if(
      !Array.isArray(messages) ||
      !messages.length
    ){

      result.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            💬
          </div>

          <h2>
            এখনো কোনো মেসেজ নেই
          </h2>

          <p>
            কোনো পণ্যের ভিতর থেকে
            Buyer অথবা Seller-কে মেসেজ করলে
            এখানে কথোপকথন দেখা যাবে।
          </p>

        </div>

      `;

      return;

    }


    /*
     * একই ad-এর message একসাথে করা হবে।
     */

    const groups = {};


    messages.forEach(
      function(message){

        const adId =
          String(
            message.ad_id || ""
          );


        if(!adId){

          return;

        }


        if(!groups[adId]){

          groups[adId] = [];

        }


        groups[adId].push(
          message
        );

      }
    );


    const adIds =
      Object.keys(groups);


    if(!adIds.length){

      result.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            💬
          </div>

          <h2>
            কোনো কথোপকথন পাওয়া যায়নি
          </h2>

        </div>

      `;

      return;

    }


    /*
     * সব ad-এর title একসাথে নেওয়া
     */

    const adQuery =
      adIds
        .map(
          id =>
            encodeURIComponent(id)
        )
        .join(",");


    const adResponse =
      await fetch(

        SUPA_URL +
        "/rest/v1/ads" +

        "?id=in.(" +
        adQuery +
        ")" +

        "&select=id,title",

        {

          headers:{

            "apikey":
              SUPA_KEY,

            "Authorization":
              "Bearer " +
              session.access_token

          }

        }

      );


    let ads = [];


    if(adResponse.ok){

      ads =
        await adResponse.json();

    }


    const adMap = {};


    ads.forEach(
      function(ad){

        adMap[
          String(ad.id)
        ] = ad;

      }
    );


    /*
     * Inbox render
     */

    result.innerHTML = `

      <div class="conversation-list">

        ${
          adIds.map(
            function(adId){

              const list =
                groups[adId];


              /*
               * সর্বশেষ message
               */

              const last =
                list[0];


              /*
               * অপর পক্ষ
               */

              const other =
                String(
                  last.sender_id
                ) ===
                String(
                  currentUser.id
                )

                ?

                last.receiver_id

                :

                last.sender_id;


              const ad =
                adMap[adId];


              const title =
                ad?.title ||
                "বিজ্ঞাপন";


              const role =
                String(
                  last.sender_id
                ) ===
                String(
                  currentUser.id
                )

                ?

                "SENT"

                :

                "RECEIVED";


              const time =
                last.created_at
                ?

                new Date(
                  last.created_at
                ).toLocaleString(
                  "bn-BD",
                  {
                    day:"numeric",
                    month:"short",
                    hour:"numeric",
                    minute:"2-digit"
                  }
                )

                :

                "";


              return `

                <a
                  class="conversation"
                  href="messages.html?id=${encodeURIComponent(
                    adId
                  )}">

                  <div
                    class="conversation-top">

                    <div>

                      <div class="ad-title">

                        ${esc(title)}

                      </div>

                      <span class="role">

                        ${role}

                      </span>

                    </div>

                    <span class="time">

                      ${esc(time)}

                    </span>

                  </div>


                  <div class="last-message">

                    ${esc(
                      last.message ||
                      ""
                    )}

                  </div>

                </a>

              `;

            }
          ).join("")
        }

      </div>

    `;


  }catch(error){

    console.error(
      "MESSAGE INBOX ERROR:",
      error
    );


    result.innerHTML = `

      <div class="error">

        Messages লোড করা যাচ্ছে না।

        <br><br>

        ${esc(
          error.message ||
          "Unknown error"
        )}

      </div>

    `;

  }

}


/* ==========================================================
   START
========================================================== */

loadMessages();


/*
 * প্রতি ৫ সেকেন্ডে refresh
 */

setInterval(
  loadMessages,
  5000
);


})();

</script>


</body>

</html>
