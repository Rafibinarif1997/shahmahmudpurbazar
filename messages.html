<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Messages | শাহমাহমুদপুর বাজার</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   SIMPLE LIGHT MESSAGES UI
========================= */

.messages-page{
  max-width:900px;
  padding:28px 16px 110px;
}


/* HEADER */

.messages-header{
  padding:16px 0;
  border-bottom:1px solid #e8e8e8;
  background:#fff;
}

.messages-header .head{
  display:flex;
  align-items:center;
}

.messages-header .brand{
  text-decoration:none;
  line-height:1.05;
}

.messages-header .brand b,
.messages-header .brand strong{
  display:block;
}

.messages-header .brand b{
  font-size:19px;
  color:#222;
  font-weight:800;
}

.messages-header .brand strong{
  font-size:21px;
  color:#16a05d;
  font-weight:900;
}

.messages-header .brand small{
  display:block;
  margin-top:5px;
  font-size:7px;
  letter-spacing:2px;
  color:#999;
}


/* PAGE TOP */

.inbox{
  margin-top:0;
}

.inbox-head{
  margin-bottom:18px;
}

.inbox-head small{
  display:block;
  color:#16a05d;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.5px;
  margin-bottom:7px;
}

.inbox-head h1{
  margin:0;
  color:#222;
  font-size:28px;
  font-weight:800;
}

.inbox-head p{
  margin:7px 0 0;
  color:#777;
  font-size:13px;
}


/* TOP ACTION */

.refresh{
  display:flex;
  justify-content:flex-end;
  margin:0 0 15px;
}

.refresh button{
  border:1px solid #e2e2e2;
  background:#fff;
  color:#555;
  padding:8px 13px;
  border-radius:8px;
  font-size:11px;
  cursor:pointer;
}

.refresh button:hover{
  border-color:#16a05d;
  color:#16a05d;
}


/* CONVERSATIONS */

.conversation-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.conversation{
  display:block;
  padding:16px;
  background:#fff;
  border:1px solid #e9e9e9;
  border-radius:12px;
  text-decoration:none;
  transition:.2s ease;
}

.conversation:hover{
  border-color:#b9e5cf;
  box-shadow:0 4px 15px rgba(0,0,0,.04);
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.ad-title{
  color:#222;
  font-size:14px;
  font-weight:700;
  line-height:1.4;
}

.person{
  display:inline-block;
  margin-top:7px;
  font-size:9px;
  font-weight:700;
  color:#16a05d;
  letter-spacing:.5px;
}

.last-message{
  margin-top:10px;
  color:#777;
  font-size:12px;
  line-height:1.5;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.time{
  color:#aaa;
  font-size:10px;
  white-space:nowrap;
}


/* STATES */

.loading{
  padding:60px 20px;
  text-align:center;
  color:#888;
  font-size:13px;
}

.empty{
  padding:55px 20px;
  text-align:center;
  color:#777;
  font-size:13px;
  background:#fff;
  border:1px solid #e9e9e9;
  border-radius:12px;
  line-height:1.8;
}

.empty a{
  display:inline-block;
  margin-top:10px;
}

.error{
  padding:16px;
  border-radius:10px;
  border:1px solid #ffd5d5;
  background:#fff8f8;
  color:#d65c5c;
  font-size:12px;
  line-height:1.7;
}


/* MOBILE */

@media(max-width:700px){

  .messages-page{
    padding:22px 14px 100px;
  }

  .messages-header{
    padding:14px 0;
  }

  .messages-header .brand b{
    font-size:17px;
  }

  .messages-header .brand strong{
    font-size:19px;
  }

  .messages-header .brand small{
    font-size:6px;
  }

  .inbox-head h1{
    font-size:26px;
  }

  .conversation{
    padding:14px;
    border-radius:10px;
  }

  .ad-title{
    font-size:13px;
  }

  .last-message{
    font-size:11px;
  }

}

</style>

</head>


<body>


<!-- HEADER -->

<header class="messages-header">

  <div class="container head">

    <a class="brand" href="index.html">

      <b>শাহমাহমুদপুর</b>

      <strong>বাজার</strong>

      <small>LOCAL MARKETPLACE</small>

    </a>

  </div>

</header>



<!-- MAIN -->

<main class="container messages-page">

<section class="inbox">


<div class="inbox-head">

  <small>PRIVATE MESSAGES</small>

  <h1>Messages</h1>

  <p>
    আপনার Buyer ও Seller কথোপকথন
  </p>

</div>


<div class="refresh">

  <button id="refreshBtn" type="button">

    ↻ Refresh

  </button>

</div>


<div id="result">

  <div class="loading">

    মেসেজ লোড হচ্ছে...

  </div>

</div>


</section>

</main>



<!-- MOBILE NAV -->

<nav class="mobile-nav">

<a href="index.html">

  <span>⌂</span>
  Home

</a>

<a href="favorites.html">

  <span>♡</span>
  Saved

</a>

<a href="post-ad.html">

  <span>⊞</span>
  Sell

</a>

<a class="active" href="messages.html">

  <span>▤</span>
  Messages

</a>

<a href="profile.html">

  <span>♙</span>
  Profile

</a>

</nav>



<script src="supabase.js?v=30"></script>


<script>

(function(){

"use strict";


const SUPA_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


const result =
  document.getElementById("result");


const refreshBtn =
  document.getElementById("refreshBtn");


let currentUser = null;



function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



async function getSession(){

  if(typeof getSbSession === "function"){

    try{

      const session =
        await getSbSession();

      if(session && session.access_token){

        return session;

      }

    }catch(e){

      console.error(e);

    }

  }

  return null;

}



async function getUser(){

  if(typeof getCurrentUser === "function"){

    try{

      const user =
        await getCurrentUser();

      if(user){

        return user;

      }

    }catch(e){

      console.error(e);

    }

  }


  try{

    const saved =
      JSON.parse(
        localStorage.getItem("smb_user_v1") ||
        "null"
      );

    if(saved && saved.id){

      return {

        id:saved.id,
        email:saved.email || ""

      };

    }

  }catch(e){}


  return null;

}



async function api(url,session){

  const response =
    await fetch(url,{

      headers:{

        "apikey":SUPA_KEY,

        "Authorization":
          "Bearer " +
          session.access_token,

        "Content-Type":
          "application/json"

      }

    });


  if(!response.ok){

    throw new Error(
      await response.text()
    );

  }


  return await response.json();

}



async function loadInbox(){


  result.innerHTML = `

    <div class="loading">

      মেসেজ লোড হচ্ছে...

    </div>

  `;


  try{


    currentUser =
      await getUser();


    if(!currentUser){


      result.innerHTML = `

        <div class="empty">

          🔐<br><br>

          আগে Login করুন।

          <br>

          <a
            href="login.html"
            class="btn">

            Login করুন

          </a>

        </div>

      `;


      return;

    }


    const session =
      await getSession();


    if(!session){

      throw new Error(
        "Login session পাওয়া যায়নি।"
      );

    }


    const uid =
      encodeURIComponent(
        currentUser.id
      );


    const conversationUrl =

      SUPA_URL +
      "/rest/v1/conversations" +

      "?or=(" +

      "buyer_id.eq." +
      uid +

      ",seller_id.eq." +
      uid +

      ")" +

      "&select=*" +

      "&order=created_at.desc";


    const conversations =
      await api(
        conversationUrl,
        session
      );


    if(
      !Array.isArray(conversations) ||
      !conversations.length
    ){


      result.innerHTML = `

        <div class="empty">

          💬<br><br>

          এখনো কোনো কথোপকথন নেই।

          <br><br>

          কোনো বিজ্ঞাপনের ভিতর থেকে
          বিক্রেতাকে মেসেজ করুন।

        </div>

      `;


      return;

    }


    const conversationIds =
      conversations.map(
        c => String(c.id)
      );


    const idList =
      conversationIds
      .map(
        id => encodeURIComponent(id)
      )
      .join(",");


    const messageUrl =

      SUPA_URL +
      "/rest/v1/messages" +

      "?conversation_id=in.(" +
      idList +
      ")" +

      "&select=*" +

      "&order=created_at.desc";


    const allMessages =
      await api(
        messageUrl,
        session
      );


    const lastMessages = {};


    if(Array.isArray(allMessages)){


      allMessages.forEach(
        function(message){


          const cid =
            String(
              message.conversation_id
            );


          if(!lastMessages[cid]){

            lastMessages[cid] =
              message;

          }


        }
      );


    }


    const adIds =
      conversations
      .map(
        c => String(c.ad_id)
      )
      .filter(Boolean);


    let ads = [];


    if(adIds.length){


      const uniqueAdIds =
        [...new Set(adIds)];


      const adList =
        uniqueAdIds
        .map(
          id => encodeURIComponent(id)
        )
        .join(",");


      const adsUrl =

        SUPA_URL +
        "/rest/v1/ads" +

        "?id=in.(" +
        adList +
        ")" +

        "&select=id,title,seller_name";


      try{

        ads =
          await api(
            adsUrl,
            session
          );

      }catch(e){

        console.error(
          "Ads load error:",
          e
        );

      }

    }


    const adMap = {};


    ads.forEach(
      function(ad){

        adMap[
          String(ad.id)
        ] = ad;

      }
    );


    const html =
      conversations
      .map(
        function(conversation){


          const cid =
            String(
              conversation.id
            );


          const last =
            lastMessages[cid];


          const ad =
            adMap[
              String(
                conversation.ad_id
              )
            ];


          const title =
            ad?.title ||
            "বিজ্ঞাপন";


          let role = "";


          if(
            String(
              conversation.buyer_id
            ) ===
            String(
              currentUser.id
            )
          ){

            role = "SELLER";

          }else{

            role = "BUYER";

          }


          const time =

            last?.created_at

            ?

            new Date(
              last.created_at
            ).toLocaleString(
              "bn-BD",
              {

                day:"numeric",
                month:"short",
                hour:"numeric",
                minute:"2-digit"

              }
            )

            :

            new Date(
              conversation.created_at
            ).toLocaleString(
              "bn-BD",
              {

                day:"numeric",
                month:"short",
                hour:"numeric",
                minute:"2-digit"

              }
            );


          const preview =
            last?.body ||
            "কথোপকথন শুরু হয়েছে।";


          return `

            <a
              class="conversation"
              href="chat.html?conversation=${encodeURIComponent(cid)}">

              <div class="conversation-top">

                <div>

                  <div class="ad-title">

                    ${esc(title)}

                  </div>

                  <div class="person">

                    ${role}

                  </div>

                </div>


                <div class="time">

                  ${esc(time)}

                </div>

              </div>


              <div class="last-message">

                ${esc(preview)}

              </div>

            </a>

          `;


        }
      )
      .join("");


    result.innerHTML = `

      <div class="conversation-list">

        ${html}

      </div>

    `;


  }catch(error){


    console.error(
      "INBOX ERROR:",
      error
    );


    result.innerHTML = `

      <div class="error">

        Messages লোড করা যাচ্ছে না।

        <br><br>

        ${esc(
          error.message ||
          "Unknown error"
        )}

      </div>

    `;


  }


}



refreshBtn.addEventListener(
  "click",
  loadInbox
);


loadInbox();


setInterval(
  loadInbox,
  10000
);


})();

</script>


</body>

</html>
