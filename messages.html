<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>মেসেজ | শাহমাহমুদপুর বাজার</title>

<link
  rel="stylesheet"
  href="style.css">


<style>

/* ============================================================
   MESSAGES PAGE
============================================================ */

body{
  background:
    linear-gradient(
      180deg,
      #f8faf9 0%,
      #ffffff 45%,
      #f8faf9 100%
    );

  color:#1d2923;
}


/* ============================================================
   HEADER
============================================================ */

.message-header{

  position:sticky;

  top:0;

  z-index:100;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:
    blur(18px);

  border-bottom:
    1px solid rgba(20,70,45,.10);

}


.message-topbar{

  min-height:70px;

  display:flex;

  align-items:center;

  justify-content:space-between;

}


/* ============================================================
   BRAND
============================================================ */

.message-brand{

  display:flex;

  flex-wrap:wrap;

  align-items:center;

  width:250px;

  position:relative;

  padding-left:55px;

  text-decoration:none;

}


.message-brand:before{

  content:"💬";

  position:absolute;

  left:0;

  top:50%;

  transform:translateY(-50%);

  width:42px;

  height:42px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #0d9b55,
      #05743a
    );

  font-size:22px;

  box-shadow:
    0 8px 18px
    rgba(11,143,75,.20);

}


.message-brand b{

  width:100%;

  color:#27352e;

  font-size:18px;

  font-weight:900;

  letter-spacing:-.5px;

}


.message-brand strong{

  position:absolute;

  left:178px;

  top:0;

  color:#0b8f4b;

  font-size:18px;

  font-weight:900;

}


.message-brand small{

  width:100%;

  margin-top:3px;

  color:#66726b;

  font-size:8px;

  font-weight:800;

  letter-spacing:1.5px;

}


/* ============================================================
   REFRESH BUTTON
============================================================ */

.refresh-btn{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  min-height:40px;

  padding:0 16px;

  border:1px solid #dfe8e2;

  border-radius:12px;

  background:#fff;

  color:#0b8f4b;

  cursor:pointer;

  font-size:11px;

  font-weight:800;

  box-shadow:
    0 5px 16px
    rgba(30,55,42,.05);

}


.refresh-btn:hover{

  background:#eef9f1;

}


/* ============================================================
   PAGE
============================================================ */

.messages-page{

  max-width:850px;

  padding:
    26px
    0
    110px;

}


/* ============================================================
   PAGE TITLE
============================================================ */

.inbox-head{

  display:flex;

  align-items:flex-end;

  justify-content:space-between;

  gap:20px;

  margin-bottom:20px;

}


.inbox-head small{

  display:block;

  color:#0b8f4b;

  font-size:9px;

  font-weight:900;

  letter-spacing:1.5px;

  margin-bottom:5px;

}


.inbox-head h1{

  margin:0;

  color:#1d2923;

  font-size:28px;

  font-weight:900;

  letter-spacing:-1px;

}


.inbox-head p{

  margin:5px 0 0;

  color:#68736d;

  font-size:11px;

}


/* ============================================================
   CONVERSATION LIST
============================================================ */

.conversation-list{

  display:flex;

  flex-direction:column;

  gap:10px;

}


.conversation{

  display:flex;

  align-items:center;

  gap:14px;

  padding:14px;

  border:
    1px solid
    #e5ece7;

  border-radius:18px;

  background:#fff;

  text-decoration:none;

  box-shadow:
    0 6px 20px
    rgba(30,55,42,.05);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;

}


.conversation:hover{

  transform:
    translateY(-2px);

  border-color:
    rgba(11,143,75,.28);

  box-shadow:
    0 10px 25px
    rgba(30,55,42,.09);

}


/* ============================================================
   AVATAR
============================================================ */

.conversation-avatar{

  flex:0 0 48px;

  width:48px;

  height:48px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #e8f8ee,
      #d9f2e2
    );

  font-size:22px;

}


/* ============================================================
   CONTENT
============================================================ */

.conversation-content{

  flex:1;

  min-width:0;

}


.conversation-top{

  display:flex;

  align-items:flex-start;

  justify-content:space-between;

  gap:12px;

}


.ad-title{

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  color:#26342d;

  font-size:13px;

  font-weight:900;

}


.person{

  display:inline-flex;

  margin-top:4px;

  padding:
    3px
    7px;

  border-radius:6px;

  background:#eef9f1;

  color:#0b8f4b;

  font-size:7px;

  font-weight:900;

  letter-spacing:.7px;

}


.last-message{

  margin-top:7px;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  color:#718078;

  font-size:10px;

  line-height:1.5;

}


.time{

  flex:0 0 auto;

  color:#8a9790;

  font-size:8px;

  white-space:nowrap;

}


/* ============================================================
   LOADING
============================================================ */

.loading{

  padding:60px 20px;

  text-align:center;

  color:#718078;

  font-size:11px;

}


.loading:before{

  content:"";

  display:block;

  width:30px;

  height:30px;

  margin:
    0
    auto
    12px;

  border:
    3px solid
    #e4eee7;

  border-top-color:
    #0b8f4b;

  border-radius:50%;

  animation:
    msgSpin .7s linear infinite;

}


@keyframes msgSpin{

  to{

    transform:
      rotate(360deg);

  }

}


/* ============================================================
   EMPTY STATE
============================================================ */

.empty{

  padding:
    55px
    25px;

  text-align:center;

  border:
    1px dashed
    #dce7df;

  border-radius:20px;

  background:#fff;

  color:#718078;

  font-size:11px;

  line-height:1.7;

}


.empty-icon{

  width:60px;

  height:60px;

  margin:
    0
    auto
    15px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:20px;

  background:#eaf8ef;

  font-size:28px;

}


.empty h3{

  margin:
    0
    0
    7px;

  color:#26342d;

  font-size:16px;

}


.login-btn{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  margin-top:16px;

  padding:
    11px
    18px;

  border-radius:12px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #0d9b55,
      #05743a
    );

  font-size:11px;

  font-weight:800;

}


/* ============================================================
   ERROR
============================================================ */

.error{

  padding:18px;

  border:
    1px solid
    #f1d5d5;

  border-radius:15px;

  background:#fffafa;

  color:#b54a4a;

  font-size:10px;

  line-height:1.7;

}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:600px){

  .message-header{
    position:relative;
  }


  .message-topbar{

    min-height:64px;

  }


  .message-brand{

    width:210px;

    padding-left:46px;

  }


  .message-brand:before{

    width:37px;

    height:37px;

    border-radius:12px;

    font-size:19px;

  }


  .message-brand b{

    font-size:14px;

  }


  .message-brand strong{

    position:static;

    width:auto;

    margin-left:4px;

    font-size:14px;

  }


  .message-brand small{

    font-size:7px;

  }


  .messages-page{

    padding:
      20px
      0
      95px;

  }


  .inbox-head{

    align-items:flex-start;

    margin-bottom:16px;

  }


  .inbox-head h1{

    font-size:24px;

  }


  .inbox-head p{

    font-size:10px;

  }


  .refresh-btn{

    min-height:36px;

    padding:0 11px;

    font-size:9px;

  }


  .conversation{

    gap:11px;

    padding:12px;

    border-radius:15px;

  }


  .conversation-avatar{

    flex-basis:42px;

    width:42px;

    height:42px;

    border-radius:13px;

    font-size:19px;

  }


  .ad-title{

    font-size:11px;

  }


  .person{

    margin-top:3px;

    font-size:6px;

  }


  .last-message{

    margin-top:6px;

    font-size:9px;

  }


  .time{

    font-size:7px;

  }

}

</style>

</head>


<body>


<header class="message-header">

<div class="container message-topbar">

<a
  href="index.html"
  class="message-brand">

  <b>শাহমাহমুদপুর</b>

  <strong>বাজার</strong>

  <small>LOCAL MARKETPLACE</small>

</a>


<button
  id="refreshBtn"
  class="refresh-btn"
  type="button">

  ↻ রিফ্রেশ

</button>

</header>



<main
  class="container messages-page">


<section class="inbox">


<div class="inbox-head">

<small>PRIVATE MESSAGES</small>

আপনার Buyer ও Seller কথোপকথন
</p>

</div>

</div>

মেসেজ লোড হচ্ছে...

</div>

</section>


</main>

<script src="supabase.js?v=30"></script>


<script>

(function(){

"use strict";


const SUPA_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


const result =
  document.getElementById("result");


const refreshBtn =
  document.getElementById("refreshBtn");


let currentUser = null;



function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



async function getSession(){

  if(typeof getSbSession === "function"){

    try{

      const session =
        await getSbSession();

      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }catch(e){

      console.error(e);

    }

  }


  return null;

}



async function getUser(){

  if(typeof getCurrentUser === "function"){

    try{

      const user =
        await getCurrentUser();

      if(user){

        return user;

      }

    }catch(e){

      console.error(e);

    }

  }


  try{

    const saved =
      JSON.parse(
        localStorage.getItem("smb_user_v1") ||
        "null"
      );


    if(saved && saved.id){

      return {

        id:saved.id,

        email:saved.email || ""

      };

    }

  }catch(e){}


  return null;

}



async function api(
  url,
  session
){

  const response =
    await fetch(
      url,
      {

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    throw new Error(
      await response.text()
    );

  }


  return await response.json();

}



/* ============================================================
   LOAD INBOX
============================================================ */

async function loadInbox(){

  result.innerHTML = `

    <div class="loading">

      মেসেজ লোড হচ্ছে...

    </div>

  `;


  try{

    currentUser =
      await getUser();


    if(!currentUser){

      result.innerHTML = `

        <div class="empty">

          <div class="empty-icon">

            🔐

          </div>

          <h3>

            মেসেজ দেখতে লগইন করুন

          </h3>

          <div>

            আপনার Buyer ও Seller
            কথোপকথন দেখতে আগে লগইন করুন।

          </div>

          <a
            href="login.html"
            class="login-btn">

            লগইন করুন

          </a>

        </div>

      `;

      return;

    }


    const session =
      await getSession();


    if(!session){

      throw new Error(
        "Login session পাওয়া যায়নি।"
      );

    }


    const uid =
      encodeURIComponent(
        currentUser.id
      );


    const conversationUrl =

      SUPA_URL +
      "/rest/v1/conversations" +

      "?or=(" +

      "buyer_id.eq." +
      uid +

      ",seller_id.eq." +
      uid +

      ")" +

      "&select=*" +

      "&order=created_at.desc";


    const conversations =
      await api(
        conversationUrl,
        session
      );


    if(
      !Array.isArray(conversations) ||
      !conversations.length
    ){

      result.innerHTML = `

        <div class="empty">

          <div class="empty-icon">

            💬

          </div>

          <h3>

            এখনো কোনো মেসেজ নেই

          </h3>

          <div>

            কোনো পণ্যের ভিতর থেকে
            বিক্রেতাকে মেসেজ করুন।

          </div>

        </div>

      `;

      return;

    }


    const conversationIds =
      conversations
        .map(
          c => String(c.id)
        );


    const idList =
      conversationIds
        .map(
          id =>
            encodeURIComponent(id)
        )
        .join(",");


    const messageUrl =

      SUPA_URL +
      "/rest/v1/messages" +

      "?conversation_id=in.(" +
      idList +
      ")" +

      "&select=*" +

      "&order=created_at.desc";


    const allMessages =
      await api(
        messageUrl,
        session
      );


    const lastMessages = {};


    if(Array.isArray(allMessages)){

      allMessages.forEach(
        function(message){

          const cid =
            String(
              message.conversation_id
            );


          if(!lastMessages[cid]){

            lastMessages[cid] =
              message;

          }

        }
      );

    }


    const adIds =
      conversations
        .map(
          c =>
            String(c.ad_id)
        )
        .filter(Boolean);


    let ads = [];


    if(adIds.length){

      const uniqueAdIds =
        [...new Set(adIds)];


      const adList =
        uniqueAdIds
          .map(
            id =>
              encodeURIComponent(id)
          )
          .join(",");


      const adsUrl =

        SUPA_URL +
        "/rest/v1/ads" +

        "?id=in.(" +
        adList +
        ")" +

        "&select=id,title,seller_name";


      try{

        ads =
          await api(
            adsUrl,
            session
          );

      }catch(e){

        console.error(
          "Ads load error:",
          e
        );

      }

    }


    const adMap = {};


    ads.forEach(
      function(ad){

        adMap[
          String(ad.id)
        ] = ad;

      }
    );


    const html =
      conversations
        .map(
          function(conversation){

            const cid =
              String(
                conversation.id
              );


            const last =
              lastMessages[cid];


            const ad =
              adMap[
                String(
                  conversation.ad_id
                )
              ];


            const title =
              ad?.title ||
              "বিজ্ঞাপন";


            let role = "";


            if(
              String(
                conversation.buyer_id
              ) ===
              String(
                currentUser.id
              )
            ){

              role =
                "SELLER";

            }else{

              role =
                "BUYER";

            }


            const time =
              last?.created_at

              ?

              new Date(
                last.created_at
              ).toLocaleString(
                "bn-BD",
                {

                  day:"numeric",

                  month:"short",

                  hour:"numeric",

                  minute:"2-digit"

                }
              )

              :

              new Date(
                conversation.created_at
              ).toLocaleString(
                "bn-BD",
                {

                  day:"numeric",

                  month:"short",

                  hour:"numeric",

                  minute:"2-digit"

                }
              );


            const preview =
              last?.body ||
              "কথোপকথন শুরু হয়েছে।";


            return `

              <a
                class="conversation"
                href="chat.html?conversation=${encodeURIComponent(cid)}">


                <div class="conversation-avatar">

                  💬

                </div>


                <div class="conversation-content">


                  <div class="conversation-top">


                    <div
                      style="
                        min-width:0;
                        flex:1;
                      ">


                      <div class="ad-title">

                        ${esc(title)}

                      </div>


                      <div class="person">

                        ${role}

                      </div>


                    </div>


                    <div class="time">

                      ${esc(time)}

                    </div>


                  </div>


                  <div class="last-message">

                    ${esc(preview)}

                  </div>


                </div>


              </a>

            `;

          }
        )
        .join("");


    result.innerHTML = `

      <div class="conversation-list">

        ${html}

      </div>

    `;


  }catch(error){

    console.error(
      "INBOX ERROR:",
      error
    );


    result.innerHTML = `

      <div class="error">

        মেসেজ লোড করা যাচ্ছে না।

        <br><br>

        ${esc(
          error.message ||
          "Unknown error"
        )}

      </div>

    `;

  }

}



refreshBtn.addEventListener(
  "click",
  loadInbox
);


loadInbox();


setInterval(
  loadInbox,
  10000
);


})();

</script>


</body>
