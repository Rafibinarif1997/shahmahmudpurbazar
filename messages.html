<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>
মেসেজ | শাহমাহমুদপুর বাজার
</title>

<link
  rel="stylesheet"

<style>

/* ============================================================
   SAME BRIGHT UI AS HOMEPAGE
============================================================ */

:root{

  --green:#0b8f4b;
  --green-dark:#05743a;
  --green-light:#e9f8ef;

  --text:#1d2923;
  --muted:#66736c;

  --border:#e6ece8;

  --bg:#f8faf9;

  --card:#ffffff;

  --shadow:
    0 8px 30px rgba(30,55,42,.08);

}


/* ============================================================
   RESET
============================================================ */

*{
  box-sizing:border-box;
}


html{
  scroll-behavior:smooth;
}


body{

  margin:0;

  background:
    linear-gradient(
      180deg,
      #f8faf9 0%,
      #ffffff 45%,
      #f8faf9 100%
    );

  color:var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  padding-bottom:90px;

}


a{
  text-decoration:none;
  color:inherit;
}


.container{

  width:min(1180px,calc(100% - 40px));

  margin:auto;

}


/* ============================================================
   HEADER - SAME AS HOMEPAGE
============================================================ */

.header{

  position:sticky;

  top:0;

  z-index:100;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:
    blur(18px);

  border-bottom:
    1px solid rgba(20,70,45,.10);

}


.topbar{

  min-height:76px;

  display:flex;

  align-items:center;

}


.brand{

  display:flex;

  flex-wrap:wrap;

  align-items:center;

  width:250px;

  position:relative;

  padding-left:58px;

}


.brand:before{

  content:"🛍";

  position:absolute;

  left:0;

  top:50%;

  transform:translateY(-50%);

  width:45px;

  height:45px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #0d9b55,
      #05743a
    );

  font-size:26px;

  box-shadow:
    0 8px 18px
    rgba(11,143,75,.22);

}


.brand b{

  width:100%;

  font-size:19px;

  font-weight:900;

  letter-spacing:-.5px;

  color:#27352e;

}


.brand strong{

  position:absolute;

  top:0;

  left:188px;

  color:var(--green);

  font-size:19px;

  font-weight:900;

}


.brand small{

  width:100%;

  margin-top:3px;

  color:#66726b;

  font-size:9px;

  font-weight:800;

  letter-spacing:1.5px;

}


/* ============================================================
   MESSAGES PAGE
============================================================ */

.messages-page{

  max-width:820px;

  padding-top:28px;

  padding-bottom:30px;

}


.inbox-head{

  display:flex;

  align-items:flex-end;

  justify-content:space-between;

  gap:15px;

  margin-bottom:18px;

}


.inbox-title small{

  display:block;

  color:var(--green);

  font-size:9px;

  font-weight:900;

  letter-spacing:1.5px;

  margin-bottom:4px;

}


.inbox-title h1{

  margin:0;

  color:#1d2923;

  font-size:28px;

  font-weight:900;

  letter-spacing:-.5px;

}


.inbox-title p{

  margin:6px 0 0;

  color:var(--muted);

  font-size:11px;

}


/* ============================================================
   REFRESH BUTTON
============================================================ */

.refresh-btn{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:6px;

  min-height:42px;

  padding:9px 15px;

  border:
    1px solid var(--border);

  border-radius:12px;

  background:#fff;

  color:#465249;

  font-size:11px;

  font-weight:800;

  cursor:pointer;

}


.refresh-btn:active{

  transform:scale(.97);

}


/* ============================================================
   CONVERSATION LIST
============================================================ */

.conversation-list{

  display:flex;

  flex-direction:column;

  gap:10px;

}


/* ============================================================
   CONVERSATION CARD
============================================================ */

.conversation{

  display:block;

  padding:15px 16px;

  border:
    1px solid var(--border);

  border-radius:17px;

  background:#fff;

  box-shadow:
    0 5px 18px rgba(30,55,42,.04);

  transition:
    transform .15s ease,
    box-shadow .15s ease;

}


.conversation:hover{

  transform:translateY(-1px);

  box-shadow:
    0 8px 22px rgba(30,55,42,.08);

}


.conversation-main{

  display:flex;

  align-items:center;

  gap:13px;

}


/* ============================================================
   MESSAGE ICON
============================================================ */

.message-avatar{

  flex:0 0 46px;

  width:46px;

  height:46px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:14px;

  background:#eaf8ef;

  color:var(--green);

  font-size:22px;

}


.conversation-content{

  flex:1;

  min-width:0;

}


/* ============================================================
   TOP ROW
============================================================ */

.conversation-top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

}


.ad-title{

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  color:#26342d;

  font-size:13px;

  font-weight:900;

}


.time{

  flex:0 0 auto;

  color:#7a867f;

  font-size:8px;

  font-weight:700;

}


/* ============================================================
   PERSON
============================================================ */

.person-row{

  display:flex;

  align-items:center;

  gap:7px;

  margin-top:4px;

}


.person{

  display:inline-flex;

  align-items:center;

  gap:4px;

  color:var(--green);

  font-size:8px;

  font-weight:900;

  letter-spacing:.6px;

}


.person-dot{

  width:5px;

  height:5px;

  border-radius:50%;

  background:var(--green);

}


/* ============================================================
   LAST MESSAGE
============================================================ */

.last-message{

  margin-top:6px;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  color:#718078;

  font-size:10px;

  line-height:1.5;

}


/* ============================================================
   ARROW
============================================================ */

.conversation-arrow{

  flex:0 0 auto;

  margin-left:3px;

  color:#9aa69f;

  font-size:18px;

}


/* ============================================================
   LOADING
============================================================ */

.loading{

  padding:55px 20px;

  text-align:center;

  border:
    1px dashed #dbe5de;

  border-radius:18px;

  background:#fff;

  color:#657169;

  font-size:11px;

}


.loading-spinner{

  width:28px;

  height:28px;

  margin:
    0 auto
    12px;

  border:
    3px solid #e4eee7;

  border-top-color:
    var(--green);

  border-radius:50%;

  animation:
    smbSpin .7s linear infinite;

}


@keyframes smbSpin{

  to{
    transform:rotate(360deg);
  }

}


/* ============================================================
   EMPTY
============================================================ */

.empty{

  padding:
    55px
    20px;

  text-align:center;

  border:
    1px dashed #dbe5de;

  border-radius:18px;

  background:#fff;

}


.empty-icon{

  width:58px;

  height:58px;

  margin:
    0 auto
    14px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:18px;

  background:#eaf8ef;

  font-size:28px;

}


.empty h3{

  margin:0;

  color:#27352e;

  font-size:16px;

  font-weight:900;

}


.empty p{

  margin:
    7px
    0
    0;

  color:#718078;

  font-size:10px;

  line-height:1.6;

}


/* ============================================================
   ERROR
============================================================ */

.error{

  padding:18px;

  border:
    1px solid #ffdede;

  border-radius:16px;

  background:#fff8f8;

  color:#c45b5b;

  font-size:10px;

  line-height:1.7;

}


/* ============================================================
   MOBILE NAVIGATION - SAME AS HOMEPAGE
============================================================ */

.mobile-nav{

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  z-index:200;

  height:72px;

  display:flex;

  align-items:center;

  justify-content:space-around;

  padding-bottom:
    env(safe-area-inset-bottom);

  border-top:
    1px solid #e8eeea;

  background:
    rgba(255,255,255,.97);

  box-shadow:
    0 -8px 25px
    rgba(0,0,0,.05);

}


.mobile-nav a{

  min-width:55px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:3px;

  color:#657169;

  font-size:8px;

  font-weight:700;

}


.mobile-nav a span{

  font-size:22px;

}


.mobile-nav a.active{

  color:var(--green);

}


.mobile-nav a:nth-child(3) span{

  width:48px;

  height:48px;

  margin-top:-28px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #10a85d,
      #05733b
    );

  font-size:30px;

}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:600px){

  body{
    padding-bottom:78px;
  }


  .container{
    width:calc(100% - 24px);
  }


  .header{
    position:relative;
  }


  .topbar{
    min-height:66px;
  }


  .brand{
    width:190px;
    padding-left:47px;
  }


  .brand:before{

    width:38px;

  }


  .brand b{

    position:static;

    width:auto;

  }


  .brand small{

  }


  .inbox-head{

    align-items:flex-end;

    margin-bottom:15px;

  }


  .inbox-title h1{

    font-size:22px;

  }


  .inbox-title p{

  }


  .refresh-btn{

    min-height:38px;

    padding:
      8px

    font-size:9px;

  }

      13px

    border-radius:15px;

  }


  .conversation-main{

  }

    flex-basis:40px;

  }

    font-size:7px;

  }


  .time{

    font-size:7px;

  }


  .conversation-arrow{

    display:none;

  }

}

</style>

<script src="supabase.js?v=30"></script>


<script>

(function(){

"use strict";


const SUPA_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


const result =
  document.getElementById("result");


const refreshBtn =
  document.getElementById("refreshBtn");


let currentUser = null;



/* ============================================================
   ESCAPE HTML
============================================================ */

function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



/* ============================================================
   GET SESSION
============================================================ */

async function getSession(){

  if(typeof window.getValidSbSession === "function"){

    try{

      const session =
        await window.getValidSbSession();

      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }catch(e){

      console.error(e);

    }

  }


  if(typeof window.getSbSession === "function"){

    try{

      const session =
        await window.getSbSession();

      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }catch(e){

      console.error(e);

    }

  }


  return null;

}



/* ============================================================
   GET USER
============================================================ */

async function getUser(){

  if(typeof window.getCurrentUser === "function"){

    try{

      const user =
        await window.getCurrentUser();

      if(user){

        return user;

      }

    }catch(e){

      console.error(e);

    }

  }


  try{

    const saved =
      JSON.parse(

        localStorage.getItem(
          "smb_user_v1"
        ) || "null"

      );


    if(saved && saved.id){

      return {

        id:saved.id,

        email:
          saved.email || ""

      };

    }

  }catch(e){}


  return null;

}



/* ============================================================
   API
============================================================ */

async function api(
  url,
  session
){

  const response =
    await fetch(

      url,

      {

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json"

        }

      }

    );


  if(!response.ok){

    throw new Error(
      await response.text()
    );

  }


  return await response.json();

}



/* ============================================================
   FORMAT TIME
============================================================ */

function formatTime(dateValue){

  if(!dateValue) return "";


  try{

    return new Date(
      dateValue
    ).toLocaleString(

      "bn-BD",

      {

        day:"numeric",

        month:"short",

        hour:"numeric",

        minute:"2-digit"

      }

    );

  }catch(e){

    return "";

  }

}



/* ============================================================
   LOAD INBOX
============================================================ */

async function loadInbox(){


  result.innerHTML = `

    <div class="loading">

      <div class="loading-spinner"></div>

      মেসেজ লোড হচ্ছে...

    </div>

  `;


  try{


    currentUser =
      await getUser();


    if(!currentUser){


      result.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🔐
          </div>

          <h3>
            Login প্রয়োজন
          </h3>

          <p>

            মেসেজ দেখতে আগে<br>

            আপনার অ্যাকাউন্টে Login করুন।

          </p>

        </div>

      `;


      return;

    }


    const session =
      await getSession();


    if(!session){

      throw new Error(
        "Login session পাওয়া যায়নি।"
      );

    }


    const uid =
      encodeURIComponent(
        currentUser.id
      );


    /* ========================================================
       LOAD CONVERSATIONS
    ======================================================== */

    const conversationUrl =

      SUPA_URL +
      "/rest/v1/conversations" +

      "?or=(" +

      "buyer_id.eq." +
      uid +

      ",seller_id.eq." +
      uid +

      ")" +

      "&select=*" +

      "&order=created_at.desc";


    const conversations =
      await api(
        conversationUrl,
        session
      );


    if(

      !Array.isArray(conversations) ||

      !conversations.length

    ){


      result.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            💬
          </div>

          <h3>
            এখনো কোনো মেসেজ নেই
          </h3>

          <p>

            কোনো বিজ্ঞাপনে গিয়ে<br>

            বিক্রেতাকে মেসেজ করুন।

          </p>

        </div>

      `;


      return;

    }



    /* ========================================================
       CONVERSATION IDS
    ======================================================== */

    const conversationIds =

      conversations.map(
        c => String(c.id)
      );


    const idList =

      conversationIds

        .map(
          id => encodeURIComponent(id)
        )

        .join(",");



    /* ========================================================
       LOAD ALL MESSAGES
    ======================================================== */

    const messageUrl =

      SUPA_URL +
      "/rest/v1/messages" +

      "?conversation_id=in.(" +
      idList +
      ")" +

      "&select=*" +

      "&order=created_at.desc";


    const allMessages =
      await api(
        messageUrl,
        session
      );


    const lastMessages = {};


    if(Array.isArray(allMessages)){


      allMessages.forEach(
        function(message){


          const cid =
            String(
              message.conversation_id
            );


          if(!lastMessages[cid]){

            lastMessages[cid] =
              message;

          }

        }
      );

    }



    /* ========================================================
       AD IDS
    ======================================================== */

    const adIds =

      conversations

        .map(
          c => String(c.ad_id)
        )

        .filter(Boolean);


    let ads = [];


    if(adIds.length){


      const uniqueAdIds =
        [...new Set(adIds)];


      const adList =

        uniqueAdIds

          .map(
            id => encodeURIComponent(id)
          )

          .join(",");


      const adsUrl =

        SUPA_URL +
        "/rest/v1/ads" +

        "?id=in.(" +
        adList +
        ")" +

        "&select=id,title,seller_name";


      try{

        ads =
          await api(
            adsUrl,
            session
          );

      }catch(e){

        console.error(
          "Ads load error:",
          e
        );

      }

    }



    /* ========================================================
       AD MAP
    ======================================================== */

    const adMap = {};


    if(Array.isArray(ads)){


      ads.forEach(
        function(ad){

          adMap[
            String(ad.id)
          ] = ad;

        }
      );

    }



    /* ========================================================
       SORT BY LAST MESSAGE
    ======================================================== */

    conversations.sort(
      function(a,b){


        const aLast =
          lastMessages[String(a.id)];


        const bLast =
          lastMessages[String(b.id)];


        const aTime =
          new Date(

            aLast?.created_at ||
            a.created_at

          ).getTime();


        const bTime =
          new Date(

            bLast?.created_at ||
            b.created_at

          ).getTime();


        return bTime - aTime;

      }
    );



    /* ========================================================
       RENDER
    ======================================================== */

    const html =

      conversations

        .map(
          function(conversation){


            const cid =
              String(
                conversation.id
              );


            const last =
              lastMessages[cid];


            const ad =
              adMap[
                String(
                  conversation.ad_id
                )
              ];


            const title =

              ad?.title ||

              "বিজ্ঞাপন";


            let role = "";


            if(

              String(
                conversation.buyer_id
              ) ===

              String(
                currentUser.id
              )

            ){


              role =
                "SELLER";


            }else{


              role =
                "BUYER";


            }


            const time =
              formatTime(

                last?.created_at ||

                conversation.created_at

              );


            const preview =

              last?.body ||

              "কথোপকথন শুরু হয়েছে।";


            return `

              <a

                class="conversation"

                href="chat.html?conversation=${encodeURIComponent(cid)}">


                <div class="conversation-main">


                  <div class="message-avatar">

                    💬

                  </div>


                  <div class="conversation-content">


                    <div class="conversation-top">


                      <div class="ad-title">

                        ${esc(title)}

                      </div>


                      <div class="time">

                        ${esc(time)}

                      </div>


                    </div>



                    <div class="person-row">


                      <div class="person-dot"></div>


                      <div class="person">

                        ${esc(role)}

                      </div>


                    </div>



                    <div class="last-message">

                      ${esc(preview)}

                    </div>


                  </div>


                  <div class="conversation-arrow">

                    › 

                  </div>


                </div>


              </a>

            `;

          }

        )

        .join("");


    result.innerHTML = `

      <div class="conversation-list">

        ${html}

      </div>

    `;


  }catch(error){


    console.error(
      "INBOX ERROR:",
      error
    );


    result.innerHTML = `

      <div class="error">

        <b>
          Messages লোড করা যাচ্ছে না।
        </b>

        <br><br>

        ${esc(

          error.message ||

          "Unknown error"

        )}

      </div>

    `;

  }

}



/* ============================================================
   REFRESH
============================================================ */

refreshBtn.addEventListener(
  "click",
  loadInbox
);



/* ============================================================
   START
============================================================ */

loadInbox();


})();

</script>
