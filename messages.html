<script src="supabase.js?v=30"></script>


<script>

(function(){

"use strict";


/* =========================================================
   CONFIG
========================================================= */

const SUPA_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


const app =
  document.getElementById("app");


const params =
  new URLSearchParams(
    window.location.search
  );


const conversationId =
  params.get("conversation");


const adId =
  params.get("id");


let currentUser = null;

let currentConversation = null;

let currentAd = null;

let currentOtherUser = null;

let loading = false;


/* =========================================================
   ESCAPE
========================================================= */

function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =========================================================
   SESSION
========================================================= */

async function getSession(){

  try{

    if(
      typeof getSbSession ===
      "function"
    ){

      const session =
        await getSbSession();

      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }

  }catch(error){

    console.error(
      "Session error:",
      error
    );

  }

  return null;

}


/* =========================================================
   USER
========================================================= */

async function getUser(){

  try{

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        await getCurrentUser();

      if(user){

        return user;

      }

    }

  }catch(error){

    console.error(
      "User error:",
      error
    );

  }


  try{

    const stored =
      JSON.parse(
        localStorage.getItem(
          "smb_user_v1"
        ) || "null"
      );

    if(
      stored &&
      stored.id
    ){

      return {
        id:stored.id,
        email:stored.email || "",
        user_metadata:{
          full_name:
            stored.name || ""
        }
      };

    }

  }catch(error){}


  return null;

}


/* =========================================================
   API GET
========================================================= */

async function apiGet(path){

  const session =
    await getSession();


  if(!session){

    throw new Error(
      "Login session পাওয়া যায়নি।"
    );

  }


  const response =
    await fetch(
      SUPA_URL +
      path,
      {

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    throw new Error(
      await response.text()
    );

  }


  return await response.json();

}


/* =========================================================
   API POST
========================================================= */

async function apiPost(
  path,
  data
){

  const session =
    await getSession();


  if(!session){

    throw new Error(
      "Login session পাওয়া যায়নি।"
    );

  }


  const response =
    await fetch(
      SUPA_URL +
      path,
      {

        method:"POST",

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body:
          JSON.stringify(data)

      }
    );


  if(!response.ok){

    throw new Error(
      await response.text()
    );

  }


  return await response.json();

}


/* =========================================================
   GET AD
========================================================= */

async function getAd(id){

  if(
    typeof window.getAdById ===
    "function"
  ){

    const ad =
      await window.getAdById(id);

    if(ad){

      return ad;

    }

  }


  const rows =
    await apiGet(

      "/rest/v1/ads" +

      "?id=eq." +
      encodeURIComponent(id) +

      "&select=*"

    );


  return rows[0] || null;

}


/* =========================================================
   FIND CONVERSATION FOR AD
========================================================= */

async function findConversationForAd(
  id
){

  const userId =
    encodeURIComponent(
      currentUser.id
    );


  /*
   * Buyer অথবা seller — দুজনের
   * যেকোনো একজন হলে conversation পাওয়া যাবে।
   */

  const rows =
    await apiGet(

      "/rest/v1/conversations" +

      "?ad_id=eq." +
      encodeURIComponent(id) +

      "&or=(" +

        "buyer_id.eq." +
        userId +

        ",seller_id.eq." +
        userId +

      ")" +

      "&select=*" +

      "&order=created_at.desc" +

      "&limit=1"

    );


  return rows[0] || null;

}


/* =========================================================
   CREATE CONVERSATION
========================================================= */

async function createConversation(){

  if(!currentAd){

    throw new Error(
      "বিজ্ঞাপন পাওয়া যায়নি।"
    );

  }


  const sellerId =
    currentAd.seller_id ||
    currentAd.user_id;


  if(!sellerId){

    throw new Error(
      "এই বিজ্ঞাপনের Seller ID পাওয়া যায়নি।"
    );

  }


  if(
    String(sellerId) ===
    String(currentUser.id)
  ){

    throw new Error(
      "নিজের বিজ্ঞাপনে নিজেকে মেসেজ করা যাবে না।"
    );

  }


  const data = {

    ad_id:
      currentAd.id,

    buyer_id:
      currentUser.id,

    seller_id:
      sellerId

  };


  const created =
    await apiPost(
      "/rest/v1/conversations",
      data
    );


  return created[0];

}


/* =========================================================
   GET MESSAGES
========================================================= */

async function getMessages(
  convId
){

  return await apiGet(

    "/rest/v1/messages" +

    "?conversation_id=eq." +
    encodeURIComponent(convId) +

    "&select=*" +

    "&order=created_at.asc"

  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(
  text
){

  if(
    !currentConversation
  ){

    throw new Error(
      "Conversation পাওয়া যায়নি।"
    );

  }


  const receiverId =
    String(
      currentConversation.buyer_id
    ) ===
    String(
      currentUser.id
    )

    ?

    currentConversation.seller_id

    :

    currentConversation.buyer_id;


  if(!receiverId){

    throw new Error(
      "Receiver ID পাওয়া যায়নি।"
    );

  }


  return await apiPost(

    "/rest/v1/messages",

    {

      conversation_id:
        currentConversation.id,

      sender_id:
        currentUser.id,

      receiver_id:
        receiverId,

      body:
        text

    }

  );

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
  value
){

  if(!value){

    return "";

  }


  try{

    return new Date(
      value
    ).toLocaleString(
      "bn-BD",
      {

        day:"numeric",

        month:"short",

        hour:"numeric",

        minute:"2-digit"

      }
    );

  }catch(error){

    return "";

  }

}


/* =========================================================
   SHOW ERROR
========================================================= */

function errorBox(
  text
){

  app.innerHTML = `

    <div class="error">

      ${esc(text)}

    </div>

  `;

}


/* =========================================================
   LOGIN
========================================================= */

function showLogin(){

  app.innerHTML = `

    <div class="empty">

      <div class="empty-icon">
        🔐
      </div>

      <h2>
        Login করুন
      </h2>

      <p>
        আপনার Messages দেখতে
        আগে Login করতে হবে।
      </p>

      <br>

      <a
        href="login.html"
        class="btn green">

        Google দিয়ে Login করুন

      </a>

    </div>

  `;

}


/* =========================================================
   INBOX
========================================================= */

async function loadInbox(){

  app.innerHTML = `

    <div class="inbox-head">

      <small>
        PRIVATE MESSAGES
      </small>

      <h1>
        Messages
      </h1>

      <p>
        আপনার সব Buyer ও Seller কথোপকথন
      </p>

    </div>

    <div class="loading">
      মেসেজ লোড হচ্ছে...
    </div>

  `;


  try{

    /*
     * প্রথমে current user-এর
     * conversations বের করি।
     */

    const userId =
      encodeURIComponent(
        currentUser.id
      );


    const conversations =
      await apiGet(

        "/rest/v1/conversations" +

        "?or=(" +

          "buyer_id.eq." +
          userId +

          ",seller_id.eq." +
          userId +

        ")" +

        "&select=*" +

        "&order=created_at.desc"

      );


    if(
      !Array.isArray(
        conversations
      ) ||
      !conversations.length
    ){

      app.innerHTML = `

        <div class="inbox-head">

          <small>
            PRIVATE MESSAGES
          </small>

          <h1>
            Messages
          </h1>

          <p>
            আপনার সব Buyer ও Seller কথোপকথন
          </p>

        </div>


        <div class="empty">

          <div class="empty-icon">
            💬
          </div>

          <h2>
            এখনো কোনো মেসেজ নেই
          </h2>

          <p>
            কোনো পণ্যের ভিতর থেকে
            Seller অথবা Buyer-কে মেসেজ করলে
            কথোপকথন এখানে দেখা যাবে।
          </p>

        </div>

      `;

      return;

    }


    /*
     * সব conversation-এর ad ID
     */

    const adIds =
      [
        ...new Set(

          conversations

            .map(
              c =>
                c.ad_id
            )

            .filter(Boolean)

            .map(
              String
            )

        )

      ];


    /*
     * Ads একসাথে load
     */

    let ads = [];


    if(adIds.length){

      const ids =
        adIds
          .map(
            id =>
              encodeURIComponent(id)
          )
          .join(",");


      try{

        ads =
          await apiGet(

            "/rest/v1/ads" +

            "?id=in.(" +
            ids +
            ")" +

            "&select=id,title"

          );

      }catch(error){

        console.error(
          "Ads load error:",
          error
        );

      }

    }


    const adMap = {};


    ads.forEach(
      function(ad){

        adMap[
          String(ad.id)
        ] = ad;

      }
    );


    /*
     * প্রতিটি conversation-এর
     * latest message বের করি।
     */

    const items = [];


    for(
      const conversation
      of conversations
    ){

      let messages = [];


      try{

        messages =
          await getMessages(
            conversation.id
          );

      }catch(error){

        console.error(
          "Conversation messages error:",
          error
        );

      }


      const last =
        messages.length
        ?
        messages[
          messages.length - 1
        ]
        :
        null;


      const isBuyer =
        String(
          conversation.buyer_id
        ) ===
        String(
          currentUser.id
        );


      const role =
        isBuyer
        ?
        "BUYER"
        :
        "SELLER";


      const ad =
        adMap[
          String(
            conversation.ad_id
          )
        ];


      items.push({

        conversation,
        last,
        role,
        ad

      });

    }


    /*
     * Latest message অনুযায়ী sort
     */

    items.sort(
      function(a,b){

        const ta =
          new Date(
            a.last?.created_at ||
            a.conversation.created_at
          ).getTime();


        const tb =
          new Date(
            b.last?.created_at ||
            b.conversation.created_at
          ).getTime();


        return tb - ta;

      }
    );


    app.innerHTML = `

      <div class="inbox-head">

        <small>
          PRIVATE MESSAGES
        </small>

        <h1>
          Messages
        </h1>

        <p>
          আপনার সব Buyer ও Seller কথোপকথন
        </p>

      </div>


      <div class="conversation-list">

        ${
          items.map(
            function(item){

              const c =
                item.conversation;


              const last =
                item.last;


              const title =
                item.ad?.title ||
                "বিজ্ঞাপন";


              const preview =
                last?.body ||
                "কোনো মেসেজ নেই";


              const time =
                last?.created_at
                ?

                formatTime(
                  last.created_at
                )

                :

                formatTime(
                  c.created_at
                );


              return `

                <a
                  class="conversation"
                  href="messages.html?conversation=${encodeURIComponent(
                    c.id
                  )}">

                  <div
                    class="conversation-top">

                    <div>

                      <div class="ad-title">

                        ${esc(title)}

                      </div>

                      <span class="role">

                        ${roleLabel(
                          item.role
                        )}

                      </span>

                    </div>

                    <span class="time">

                      ${esc(time)}

                    </span>

                  </div>


                  <div class="last-message">

                    ${esc(preview)}

                  </div>

                </a>

              `;

            }
          ).join("")

        }

      </div>

    `;

  }catch(error){

    console.error(
      "Inbox error:",
      error
    );


    errorBox(
      "Messages লোড করা যাচ্ছে না: " +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}


/* =========================================================
   ROLE LABEL
========================================================= */

function roleLabel(
  role
){

  return role === "BUYER"
    ? "BUYER"
    : "SELLER";

}


/* =========================================================
   CHAT PAGE
========================================================= */

async function loadChat(){

  try{

    let conversation =
      null;


    /*
     * যদি সরাসরি conversation ID দেওয়া থাকে
     */

    if(conversationId){

      const rows =
        await apiGet(

          "/rest/v1/conversations" +

          "?id=eq." +
          encodeURIComponent(
            conversationId
          ) +

          "&select=*"

        );


      conversation =
        rows[0] || null;

    }


    /*
     * যদি ad ID দিয়ে আসা হয়
     */

    if(
      !conversation &&
      adId
    ){

      currentAd =
        await getAd(
          adId
        );


      if(!currentAd){

        throw new Error(
          "বিজ্ঞাপনটি পাওয়া যায়নি।"
        );

      }


      conversation =
        await findConversationForAd(
          adId
        );


      /*
       * Conversation নেই।
       *
       * Buyer হলে নতুন conversation
       * তৈরি করা যাবে।
       */

      if(!conversation){

        const sellerId =
          currentAd.seller_id ||
          currentAd.user_id;


        if(
          String(sellerId) ===
          String(currentUser.id)
        ){

          throw new Error(
            "নিজের বিজ্ঞাপনের chat খুলতে কোনো Buyer conversation নেই।"
          );

        }


        conversation =
          await createConversation();

      }

    }


    if(!conversation){

      throw new Error(
        "কোনো কথোপকথন পাওয়া যায়নি।"
      );

    }


    /*
     * User এই conversation-এর
     * participant কি না
     */

    const participant =
      String(
        conversation.buyer_id
      ) ===
      String(
        currentUser.id
      )

      ||

      String(
        conversation.seller_id
      ) ===
      String(
        currentUser.id
      );


    if(!participant){

      throw new Error(
        "এই কথোপকথনে আপনার access নেই।"
      );

    }


    currentConversation =
      conversation;


    /*
     * Ad load
     */

    if(
      !currentAd &&
      conversation.ad_id
    ){

      currentAd =
        await getAd(
          conversation.ad_id
        );

    }


    /*
     * অপর পক্ষ
     */

    currentOtherUser =

      String(
        conversation.buyer_id
      ) ===
      String(
        currentUser.id
      )

      ?

      conversation.seller_id

      :

      conversation.buyer_id;


    /*
     * Chat UI
     */

    app.innerHTML = `

      <a
        class="back-button"
        href="messages.html">

        ← Messages-এ ফিরে যান

      </a>


      <section class="chat-box">

        <div class="chat-header">

          <small>
            PRIVATE MESSAGE
          </small>

          <h2 id="chatTitle">

            ${esc(
              currentAd?.title ||
              "বিজ্ঞাপন"
            )}

          </h2>

          <p>

            ${
              String(
                conversation.buyer_id
              ) ===
              String(
                currentUser.id
              )

              ?

              "বিক্রেতার সাথে যোগাযোগ করুন"

              :

              "ক্রেতার সাথে কথোপকথন"

            }

          </p>

        </div>


        <div
          id="chatError"
          style="display:none">
        </div>


        <div
          id="messagesList"
          class="messages-list">

          <div class="message-empty">

            মেসেজ লোড হচ্ছে...

          </div>

        </div>


        <form
          id="chatForm"
          class="chat-form">

          <input
            id="messageInput"
            type="text"
            maxlength="2000"
            autocomplete="off"
            placeholder="মেসেজ লিখুন...">

          <button
            id="sendButton"
            type="submit"
            class="btn green">

            Send

          </button>

        </form>

      </section>

    `;


    await refreshChat();


    const form =
      document.getElementById(
        "chatForm"
      );


    const input =
      document.getElementById(
        "messageInput"
      );


    const button =
      document.getElementById(
        "sendButton"
      );


    form.addEventListener(
      "submit",
      async function(event){

        event.preventDefault();


        const text =
          input.value.trim();


        if(!text){

          return;

        }


        button.disabled =
          true;

        button.textContent =
          "Sending...";


        try{

          await sendMessage(
            text
          );


          input.value =
            "";


          await refreshChat();

        }catch(error){

          console.error(
            "Send error:",
            error
          );


          showChatError(
            error.message ||
            "মেসেজ পাঠানো যায়নি।"
          );

        }finally{

          button.disabled =
            false;

          button.textContent =
            "Send";

          input.focus();

        }

      }
    );


    /*
     * প্রতি ৫ সেকেন্ডে শুধু message refresh
     */

    setInterval(
      refreshChat,
      5000
    );

  }catch(error){

    console.error(
      "Chat error:",
      error
    );


    errorBox(
      error.message ||
      "Chat চালু করা যাচ্ছে না।"
    );

  }

}


/* =========================================================
   REFRESH CHAT
========================================================= */

async function refreshChat(){

  if(
    !currentConversation
  ){

    return;

  }


  if(loading){

    return;

  }


  loading =
    true;


  try{

    const messages =
      await getMessages(
        currentConversation.id
      );


    renderMessages(
      messages
    );

  }catch(error){

    console.error(
      "Refresh chat error:",
      error
    );


    showChatError(
      "মেসেজ লোড করা যাচ্ছে না।"
    );

  }finally{

    loading =
      false;

  }

}


/* =========================================================
   RENDER CHAT
========================================================= */

function renderMessages(
  messages
){

  const list =
    document.getElementById(
      "messagesList"
    );


  if(!list){

    return;

  }


  if(
    !messages.length
  ){

    list.innerHTML = `

      <div class="message-empty">

        এখনো কোনো মেসেজ নেই।<br>
        নিচে লিখে কথোপকথন শুরু করুন।

      </div>

    `;

    return;

  }


  list.innerHTML =
    messages.map(
      function(message){

        const mine =
          String(
            message.sender_id
          ) ===
          String(
            currentUser.id
          );


        return `

          <div
            class="
              message-row
              ${
                mine
                ?
                "mine"
                :
                "theirs"
              }
            ">

            <div
              class="message-bubble">

              ${esc(
                message.body ||
                ""
              )}

              <span
                class="message-time">

                ${esc(
                  formatTime(
                    message.created_at
                  )
                )}

              </span>

            </div>

          </div>

        `;

      }
    ).join("");


  /*
   * সবসময় নিচের latest message
   */

  list.scrollTop =
    list.scrollHeight;

}


/* =========================================================
   CHAT ERROR
========================================================= */

function showChatError(
  text
){

  const box =
    document.getElementById(
      "chatError"
    );


  if(!box){

    return;

  }


  box.style.display =
    "block";

  box.className =
    "chat-error";

  box.textContent =
    text;

}


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

  try{

    currentUser =
      await getUser();


    if(!currentUser){

      showLogin();

      return;

    }


    /*
     * ?conversation= থাকলে
     * সরাসরি chat
     */

    if(conversationId){

      await loadChat();

      return;

    }


    /*
     * ?id= থাকলে
     * ad-এর conversation
     */

    if(adId){

      await loadChat();

      return;

    }


    /*
     * কোনো ID না থাকলে Inbox
     */

    await loadInbox();

  }catch(error){

    console.error(
      "Initialize error:",
      error
    );


    errorBox(
      error.message ||
      "Messages চালু করা যাচ্ছে না।"
    );

  }

}


initialize();

})();

</script>
