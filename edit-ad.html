<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>
বিজ্ঞাপন এডিট করুন | শাহমাহমুদপুর বাজার
</title>

<link
  rel="stylesheet"
  href="style.css">


<style>

/* ============================================================
   ROOT
============================================================ */

:root{

  --green:#0b8f4b;
  --green-dark:#05743a;
  --green-light:#eaf8ef;

  --text:#1d2923;
  --muted:#758078;

  --border:#e2eae5;
  --bg:#f7faf8;
  --card:#ffffff;

}


/* ============================================================
   BODY
============================================================ */

body{

  margin:0;

  background:
    linear-gradient(
      180deg,
      #f7faf8 0%,
      #ffffff 45%,
      #f7faf8 100%
    );

  color:var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  padding-bottom:40px;

}


a{
  text-decoration:none;
}


/* ============================================================
   PAGE
============================================================ */

.page{

  max-width:900px;

  margin:auto;

  padding:
    35px
    16px
    60px;

}


/* ============================================================
   BRAND
============================================================ */

.page .brand{

  display:flex;

  flex-wrap:wrap;

  align-items:center;

  width:250px;

  position:relative;

  padding-left:58px;

  color:var(--text);

}


.page .brand:before{

  content:"🛍";

  position:absolute;

  left:0;

  top:50%;

  transform:translateY(-50%);

  width:45px;

  height:45px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #0d9b55,
      #05743a
    );

  font-size:25px;

  box-shadow:
    0 8px 20px
    rgba(11,143,75,.22);

}


.page .brand b{

  width:100%;

  color:#27352e;

  font-size:19px;

  font-weight:900;

  letter-spacing:-.5px;

}


.page .brand strong{

  position:absolute;

  left:188px;

  top:0;

  color:var(--green);

  font-size:19px;

  font-weight:900;

}


.page .brand small{

  width:100%;

  margin-top:3px;

  color:#66726b;

  font-size:9px;

  font-weight:800;

  letter-spacing:1.5px;

}


/* ============================================================
   PAGE WRAP
============================================================ */

.page-wrap{

  margin-top:30px;

}


/* ============================================================
   BACK BUTTON
============================================================ */

.back-link{

  display:inline-flex;

  align-items:center;

  gap:6px;

  margin-bottom:18px;

  color:
    var(--muted);

  font-size:11px;

  font-weight:700;

}


.back-link:hover{

  color:
    var(--green);

}


/* ============================================================
   HEADER CARD
============================================================ */

.edit-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  padding:
    25px
    28px;

  border:
    1px solid
    var(--border);

  border-radius:22px;

  background:

    radial-gradient(
      circle at 90% 20%,
      rgba(105,245,165,.16),
      transparent 35%
    ),

    linear-gradient(
      135deg,
      #ffffff,
      #f2fbf5
    );

  box-shadow:
    0 15px 40px
    rgba(30,55,42,.06);

}


.header-eyebrow{

  display:inline-block;

  margin-bottom:8px;

  padding:
    6px
    10px;

  border-radius:50px;

  background:
    var(--green-light);

  color:
    var(--green);

  font-size:8px;

  font-weight:900;

  letter-spacing:1.4px;

}


.edit-header h2{

  margin:0;

  color:#26362d;

  font-size:25px;

  font-weight:900;

}


.edit-header p{

  margin:
    7px
    0
    0;

  color:
    var(--muted);

  font-size:11px;

}


/* ============================================================
   LOADING
============================================================ */

.loading-box{

  margin-top:22px;

  padding:
    60px
    20px;

  text-align:center;

  color:
    var(--muted);

  font-size:12px;

  border:
    1px solid
    var(--border);

  border-radius:20px;

  background:#fff;

  box-shadow:
    0 12px 35px
    rgba(30,55,42,.05);

}


/* ============================================================
   FORM CARD
============================================================ */

.edit-form-card{

  margin-top:22px;

  padding:28px;

  border:
    1px solid
    var(--border);

  border-radius:22px;

  background:#fff;

  box-shadow:
    0 12px 35px
    rgba(30,55,42,.05);

}


/* ============================================================
   FORM GRID
============================================================ */

.form-grid{

  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:18px;

}


.form-group.full{

  grid-column:
    1 / -1;

}


/* ============================================================
   LABEL
============================================================ */

.form-group label{

  display:block;

  margin-bottom:8px;

  color:#425047;

  font-size:10px;

  font-weight:800;

}


/* ============================================================
   INPUT
============================================================ */

.form-group input,

.form-group textarea{

  width:100%;

  box-sizing:border-box;

  border:
    1px solid
    var(--border);

  border-radius:12px;

  outline:none;

  background:#fff;

  color:#26362d;

  font-family:inherit;

  font-size:13px;

  transition:.2s ease;

}


.form-group input{

  height:48px;

  padding:
    0
    14px;

}


.form-group textarea{

  min-height:130px;

  padding:14px;

  resize:vertical;

}


.form-group input:focus,

.form-group textarea:focus{

  border-color:
    rgba(11,143,75,.65);

  box-shadow:
    0 0 0 3px
    rgba(11,143,75,.08);

}


/* ============================================================
   STATUS INFO
============================================================ */

.status-info{

  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:24px;

  padding:
    13px
    15px;

  border-radius:13px;

  background:
    #f6faf7;

  border:
    1px solid
    var(--border);

}


.status-dot{

  width:9px;

  height:9px;

  border-radius:50%;

  background:
    #f2b84b;

}


.status-dot.published{

  background:
    var(--green);

}


.status-text{

  color:
    #536057;

  font-size:10px;

  font-weight:700;

}


/* ============================================================
   BUTTON AREA
============================================================ */

.form-actions{

  display:flex;

  align-items:center;

  justify-content:flex-end;

  gap:12px;

  margin-top:26px;

  padding-top:22px;

  border-top:
    1px solid
    var(--border);

}


/* ============================================================
   BUTTON
============================================================ */

.cancel-btn{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  min-height:46px;

  padding:
    0
    18px;

  border-radius:13px;

  border:
    1px solid
    var(--border);

  background:#fff;

  color:
    var(--muted);

  font-size:11px;

  font-weight:800;

}


.save-btn{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  min-height:46px;

  padding:
    0
    20px;

  border:none;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #0d9b55,
      #05743a
    );

  color:#fff;

  font-family:inherit;

  font-size:11px;

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 10px 22px
    rgba(11,143,75,.20);

  transition:.2s ease;

}


.save-btn:hover{

  transform:
    translateY(-2px);

}


.save-btn:disabled{

  opacity:.65;

  cursor:not-allowed;

  transform:none;

}


/* ============================================================
   MESSAGE
============================================================ */

.form-message{

  margin-top:16px;

  padding:12px 14px;

  border-radius:12px;

  font-size:10px;

  line-height:1.5;

}


.form-message.success{

  color:#19713f;

  background:#eefaf2;

  border:
    1px solid
    #ccebd7;

}


.form-message.error{

  color:#a13d3d;

  background:#fff2f2;

  border:
    1px solid
    #f1d0d0;

}


/* ============================================================
   ERROR BOX
============================================================ */

.error-box{

  margin-top:22px;

  padding:
    50px
    20px;

  text-align:center;

  border:
    1px solid
    var(--border);

  border-radius:20px;

  background:#fff;

}


.error-icon{

  width:58px;

  height:58px;

  margin:
    0
    auto
    15px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:#fff4f4;

  font-size:25px;

}


.error-box strong{

  display:block;

  color:#26362d;

  margin-bottom:8px;

  font-size:15px;

}


.error-box span{

  color:
    var(--muted);

  font-size:10px;

}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:600px){

  .page{

    padding:
      22px
      12px
      45px;

  }


  .page .brand{

    width:190px;

    padding-left:47px;

  }


  .page .brand:before{

    width:38px;

    height:38px;

    border-radius:12px;

    font-size:22px;

  }


  .page .brand b{

    font-size:14px;

  }


  .page .brand strong{

    position:static;

    width:auto;

    margin-left:4px;

    font-size:14px;

  }


  .page .brand small{

    font-size:7px;

  }


  .page-wrap{

    margin-top:20px;

  }


  .edit-header{

    padding:
      20px
      18px;

  }


  .edit-header h2{

    font-size:21px;

  }


  .edit-header p{

    font-size:10px;

  }


  .edit-form-card{

    padding:18px;

  }


  .form-grid{

    grid-template-columns:1fr;

    gap:15px;

  }


  .form-group.full{

    grid-column:auto;

  }


  .form-actions{

    flex-direction:column-reverse;

  }


  .cancel-btn,

  .save-btn{

    width:100%;

  }

}

</style>

</head>


<body>


<main class="container page">


<!-- ==========================================================
     BRAND
=========================================================== -->

<a
  href="index.html"
  class="brand">

  <b>
    শাহমাহমুদপুর
  </b>

  <strong>
    বাজার
  </strong>

  <small>
    LOCAL MARKETPLACE
  </small>

</a>



<div class="page-wrap">


<!-- ==========================================================
     BACK
=========================================================== -->

<a
  href="my-ads.html"
  class="back-link">

  ← আমার বিজ্ঞাপনে ফিরে যান

</a>



<!-- ==========================================================
     HEADER
=========================================================== -->

<div class="edit-header">

  <div>

    <span class="header-eyebrow">
      EDIT LISTING
    </span>

    <h2>
      বিজ্ঞাপন এডিট করুন
    </h2>

    <p>
      আপনার বিজ্ঞাপনের তথ্য পরিবর্তন করুন।
    </p>

  </div>

</div>



<!-- ==========================================================
     LOADING
=========================================================== -->

<div
  id="loading"
  class="loading-box">

  বিজ্ঞাপনের তথ্য লোড হচ্ছে...

</div>



<!-- ==========================================================
     CONTENT
=========================================================== -->

<div
  id="content"
  style="display:none">

</div>


</div>

</main>



<script src="supabase.js?v=12"></script>


<script>

(function(){

"use strict";


/* ============================================================
   CONFIG
============================================================ */

const SUPA_URL =
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


/* ============================================================
   ELEMENTS
============================================================ */

const loading =
  document.getElementById(
    "loading"
  );


const content =
  document.getElementById(
    "content"
  );


/* ============================================================
   GET AD ID
============================================================ */

const params =
  new URLSearchParams(
    window.location.search
  );


const adId =
  params.get("id");


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* ============================================================
   GET CURRENT USER
============================================================ */

async function getUser(){

  try{

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        await getCurrentUser();


      if(user){

        return user;

      }

    }

  }catch(error){

    console.error(
      "User error:",
      error
    );

  }


  return null;

}


/* ============================================================
   GET SESSION
============================================================ */

async function getSession(){

  try{

    if(
      typeof getSbSession ===
      "function"
    ){

      const session =
        await getSbSession();


      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }

  }catch(error){

    console.error(
      "Session error:",
      error
    );

  }


  return null;

}


/* ============================================================
   NORMALIZE STATUS
============================================================ */

function normalizeStatus(status){

  return String(
    status ||
    "pending"
  )
  .trim()
  .toLowerCase();

}


/* ============================================================
   STATUS TEXT
============================================================ */

function getStatusText(status){

  if(
    status === "pending"
  ){

    return "এই বিজ্ঞাপনটি বর্তমানে Admin approval-এর অপেক্ষায় আছে।";

  }


  if(

    status === "approved" ||

    status === "published" ||

    status === "active"

  ){

    return "এই বিজ্ঞাপনটি বর্তমানে Published অবস্থায় আছে।";

  }


  return "বিজ্ঞাপনের বর্তমান অবস্থা: " + status;

}


/* ============================================================
   LOAD AD
============================================================ */

async function loadAd(
  user,
  session
){

  const userId =
    encodeURIComponent(
      user.id
    );


  const ownership =
    encodeURIComponent(
      "(seller_id.eq." +
      userId +
      ",user_id.eq." +
      userId +
      ")"
    );


  const url =
    SUPA_URL +
    "/rest/v1/ads" +
    "?id=eq." +
    encodeURIComponent(
      adId
    ) +
    "&or=" +
    ownership +
    "&select=*";


  const response =
    await fetch(
      url,
      {

        method:"GET",

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token

        }

      }
    );


  if(!response.ok){

    const text =
      await response.text();


    throw new Error(
      text
    );

  }


  const data =
    await response.json();


  return data &&
    data.length
    ? data[0]
    : null;

}


/* ============================================================
   RENDER FORM
============================================================ */

function renderAd(ad){

  loading.style.display =
    "none";


  content.style.display =
    "block";


  const status =
    normalizeStatus(
      ad.status
    );


  const isPublished =

    status === "approved" ||

    status === "published" ||

    status === "active";


  const statusClass =
    isPublished
    ? "published"
    : "";


  content.innerHTML = `

    <form
      id="editForm"
      class="edit-form-card">


      <div class="status-info">

        <span
          class="status-dot ${statusClass}">
        </span>

        <span class="status-text">

          ${escapeHTML(
            getStatusText(status)
          )}

        </span>

      </div>


      <div class="form-grid">


        <!-- TITLE -->

        <div class="form-group full">

          <label>
            বিজ্ঞাপনের শিরোনাম
          </label>

          <input
            type="text"
            id="title"
            required
            value="${escapeHTML(
              ad.title
            )}"
          >

        </div>


        <!-- PRICE -->

        <div class="form-group">

          <label>
            দাম
          </label>

          <input
            type="number"
            id="price"
            required
            value="${escapeHTML(
              ad.price
            )}"
          >

        </div>


        <!-- CATEGORY -->

        <div class="form-group">

          <label>
            ক্যাটাগরি
          </label>

          <input
            type="text"
            id="category"
            value="${escapeHTML(
              ad.category
            )}"
          >

        </div>


        <!-- LOCATION -->

        <div class="form-group full">

          <label>
            লোকেশন
          </label>

          <input
            type="text"
            id="location"
            value="${escapeHTML(
              ad.location
            )}"
          >

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group full">

          <label>
            বিস্তারিত বিবরণ
          </label>

          <textarea
            id="description"
          >${escapeHTML(
            ad.description || ""
          )}</textarea>

        </div>


      </div>


      <div
        id="formMessage">
      </div>


      <div class="form-actions">


        <a
          href="my-ads.html"
          class="cancel-btn">

          বাতিল করুন

        </a>


        <button
          type="submit"
          id="saveButton"
          class="save-btn">

          পরিবর্তন সংরক্ষণ করুন

        </button>


      </div>


    </form>

  `;


  const form =
    document.getElementById(
      "editForm"
    );


  form.addEventListener(

    "submit",

    async function(event){

      event.preventDefault();


      await saveAd();

    }

  );

}


/* ============================================================
   SAVE AD
============================================================ */

async function saveAd(){

  const button =
    document.getElementById(
      "saveButton"
    );


  const message =
    document.getElementById(
      "formMessage"
    );


  const user =
    await getUser();


  const session =
    await getSession();


  if(
    !user ||
    !session
  ){

    message.innerHTML = `

      <div class="form-message error">

        Login session পাওয়া যায়নি।
        আবার Login করুন।

      </div>

    `;

    return;

  }


  const payload = {

    title:
      document.getElementById(
        "title"
      ).value.trim(),

    price:
      Number(
        document.getElementById(
          "price"
        ).value
      ),

    category:
      document.getElementById(
        "category"
      ).value.trim(),

    location:
      document.getElementById(
        "location"
      ).value.trim(),

    description:
      document.getElementById(
        "description"
      ).value.trim()

  };


  button.disabled =
    true;


  button.textContent =
    "সংরক্ষণ হচ্ছে...";


  message.innerHTML =
    "";


  try{

    const url =
      SUPA_URL +
      "/rest/v1/ads" +
      "?id=eq." +
      encodeURIComponent(
        adId
      );


    const response =
      await fetch(

        url,

        {

          method:"PATCH",

          headers:{

            "apikey":
              SUPA_KEY,

            "Authorization":
              "Bearer " +
              session.access_token,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify(
              payload
            )

        }

      );


    if(!response.ok){

      const text =
        await response.text();


      throw new Error(
        text
      );

    }


    message.innerHTML = `

      <div class="form-message success">

        ✓ আপনার বিজ্ঞাপন সফলভাবে আপডেট করা হয়েছে।

      </div>

    `;


    button.textContent =
      "✓ সংরক্ষিত";


    setTimeout(

      function(){

        window.location.href =
          "my-ads.html";

      },

      1200

    );


  }catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );


    message.innerHTML = `

      <div class="form-message error">

        বিজ্ঞাপন আপডেট করা যায়নি।
        ${escapeHTML(
          error.message
        )}

      </div>

    `;


    button.disabled =
      false;


    button.textContent =
      "পরিবর্তন সংরক্ষণ করুন";

  }

}


/* ============================================================
   INITIALIZE
============================================================ */

async function initialize(){


  /* CHECK AD ID */

  if(!adId){

    loading.innerHTML = `

      <div class="error-box">

        <div class="error-icon">
          ⚠
        </div>

        <strong>
          বিজ্ঞাপনের ID পাওয়া যায়নি
        </strong>

        <span>
          আবার আমার বিজ্ঞাপন পেজ থেকে চেষ্টা করুন।
        </span>

      </div>

    `;

    return;

  }


  /* GET USER */

  let user =
    await getUser();


  /*
   * Session একটু delay হলে
   * আবার চেষ্টা করবে
   */

  if(!user){

    await new Promise(
      function(resolve){

        setTimeout(
          resolve,
          800
        );

      }
    );


    user =
      await getUser();

  }


  if(!user){

    loading.innerHTML = `

      <div class="error-box">

        <div class="error-icon">
          🔐
        </div>

        <strong>
          Login session পাওয়া যায়নি
        </strong>

        <span>
          আপনার বিজ্ঞাপন এডিট করতে Login করুন।
        </span>

      </div>

    `;

    return;

  }


  /* GET SESSION */

  const session =
    await getSession();


  if(!session){

    loading.innerHTML = `

      <div class="error-box">

        <div class="error-icon">
          🔐
        </div>

        <strong>
          Login session পাওয়া যায়নি
        </strong>

        <span>
          আবার Login করে চেষ্টা করুন।
        </span>

      </div>

    `;

    return;

  }


  /* LOAD AD */

  try{

    const ad =
      await loadAd(
        user,
        session
      );


    if(!ad){

      loading.innerHTML = `

        <div class="error-box">

          <div class="error-icon">
            📄
          </div>

          <strong>
            বিজ্ঞাপনটি পাওয়া যায়নি
          </strong>

          <span>
            এটি আপনার বিজ্ঞাপন নয় অথবা বিজ্ঞাপনটি মুছে ফেলা হয়েছে।
          </span>

        </div>

      `;

      return;

    }


    renderAd(
      ad
    );


  }catch(error){

    console.error(
      "LOAD AD ERROR:",
      error
    );


    loading.innerHTML = `

      <div class="error-box">

        <div class="error-icon">
          ⚠
        </div>

        <strong>
          বিজ্ঞাপন লোড করা যায়নি
        </strong>

        <span>
          ${escapeHTML(
            error.message ||
            "দয়া করে আবার চেষ্টা করুন।"
          )}
        </span>

      </div>

    `;

  }

}


/* ============================================================
   START
============================================================ */

initialize();


})();

</script>

</body>
</html>
