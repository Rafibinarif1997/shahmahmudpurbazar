<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>
বিজ্ঞাপন এডিট করুন | শাহমাহমুদপুর বাজার
</title>

<link
  rel="stylesheet"
  href="style.css">

  <style>

/* EDIT AD PAGE */

.edit-card{

  margin-top:30px;

  padding:25px;

  background:#ffffff;

  border-radius:18px;

  border:1px solid #e2eae5;

  color:#1d2923;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.08);

}


.edit-card h2{

  margin:
    0
    0
    20px;

  color:#1d2923;

  font-size:22px;

}


.edit-card p{

  color:#4f5d55;

  font-size:15px;

  line-height:1.7;

}

</style>

</head>


<body>


<main class="container page">


<a
  href="my-ads.html"
  class="brand">

  <b>
    শাহমাহমুদপুর
  </b>

  <strong>
    বাজার
  </strong>

  <small>
    LOCAL MARKETPLACE
  </small>

</a>


<div
  id="loading"
  style="
    margin-top:30px;
    padding:40px;
    text-align:center;
  ">

  বিজ্ঞাপনের তথ্য লোড হচ্ছে...

</div>


<div
  id="content"
  style="display:none">

</div>

</main>

<script src="supabase.js?v=12"></script>

<script>

(function(){

"use strict";


/* ============================================================
   CONFIG
============================================================ */

const SUPA_URL =
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


/* ============================================================
   ELEMENTS
============================================================ */

const loading =
  document.getElementById(
    "loading"
  );


const content =
  document.getElementById(
    "content"
  );


/* ============================================================
   GET AD ID FROM URL
============================================================ */

const params =
  new URLSearchParams(
    window.location.search
  );


const adId =
  params.get("id");


/* ============================================================
   GET CURRENT USER
============================================================ */

async function getUser(){

  try{

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        await getCurrentUser();


      if(user){

        return user;

      }

    }

  }catch(error){

    console.error(
      "User error:",
      error
    );

  }


  return null;

}


/* ============================================================
   GET SESSION
============================================================ */

async function getSession(){

  try{

    if(
      typeof getSbSession ===
      "function"
    ){

      const session =
        await getSbSession();


      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }

  }catch(error){

    console.error(
      "Session error:",
      error
    );

  }


  return null;

}


/* ============================================================
   LOAD AD
============================================================ */

async function loadAd(
  user,
  session
){

  const url =
    SUPA_URL +
    "/rest/v1/ads" +
    "?id=eq." +
    encodeURIComponent(
      adId
    ) +
    "&seller_id=eq." +
    encodeURIComponent(
      user.id
    ) +
    "&select=*";


  const response =
    await fetch(
      url,
      {

        method:"GET",

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token

        }

      }
    );


  if(!response.ok){

    const text =
      await response.text();


    throw new Error(
      "বিজ্ঞাপন লোড করা যায়নি: " +
      text
    );

  }


  const data =
    await response.json();


  return data && data.length
    ? data[0]
    : null;

}


/* ============================================================
   RENDER AD DATA
============================================================ */

function renderAd(
  ad
){

  loading.style.display =
    "none";


  content.style.display =
    "block";


  content.innerHTML = `

    <div class="edit-card">

      <h2>
        বিজ্ঞাপন এডিট করুন
      </h2>

      <p>
        ${ad.title || ""}
      </p>

      <p>
        দাম: ৳ ${ad.price || ""}
      </p>

      <p>
        ক্যাটাগরি: ${ad.category || ""}
      </p>

      <p>
        লোকেশন: ${ad.location || ""}
      </p>

    </div>

  `;

}


/* ============================================================
   INITIALIZE
============================================================ */

async function initialize(){

  /* Check ID */

  if(!adId){

    loading.innerHTML = `

      বিজ্ঞাপনের ID পাওয়া যায়নি।

      <br><br>

      <a href="my-ads.html">

        ← আমার বিজ্ঞাপনে ফিরে যান

      </a>

    `;

    return;

  }


  /* Get user */

  const user =
    await getUser();


  if(!user){

    loading.innerHTML = `

      Login session পাওয়া যায়নি।

      <br><br>

      <a href="login.html?next=my-ads.html">

        Login করুন

      </a>

    `;

    return;

  }


  /* Get session */

  const session =
    await getSession();


  if(!session){

    loading.innerHTML = `

      Login session পাওয়া যায়নি।

      <br><br>

      <a href="login.html?next=my-ads.html">

        আবার Login করুন

      </a>

    `;

    return;

  }


  /* Load Ad */

  try{

    const ad =
      await loadAd(
        user,
        session
      );


    if(!ad){

      loading.innerHTML = `

        বিজ্ঞাপনটি পাওয়া যায়নি অথবা
        এটি আপনার বিজ্ঞাপন নয়।

        <br><br>

        <a href="my-ads.html">

          ← আমার বিজ্ঞাপনে ফিরে যান

        </a>

      `;

      return;

    }


    renderAd(
      ad
    );


  }catch(error){

    console.error(
      "LOAD AD ERROR:",
      error
    );


    loading.innerHTML = `

      বিজ্ঞাপন লোড করা যায়নি।

      <br><br>

      ${error.message}

      <br><br>

      <a href="my-ads.html">

        ← ফিরে যান

      </a>

    `;

  }

}


/* ============================================================
   START
============================================================ */

initialize();


})();

</script>

</body>
</html>
