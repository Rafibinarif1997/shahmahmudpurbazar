<!doctype html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>শাহমাহমুদপুর বাজার</title>
<style>html,body{margin:0;background:#030705;color:#dfeae4;font-family:Arial}#app{min-height:100vh}</style></head>
<body><div id="app"></div>
<script>
(async function(){
 const map={
  "/":"index.html","/login":"login.html","/profile":"profile.html","/search":"search.html",
  "/post-ad":"post-ad.html","/favorites":"favorites.html","/messages":"messages.html",
  "/ad-details":"ad-details.html","/admin":"admin.html","/hijama":"hijama.html",
  "/about":"about.html","/contact":"contact.html","/safety":"safety.html",
  "/terms":"terms.html","/verify":"verify.html"
 };
 const path=location.pathname.replace(/\/+$/,"")||"/";
 const file=map[path]||"index.html";
 try{
   const r=await fetch(file);
   if(!r.ok)throw new Error("not found");
   let text=await r.text();
   const doc=new DOMParser().parseFromString(text,"text/html");
   document.title=doc.title||"শাহমাহমুদপুর বাজার";
   document.head.querySelectorAll('link[rel="stylesheet"]').forEach(x=>x.remove());
   doc.head.querySelectorAll('link[rel="stylesheet"]').forEach(x=>document.head.appendChild(x.cloneNode(true)));
   document.getElementById("app").innerHTML=doc.body.innerHTML;
   // Execute scripts from fetched page.
   for(const old of doc.body.querySelectorAll("script")){
     const s=document.createElement("script");
     if(old.src)s.src=old.src;
     else s.textContent=old.textContent;
     document.body.appendChild(s);
   }
 }catch(e){location.replace("./")}
})();
</script></body></html>
