<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>বিজ্ঞাপন</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="container topbar"><a class="brand" href="index.html"><b>শাহমাহমুদপুর</b><strong>বাজার</strong></a><div class="top-actions"><a href="login.html">লগইন</a><i></i><a href="register.html">রেজিস্টার</a></div></div></header><main class="container" id="detail"><p class="muted">লোড হচ্ছে...</p></main><nav class="mobile-nav"><a href="index.html"><span>⌂</span>হোম</a><a href="favorites.html"><span>♡</span>সেভড</a><a href="post-ad.html"><span>＋</span>বিজ্ঞাপন</a><a href="messages.html"><span>▤</span>মেসেজ</a><a href="profile.html"><span>♙</span>প্রোফাইল</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>const id=new URLSearchParams(location.search).get('id');(async()=>{if(!id){detail.innerHTML='<p>বিজ্ঞাপন পাওয়া যায়নি।</p>';return}const {data:a,error}=await sb.from('ads').select('*,profiles(name)').eq('id',id).maybeSingle();if(error||!a){detail.innerHTML='<p>বিজ্ঞাপন পাওয়া যায়নি।</p>';return}await sb.rpc('increment_ad_views',{ad_id:id}).catch(()=>{});const img=a.image_urls?.[0];detail.innerHTML=`<div class="detail-layout"><div class="detail-photo" ${img?`style="background-image:url('${marketplace.esc(img)}');background-size:cover;background-position:center"`:''}>${img?'':'NO IMAGE'}</div><div class="detail-box"><span class="badge">${marketplace.esc(a.category)}${a.subcategory?' · '+marketplace.esc(a.subcategory):''}</span><h1>${marketplace.esc(a.title)}</h1><h2 class="price">${marketplace.money(a.price)}</h2><p>${marketplace.esc(a.description||'বিস্তারিত দেওয়া হয়নি।')}</p><p class="muted">⌖ ${marketplace.esc(a.location)} · ${marketplace.esc(a.phone)}</p><div class="actions"><a class="btn green" href="tel:${encodeURIComponent(a.phone)}">📞 কল করুন</a><button class="btn" id="msgBtn">💬 মেসেজ</button><button class="btn" id="favBtn">♡ সেভ</button></div><hr><p>বিক্রেতা: <b>${marketplace.esc(a.profiles?.name||'Seller')}</b></p><button class="btn" id="report">⚠ রিপোর্ট</button></div></div>`;msgBtn.onclick=async()=>{const u=await marketplace.user();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}if(u.id===a.seller_id){marketplace.toast('নিজের বিজ্ঞাপনে message করা যাবে না।');return}const {data:c,error}=await sb.from('conversations').upsert({ad_id:a.id,buyer_id:u.id,seller_id:a.seller_id},{onConflict:'ad_id,buyer_id,seller_id'}).select().single();if(error){marketplace.toast(error.message);return}location.href='messages.html?id='+c.id};favBtn.onclick=()=>marketplace.fav(a.id);report.onclick=async()=>{const u=await marketplace.user();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}const reason=prompt('রিপোর্টের কারণ লিখুন');if(reason){const r=await sb.from('reports').insert({ad_id:a.id,reporter_id:u.id,reason});marketplace.toast(r.error?r.error.message:'রিপোর্ট জমা হয়েছে।')}}})();</script></body></html>
