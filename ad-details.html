<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>বিজ্ঞাপনের বিস্তারিত | শাহমাহমুদপুর বাজার</title>

<link
  rel="stylesheet"
  href="style.css">

<style>

/* ==========================================================
   PREMIUM AD DETAILS PAGE
========================================================== */

body{
  background:#f7faf8;
}


/* ==========================================================
   PAGE
========================================================== */

.detail-page{
  max-width:980px;
  padding:28px 16px 115px;
}


/* ==========================================================
   BRAND SPACING
========================================================== */

.detail-page .brand{
  margin-bottom:24px;
}


/* ==========================================================
   MAIN CARD
========================================================== */

.detail-box{

  position:relative;

  margin-top:10px;

  padding:22px;

  overflow:hidden;

  border:1px solid rgba(20,100,60,.10);

  border-radius:26px;

  background:

    radial-gradient(
      circle at 100% 0%,
      rgba(105,245,165,.10),
      transparent 30%
    ),

    linear-gradient(
      145deg,
      #ffffff,
      #fbfdfc
    );

  box-shadow:
    0 12px 45px rgba(25,70,45,.07);

}


/* Decorative glow */

.detail-box::before{

  content:"";

  position:absolute;

  width:260px;
  height:260px;

  top:-170px;
  right:-120px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(50,190,110,.10),
      transparent 70%
    );

  pointer-events:none;

}


/* ==========================================================
   LOADING / NOT FOUND
========================================================== */

.loading-box,
.not-found{

  padding:70px 20px;

  text-align:center;

  color:#718078;

  font-size:12px;

}


.not-found h2{

  margin:0;

  color:#25372d;

  font-size:22px;

}


.not-found p{

  margin:10px auto 0;

  max-width:400px;

  color:#819089;

  font-size:11px;

  line-height:1.7;

}


/* ==========================================================
   IMAGE GALLERY
========================================================== */

.gallery{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-bottom:24px;

}


.gallery img{

  width:100%;

  aspect-ratio:1;

  display:block;

  object-fit:cover;

  border-radius:16px;

  border:1px solid #e5ece8;

  background:#eef4f0;

  transition:
    transform .25s ease,
    box-shadow .25s ease;

}


.gallery img:hover{

  transform:scale(1.015);

  box-shadow:
    0 12px 28px rgba(20,70,45,.12);

}


.gallery img:first-child{

  grid-column:1/-1;

  aspect-ratio:16/8.5;

  border-radius:20px;

}


/* ==========================================================
   CATEGORY
========================================================== */

.category-badge{

  display:inline-flex;

  align-items:center;

  padding:7px 12px;

  border-radius:100px;

  color:#11834c;

  background:#edf8f1;

  border:1px solid #d9eee1;

  font-size:9px;

  font-weight:900;

  letter-spacing:.2px;

}


.subcategory{

  display:inline-block;

  margin-left:8px;

  color:#7b8982;

  font-size:10px;

  font-weight:600;

}


/* ==========================================================
   TITLE
========================================================== */

.detail-title{

  max-width:800px;

  margin:15px 0 9px;

  color:#203229;

  font-size:32px;

  font-weight:900;

  line-height:1.3;

  letter-spacing:-.5px;

}


/* ==========================================================
   PRICE
========================================================== */

.detail-price{

  display:inline-flex;

  align-items:center;

  margin-top:4px;

  padding:9px 14px;

  border-radius:12px;

  background:

    linear-gradient(
      135deg,
      #e8f8ee,
      #f2fbf5
    );

  color:#0d7d4a;

  font-size:24px;

  font-weight:900;

}


.view-count{

  margin-top:13px;

  padding-bottom:20px;

  border-bottom:1px solid #edf1ee;

  color:#84918b;

  font-size:10px;

}


/* ==========================================================
   INFO GRID
========================================================== */

.info-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:11px;

  margin:22px 0;

}


.info-box{

  position:relative;

  padding:16px;

  overflow:hidden;

  border:1px solid #e5ece8;

  border-radius:15px;

  background:#fbfdfc;

  transition:
    transform .2s ease,
    border-color .2s ease;

}


.info-box:hover{

  transform:translateY(-2px);

  border-color:#d5e8dc;

}


.info-box small{

  display:block;

  margin-bottom:7px;

  color:#829088;

  font-size:8px;

  font-weight:800;

  letter-spacing:.6px;

  text-transform:uppercase;

}


.info-box strong{

  display:block;

  color:#27372e;

  font-size:12px;

  font-weight:800;

  word-break:break-word;

}


/* ==========================================================
   DESCRIPTION
========================================================== */

.description-section{

  margin-top:26px;

  padding:22px;

  border:1px solid #e8eeea;

  border-radius:18px;

  background:

    linear-gradient(
      145deg,
      #ffffff,
      #fbfdfc
    );

}


.description-section h3{

  display:flex;

  align-items:center;

  gap:8px;

  margin:0 0 13px;

  color:#26382f;

  font-size:17px;

  font-weight:900;

}


.description-section h3::before{

  content:"";

  width:4px;
  height:20px;

  border-radius:10px;

  background:
    linear-gradient(
      180deg,
      #0d7d4a,
      #55ca8a
    );

}


.description{

  color:#65756d;

  font-size:12px;

  line-height:2;

  white-space:pre-wrap;

}


/* ==========================================================
   SELLER BOX
========================================================== */

.seller-box{

  position:relative;

  margin-top:22px;

  padding:22px;

  overflow:hidden;

  border:1px solid #dcece2;

  border-radius:20px;

  background:

    radial-gradient(
      circle at 100% 0%,
      rgba(105,245,165,.12),
      transparent 45%
    ),

    linear-gradient(
      145deg,
      #f8fcf9,
      #ffffff
    );

}


.seller-box::after{

  content:"";

  position:absolute;

  width:120px;
  height:120px;

  right:-50px;
  bottom:-60px;

  border-radius:50%;

  border:1px solid rgba(30,150,85,.10);

}


.seller-box h3{

  position:relative;

  z-index:1;

  margin:0 0 14px;

  color:#26382f;

  font-size:17px;

  font-weight:900;

}


.seller-name{

  position:relative;

  z-index:1;

  display:flex;

  align-items:center;

  gap:9px;

  color:#32443a;

  font-size:13px;

  font-weight:850;

}


.seller-name::before{

  content:"♙";

  width:30px;
  height:30px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#e5f5eb;

  color:#13834c;

  font-size:15px;

}


.phone-number{

  position:relative;

  z-index:1;

  display:inline-flex;

  align-items:center;

  margin:18px 0;

  padding:11px 14px;

  border-radius:12px;

  background:#fff;

  border:1px solid #dcebe1;

  color:#0b8049;

  font-size:18px;

  font-weight:900;

  letter-spacing:.3px;

}


/* ==========================================================
   ACTIONS
========================================================== */

.actions{

  position:relative;

  z-index:1;

  display:flex;

  gap:10px;

  flex-wrap:wrap;

}


.actions .btn{

  flex:1;

  min-width:145px;

  text-align:center;

}


.copy-message{

  position:relative;

  z-index:1;

  min-height:15px;

  margin-top:11px;

  color:#14854f;

  font-size:9px;

  font-weight:700;

  text-align:center;

}


/* ==========================================================
   MESSAGE BUTTON
========================================================== */

.detail-box > .btn:last-child{

  width:100%;

  margin-top:4px;

  padding:14px 18px;

  border-radius:14px;

  text-align:center;

  font-size:12px;

  font-weight:850;

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:700px){

  .detail-page{

    padding:
      20px 12px
      105px;

  }


  .detail-box{

    padding:15px;

    border-radius:20px;

  }


  .gallery{

    grid-template-columns:
      repeat(2,1fr);

    gap:8px;

    margin-bottom:18px;

  }


  .gallery img{

    border-radius:12px;

  }


  .gallery img:first-child{

    grid-column:1/-1;

    aspect-ratio:4/3;

    border-radius:16px;

  }


  .detail-title{

    margin-top:13px;

    font-size:24px;

    line-height:1.35;

  }


  .detail-price{

    padding:8px 11px;

    font-size:20px;

  }


  .view-count{

    margin-top:11px;

    padding-bottom:17px;

  }


  .info-grid{

    grid-template-columns:1fr;

    gap:8px;

    margin:18px 0;

  }


  .info-box{

    padding:13px;

    border-radius:13px;

  }


  .description-section{

    margin-top:20px;

    padding:17px;

    border-radius:16px;

  }


  .description-section h3{

    font-size:15px;

  }


  .description{

    font-size:11px;

    line-height:1.9;

  }


  .seller-box{

    margin-top:18px;

    padding:18px 16px;

    border-radius:17px;

  }


  .seller-box h3{

    font-size:15px;

  }


  .phone-number{

    width:100%;

    justify-content:center;

    box-sizing:border-box;

    margin:15px 0;

    font-size:16px;

  }


  .actions{

    flex-direction:column;

  }


  .actions .btn{

    width:100%;

    flex:none;

  }


  .detail-box > .btn:last-child{

    margin-top:2px;

  }

}

</style>

</head>


<body>


<main class="container detail-page">


<a
  href="index.html"
  class="brand">

  <b>শাহমাহমুদপুর</b>

  <strong>বাজার</strong>

  <small>
    স্থানীয় অনলাইন বাজার
  </small>

</a>


<div
  id="detail"
  class="authbox detail-box">

  <div class="loading-box">

    বিজ্ঞাপনের তথ্য লোড হচ্ছে...

  </div>

</div>


</main>



<nav class="mobile-nav">

<a href="index.html">
<span>⌂</span>
হোম
</a>

<a href="favorites.html">
<span>♡</span>
সংরক্ষিত
</a>

<a href="post-ad.html">
<span>⊞</span>
ক্রয়-বিক্রয়
</a>

<a href="messages.html">
<span>▤</span>
ম্যাসেজ
</a>

<a href="profile.html">
<span>♙</span>
প্রোফাইল
</a>

</nav>



<script src="supabase.js?v=13"></script>

<script src="app.js?v=13"></script>


<script>

document.addEventListener(
"DOMContentLoaded",
async function(){

"use strict";


const detail =
document.getElementById(
  "detail"
);


/* ==========================================================
   GET AD ID
========================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const adId =
  params.get("id");


if(!adId){

  detail.innerHTML = `

    <div class="not-found">

      <h2>
        বিজ্ঞাপন পাওয়া যায়নি।
      </h2>

      <br>

      <a
        href="search.html"
        class="btn green">

        Marketplace-এ যান →

      </a>

    </div>

  `;

  return;

}



/* ==========================================================
   LOAD EXACT AD FROM SUPABASE
========================================================== */

let ad = null;


try{

  ad =
    await window.getAdById(
      adId
    );

}catch(error){

  console.error(
    "AD DETAILS ERROR:",
    error
  );

}



/* ==========================================================
   NOT FOUND
========================================================== */

if(!ad){

  detail.innerHTML = `

    <div class="not-found">

      <h2>
        বিজ্ঞাপন পাওয়া যায়নি।
      </h2>

      <p>
        এই বিজ্ঞাপনটি বর্তমানে প্রকাশিত নেই
        অথবা বিজ্ঞাপনটি মুছে ফেলা হয়েছে।
      </p>

      <br>

      <a
        href="search.html"
        class="btn green">

        Marketplace-এ ফিরে যান →

      </a>

    </div>

  `;

  return;

}

/* ==========================================================
   TRACK AD VIEW
========================================================== */

(function(){

  try{

    let viewerKey =
      localStorage.getItem(
        "smbazar_viewer_key"
      );


    if(!viewerKey){

      viewerKey =
        crypto.randomUUID();


      localStorage.setItem(
        "smbazar_viewer_key",
        viewerKey
      );

    }


    window.sbFetch(
      "/rest/v1/rpc/track_ad_view",
      {
        method:"POST",

        body:JSON.stringify({

          p_ad_id:ad.id,

          p_viewer_key:viewerKey

        })

      }
    )

    .then(function(result){

      console.log(
        "VIEW TRACKED:",
        result
      );

    })

    .catch(function(error){

      console.error(
        "VIEW TRACK ERROR:",
        error
      );

    });


  }catch(error){

    console.error(
      "VIEW SYSTEM ERROR:",
      error
    );

  }

})();


 /* ==========================================================
   DATA
========================================================== */

const title =
  ad.title ||
  "বিজ্ঞাপন";


const category =
  ad.category ||
  "অন্যান্য";


const subcategory =
  ad.subcategory ||
  "";


const description =
  ad.description ||
  "বিস্তারিত তথ্য দেওয়া হয়নি।";


const location =
  ad.location ||
  "এলাকা উল্লেখ নেই";


const phone =
  String(
    ad.phone ||
    ""
  ).trim();


const seller =
  ad.seller_name ||
  ad.seller ||
  ad.name ||
  ad.seller_email ||
  "বিক্রেতা";


const views =
  Number(
    ad.views || 0
  );



/* ==========================================================
   IMAGES
========================================================== */

let images = [];


if(
  Array.isArray(
    ad.image_urls
  )
){

  images =
    ad.image_urls.filter(
      function(url){

        return String(
          url || ""
        ).trim();

      }
    );

}


else if(
  typeof ad.image_urls ===
  "string"
){

  try{

    const parsed =
      JSON.parse(
        ad.image_urls
      );


    if(
      Array.isArray(parsed)
    ){

      images =
        parsed.filter(
          function(url){

            return String(
              url || ""
            ).trim();

          }
        );

    }

  }catch(error){

    if(
      ad.image_urls.trim()
    ){

      images = [
        ad.image_urls
      ];

    }

  }

}



/* ==========================================================
   GALLERY
========================================================== */

let gallery = "";


if(images.length){

  gallery = `

    <div class="gallery">

      ${
        images.map(
          function(url,index){

            return `

              <img
                src="${escapeHtml(url)}"
                alt="${escapeHtml(title)}"
                loading="${
                  index === 0
                  ? "eager"
                  : "lazy"
                }"
                onerror="
                  this.style.display='none'
                "
              >

            `;

          }
        ).join("")
      }

    </div>

  `;

}



/* ==========================================================
   PHONE
========================================================== */

const cleanPhone =
  phone.replace(
    /[^0-9+]/g,
    ""
  );


let phoneArea = "";


if(phone){

  phoneArea = `

    <div class="phone-number">

      📞 ${escapeHtml(phone)}

    </div>


    <div class="actions">

      <button
        id="copyPhone"
        class="btn"
        type="button">

        📋 নম্বর কপি করুন

      </button>


      <a
        class="btn green"
        href="tel:${escapeHtml(cleanPhone)}">

        ☎ কল করুন

      </a>

    </div>


    <div
      id="copyMessage"
      class="copy-message">
    </div>

  `;

}else{

  phoneArea = `

    <p class="muted">

      বিক্রেতা কোনো ফোন নম্বর দেননি।

    </p>

  `;

}



/* ==========================================================
   RENDER
========================================================== */

detail.innerHTML = `

  ${gallery}


  <span class="category-badge">

    ${escapeHtml(category)}

  </span>


  ${
    subcategory

    ?

    `<span class="subcategory">

      • ${escapeHtml(subcategory)}

    </span>`

    :

    ""
  }


  <h1 class="detail-title">

    ${escapeHtml(title)}

  </h1>


  <div class="detail-price">

    ${money(ad.price)}

  </div>


  <div class="view-count">

    👁 ${views} বার দেখা হয়েছে

  </div>



  <div class="info-grid">


    <div class="info-box">

      <small>
        📍 এলাকা
      </small>

      <strong>
        ${escapeHtml(location)}
      </strong>

    </div>


    <div class="info-box">

      <small>
        🏷️ ক্যাটাগরি
      </small>

      <strong>
        ${escapeHtml(category)}
      </strong>

    </div>


    ${
      subcategory

      ?

      `

      <div class="info-box">

        <small>
          ▦ সাব-ক্যাটাগরি
        </small>

        <strong>
          ${escapeHtml(subcategory)}
        </strong>

      </div>

      `

      :

      ""
    }


    <div class="info-box">

      <small>
        ✓ STATUS
      </small>

      <strong>
        প্রকাশিত
      </strong>

    </div>


  </div>



  <div class="description-section">

    <h3>
      পণ্যের বিস্তারিত
    </h3>

    <div class="description">

      ${escapeHtml(description)}

    </div>

  </div>



  <div class="seller-box">

    <h3>
      বিক্রেতার সাথে যোগাযোগ
    </h3>


    <div class="seller-name">

      ${escapeHtml(seller)}

    </div>


    ${phoneArea}


  </div>



  <br>


  <a
    class="btn"
    href="chat.html?id=${encodeURIComponent(
      ad.id
    )}">

    💬 বিক্রেতাকে মেসেজ করুন

  </a>

`;



/* ==========================================================
   COPY PHONE
========================================================== */

const copyButton =
  document.getElementById(
    "copyPhone"
  );


if(copyButton){

  copyButton.addEventListener(
    "click",
    async function(){

      const copyMessage =
        document.getElementById(
          "copyMessage"
        );


      try{

        await navigator.clipboard.writeText(
          phone
        );


        copyMessage.textContent =
          "✓ মোবাইল নম্বর কপি হয়েছে";

        copyButton.textContent =
          "✓ কপি হয়েছে";


      }catch(error){

        try{

          const input =
            document.createElement(
              "input"
            );


          input.value =
            phone;


          document.body.appendChild(
            input
          );


          input.select();


          document.execCommand(
            "copy"
          );


          input.remove();


          copyMessage.textContent =
            "✓ মোবাইল নম্বর কপি হয়েছে";


          copyButton.textContent =
            "✓ কপি হয়েছে";


        }catch(e){

          copyMessage.textContent =
            "নম্বর: " + phone;

        }

      }

    }
  );

}


});

</script>


</body>

</html>
