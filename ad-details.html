<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>বিজ্ঞাপনের বিস্তারিত | শাহমাহমুদপুর বাজার</title>

<link
  rel="stylesheet"
  href="style.css">

<style>

.detail-page{
  max-width:900px;
  padding:35px 16px 110px;
}

.detail-box{
  margin-top:28px;
}

.loading-box,
.not-found{
  padding:55px 20px;
  text-align:center;
  color:#819089;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:25px;
}

.gallery img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:15px;
  border:1px solid rgba(105,245,165,.14);
  background:#07110c;
}

.gallery img:first-child{
  grid-column:1/-1;
  aspect-ratio:16/10;
}

.category-badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  color:#69f5a5;
  background:rgba(105,245,165,.06);
  border:1px solid rgba(105,245,165,.15);
  font-size:9px;
  font-weight:800;
}

.subcategory{
  color:#7f9087;
  font-size:10px;
  margin-left:7px;
}

.detail-title{
  font-size:30px;
  line-height:1.3;
  margin:13px 0 8px;
}

.detail-price{
  color:#69f5a5;
  font-size:26px;
  font-weight:900;
  margin-bottom:12px;
}

.view-count{
  color:#819089;
  font-size:11px;
  margin-bottom:22px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:20px 0;
}

.info-box{
  padding:14px;
  border-radius:13px;
  border:1px solid rgba(105,245,165,.10);
  background:rgba(105,245,165,.025);
}

.info-box small{
  display:block;
  color:#697a72;
  font-size:8px;
  margin-bottom:6px;
}

.info-box strong{
  color:#eaf5ef;
  font-size:11px;
}

.description-section{
  margin-top:25px;
  padding-top:22px;
  border-top:1px solid rgba(255,255,255,.06);
}

.description-section h3{
  margin-bottom:10px;
  color:#edf7f1;
}

.description{
  color:#a9b8af;
  font-size:12px;
  line-height:1.9;
  white-space:pre-wrap;
}

.seller-box{
  margin-top:25px;
  padding:20px;
  border-radius:17px;
  border:1px solid rgba(105,245,165,.14);
  background:rgba(105,245,165,.025);
}

.seller-box h3{
  margin-bottom:12px;
}

.seller-name{
  color:#edf7f1;
  font-size:13px;
  font-weight:800;
}

.phone-number{
  margin:12px 0 18px;
  color:#69f5a5;
  font-size:18px;
  font-weight:900;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.actions .btn{
  flex:1;
  min-width:145px;
  text-align:center;
}

.copy-message{
  margin-top:10px;
  color:#69f5a5;
  font-size:9px;
  text-align:center;
  min-height:14px;
}

@media(max-width:600px){

  .detail-title{
    font-size:24px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
  }

  .gallery img:first-child{
    grid-column:1/-1;
  }

}

</style>

</head>


<body>


<main class="container detail-page">


<a
  href="index.html"
  class="brand">

  <b>শাহমাহমুদপুর</b>

  <strong>বাজার</strong>

  <small>
    LOCAL MARKETPLACE
  </small>

</a>


<div
  id="detail"
  class="authbox detail-box">

  <div class="loading-box">

    বিজ্ঞাপনের তথ্য লোড হচ্ছে...

  </div>

</div>


</main>



<nav class="mobile-nav">

<a href="index.html">
<span>⌂</span>
Home
</a>

<a href="favorites.html">
<span>♡</span>
Saved
</a>

<a href="post-ad.html">
<span>⊞</span>
Sell
</a>

<a href="messages.html">
<span>▤</span>
Messages
</a>

<a href="profile.html">
<span>♙</span>
Profile
</a>

</nav>



<script src="supabase.js?v=13"></script>

<script src="app.js?v=13"></script>


<script>

document.addEventListener(
"DOMContentLoaded",
async function(){

"use strict";


const detail =
document.getElementById(
  "detail"
);


/* ==========================================================
   GET AD ID
========================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const adId =
  params.get("id");


if(!adId){

  detail.innerHTML = `

    <div class="not-found">

      <h2>
        বিজ্ঞাপন পাওয়া যায়নি।
      </h2>

      <br>

      <a
        href="search.html"
        class="btn green">

        Marketplace-এ যান →

      </a>

    </div>

  `;

  return;

}



/* ==========================================================
   LOAD EXACT AD FROM SUPABASE
========================================================== */

let ad = null;


try{

  ad =
    await window.getAdById(
      adId
    );

}catch(error){

  console.error(
    "AD DETAILS ERROR:",
    error
  );

}



/* ==========================================================
   NOT FOUND
========================================================== */

if(!ad){

  detail.innerHTML = `

    <div class="not-found">

      <h2>
        বিজ্ঞাপন পাওয়া যায়নি।
      </h2>

      <p>
        এই বিজ্ঞাপনটি বর্তমানে প্রকাশিত নেই
        অথবা বিজ্ঞাপনটি মুছে ফেলা হয়েছে।
      </p>

      <br>

      <a
        href="search.html"
        class="btn green">

        Marketplace-এ ফিরে যান →

      </a>

    </div>

  `;

  return;

}

  /* ==========================================================
   TRACK AD VIEW
========================================================== */

try{

  let viewerKey =
    localStorage.getItem(
      "smbazar_viewer_key"
    );


  if(!viewerKey){

    viewerKey =
      crypto.randomUUID();


    localStorage.setItem(
      "smbazar_viewer_key",
      viewerKey
    );

  }


  const supabaseClient =
    window.supabaseClient;


  if(supabaseClient){

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "track_ad_view",
        {
          p_ad_id: ad.id,
          p_viewer_key: viewerKey
        }
      );


    if(error){

      console.error(
        "VIEW TRACK ERROR:",
        error
      );

    }else{

      console.log(
        "VIEW TRACKED:",
        data
      );

    }

  }


}catch(error){

  console.error(
    "VIEW SYSTEM ERROR:",
    error
  );

}



/* ==========================================================
   VIEW TRACKING
========================================================== */

function getViewerKey(){

  let viewerKey =
    localStorage.getItem(
      "smbazar_viewer_key"
    );


  if(!viewerKey){

    viewerKey =
      crypto.randomUUID
      ?

      crypto.randomUUID()

      :

      Date.now().toString(36) +
      Math.random()
      .toString(36)
      .substring(2);


    localStorage.setItem(
      "smbazar_viewer_key",
      viewerKey
    );

  }


  return viewerKey;

}


try{

  const viewerKey =
    getViewerKey();


  if(
    window.supabaseClient
  ){

    const {
      error
    } =
    await window.supabaseClient.rpc(
      "track_ad_view",
      {
        p_ad_id:
          ad.id,

        p_viewer_key:
          viewerKey
      }
    );


    if(error){

      console.error(
        "VIEW TRACK ERROR:",
        error
      );

    }


    /*
      নতুন view count পাওয়ার জন্য
      আবার ad reload করা হচ্ছে
    */

    const updatedAd =
      await window.getAdById(
        adId
      );


    if(updatedAd){

      ad =
        updatedAd;

    }

  }


}catch(error){

  console.error(
    "VIEW TRACKING ERROR:",
    error
  );

}



/* ==========================================================
   DATA
========================================================== */

const title =
  ad.title ||
  "বিজ্ঞাপন";


const category =
  ad.category ||
  "অন্যান্য";


const subcategory =
  ad.subcategory ||
  "";


const description =
  ad.description ||
  "বিস্তারিত তথ্য দেওয়া হয়নি।";


const location =
  ad.location ||
  "এলাকা উল্লেখ নেই";


const phone =
  String(
    ad.phone ||
    ""
  ).trim();


const seller =
  ad.seller_name ||
  ad.seller ||
  ad.name ||
  ad.seller_email ||
  "বিক্রেতা";


const views =
  Number(
    ad.views || 0
  );



/* ==========================================================
   IMAGES
========================================================== */

let images = [];


if(
  Array.isArray(
    ad.image_urls
  )
){

  images =
    ad.image_urls.filter(
      function(url){

        return String(
          url || ""
        ).trim();

      }
    );

}


else if(
  typeof ad.image_urls ===
  "string"
){

  try{

    const parsed =
      JSON.parse(
        ad.image_urls
      );


    if(
      Array.isArray(parsed)
    ){

      images =
        parsed.filter(
          function(url){

            return String(
              url || ""
            ).trim();

          }
        );

    }

  }catch(error){

    if(
      ad.image_urls.trim()
    ){

      images = [
        ad.image_urls
      ];

    }

  }

}



/* ==========================================================
   GALLERY
========================================================== */

let gallery = "";


if(images.length){

  gallery = `

    <div class="gallery">

      ${
        images.map(
          function(url,index){

            return `

              <img
                src="${escapeHtml(url)}"
                alt="${escapeHtml(title)}"
                loading="${
                  index === 0
                  ? "eager"
                  : "lazy"
                }"
                onerror="
                  this.style.display='none'
                "
              >

            `;

          }
        ).join("")
      }

    </div>

  `;

}



/* ==========================================================
   PHONE
========================================================== */

const cleanPhone =
  phone.replace(
    /[^0-9+]/g,
    ""
  );


let phoneArea = "";


if(phone){

  phoneArea = `

    <div class="phone-number">

      📞 ${escapeHtml(phone)}

    </div>


    <div class="actions">

      <button
        id="copyPhone"
        class="btn"
        type="button">

        📋 নম্বর কপি করুন

      </button>


      <a
        class="btn green"
        href="tel:${escapeHtml(cleanPhone)}">

        ☎ কল করুন

      </a>

    </div>


    <div
      id="copyMessage"
      class="copy-message">
    </div>

  `;

}else{

  phoneArea = `

    <p class="muted">

      বিক্রেতা কোনো ফোন নম্বর দেননি।

    </p>

  `;

}



/* ==========================================================
   RENDER
========================================================== */

detail.innerHTML = `

  ${gallery}


  <span class="category-badge">

    ${escapeHtml(category)}

  </span>


  ${
    subcategory

    ?

    `<span class="subcategory">

      • ${escapeHtml(subcategory)}

    </span>`

    :

    ""
  }


  <h1 class="detail-title">

    ${escapeHtml(title)}

  </h1>


  <div class="detail-price">

    ${money(ad.price)}

  </div>


  <div class="view-count">

    👁 ${views} বার দেখা হয়েছে

  </div>



  <div class="info-grid">


    <div class="info-box">

      <small>
        📍 এলাকা
      </small>

      <strong>
        ${escapeHtml(location)}
      </strong>

    </div>


    <div class="info-box">

      <small>
        🏷️ ক্যাটাগরি
      </small>

      <strong>
        ${escapeHtml(category)}
      </strong>

    </div>


    ${
      subcategory

      ?

      `

      <div class="info-box">

        <small>
          ▦ সাব-ক্যাটাগরি
        </small>

        <strong>
          ${escapeHtml(subcategory)}
        </strong>

      </div>

      `

      :

      ""
    }


    <div class="info-box">

      <small>
        ✓ STATUS
      </small>

      <strong>
        প্রকাশিত
      </strong>

    </div>


  </div>



  <div class="description-section">

    <h3>
      পণ্যের বিস্তারিত
    </h3>

    <div class="description">

      ${escapeHtml(description)}

    </div>

  </div>



  <div class="seller-box">

    <h3>
      বিক্রেতার সাথে যোগাযোগ
    </h3>


    <div class="seller-name">

      ${escapeHtml(seller)}

    </div>


    ${phoneArea}


  </div>



  <br>


  <a
    class="btn"
    href="chat.html?id=${encodeURIComponent(
      ad.id
    )}">

    💬 বিক্রেতাকে মেসেজ করুন

  </a>

`;



/* ==========================================================
   COPY PHONE
========================================================== */

const copyButton =
  document.getElementById(
    "copyPhone"
  );


if(copyButton){

  copyButton.addEventListener(
    "click",
    async function(){

      const copyMessage =
        document.getElementById(
          "copyMessage"
        );


      try{

        await navigator.clipboard.writeText(
          phone
        );


        copyMessage.textContent =
          "✓ মোবাইল নম্বর কপি হয়েছে";

        copyButton.textContent =
          "✓ কপি হয়েছে";


      }catch(error){

        try{

          const input =
            document.createElement(
              "input"
            );


          input.value =
            phone;


          document.body.appendChild(
            input
          );


          input.select();


          document.execCommand(
            "copy"
          );


          input.remove();


          copyMessage.textContent =
            "✓ মোবাইল নম্বর কপি হয়েছে";


          copyButton.textContent =
            "✓ কপি হয়েছে";


        }catch(e){

          copyMessage.textContent =
            "নম্বর: " + phone;

        }

      }

    }
  );

}


});

</script>


</body>

</html>
