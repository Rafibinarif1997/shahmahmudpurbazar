<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>বিজ্ঞাপনের বিস্তারিত</title><link rel="stylesheet" href="style.css"></head><body><main class="container" style="padding:35px 0"><a href="index.html" class="brand"><b>শাহমাহমুদপুর</b><strong>বাজার</strong></a><div id="detail" class="authbox" style="margin-top:28px"></div></main><script src="app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{let id=new URLSearchParams(location.search).get("id"),a=ads().find(x=>x.id===id);if(!a){detail.innerHTML="<h2>বিজ্ঞাপন পাওয়া যায়নি।</h2>";return}detail.innerHTML=`<span class="eyebrow">${escapeHtml(a.category)}</span><h1 style="font-size:30px">${escapeHtml(a.title)}</h1><div class="price" style="font-size:24px">${money(a.price)}</div><p class="muted" style="line-height:1.8">${escapeHtml(a.description||"বিস্তারিত তথ্য নেই।")}</p><p class="muted">⌖ ${escapeHtml(a.location)}</p><hr style="border-color:#18251e"><h3>বিক্রেতা</h3><p>${escapeHtml(a.seller||"Seller")}</p><a class="btn green" href="${a.phone?"tel:"+a.phone:"#"}">☎ যোগাযোগ করুন</a><a class="btn" href="messages.html?id=${encodeURIComponent(a.id)}">💬 Message</a>`})</script></body></html>
