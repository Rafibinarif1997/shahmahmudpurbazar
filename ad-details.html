<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>বিজ্ঞাপনের বিস্তারিত | শাহমাহমুদপুর বাজার</title>

<link
  rel="stylesheet"
  href="style.css">

<style>

/* ==========================================================
   PREMIUM AD DETAILS PAGE
========================================================== */

:root{
  --page-bg:#f4f8f6;
  --card:#ffffff;
  --card-soft:#f8fbf9;
  --border:#dfe9e3;
  --border-strong:#cfe0d6;

  --text:#17271f;
  --text-secondary:#405248;
  --muted:#63746b;

  --green:#087443;
  --green-dark:#075d35;
  --green-soft:#e7f6ed;

  --blue:#1769e0;
  --blue-dark:#1056bd;
}


/* ==========================================================
   BASE
========================================================== */

body{
  background:var(--page-bg);
  color:var(--text);
}


/* ==========================================================
   PAGE
========================================================== */

.detail-page{
  width:100%;
  max-width:1280px;
  margin:0 auto;
  padding:30px 24px 120px;
}


/* ==========================================================
   PREMIUM BRAND
========================================================== */

.detail-page .brand{

  position:relative;

  display:inline-flex;

  align-items:center;

  gap:5px;

  margin-bottom:26px;

  padding:13px 19px 13px 17px;

  border-radius:17px;

  text-decoration:none;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #f2faf5
    );

  border:1px solid #d5e8dc;

  box-shadow:
    0 8px 25px
    rgba(15,90,50,.08);

  overflow:hidden;

}


.detail-page .brand::before{

  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:5px;

  background:
    linear-gradient(
      180deg,
      #0a8d51,
      #47c97d
    );

}


.detail-page .brand b{

  position:relative;

  color:#075d35;

  font-size:19px;

  font-weight:950;

  letter-spacing:-.4px;

  text-shadow:
    0 1px 0
    rgba(255,255,255,.9);

}


.detail-page .brand strong{

  position:relative;

  color:#16834e;

  font-size:19px;

  font-weight:950;

}


.detail-page .brand small{

  position:relative;

  display:block;

  width:100%;

  margin-left:7px;

  padding-left:9px;

  border-left:1px solid #cfe2d7;

  color:#65776d;

  font-size:9px;

  font-weight:800;

  letter-spacing:.2px;

}


/* ==========================================================
   MAIN DETAIL CARD
========================================================== */

.detail-box{

  position:relative;

  width:100%;

  box-sizing:border-box;

  margin-top:0;

  padding:28px;

  overflow:hidden;

  border:1px solid var(--border);

  border-radius:28px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(40,180,100,.10),
      transparent 30%
    ),
    linear-gradient(
      145deg,
      #ffffff 0%,
      #fbfdfc 100%
    );

  box-shadow:
    0 18px 60px rgba(20,70,45,.08);

}


.detail-box::before{

  content:"";

  position:absolute;

  width:340px;
  height:340px;

  top:-230px;
  right:-170px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(65,190,115,.11),
      transparent 70%
    );

  pointer-events:none;

}


/* ==========================================================
   LOADING / NOT FOUND
========================================================== */

.loading-box,
.not-found{

  padding:90px 20px;

  text-align:center;

  color:#52645a;

  font-size:15px;

  font-weight:750;

}


.not-found h2{

  margin:0;

  color:#17271f;

  font-size:25px;

  font-weight:950;

}


.not-found p{

  margin:12px auto 0;

  max-width:430px;

  color:#53645b;

  font-size:14px;

  font-weight:600;

  line-height:1.8;

}


/* ==========================================================
   DESKTOP MAIN LAYOUT
========================================================== */

@media(min-width:901px){

  .detail-box{

    display:grid;

    grid-template-columns:
      minmax(0,1.35fr)
      minmax(360px,.9fr);

    column-gap:32px;

    row-gap:0;

    align-items:start;

  }


  .gallery{

    grid-column:1;

    grid-row:1 / span 6;

    margin:0;

    position:sticky;

    top:24px;

  }


  .category-badge{

    grid-column:2;

  }


  .subcategory{

    grid-column:2;

  }


  .detail-title{

    grid-column:2;

  }


  .detail-price{

    grid-column:2;

  }


  .view-count{

    grid-column:2;

  }


  .info-grid{

    grid-column:1 / -1;

  }


  .description-section{

    grid-column:1;

    align-self:stretch;

  }


  .seller-box{

    grid-column:2;

    margin-top:26px;

    align-self:start;

  }


  .detail-box > br{

    display:none;

  }


  .detail-box > .btn:last-child{

    grid-column:1 / -1;

    margin-top:26px;

  }

}


/* ==========================================================
   IMAGE GALLERY
========================================================== */

.gallery{

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:10px;

  margin-bottom:26px;

}


.gallery img{

  width:100%;

  aspect-ratio:1;

  display:block;

  object-fit:cover;

  border-radius:16px;

  border:1px solid var(--border);

  background:#eef4f0;

  cursor:zoom-in;

  transition:
    transform .25s ease,
    box-shadow .25s ease;

}


.gallery img:hover{

  transform:scale(1.015);

  box-shadow:
    0 14px 30px
    rgba(20,70,45,.13);

}


.gallery img:first-child{

  grid-column:1 / -1;

  aspect-ratio:16 / 9;

  border-radius:20px;

}


/* ==========================================================
   IMAGE FULLSCREEN LIGHTBOX
========================================================== */

.image-lightbox{

  position:fixed;

  inset:0;

  z-index:99999;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  box-sizing:border-box;

  background:rgba(0,0,0,.94);

}


.image-lightbox.active{

  display:flex;

}


.image-lightbox-content{

  position:relative;

  width:100%;

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

}


.image-lightbox img{

  max-width:100%;

  max-height:100%;

  width:auto;

  height:auto;

  display:block;

  object-fit:contain;

  border-radius:8px;

  user-select:none;

  -webkit-user-select:none;

}


.lightbox-close{

  position:absolute;

  top:10px;

  right:10px;

  z-index:3;

  width:46px;

  height:46px;

  border:0;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:rgba(255,255,255,.16);

  color:#fff;

  font-size:28px;

  line-height:1;

  cursor:pointer;

  backdrop-filter:blur(8px);

}


.lightbox-close:hover{

  background:rgba(255,255,255,.28);

}


.lightbox-nav{

  position:absolute;

  top:50%;

  transform:translateY(-50%);

  z-index:3;

  width:52px;

  height:52px;

  border:0;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:rgba(255,255,255,.16);

  color:#fff;

  font-size:34px;

  cursor:pointer;

  backdrop-filter:blur(8px);

}


.lightbox-nav:hover{

  background:rgba(255,255,255,.28);

}


.lightbox-prev{

  left:12px;

}


.lightbox-next{

  right:12px;

}


.lightbox-counter{

  position:absolute;

  left:50%;

  bottom:18px;

  transform:translateX(-50%);

  z-index:3;

  padding:8px 14px;

  border-radius:100px;

  background:rgba(0,0,0,.5);

  color:#fff;

  font-size:13px;

  font-weight:800;

  backdrop-filter:blur(8px);

}


body.lightbox-open{

  overflow:hidden;

}


/* ==========================================================
   CATEGORY
========================================================== */

.category-badge{

  display:inline-flex;

  align-items:center;

  width:max-content;

  max-width:100%;

  padding:8px 13px;

  border-radius:100px;

  background:var(--green-soft);

  border:1px solid #cde8d7;

  color:#076239;

  font-size:11px;

  font-weight:950;

  letter-spacing:.2px;

}


.subcategory{

  display:inline-block;

  margin-left:8px;

  color:#52645a;

  font-size:12px;

  font-weight:800;

}


/* ==========================================================
   PREMIUM PRODUCT TITLE
========================================================== */

.detail-title{

  position:relative;

  max-width:100%;

  margin:18px 0 14px;

  padding-bottom:17px;

  color:#14251c;

  font-size:35px;

  font-weight:950;

  line-height:1.32;

  letter-spacing:-.8px;

  border-bottom:1px solid #e2ebe6;

}


.detail-title::after{

  content:"";

  position:absolute;

  left:0;

  bottom:-1px;

  width:68px;

  height:4px;

  border-radius:100px;

  background:
    linear-gradient(
      90deg,
      #087443,
      #54c985
    );

}


/* ==========================================================
   PRICE
========================================================== */

.detail-price{

  display:inline-flex;

  align-items:center;

  width:max-content;

  margin-top:2px;

  padding:11px 17px;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #e4f8ec,
      #f5fcf7
    );

  border:1px solid #d1ebda;

  color:#087443;

  font-size:26px;

  font-weight:950;

  box-shadow:
    0 5px 14px
    rgba(8,116,67,.06);

}


/* ==========================================================
   VIEW COUNT - RED
========================================================== */

.view-count{

  display:inline-flex;

  align-items:center;

  margin-top:16px;

  padding:9px 13px;

  border-radius:10px;

  background:#fff4f4;

  border:1px solid #ffe0e0;

  color:#d93636;

  font-size:12px;

  font-weight:850;

}


/* ==========================================================
   INFO GRID
========================================================== */

.info-grid{

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:12px;

  margin:30px 0 4px;

}


.info-box{

  position:relative;

  min-height:82px;

  padding:16px;

  box-sizing:border-box;

  overflow:hidden;

  border:1px solid var(--border);

  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #fafcfb
    );

  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;

}


.info-box:hover{

  transform:translateY(-3px);

  border-color:#c5dfd0;

  box-shadow:
    0 10px 25px
    rgba(20,70,45,.07);

}


.info-box small{

  display:block;

  margin-bottom:9px;

  color:#607268;

  font-size:10px;

  font-weight:900;

  letter-spacing:.4px;

}


.info-box strong{

  display:block;

  color:#21352a;

  font-size:14px;

  font-weight:850;

  line-height:1.5;

  word-break:break-word;

}


/* ==========================================================
   DESCRIPTION
========================================================== */

.description-section{

  margin-top:28px;

  padding:26px;

  box-sizing:border-box;

  border:1px solid var(--border);

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #fbfdfc
    );

}


.description-section h3{

  display:flex;

  align-items:center;

  gap:10px;

  margin:0 0 18px;

  color:#193027;

  font-size:20px;

  font-weight:950;

}


.description-section h3::before{

  content:"";

  width:5px;
  height:25px;

  flex:none;

  border-radius:10px;

  background:
    linear-gradient(
      180deg,
      #087443,
      #55ca8a
    );

}


.description{

  color:#354b3f;

  font-size:16px;

  font-weight:600;

  line-height:2;

  white-space:pre-wrap;

  letter-spacing:.05px;

}


/* ==========================================================
   SELLER BOX
========================================================== */

.seller-box{

  position:relative;

  margin-top:28px;

  padding:24px;

  box-sizing:border-box;

  overflow:hidden;

  border:1px solid #d1e7da;

  border-radius:20px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(70,190,115,.12),
      transparent 45%
    ),
    linear-gradient(
      145deg,
      #f8fcf9,
      #ffffff
    );

}


.seller-box::after{

  content:"";

  position:absolute;

  width:150px;
  height:150px;

  right:-65px;
  bottom:-80px;

  border-radius:50%;

  border:1px solid rgba(30,150,85,.12);

}


.seller-box h3{

  position:relative;

  z-index:1;

  margin:0 0 18px;

  color:#193027;

  font-size:20px;

  font-weight:950;

}


.seller-name{

  position:relative;

  z-index:1;

  display:flex;

  align-items:center;

  gap:11px;

  color:#20352a;

  font-size:16px;

  font-weight:900;

}


.seller-name::before{

  content:"♙";

  width:38px;
  height:38px;

  flex:none;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#e0f4e8;

  color:#087443;

  font-size:18px;

}


.phone-number{

  position:relative;

  z-index:1;

  display:inline-flex;

  align-items:center;

  margin:20px 0;

  padding:13px 16px;

  border-radius:13px;

  background:#ffffff;

  border:1px solid #cfe5d7;

  color:#087443;

  font-size:20px;

  font-weight:950;

  letter-spacing:.3px;

}


/* ==========================================================
   ACTIONS
========================================================== */

.actions{

  position:relative;

  z-index:1;

  display:flex;

  gap:10px;

  flex-wrap:wrap;

}


.actions .btn{

  flex:1;

  min-width:145px;

  text-align:center;

}


#copyPhone{

  background:#ffffff;

  color:#263d31;

  border:1px solid #cbded3;

  font-weight:900;

}


#copyPhone:hover{

  background:#f1f8f4;

  border-color:#9bc9ae;

}


.copy-message{

  position:relative;

  z-index:1;

  min-height:18px;

  margin-top:13px;

  color:#087443;

  font-size:11px;

  font-weight:850;

  text-align:center;

}


/* ==========================================================
   MESSAGE BUTTON - BLUE
========================================================== */

.detail-box > .btn:last-child{

  display:flex;

  align-items:center;

  justify-content:center;

  width:100%;

  box-sizing:border-box;

  margin-top:28px;

  padding:16px 20px;

  border-radius:15px;

  text-align:center;

  background:
    linear-gradient(
      135deg,
      #2378ee,
      #105dcc
    );

  border:1px solid #0e58bf;

  color:#ffffff;

  font-size:15px;

  font-weight:950;

  text-decoration:none;

  box-shadow:
    0 10px 24px
    rgba(23,105,224,.22);

  transition:
    transform .2s ease,
    box-shadow .2s ease;

}


.detail-box > .btn:last-child:hover{

  transform:translateY(-2px);

  box-shadow:
    0 14px 30px
    rgba(23,105,224,.3);

}


/* ==========================================================
   TABLET
========================================================== */

@media(max-width:1100px){

  .detail-page{

    max-width:980px;

  }


  .info-grid{

    grid-template-columns:
      repeat(2,minmax(0,1fr));

  }

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:900px){

  .detail-page{

    max-width:760px;

    padding:
      20px 14px
      110px;

  }


  .detail-page .brand{

    margin-bottom:18px;

    padding:11px 15px 11px 14px;

  }


  .detail-page .brand b,
  .detail-page .brand strong{

    font-size:16px;

  }


  .detail-page .brand small{

    font-size:8px;

  }


  .detail-box{

    padding:18px;

    border-radius:22px;

  }


  .gallery{

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:9px;

    margin-bottom:20px;

  }


  .gallery img{

    border-radius:13px;

  }


  .gallery img:first-child{

    grid-column:1 / -1;

    aspect-ratio:4 / 3;

    border-radius:17px;

  }


  .detail-title{

    margin-top:16px;

    padding-bottom:14px;

    font-size:29px;

    line-height:1.34;

  }


  .detail-price{

    padding:10px 14px;

    font-size:23px;

  }


  .view-count{

    margin-top:14px;

    font-size:11px;

  }


  .info-grid{

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:9px;

    margin:22px 0;

  }


  .info-box{

    min-height:75px;

    padding:14px;

    border-radius:14px;

  }


  .description-section{

    margin-top:22px;

    padding:21px;

    border-radius:18px;

  }


  .description-section h3{

    font-size:18px;

  }


  .description{

    font-size:15px;

    line-height:1.9;

  }


  .seller-box{

    margin-top:20px;

    padding:20px;

    border-radius:18px;

  }


  .seller-box h3{

    font-size:18px;

  }

}


/* ==========================================================
   SMALL MOBILE
========================================================== */

@media(max-width:600px){

  .detail-page{

    padding:
      16px 12px
      105px;

  }


  .detail-page .brand{

    gap:3px;

    padding:10px 13px 10px 13px;

    border-radius:14px;

  }


  .detail-page .brand b,
  .detail-page .brand strong{

    font-size:14px;

  }


  .detail-page .brand small{

    display:none;

  }


  .detail-box{

    padding:15px;

    border-radius:19px;

  }


  .gallery{

    gap:8px;

    margin-bottom:18px;

  }


  .gallery img:first-child{

    aspect-ratio:4 / 3;

    border-radius:15px;

  }


  .category-badge{

    padding:7px 11px;

    font-size:10px;

  }


  .subcategory{

    margin-left:6px;

    font-size:10px;

  }


  .detail-title{

    margin:15px 0 12px;

    padding-bottom:13px;

    font-size:25px;

    line-height:1.38;

    letter-spacing:-.4px;

  }


  .detail-title::after{

    width:52px;

    height:3px;

  }


  .detail-price{

    padding:9px 12px;

    font-size:20px;

    border-radius:11px;

  }


  .view-count{

    margin-top:12px;

    padding:8px 11px;

    font-size:10px;

  }


  .info-grid{

    grid-template-columns:1fr;

    gap:8px;

    margin:18px 0;

  }


  .info-box{

    min-height:auto;

    padding:14px;

    border-radius:13px;

  }


  .info-box small{

    margin-bottom:7px;

    font-size:9px;

  }


  .info-box strong{

    font-size:13px;

  }


  .description-section{

    margin-top:19px;

    padding:18px;

    border-radius:16px;

  }


  .description-section h3{

    margin-bottom:14px;

    font-size:17px;

  }


  .description-section h3::before{

    width:4px;

    height:21px;

  }


  .description{

    font-size:14px;

    font-weight:600;

    line-height:2;

  }


  .seller-box{

    margin-top:18px;

    padding:19px 17px;

    border-radius:17px;

  }


  .seller-box h3{

    margin-bottom:15px;

    font-size:17px;

  }


  .seller-name{

    font-size:14px;

  }


  .seller-name::before{

    width:33px;
    height:33px;

    font-size:15px;

  }


  .phone-number{

    width:100%;

    justify-content:center;

    box-sizing:border-box;

    margin:17px 0;

    font-size:17px;

  }


  .actions{

    flex-direction:column;

  }


  .actions .btn{

    width:100%;

    flex:none;

    font-size:14px;

    font-weight:900;

  }


  .detail-box > .btn:last-child{

    margin-top:22px;

    padding:15px 16px;

    font-size:14px;

  }


  .image-lightbox{

    padding:10px;

  }


  .lightbox-close{

    top:5px;

    right:5px;

    width:42px;

    height:42px;

    font-size:25px;

  }


  .lightbox-nav{

    width:44px;

    height:44px;

    font-size:28px;

  }


  .lightbox-prev{

    left:4px;

  }


  .lightbox-next{

    right:4px;

  }


  .lightbox-counter{

    bottom:10px;

    font-size:11px;

    padding:7px 12px;

  }

}

</style>

</head>


<body>


<main class="container detail-page">


<a
  href="index.html"
  class="brand">

  <b>শাহমাহমুদপুর</b>

  <strong>বাজার</strong>

  <small>
    স্থানীয় অনলাইন বাজার
  </small>

</a>


<div
  id="detail"
  class="authbox detail-box">

  <div class="loading-box">

    বিজ্ঞাপনের তথ্য লোড হচ্ছে...

  </div>

</div>


</main>


<nav class="mobile-nav">

<script src="supabase.js?v=13"></script>

<script src="app.js?v=13"></script>


<script>

document.addEventListener(
"DOMContentLoaded",
async function(){

"use strict";


const detail =
document.getElementById(
  "detail"
);


/* ==========================================================
   GET AD ID
========================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const adId =
  params.get("id");


if(!adId){

  detail.innerHTML = `

    <div class="not-found">

      <h2>
        বিজ্ঞাপন পাওয়া যায়নি।
      </h2>

      <br>

      <a
        href="search.html"
        class="btn green">

        Marketplace-এ যান →

      </a>

    </div>

  `;

  return;

}


/* ==========================================================
   LOAD EXACT AD FROM SUPABASE
========================================================== */

let ad = null;


try{

  ad =
    await window.getAdById(
      adId
    );

}catch(error){

  console.error(
    "AD DETAILS ERROR:",
    error
  );

}


/* ==========================================================
   NOT FOUND
========================================================== */

if(!ad){

  detail.innerHTML = `

    <div class="not-found">

      <h2>
        বিজ্ঞাপন পাওয়া যায়নি।
      </h2>

      <p>
        এই বিজ্ঞাপনটি বর্তমানে প্রকাশিত নেই
        অথবা বিজ্ঞাপনটি মুছে ফেলা হয়েছে।
      </p>

      <br>

      <a
        href="search.html"
        class="btn green">

        Marketplace-এ ফিরে যান →

      </a>

    </div>

  `;

  return;

}


/* ==========================================================
   TRACK AD VIEW
========================================================== */

(function(){

  try{

    let viewerKey =
      localStorage.getItem(
        "smbazar_viewer_key"
      );


    if(!viewerKey){

      viewerKey =
        crypto.randomUUID();


      localStorage.setItem(
        "smbazar_viewer_key",
        viewerKey
      );

    }


    window.sbFetch(
      "/rest/v1/rpc/track_ad_view",
      {
        method:"POST",

        body:JSON.stringify({

          p_ad_id:ad.id,

          p_viewer_key:viewerKey

        })

      }
    )

    .then(function(result){

      console.log(
        "VIEW TRACKED:",
        result
      );

    })

    .catch(function(error){

      console.error(
        "VIEW TRACK ERROR:",
        error
      );

    });


  }catch(error){

    console.error(
      "VIEW SYSTEM ERROR:",
      error
    );

  }

})();


/* ==========================================================
   DATA
========================================================== */

const title =
  ad.title ||
  "বিজ্ঞাপন";


const category =
  ad.category ||
  "অন্যান্য";


const subcategory =
  ad.subcategory ||
  "";


const description =
  ad.description ||
  "বিস্তারিত তথ্য দেওয়া হয়নি।";


const location =
  ad.location ||
  "এলাকা উল্লেখ নেই";


const phone =
  String(
    ad.phone ||
    ""
  ).trim();


const seller =
  ad.seller_name ||
  ad.seller ||
  ad.name ||
  ad.seller_email ||
  "বিক্রেতা";


const views =
  Number(
    ad.views || 0
  );


/* ==========================================================
   IMAGES
========================================================== */

let images = [];


if(
  Array.isArray(
    ad.image_urls
  )
){

  images =
    ad.image_urls.filter(
      function(url){

        return String(
          url || ""
        ).trim();

      }
    );

}


else if(
  typeof ad.image_urls ===
  "string"
){

  try{

    const parsed =
      JSON.parse(
        ad.image_urls
      );


    if(
      Array.isArray(parsed)
    ){

      images =
        parsed.filter(
          function(url){

            return String(
              url || ""
            ).trim();

          }
        );

    }

  }catch(error){

    if(
      ad.image_urls.trim()
    ){

      images = [
        ad.image_urls
      ];

    }

  }

}


/* ==========================================================
   GALLERY
========================================================== */

let gallery = "";


if(images.length){

  gallery = `

    <div class="gallery">

      ${
        images.map(
          function(url,index){

            return `

              <img
                src="${escapeHtml(url)}"
                alt="${escapeHtml(title)}"
                loading="${
                  index === 0
                  ? "eager"
                  : "lazy"
                }"
                data-image-index="${index}"
                onclick="window.openAdImage(${index})"
                onerror="
                  this.style.display='none'
                "
              >

            `;

          }
        ).join("")
      }

    </div>

  `;

}


/* ==========================================================
   PHONE
========================================================== */

const cleanPhone =
  phone.replace(
    /[^0-9+]/g,
    ""
  );


let phoneArea = "";


if(phone){

  phoneArea = `

    <div class="phone-number">

      📞 ${escapeHtml(phone)}

    </div>


    <div class="actions">

      <button
        id="copyPhone"
        class="btn"
        type="button">

        📋 নম্বর কপি করুন

      </button>


      <a
        class="btn green"
        href="tel:${escapeHtml(cleanPhone)}">

        ☎ কল করুন

      </a>

    </div>


    <div
      id="copyMessage"
      class="copy-message">
    </div>

  `;

}else{

  phoneArea = `

    <p class="muted">

      বিক্রেতা কোনো ফোন নম্বর দেননি।

    </p>

  `;

}


/* ==========================================================
   RENDER
========================================================== */

detail.innerHTML = `

  ${gallery}


  <span class="category-badge">

    ${escapeHtml(category)}

  </span>


  ${
    subcategory

    ?

    `<span class="subcategory">

      • ${escapeHtml(subcategory)}

    </span>`

    :

    ""
  }


  <h1 class="detail-title">

    ${escapeHtml(title)}

  </h1>


  <div class="detail-price">

    ${money(ad.price)}

  </div>


  <div class="view-count">

    👁 ${views} বার দেখা হয়েছে

  </div>



  <div class="info-grid">


    <div class="info-box">

      <small>
        📍 এলাকা
      </small>

      <strong>
        ${escapeHtml(location)}
      </strong>

    </div>


    <div class="info-box">

      <small>
        🏷️ ক্যাটাগরি
      </small>

      <strong>
        ${escapeHtml(category)}
      </strong>

    </div>


    ${
      subcategory

      ?

      `

      <div class="info-box">

        <small>
          ▦ সাব-ক্যাটাগরি
        </small>

        <strong>
          ${escapeHtml(subcategory)}
        </strong>

      </div>

      `

      :

      ""
    }


    <div class="info-box">

      <small>
        ✓ STATUS
      </small>

      <strong>
        প্রকাশিত
      </strong>

    </div>


  </div>



  <div class="description-section">

    <h3>
      পণ্যের বিস্তারিত
    </h3>

    <div class="description">

      ${escapeHtml(description)}

    </div>

  </div>



  <div class="seller-box">

    <h3>
      বিক্রেতার সাথে যোগাযোগ
    </h3>


    <div class="seller-name">

      ${escapeHtml(seller)}

    </div>


    ${phoneArea}


  </div>



  <br>


  <a
    class="btn"
    href="chat.html?id=${encodeURIComponent(
      ad.id
    )}">

    💬 বিক্রেতাকে মেসেজ করুন

  </a>

`;


/* ==========================================================
   IMAGE FULLSCREEN LIGHTBOX
========================================================== */

const lightboxImages =
  images.slice();


let currentImageIndex =
  0;


const lightbox =
  document.createElement(
    "div"
  );


lightbox.className =
  "image-lightbox";


lightbox.id =
  "imageLightbox";


lightbox.innerHTML = `

  <div class="image-lightbox-content">


    <button
      type="button"
      class="lightbox-close"
      aria-label="বন্ধ করুন">

      ×

    </button>


    <button
      type="button"
      class="lightbox-nav lightbox-prev"
      aria-label="আগের ছবি">

      ‹

    </button>


    <img
      id="lightboxImage"
      src=""
      alt="পূর্ণ ছবি"
    >


    <button
      type="button"
      class="lightbox-nav lightbox-next"
      aria-label="পরের ছবি">

      ›

    </button>


    <div
      id="lightboxCounter"
      class="lightbox-counter">

    </div>


  </div>

`;


document.body.appendChild(
  lightbox
);


const lightboxImage =
  document.getElementById(
    "lightboxImage"
  );


const lightboxCounter =
  document.getElementById(
    "lightboxCounter"
  );


const lightboxPrev =
  lightbox.querySelector(
    ".lightbox-prev"
  );


const lightboxNext =
  lightbox.querySelector(
    ".lightbox-next"
  );


const lightboxClose =
  lightbox.querySelector(
    ".lightbox-close"
  );


function showLightboxImage(index){

  if(
    !lightboxImages.length
  ){

    return;

  }


  if(index < 0){

    index =
      lightboxImages.length - 1;

  }


  if(
    index >= lightboxImages.length
  ){

    index = 0;

  }


  currentImageIndex =
    index;


  lightboxImage.src =
    lightboxImages[
      currentImageIndex
    ];


  lightboxImage.alt =
    title +
    " - ছবি " +
    (
      currentImageIndex + 1
    );


  lightboxCounter.textContent =
    (
      currentImageIndex + 1
    ) +
    " / " +
    lightboxImages.length;


  if(
    lightboxImages.length <= 1
  ){

    lightboxPrev.style.display =
      "none";


    lightboxNext.style.display =
      "none";


    lightboxCounter.style.display =
      "none";

  }else{

    lightboxPrev.style.display =
      "flex";


    lightboxNext.style.display =
      "flex";


    lightboxCounter.style.display =
      "block";

  }

}


/* ==========================================================
   OPEN IMAGE
========================================================== */

window.openAdImage =
  function(index){

    currentImageIndex =
      Number(index) || 0;


    showLightboxImage(
      currentImageIndex
    );


    lightbox.classList.add(
      "active"
    );


    document.body.classList.add(
      "lightbox-open"
    );

  };


/* ==========================================================
   CLOSE LIGHTBOX
========================================================== */

function closeLightbox(){

  lightbox.classList.remove(
    "active"
  );


  document.body.classList.remove(
    "lightbox-open"
  );


  setTimeout(
    function(){

      if(
        !lightbox.classList.contains(
          "active"
        )
      ){

        lightboxImage.src =
          "";

      }

    },
    200
  );

}


/* ==========================================================
   CLOSE BUTTON
========================================================== */

lightboxClose.addEventListener(
  "click",
  closeLightbox
);


/* ==========================================================
   PREVIOUS IMAGE
========================================================== */

lightboxPrev.addEventListener(
  "click",
  function(){

    showLightboxImage(
      currentImageIndex - 1
    );

  }
);


/* ==========================================================
   NEXT IMAGE
========================================================== */

lightboxNext.addEventListener(
  "click",
  function(){

    showLightboxImage(
      currentImageIndex + 1
    );

  }
);


/* ==========================================================
   CLOSE OUTSIDE
========================================================== */

lightbox.addEventListener(
  "click",
  function(event){

    if(
      event.target === lightbox
    ){

      closeLightbox();

    }

  }
);


/* ==========================================================
   KEYBOARD
========================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      !lightbox.classList.contains(
        "active"
      )
    ){

      return;

    }


    if(
      event.key === "Escape"
    ){

      closeLightbox();

    }


    if(
      event.key === "ArrowLeft"
    ){

      showLightboxImage(
        currentImageIndex - 1
      );

    }


    if(
      event.key === "ArrowRight"
    ){

      showLightboxImage(
        currentImageIndex + 1
      );

    }

  }
);


/* ==========================================================
   MOBILE SWIPE
========================================================== */

let touchStartX =
  0;


let touchEndX =
  0;


lightbox.addEventListener(
  "touchstart",
  function(event){

    touchStartX =
      event.changedTouches[0].screenX;

  },
  {
    passive:true
  }
);


lightbox.addEventListener(
  "touchend",
  function(event){

    touchEndX =
      event.changedTouches[0].screenX;


    const difference =
      touchEndX -
      touchStartX;


    if(
      Math.abs(difference) < 50
    ){

      return;

    }


    if(difference > 0){

      showLightboxImage(
        currentImageIndex - 1
      );

    }else{

      showLightboxImage(
        currentImageIndex + 1
      );

    }

  },
  {
    passive:true
  }
);


/* ==========================================================
   COPY PHONE
========================================================== */

const copyButton =
  document.getElementById(
    "copyPhone"
  );


if(copyButton){

  copyButton.addEventListener(
    "click",
    async function(){

      const copyMessage =
        document.getElementById(
          "copyMessage"
        );


      try{

        await navigator.clipboard.writeText(
          phone
        );


        copyMessage.textContent =
          "✓ মোবাইল নম্বর কপি হয়েছে";


        copyButton.textContent =
          "✓ কপি হয়েছে";


      }catch(error){

        try{

          const input =
            document.createElement(
              "input"
            );


          input.value =
            phone;


          document.body.appendChild(
            input
          );


          input.select();


          document.execCommand(
            "copy"
          );


          input.remove();


          copyMessage.textContent =
            "✓ মোবাইল নম্বর কপি হয়েছে";


          copyButton.textContent =
            "✓ কপি হয়েছে";


        }catch(e){

          copyMessage.textContent =
            "নম্বর: " + phone;

        }

      }

    }
  );

}


});

</script>


</body>

</html>
