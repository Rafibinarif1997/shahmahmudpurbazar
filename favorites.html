<head>

<meta charset="UTF-8">

<title>
সেভ করা বিজ্ঞাপন | শাহমাহমুদপুর বাজার
</title>

rel="stylesheet"

<style>

/* =========================
   FAVOURITES PAGE
========================= */

body{
  background:#f7faf8;
}


.fav-page{
  padding:22px 16px 115px;
  max-width:1200px;
  margin:auto;
}


/* =========================
   HEADER
========================= */

.fav-hero{

  position:relative;

  overflow:hidden;

  padding:24px 20px;

  margin-bottom:20px;

  border:1px solid rgba(22,137,82,.12);

  border-radius:22px;

  background:

    radial-gradient(
      circle at 100% 0%,
      rgba(105,245,165,.16),
      transparent 42%
    ),

    linear-gradient(
      135deg,
      #ffffff,
      #f1fbf5
    );

  box-shadow:
    0 10px 35px rgba(24,80,52,.06);

}


.fav-hero::after{

  content:"";

  position:absolute;

  width:170px;
  height:170px;

  right:-70px;
  bottom:-90px;

  border-radius:50%;

  border:1px solid rgba(36,173,106,.12);

}


.fav-top{

  display:flex;

  align-items:center;

  gap:14px;

}


.fav-icon{

  width:52px;
  height:52px;

  flex-shrink:0;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:16px;

  background:

    linear-gradient(
      135deg,
      #0d7d4a,
      #21b970
    );

  color:#fff;

  font-size:25px;

  box-shadow:
    0 10px 22px rgba(20,150,86,.20);

}


.fav-heading h1{

  margin:0;

  color:#22342b;

  font-size:24px;

  font-weight:900;

  letter-spacing:-.4px;

}


.fav-heading p{

  margin:5px 0 0;

  color:#718078;

  font-size:11px;

  line-height:1.5;

}


/* =========================
   SAVED COUNT
========================= */

.fav-info{

  display:inline-flex;

  align-items:center;

  gap:7px;

  margin-top:18px;

  padding:8px 12px;

  border-radius:100px;

  background:#eaf8f0;

  color:#168451;

  font-size:10px;

  font-weight:800;

}


/* =========================
   PRODUCT GRID
========================= */

.products{

  display:grid;

  grid-template-columns:
  repeat(
    auto-fill,
    minmax(220px,1fr)
  );

  gap:16px;

}


/* =========================
   PRODUCT CARD
========================= */

.product{

  position:relative;

  overflow:hidden;

  border:1px solid #e5ece8;

  border-radius:18px;

  background:#fff;

  box-shadow:
    0 5px 20px rgba(20,50,35,.045);

  transition:
    transform .22s ease,
    box-shadow .22s ease;

}


.product:hover{

  transform:
    translateY(-3px);

  box-shadow:
    0 14px 32px rgba(20,70,45,.10);

}


/* =========================
   IMAGE
========================= */

.photo{

  position:relative;

  width:100%;

  height:190px;

  overflow:hidden;

  background:#eef3f0;

}


.ad-image{

  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  transition:
    transform .35s ease;

}


.product:hover .ad-image{

  transform:scale(1.04);

}


.ad-image-placeholder{

  display:flex;

  align-items:center;
  justify-content:center;

  background:

    linear-gradient(
      135deg,
      #eff8f3,
      #dff3e7
    );

  color:#168451;

  font-size:13px;

  font-weight:800;

}


/* =========================
   REMOVE HEART
========================= */

.fav-remove{

  position:absolute;

  top:10px;
  right:10px;

  z-index:20;

  width:38px;
  height:38px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:0;

  border-radius:50%;

  background:
    rgba(255,255,255,.96);

  color:#ed3e5f;

  font-size:18px;

  cursor:pointer;

  box-shadow:
    0 5px 15px rgba(0,0,0,.12);

  transition:
    transform .2s ease;

}


.fav-remove:active{

  transform:scale(.9);

}


/* =========================
   CARD BODY
========================= */

.product .body{

  padding:14px 14px 15px;

}


.badge{

  display:inline-flex;

  align-items:center;

  max-width:100%;

  padding:5px 9px;

  margin-bottom:8px;

  overflow:hidden;

  border-radius:7px;

  background:#edf8f1;

  color:#178652;

  font-size:9px;

  font-weight:800;

  white-space:nowrap;

  text-overflow:ellipsis;

}


.product h3{

  margin:0;

  min-height:42px;

  overflow:hidden;

  color:#27362e;

  font-size:15px;

  font-weight:850;

  line-height:1.45;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

}


.price{

  margin-top:11px;

  color:#0d7d4a;

  font-size:18px;

  font-weight:900;

}


.meta{

  display:flex;

  align-items:center;

  gap:4px;

  margin-top:7px;

  overflow:hidden;

  color:#87928c;

  font-size:10px;

  white-space:nowrap;

  text-overflow:ellipsis;

}


/* =========================
   LOADING
========================= */

.fav-loading{

  grid-column:1/-1;

  padding:65px 20px;

  text-align:center;

  border:1px solid #e5ece8;

  border-radius:20px;

  background:#fff;

  color:#7d8982;

  font-size:12px;

}


/* =========================
   EMPTY STATE
========================= */

.fav-empty{

  grid-column:1/-1;

  padding:65px 20px;

  text-align:center;

  border:1px dashed #cfe0d6;

  border-radius:22px;

  background:#fff;

}


.fav-empty-icon{

  width:64px;
  height:64px;

  margin:0 auto 16px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:20px;

  background:#edf8f1;

  color:#159052;

  font-size:30px;

}


.fav-empty h3{

  margin:0 0 7px;

  color:#26372e;

  font-size:17px;

  font-weight:850;

}


.fav-empty p{

  max-width:280px;

  margin:auto;

  color:#829088;

  font-size:11px;

  line-height:1.7;

}


.fav-empty a{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  margin-top:18px;

  padding:11px 18px;

  border-radius:11px;

  background:#11834c;

  color:#fff;

  font-size:11px;

  font-weight:800;

  text-decoration:none;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .fav-page{
    padding:
      18px 12px
      105px;
  }


  .fav-hero{

    padding:
      19px 16px;

    margin-bottom:15px;

    border-radius:18px;

  }


  .fav-icon{

    width:46px;
    height:46px;

    border-radius:14px;

    font-size:22px;

  }


  .fav-heading h1{

    font-size:20px;

  }


  .fav-heading p{

    font-size:10px;

  }


  .fav-info{

    margin-top:14px;

    font-size:9px;

  }


  .products{

    grid-template-columns:
    repeat(2,minmax(0,1fr));

    gap:10px;

  }


  .product{

    border-radius:15px;

  }


  .photo{

    height:135px;

  }


  .product .body{

    padding:
      10px 10px 12px;

  }


  .badge{

    padding:4px 7px;

    margin-bottom:6px;

    font-size:8px;

  }


  .product h3{

    min-height:38px;

    font-size:12px;

    line-height:1.45;

  }


  .price{

    margin-top:8px;

    font-size:15px;

  }


  .meta{

    margin-top:5px;

    font-size:8px;

  }


  .fav-remove{

    width:32px;
    height:32px;

    top:7px;
    right:7px;

    font-size:15px;

  }

}

</div>

</div>

<script src="supabase.js?v=10"></script>


<script>

(function(){

"use strict";


const SB_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SB_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


const list =
  document.getElementById("list");


const favCount =
  document.getElementById("favCount");


function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function money(value){

  return "৳ " +

    Number(value || 0)
    .toLocaleString("bn-BD");

}


function getFavorites(){

  try{

    const favorites =

      JSON.parse(

        localStorage.getItem(
          "smb_fav"
        ) || "[]"

      );


    if(
      Array.isArray(favorites)
    ){

      return favorites.map(

        function(id){

          return String(id);

        }

      );

    }


  }catch(error){

    console.error(
      "Favorite read error:",
      error
    );

  }


  return [];

}


function saveFavorites(favorites){

  localStorage.setItem(

    "smb_fav",

    JSON.stringify(favorites)

  );

}


function firstImage(ad){

  if(

    Array.isArray(ad.image_urls) &&

    ad.image_urls.length

  ){

    return ad.image_urls[0];

  }


  if(

    typeof ad.image_urls ===
    "string" &&

    ad.image_urls.trim()

  ){

    let value =
      ad.image_urls.trim();


    try{

      const parsed =
        JSON.parse(value);


      if(
        Array.isArray(parsed)
      ){

        return parsed[0] || "";

      }

    }catch(error){}


    if(

      value.startsWith("{") &&

      value.endsWith("}")

    ){

      value =

        value
        .slice(1,-1)
        .split(",")[0]
        .replace(/^"/,"")
        .replace(/"$/,"");

    }


    return value;

  }


  return "";

}


function updateCount(count){

  if(!favCount) return;


  if(count === 0){

    favCount.innerHTML =
      "♡ এখনো কোনো বিজ্ঞাপন সেভ করা হয়নি";

    return;

  }


  favCount.innerHTML =

    "♥ " +

    count +

    " টি সেভ করা বিজ্ঞাপন";

}


function showEmpty(){

  updateCount(0);


  list.innerHTML = `

    <div class="fav-empty">

      <div class="fav-empty-icon">
        ♡
      </div>

      <h3>
        এখনো কোনো সেভ করা বিজ্ঞাপন নেই
      </h3>

      <p>
        পছন্দের বিজ্ঞাপনের
        হার্ট আইকনে চাপ দিয়ে
        এখানে সেভ করে রাখুন।
      </p>

      <a href="index.html">
        বিজ্ঞাপন দেখুন
      </a>

    </div>

  `;

}


function removeFavorite(id){

  const favorites =
    getFavorites();


  const updated =

    favorites.filter(

      function(favId){

        return String(favId) !==
        String(id);

      }

    );


  saveFavorites(updated);


  loadFavorites();

}


async function loadFavorites(){


  const favoriteIds =
    getFavorites();


  updateCount(
    favoriteIds.length
  );


  if(!favoriteIds.length){

    showEmpty();

    return;

  }


  list.innerHTML = `

    <div class="fav-loading">

      আপনার সেভ করা বিজ্ঞাপন লোড হচ্ছে...

    </div>

  `;


  try{


    const url =

      SB_URL +

      "/rest/v1/ads" +

      "?select=*" +

      "&status=eq.approved" +

      "&order=created_at.desc";


    const response =

      await fetch(

        url,

        {

          method:"GET",

          headers:{

            "apikey":SB_KEY,

            "Authorization":
              "Bearer " + SB_KEY,

            "Content-Type":
              "application/json"

          }

        }

      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const ads =
      await response.json();


    const favoriteAds =

      ads.filter(

        function(ad){

          return favoriteIds.includes(

            String(ad.id)

          );

        }

      );


    updateCount(
      favoriteAds.length
    );


    if(!favoriteAds.length){

      showEmpty();

      return;

    }


    list.innerHTML =

      favoriteAds.map(

        function(ad){


          const image =
            firstImage(ad);


          const photo =

            image

            ?

            `

            <div class="photo">

              <img

                class="ad-image"

                src="${escapeHtml(image)}"

                alt="${escapeHtml(
                  ad.title ||
                  "বিজ্ঞাপন"
                )}"

                loading="lazy"

              >

            </div>

            `

            :

            `

            <div
            class="photo ad-image-placeholder">

              কোনো ছবি নেই

            </div>

            `;


          return `

          <article
          class="product">


            <button

              class="fav-remove"

              type="button"

              onclick="event.stopPropagation(); removeFav('${escapeHtml(ad.id)}')"

              aria-label="Favorite থেকে সরান"

            >

              ♥


            </button>



            <div

              onclick="window.location.href='ad-details.html?id=${encodeURIComponent(ad.id)}'"

              style="cursor:pointer"

            >


              ${photo}



              <div class="body">


                <span class="badge">

                  ${escapeHtml(

                    ad.category ||

                    "বিজ্ঞাপন"

                  )}

                </span>



                <h3>

                  ${escapeHtml(

                    ad.title ||

                    "শিরোনাম নেই"

                  )}

                </h3>



                <div class="price">

                  ${money(ad.price)}

                </div>



                <div class="meta">

                  📍

                  ${escapeHtml(

                    ad.location ||

                    "লোকেশন উল্লেখ নেই"

                  )}

                </div>


              </div>


            </div>


          </article>

          `;

        }

      ).join("");


  }catch(error){


    console.error(

      "Favorite load error:",

      error

    );


    list.innerHTML = `

      <div class="fav-empty">


        <div class="fav-empty-icon">

          ⚠

        </div>


        <h3>

          বিজ্ঞাপন লোড করা যাচ্ছে না

        </h3>


        <p>

          ইন্টারনেট সংযোগ পরীক্ষা করে
          আবার চেষ্টা করুন।

        </p>


        <a href="favorites.html">

          আবার চেষ্টা করুন

        </a>


      </div>

    `;

  }


}


window.removeFav =
function(id){

  removeFavorite(id);

};


loadFavorites();


})();

</script>


</body>
