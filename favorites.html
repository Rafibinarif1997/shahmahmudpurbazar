<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Favourite | শাহমাহমুদপুর বাজার
</title>

<link
rel="stylesheet"
href="style.css">


<style>

.fav-page{
  padding:28px 0 110px;
}


.fav-header{
  margin-bottom:22px;
}


.fav-header h1{
  margin:0;
  font-size:26px;
  font-weight:900;
  color:#26352d;
}


.fav-header p{
  margin:6px 0 0;
  color:#7c8780;
  font-size:11px;
}


.fav-empty{
  grid-column:1/-1;

  padding:55px 20px;

  text-align:center;

  border:1px dashed #dbe5de;

  border-radius:18px;

  background:#fff;

  color:#7c8780;
}


.fav-empty .icon{
  display:block;
  margin-bottom:12px;
  font-size:42px;
}


.fav-empty h3{
  margin:0 0 7px;
  color:#334039;
  font-size:17px;
}


.fav-empty p{
  margin:0;
  font-size:11px;
}


.fav-loading{
  grid-column:1/-1;

  padding:50px 20px;

  text-align:center;

  color:#7c8780;
}


.product{
  position:relative;
}


.fav-remove{

  position:absolute;

  top:10px;

  right:10px;

  z-index:20;

  width:34px;

  height:34px;

  display:flex;

  align-items:center;

  justify-content:center;

  border:0;

  border-radius:50%;

  background:#fff;

  color:#ef476f;

  font-size:19px;

  cursor:pointer;

  box-shadow:
  0 4px 12px rgba(0,0,0,.12);

}


.fav-remove:hover{
  transform:scale(1.08);
}


@media(max-width:600px){

  .fav-page{
    padding-top:22px;
  }


  .fav-header h1{
    font-size:22px;
  }

}

</style>

</head>


<body>


<main
class="container fav-page">


<div class="fav-header">

<h1>
♡ সেভ করা বিজ্ঞাপন
</h1>

<p>
আপনার পছন্দের বিজ্ঞাপনগুলো এখানে দেখুন
</p>

</div>


<div
id="list"
class="products">


<div class="fav-loading">

বিজ্ঞাপন লোড হচ্ছে...

</div>


</div>


</main>



<nav class="mobile-nav">


<a href="index.html">

<span>⌂</span>

হোম

</a>


<a
class="active"
href="favorites.html">

<span>♡</span>

সেভ করা

</a>


<a href="post-ad.html">

<span>＋</span>

বিজ্ঞাপন দিন

</a>


<a
href="messages.html"
class="message-nav">

<span>▤</span>

মেসেজ

</a>


<a href="profile.html">

<span>♙</span>

প্রোফাইল

</a>


</nav>



<script src="supabase.js?v=10"></script>


<script>

(function(){

"use strict";


const SB_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SB_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


const list =
  document.getElementById("list");


function escapeHtml(value){

  return String(value ?? "")

  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function money(value){

  return (
    "৳ " +
    Number(value || 0)
    .toLocaleString("bn-BD")
  );

}


function getFavorites(){

  try{

    const favorites =
      JSON.parse(
        localStorage.getItem(
          "smb_fav"
        ) || "[]"
      );


    if(
      Array.isArray(favorites)
    ){

      return favorites.map(
        function(id){

          return String(id);

        }
      );

    }


  }catch(error){

    console.error(
      "Favorite read error:",
      error
    );

  }


  return [];

}


function saveFavorites(favorites){

  localStorage.setItem(

    "smb_fav",

    JSON.stringify(favorites)

  );

}


function firstImage(ad){

  if(

    Array.isArray(ad.image_urls) &&

    ad.image_urls.length

  ){

    return ad.image_urls[0];

  }


  if(

    typeof ad.image_urls ===
    "string" &&

    ad.image_urls.trim()

  ){

    let value =
      ad.image_urls.trim();


    if(

      value.startsWith("{") &&

      value.endsWith("}")

    ){

      value =

        value
        .slice(1,-1)
        .split(",")[0]
        .replace(/^"/,"")
        .replace(/"$/,"");

    }


    return value;

  }


  return "";

}


function removeFavorite(id){

  const favorites =
    getFavorites();


  const updated =
    favorites.filter(
      function(favId){

        return String(favId) !==
        String(id);

      }
    );


  saveFavorites(updated);


  loadFavorites();

}


function showEmpty(){

  list.innerHTML = `

    <div class="fav-empty">

      <span class="icon">
        ♡
      </span>

      <h3>
        এখনো কোনো সেভ করা বিজ্ঞাপন নেই
      </h3>

      <p>
        আপনার পছন্দের বিজ্ঞাপনের ♡ আইকনে চাপ দিন।
      </p>

    </div>

  `;

}


async function loadFavorites(){

  const favoriteIds =
    getFavorites();


  if(!favoriteIds.length){

    showEmpty();
    return;

  }


  list.innerHTML = `

    <div class="fav-loading">

      বিজ্ঞাপন লোড হচ্ছে...

    </div>

  `;


  try{

    const url =

      SB_URL +

      "/rest/v1/ads" +

      "?select=*" +

      "&status=eq.approved" +

      "&order=created_at.desc";


    const response =
      await fetch(
        url,
        {

          method:"GET",

          headers:{

            "apikey":SB_KEY,

            "Content-Type":
              "application/json"

          }

        }
      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const ads =
      await response.json();


    const favoriteAds =
      ads.filter(
        function(ad){

          return favoriteIds.includes(
            String(ad.id)
          );

        }
      );


    if(!favoriteAds.length){

      showEmpty();
      return;

    }


    list.innerHTML =

      favoriteAds.map(
        function(ad){

          const image =
            firstImage(ad);


          const photo =

            image

            ?

            `

            <div class="photo">

              <img
              class="ad-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(
                ad.title || "বিজ্ঞাপন"
              )}"
              loading="lazy">

            </div>

            `

            :

            `

            <div
            class="photo ad-image-placeholder">

              ${escapeHtml(
                ad.category ||
                "বিজ্ঞাপন"
              )}

            </div>

            `;


          return `

          <article
          class="product">

            <button
            class="fav-remove"
            onclick="removeFav('${escapeHtml(ad.id)}')">

              ♥️

            </button>


            <div
            onclick="window.location.href='ad-details.html?id=${encodeURIComponent(ad.id)}'">

              ${photo}


              <div class="body">


                <span class="badge">

                  ${escapeHtml(
                    ad.category ||
                    "Marketplace"
                  )}

                </span>


                <h3>

                  ${escapeHtml(
                    ad.title ||
                    "Untitled"
                  )}

                </h3>


                <div class="price">

                  ${money(ad.price)}

                </div>


                <div class="meta">

                  📍
                  ${escapeHtml(
                    ad.location ||
                    ""
                  )}

                </div>


              </div>

            </div>


          </article>

          `;

        }
      ).join("");


  }catch(error){

    console.error(
      "Favorite load error:",
      error
    );


    list.innerHTML = `

      <div class="fav-empty">

        <span class="icon">
          ⚠️
        </span>

        <h3>
          বিজ্ঞাপন লোড করা যাচ্ছে না
        </h3>

        <p>
          একটু পরে আবার চেষ্টা করুন।
        </p>

      </div>

    `;

  }

}


window.removeFav =
function(id){

  removeFavorite(id);

};


loadFavorites();


})();

</script>


</body>

</html>
