<script>

document.addEventListener(
"DOMContentLoaded",
function(){

"use strict";


/* ==========================================================
   URL PARAMETERS
========================================================== */

const params =
new URLSearchParams(
window.location.search
);


const initialQuery =
params.get("q") || "";


const initialCategory =
params.get("category") || "";


const trending =
params.get("sort") === "trending";



/* ==========================================================
   ELEMENTS
========================================================== */

const cat =
document.getElementById("cat");

const sub =
document.getElementById("subcat");

const q =
document.getElementById("q2");

const min =
document.getElementById("minPrice");

const max =
document.getElementById("maxPrice");

const area =
document.getElementById("area");

const sort =
document.getElementById("sort");

const clear =
document.getElementById("clear");

const results =
document.getElementById("results");

const count =
document.getElementById("count");

const heading =
document.getElementById("heading");

const summary =
document.getElementById("summary");

const searchForm =
document.getElementById("searchForm");

const topSearch =
document.getElementById("search");



/* ==========================================================
   SUBCATEGORY MAP
========================================================== */

const subs = {

"Vehicles":[
"Cars",
"Motorcycles",
"Bicycles",
"Auto Rickshaw",
"Trucks & Buses",
"Vehicle Parts"
],

"Property":[
"Land",
"Apartments",
"Houses",
"Shops & Commercial Space",
"Office Space",
"Property for Rent"
],

"Phones & Tablets":[
"Mobile Phones",
"Tablets",
"Phone Accessories",
"Smart Watches"
],

"Electronics":[
"TV",
"Laptop & Computer",
"Camera",
"Audio",
"Gaming",
"Other Electronics"
],

"Home, Furniture & Garden":[
"Furniture",
"Home Decor",
"Kitchen",
"Garden",
"Appliances"
],

"Fashion":[
"Men",
"Women",
"Kids",
"Shoes",
"Bags & Accessories",
"Watches"
],

"Beauty & Personal Care":[
"Cosmetics",
"Skin Care",
"Hair Care",
"Perfume",
"Health & Personal Care"
],

"Services":[
"Tutoring",
"Cleaning",
"Transport",
"Photography",
"IT & Digital",
"Other Services"
],

"Repair & Construction":[
"Electrician",
"Plumber",
"AC & Fridge Repair",
"Construction Materials",
"Mechanic",
"Painter"
],

"Commercial Equipment & Machinery":[
"Factory Equipment",
"Restaurant Equipment",
"Office Equipment",
"Tools",
"Machinery"
],

"Leisure & Activities":[
"Sports",
"Gym & Fitness",
"Music",
"Books",
"Tickets & Events",
"Hobbies"
],

"Babies & Kids":[
"Baby Products",
"Toys",
"Kids Clothing",
"Strollers",
"School Items"
],

"Food, Agriculture & Supplies":[
"Vegetables",
"Fruits",
"Fish",
"Livestock Feed",
"Seeds",
"Farm Products"
],

"Animals & Pets":[
"Cattle",
"Goat",
"Poultry",
"Pets",
"Pet Supplies"
],

"Jobs":[
"Full Time",
"Part Time",
"Sales Jobs",
"Driver Jobs",
"Office Jobs",
"Other Jobs"
],

"Seeking Work - CVs":[
"CVs",
"Job Seekers",
"Freelancers",
"Skilled Workers"
],

"Business & Industry":[
"Business for Sale",
"Wholesale",
"Retail",
"Industrial Products",
"Agriculture Business"
]

};



/* ==========================================================
   UPDATE SUBCATEGORY
========================================================== */

function updateSubs(
selectedValue=""
){

  const items =
    subs[cat.value] || [];


  sub.innerHTML =
    '<option value="">সব সাব-ক্যাটাগরি</option>';


  items.forEach(
    function(item){

      const option =
        document.createElement(
          "option"
        );

      option.value =
        item;

      option.textContent =
        item;

      if(
        item === selectedValue
      ){

        option.selected =
          true;

      }

      sub.appendChild(
        option
      );

    }
  );

}



/* ==========================================================
   SAFE TEXT
========================================================== */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}



/* ==========================================================
   INITIAL FILTER
========================================================== */

if(
  initialCategory
){

  const categoryExists =
    Array.from(
      cat.options
    ).some(
      function(option){
        return option.value ===
          initialCategory;
      }
    );


  if(categoryExists){

    cat.value =
      initialCategory;

  }

}


q.value =
initialQuery;


topSearch.value =
initialQuery;


updateSubs();



/* ==========================================================
   LOAD ADS
========================================================== */

function getAds(){

  try{

    if(
      typeof window.ads ===
      "function"
    ){

      const data =
        window.ads();

      if(
        Array.isArray(data)
      ){

        return data;

      }

    }

  }catch(error){

    console.error(
      "ads() error:",
      error
    );

  }


  return [];

}



/* ==========================================================
   RENDER
========================================================== */

function render(){

  let all =
    getAds();


  /*
   * IMPORTANT
   *
   * Public marketplace-এ শুধু
   * approved অথবা published বিজ্ঞাপন দেখাবে।
   *
   * pending / rejected এখানে আসবে না।
   */

  let list =
    all.filter(
      function(ad){

        const status =
          String(
            ad.status || ""
          )
          .trim()
          .toLowerCase();


        return (
          status === "approved" ||
          status === "published"
        );

      }
    );


  const keyword =
    q.value
      .trim()
      .toLowerCase();


  const categoryValue =
    cat.value;


  const subcategoryValue =
    sub.value;


  const areaValue =
    area.value;


  const minValue =
    min.value === ""
    ? 0
    : Number(
        min.value
      );


  const maxValue =
    max.value === ""
    ? Infinity
    : Number(
        max.value
      );



  /* ========================================================
     FILTER
  ======================================================== */

  list =
    list.filter(
      function(ad){

        const title =
          String(
            ad.title || ""
          );


        const categoryText =
          String(
            ad.category || ""
          );


        const subcategoryText =
          String(
            ad.subcategory || ""
          );


        const locationText =
          String(
            ad.location || ""
          );


        const description =
          String(
            ad.description || ""
          );


        const searchable =
          (
            title +
            " " +
            categoryText +
            " " +
            subcategoryText +
            " " +
            locationText +
            " " +
            description
          )
          .toLowerCase();


        const price =
          Number(
            ad.price || 0
          );


        /*
         * Category
         */

        if(
          categoryValue &&
          categoryText !==
          categoryValue
        ){

          return false;

        }


        /*
         * Subcategory
         */

        if(
          subcategoryValue &&
          subcategoryText !==
          subcategoryValue
        ){

          return false;

        }


        /*
         * Search
         */

        if(
          keyword &&
          !searchable.includes(
            keyword
          )
        ){

          return false;

        }


        /*
         * Area
         *
         * Exact match
         */

        if(
          areaValue &&
          locationText !==
          areaValue
        ){

          return false;

        }


        /*
         * Price
         */

        if(
          price < minValue ||
          price > maxValue
        ){

          return false;

        }


        return true;

      }
    );



  /* ========================================================
     SORT
  ======================================================== */

  if(
    sort.value ===
    "low"
  ){

    list.sort(
      function(a,b){

        return Number(
          a.price || 0
        ) -
        Number(
          b.price || 0
        );

      }
    );

  }


  if(
    sort.value ===
    "high"
  ){

    list.sort(
      function(a,b){

        return Number(
          b.price || 0
        ) -
        Number(
          a.price || 0
        );

      }
    );

  }


  if(
    sort.value ===
    "new"
  ){

    list.sort(
      function(a,b){

        return String(
          b.created_at ||
          b.id ||
          ""
        )
        .localeCompare(
          String(
            a.created_at ||
            a.id ||
            ""
          )
        );

      }
    );

  }


  if(
    trending
  ){

    list.sort(
      function(a,b){

        return Number(
          b.views || 0
        ) -
        Number(
          a.views || 0
        );

      }
    );

  }



  /* ========================================================
     COUNT
  ======================================================== */

  count.textContent =
    list.length +
    "টি বিজ্ঞাপন";



  /* ========================================================
     HEADING
  ======================================================== */

  if(
    categoryValue
  ){

    heading.textContent =
      categoryValue;

  }else{

    heading.textContent =
      "সব বিজ্ঞাপন";

  }



  /* ========================================================
     SUMMARY
  ======================================================== */

  if(
    categoryValue &&
    subcategoryValue
  ){

    summary.textContent =
      categoryValue +
      " — " +
      subcategoryValue +
      " এর বিজ্ঞাপন দেখানো হচ্ছে।";

  }else if(
    categoryValue
  ){

    summary.textContent =
      categoryValue +
      " এর বিজ্ঞাপন দেখানো হচ্ছে।";

  }else if(
    areaValue
  ){

    summary.textContent =
      areaValue +
      " এলাকার প্রকাশিত বিজ্ঞাপন দেখানো হচ্ছে।";

  }else{

    summary.textContent =
      "আপনার এলাকার প্রকাশিত বিজ্ঞাপনগুলো দেখুন।";

  }



  /* ========================================================
     EMPTY
  ======================================================== */

  if(
    !list.length
  ){

    results.innerHTML = `

      <div
        style="
          grid-column:1/-1;
          padding:45px;
          text-align:center;
          color:#81948a;
          border:1px solid rgba(105,245,165,.12);
          border-radius:14px;
        ">

        এই filter অনুযায়ী কোনো বিজ্ঞাপন পাওয়া যায়নি।

      </div>

    `;

    return;

  }



  /* ========================================================
     CARD
  ======================================================== */

  results.innerHTML =
    list.map(
      function(ad){

        const title =
          esc(
            ad.title ||
            "বিজ্ঞাপন"
          );


        const location =
          esc(
            ad.location ||
            ""
          );


        const categoryText =
          esc(
            ad.category ||
            ""
          );


        let price =
          "৳ " +
          Number(
            ad.price || 0
          ).toLocaleString(
            "bn-BD"
          );


        /*
         * Image
         */

        let image = "";


        if(
          Array.isArray(
            ad.image_urls
          ) &&
          ad.image_urls.length
        ){

          image =
            ad.image_urls[0];

        }else if(
          typeof ad.image_urls ===
          "string" &&
          ad.image_urls
        ){

          try{

            const parsed =
              JSON.parse(
                ad.image_urls
              );

            if(
              Array.isArray(
                parsed
              ) &&
              parsed.length
            ){

              image =
                parsed[0];

            }else{

              image =
                ad.image_urls;

            }

          }catch(e){

            image =
              ad.image_urls;

          }

        }


        const photo =
          image
          ?

          `

          <div class="photo">

            <img
              src="${esc(image)}"
              alt="${title}"
              style="
                width:100%;
                height:100%;
                object-fit:cover;
                display:block;
              "
              loading="lazy"
            >

          </div>

          `

          :

          `

          <div class="photo">

            ${categoryText ||
              "বিজ্ঞাপন"}

          </div>

          `;



        return `

          <article
            class="product"
            onclick="
              window.location.href =
              'ad.html?id=${encodeURIComponent(
                ad.id || ""
              )}'
            "
            style="cursor:pointer"
          >

            ${photo}


            <div class="body">

              <span class="badge">
                ${esc(
                  ad.category ||
                  "বিজ্ঞাপন"
                )}
              </span>


              <h3>
                ${title}
              </h3>


              <div class="price">
                ${price}
              </div>


              <div class="meta">
                ${location}
              </div>

            </div>

          </article>

        `;

      }
    )
    .join("");

}



/* ==========================================================
   EVENTS
========================================================== */


/*
 * Category change
 */

cat.addEventListener(
"change",
function(){

  updateSubs();

  render();

});



/*
 * Subcategory
 */

sub.addEventListener(
"change",
render
);



/*
 * Area
 */

area.addEventListener(
"change",
render
);



/*
 * Sort
 */

sort.addEventListener(
"change",
render
);



/*
 * Price
 */

min.addEventListener(
"input",
render
);


max.addEventListener(
"input",
render
);



/*
 * Search
 */

q.addEventListener(
"input",
render
);



/*
 * Top search
 */

searchForm.addEventListener(
"submit",
function(e){

  e.preventDefault();

  q.value =
    topSearch.value.trim();

  render();

});



/*
 * Reset
 */

clear.addEventListener(
"click",
function(){

  cat.value =
    "";

  updateSubs();

  sub.value =
    "";

  q.value =
    "";

  topSearch.value =
    "";

  min.value =
    "";

  max.value =
    "";

  area.value =
    "";

  sort.value =
    "new";


  render();


  /*
   * URL clean
   */

  try{

    history.replaceState(
      {},
      document.title,
      "search.html"
    );

  }catch(e){}

});



/* ==========================================================
   FIRST RENDER
========================================================== */

render();


});
</script>
