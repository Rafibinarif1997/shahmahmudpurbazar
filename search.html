<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>বিজ্ঞাপন খুঁজুন</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="container topbar"><a class="brand" href="index.html"><b>শাহমাহমুদপুর</b><strong>বাজার</strong><small>LOCAL MARKETPLACE</small></a><div class="top-actions"><a href="login.html">লগইন</a><i></i><a href="register.html">রেজিস্টার</a></div></div><div class="container search-row"><form id="searchForm" class="search"><span>⌕</span><input id="search" placeholder="কি খুঁজছেন?"><button>খুঁজুন</button></form></div></header><main class="container"><div class="page-top"><small>MARKETPLACE</small><h1 id="heading">সব বিজ্ঞাপন</h1><p id="summary"></p></div><div class="filters"><select id="cat"><option value="">সব ক্যাটাগরি</option></select><select id="subcat"><option value="">সব সাব-ক্যাটাগরি</option></select><input id="min" type="number" placeholder="সর্বনিম্ন দাম"><input id="max" type="number" placeholder="সর্বোচ্চ দাম"><input id="area" placeholder="এলাকা"><select id="sort"><option value="new">নতুন আগে</option><option value="low">কম দাম</option><option value="high">বেশি দাম</option></select></div><div style="display:flex;justify-content:space-between;margin:14px 0"><strong id="count"></strong><button class="btn" id="clear">Reset</button></div><div id="results" class="products"></div></main><nav class="mobile-nav"><a href="index.html"><span>⌂</span>হোম</a><a href="favorites.html"><span>♡</span>সেভড</a><a href="post-ad.html"><span>＋</span>বিজ্ঞাপন</a><a class="active" href="search.html"><span>⌕</span>খুঁজুন</a><a href="profile.html"><span>♙</span>প্রোফাইল</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>const p=new URLSearchParams(location.search),cats=marketplace.categoryMap,cat=document.getElementById('cat'),sub=document.getElementById('subcat');Object.keys(cats).forEach(x=>cat.add(new Option(x,x)));cat.value=p.get('category')||'';function subs(){sub.innerHTML='<option value="">সব সাব-ক্যাটাগরি</option>';(cats[cat.value]||[]).forEach(x=>sub.add(new Option(x,x)))}subs();const q2=document.getElementById('search'),min=document.getElementById('min'),max=document.getElementById('max'),area=document.getElementById('area'),sort=document.getElementById('sort');q2.value=p.get('q')||'';async function render(){let q=q2.value.trim().toLowerCase(),cc=cat.value,ss=sub.value;let query=sb.from('ads').select('*').eq('status','approved');if(cc)query=query.eq('category',cc);if(ss)query=query.eq('subcategory',ss);if(min.value)query=query.gte('price',Number(min.value));if(max.value)query=query.lte('price',Number(max.value));if(area.value)query=query.ilike('location','%'+area.value+'%');if(q)query=query.or(`title.ilike.%${q}%,description.ilike.%${q}%,location.ilike.%${q}%`);query=query.order('created_at',{ascending:false});const {data,error}=await query;let a=data||[];if(sort.value==='low')a.sort((x,y)=>x.price-y.price);if(sort.value==='high')a.sort((x,y)=>y.price-x.price);count.textContent=a.length+'টি বিজ্ঞাপন';heading.textContent=cc||'সব বিজ্ঞাপন';summary.textContent=cc?`${cc}${ss?' — '+ss:''} এর বিজ্ঞাপন`:'আপনার এলাকার প্রকাশিত বিজ্ঞাপন';results.innerHTML=error?`<p class="muted">${marketplace.esc(error.message)}</p>`:(a.length?a.map(marketplace.card).join(''):'<div style="grid-column:1/-1;padding:40px;text-align:center">কোনো বিজ্ঞাপন পাওয়া যায়নি।</div>')}cat.onchange=()=>{subs();render()};sub.onchange=render;min.oninput=render;max.oninput=render;area.oninput=render;sort.onchange=render;q2.oninput=render;searchForm.onsubmit=e=>{e.preventDefault();render()};clear.onclick=()=>{cat.value='';subs();sub.value='';min.value=max.value=area.value=q2.value='';sort.value='new';render()};render();</script></body></html>
