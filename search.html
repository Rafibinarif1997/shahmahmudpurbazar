<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>বিজ্ঞাপন খুঁজুন | শাহমাহমুদপুর বাজার</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="container head"><a class="brand" href="index.html"><b>শাহমাহমুদপুর</b><strong>বাজার</strong><small>LOCAL MARKETPLACE</small></a><form id="searchForm" class="search"><span>⌕</span><input id="search" placeholder="কি খুঁজছেন?"><button>খুঁজুন</button></form><nav><a href="favorites.html">♡</a><a href="login.html">লগইন</a></nav></div></header><main class="container"><div style="padding:28px 0 10px"><span class="eyebrow">MARKETPLACE</span><h1 style="font-size:30px">সব বিজ্ঞাপন</h1></div><div class="filters" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px"><select id="cat"><option value="">সব ক্যাটাগরি</option><option>Vehicles</option><option>Property</option><option>Phones & Tablets</option><option>Electronics</option><option>Home, Furniture & Garden</option><option>Fashion</option><option>Beauty & Personal Care</option><option>Services</option><option>Repair & Construction</option><option>Commercial Equipment & Machinery</option><option>Leisure & Activities</option><option>Babies & Kids</option><option>Food, Agriculture & Supplies</option><option>Animals & Pets</option><option>Jobs</option><option>Seeking Work - CVs</option><option>Business & Industry</option></select><select id="sort"><option value="new">নতুন আগে</option><option value="low">কম দাম</option><option value="high">বেশি দাম</option></select><input id="q2" placeholder="কী খুঁজছেন?"></div><div id="results" class="products"></div></main><footer><div class="container foot"><b>শাহমাহমুদপুর বাজার</b><small>© 2026</small></div></footer><script src="app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{let p=new URLSearchParams(location.search),q=(p.get("q")||"").toLowerCase(),c=p.get("category")||"";document.getElementById("cat").value=c;document.getElementById("q2").value=q;function render(){let a=ads().filter(x=>x.status==="approved"),qq=document.getElementById("q2").value.toLowerCase(),cc=document.getElementById("cat").value;a=a.filter(x=>(!cc||x.category===cc)&&(!qq||(x.title+" "+x.category+" "+x.location).toLowerCase().includes(qq)));let s=document.getElementById("sort").value;if(s==="low")a.sort((x,y)=>x.price-y.price);if(s==="high")a.sort((x,y)=>y.price-x.price);document.getElementById("results").innerHTML=a.length?a.map(card).join("<div></div>"):"<div style='grid-column:1/-1;padding:40px;text-align:center;color:#81948a'>কোনো বিজ্ঞাপন পাওয়া যায়নি।</div>"}document.getElementById("cat").onchange=render;document.getElementById("sort").onchange=render;document.getElementById("q2").oninput=render;render()})</script></body></html>
