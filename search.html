/* ============================================================
   SEARCH PAGE - PREMIUM BRIGHT DESIGN
============================================================ */

:root{

  --green:#0b8f4b;
  --green-dark:#05743a;
  --green-light:#e9f8ef;

  --text:#1d2923;
  --muted:#66736c;

  --border:#e6ece8;

  --bg:#f8faf9;

}


/* ============================================================
   PAGE
============================================================ */

body{

  margin:0;

  background:
    linear-gradient(
      180deg,
      #f8faf9 0%,
      #ffffff 45%,
      #f8faf9 100%

  color:var(--text);

  padding-bottom:90px;

}


/* ============================================================
   HEADER
============================================================ */

.header{

  background:
    rgba(255,255,255,.96);

  border-bottom:
    1px solid
    rgba(20,70,45,.10);

}


.head{

  min-height:76px;

  display:flex;

  align-items:center;

}


.brand{

  display:flex;

  flex-wrap:wrap;

  align-items:center;

  width:260px;

  position:relative;

  padding-left:58px;

  text-decoration:none;

}


.brand:before{

  content:"🛍";

  position:absolute;

  left:0;

  top:50%;

  transform:translateY(-50%);

  width:45px;

  height:45px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #0d9b55,
      #05743a
    );

  font-size:26px;

  box-shadow:
    0 8px 18px
    rgba(11,143,75,.22);

}


.brand b{

  width:100%;

  font-size:19px;

  font-weight:900;

  letter-spacing:-.5px;

  color:#27352e !important;

}


.brand strong{

  position:absolute;

  top:0;

  left:188px;

  color:var(--green) !important;

  font-size:19px;

  font-weight:900;

}


.brand small{

  width:100%;

  margin-top:3px;

  color:#66726b !important;

  font-size:9px;

  font-weight:800;

  letter-spacing:1.5px;

}


/* ============================================================
   MAIN
============================================================ */

.search-page{

  padding-top:28px;

}


.page-top{

  margin-bottom:18px;

}


.eyebrow{

  display:block;

  color:var(--green);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;

  margin-bottom:5px;

}


.page-top h1{

  margin:0;

  font-size:28px;

  font-weight:900;

  letter-spacing:-.7px;

  color:#1d2923;

}


.page-top p{

  margin:
    6px
    0
    0;

  color:var(--muted);

  font-size:12px;

}


/* ============================================================
   FILTER BOX
============================================================ */

.filters{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:10px;

  padding:14px;

  border:
    1px solid
    var(--border);

  border-radius:18px;

  background:#fff;

  box-shadow:
    0 8px 25px
    rgba(30,55,42,.06);

}


.filter-item{

  display:flex;

  flex-direction:column;

  gap:6px;

}


.filter-item label{

  color:#68736d;

  font-size:9px;

  font-weight:800;

}


.filters select{

  width:100%;

  height:44px;

  border:
    1px solid
    #dfe8e2;

  border-radius:11px;

  background:#fff;

  color:#29372f;

  outline:0;

  padding:
    0
    10px;

  font-size:11px;

  font-weight:700;

}


.filters select:focus{

  border-color:
    var(--green);

  box-shadow:
    0 0 0 3px
    rgba(11,143,75,.08);

}


#cat{

  grid-column:span 2;

}


#subcat{

  grid-column:span 2;

}


/* ============================================================
   RESULT BAR
============================================================ */

.result-bar{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin:
    20px
    0
    12px;

}


.result-bar strong{

  font-size:11px;

  color:#66736c;

}


.reset-btn{

  border-radius:10px;

  color:#657169;

  padding:

  font-size:10px;

  font-weight:800;

}

============================================================ */

<script>

document.addEventListener(
  "DOMContentLoaded",
  async function(){

"use strict";


/* ============================================================
URL PARAMS
============================================================ */

const params =
  new URLSearchParams(
    window.location.search
  );


const initialCategory =
  params.get("category") || "";


const initialQuery =
  params.get("q") || "";


/* ============================================================
ELEMENTS
============================================================ */

const cat =
  document.getElementById("cat");


const sub =
  document.getElementById("subcat");


const area =
  document.getElementById("area");


const sort =
  document.getElementById("sort");


const clear =
  document.getElementById("clear");


const results =
  document.getElementById("results");


const count =
  document.getElementById("count");


const heading =
  document.getElementById("heading");


const summary =
  document.getElementById("summary");


/* ============================================================
SUPABASE
============================================================ */

const SUPA_URL =

  window.SUPABASE_URL ||

  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =

  window.SUPABASE_ANON_KEY ||

  window.supabaseAnonKey ||

  "";


/* ============================================================
SET INITIAL CATEGORY
============================================================ */

if(initialCategory){

  const exists =
    Array.from(
      cat.options
    ).some(function(option){

      return option.value ===
        initialCategory;

    });


  if(exists){

    cat.value =
      initialCategory;

  }

}


/* ============================================================
HELPERS
============================================================ */

function esc(value){

  return String(value ?? "")

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function getImage(ad){

  if(

    Array.isArray(
      ad.image_urls
    ) &&

    ad.image_urls.length

  ){

    return ad.image_urls[0];

  }


  if(

    typeof ad.image_urls ===
    "string" &&

    ad.image_urls.trim()

  ){

    let value =
      ad.image_urls.trim();


    try{

      const parsed =
        JSON.parse(value);


      if(

        Array.isArray(parsed) &&

        parsed.length

      ){

        return parsed[0];

      }

    }catch(error){}


    if(

      value.startsWith("{") &&

      value.endsWith("}")

    ){

      value =

        value
        .slice(1,-1)
        .split(",")[0]
        .replace(/^"/,"")
        .replace(/"$/,"");

    }


    return value;

  }


  return "";

}


/* ============================================================
LOAD ADS DIRECTLY FROM SUPABASE
============================================================ */

async function loadAds(){

  if(!SUPA_KEY){

    throw new Error(
      "Supabase key পাওয়া যায়নি"
    );

  }


  const url =

    SUPA_URL +

    "/rest/v1/ads" +

    "?select=*" +

    "&order=created_at.desc";


  const response =
    await fetch(

      url,

      {

        method:"GET",

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            SUPA_KEY,

          "Content-Type":
            "application/json"

        }

      }

    );


  if(!response.ok){

    throw new Error(
      await response.text()
    );

  }


  const data =
    await response.json();


  return Array.isArray(data)
    ? data
    : [];

}


/* ============================================================
RENDER ADS
============================================================ */

function render(allAds){


  let list =

    Array.isArray(allAds)

    ?

    allAds.filter(function(ad){

      const status =
        String(
          ad.status || ""
        ).toLowerCase();


      return (

        status === "approved" ||

        status === "published"

      );

    })

    :

    [];


  const category =
    cat.value;


  const subcategory =
    sub.value;


  const selectedArea =
    area.value;


  const query =
    initialQuery
    .trim()
    .toLowerCase();


  /* FILTER */

  list =

    list.filter(function(ad){


      const adCategory =
        String(
          ad.category || ""
        );


      const adSubcategory =
        String(
          ad.subcategory || ""
        );


      const location =
        String(
          ad.location ||
          ad.area ||
          ""
        );


      const searchable =

        [

          ad.title,

          ad.category,

          ad.subcategory,

          ad.location,

          ad.area,

          ad.description,

          ad.brand,

          ad.model

        ]

        .map(function(value){

          return String(
            value || ""
          );

        })

        .join(" ")

        .toLowerCase();


      if(

        category &&

        adCategory !== category

      ){

        return false;

      }


      if(

        subcategory &&

        adSubcategory !==
        subcategory

      ){

        return false;

      }


      if(

        selectedArea &&

        !location.includes(
          selectedArea
        )

      ){

        return false;

      }


      if(

        query &&

        !searchable.includes(
          query
        )

      ){

        return false;

      }


      return true;

    });


  /* SORT */

  if(

    sort.value === "low"

  ){

    list.sort(function(a,b){

      return Number(
        a.price || 0
      )

      -

      Number(
        b.price || 0
      );

    });

  }


  else if(

    sort.value === "high"

  ){

    list.sort(function(a,b){

      return Number(
        b.price || 0
      )

      -

      Number(
        a.price || 0
      );

    });

  }


  else{

    list.sort(function(a,b){

      return String(
        b.created_at ||
        ""
      ).localeCompare(

        String(
          a.created_at ||
          ""
        )

      );

    });

  }


  /* COUNT */

  count.textContent =

    list.length +

    "টি বিজ্ঞাপন";


  /* HEADING */

  if(category){

    heading.textContent =
      cat.options[
        cat.selectedIndex
      ].textContent;

  }

  else{

    heading.textContent =
      "সব বিজ্ঞাপন";

  }


  /* SUMMARY */

  if(category && subcategory){

    summary.textContent =

      cat.options[
        cat.selectedIndex
      ].textContent +

      " — " +

      subcategory +

      " এর বিজ্ঞাপন দেখানো হচ্ছে।";

  }


  else if(category){

    summary.textContent =

      cat.options[
        cat.selectedIndex
      ].textContent +

      " ক্যাটাগরির বিজ্ঞাপন দেখানো হচ্ছে।";

  }


  else if(selectedArea){

    summary.textContent =

      selectedArea +

      " এলাকার বিজ্ঞাপন দেখানো হচ্ছে।";

  }


  else{

    summary.textContent =

      "আপনার এলাকার প্রকাশিত বিজ্ঞাপনগুলো দেখুন।";

  }


  /* EMPTY */

  if(!list.length){

    results.innerHTML = `

      <div class="ads-message">

        কোনো বিজ্ঞাপন পাওয়া যায়নি।

        <br>

        <small>

          অন্য ক্যাটাগরি বা filter দিয়ে চেষ্টা করুন।

        </small>

      </div>

    `;

    return;

  }


  /* PRODUCTS */

  results.innerHTML =

    list.map(function(ad){


      const title =
        esc(
          ad.title ||
          "বিজ্ঞাপন"
        );


      const location =
        esc(
          ad.location ||
          ad.area ||
          ""
        );


      const category =
        esc(
          ad.category ||
          "Marketplace"
        );


      const image =
        getImage(ad);


      const price =

        "৳ " +

        Number(
          ad.price || 0
        )

        .toLocaleString(
          "bn-BD"
        );


      const photo =

        image

        ?

        `

        <div class="photo">

          <img
            src="${esc(image)}"
            alt="${title}"
            loading="lazy">

        </div>

        `

        :

        `

        <div class="photo">

          ${category}

        </div>

        `;


      return `

        <article
          class="product"
          data-id="${esc(
            ad.id || ""
          )}">

          ${photo}

          <div class="body">

            <span class="badge">

              ${category}

            </span>


            <h3>

              ${title}

            </h3>


            <div class="price">

              ${price}

            </div>


            <div class="meta">

              📍 ${location}

            </div>

          </div>

        </article>

      `;

    })

    .join("");


  /* CLICK */

  results
  .querySelectorAll(
    ".product"
  )

  .forEach(function(card){

    card.addEventListener(

      "click",

      function(){

        const id =
          card.dataset.id;


        if(id){

          window.location.href =

            "ad-details.html?id=" +

            encodeURIComponent(id);

        }

      }

    );

  });

}


/* ============================================================
LOAD DATA
============================================================ */

let allAds = [];


results.innerHTML = `

<div class="ads-message">

বিজ্ঞাপন লোড হচ্ছে...

</div>

`;


try{


  allAds =
    await loadAds();


  render(allAds);


}catch(error){


  console.error(
    "Search load error:",
    error
  );


  count.textContent =
    "0টি বিজ্ঞাপন";


  results.innerHTML = `

    <div class="ads-message">

      বিজ্ঞাপন লোড করা যাচ্ছে না।

      <br>

      <small>

        একটু পরে আবার চেষ্টা করুন।

      </small>

    </div>

  `;

}


/* ============================================================
EVENTS
============================================================ */

cat.addEventListener(

  "change",

  function(){

    render(allAds);

  }

);


sub.addEventListener(

  "change",

  function(){

    render(allAds);

  }

);


area.addEventListener(

  "change",

  function(){

    render(allAds);

  }

);


sort.addEventListener(

  "change",

  function(){

    render(allAds);

  }

);


clear.addEventListener(

  "click",

  function(){


    cat.value = "";

    sub.value = "";

    area.value = "";

    sort.value = "new";


    render(allAds);


    try{

      history.replaceState(
        {},
        document.title,
        "search.html"
      );

    }catch(error){}

  }

);


});

</script>
