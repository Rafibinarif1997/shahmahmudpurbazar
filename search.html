<script>

document.addEventListener(
  "DOMContentLoaded",
  async function(){

"use strict";


/* ============================================================
URL PARAMS
============================================================ */

const params =
  new URLSearchParams(
    window.location.search
  );


const initialCategory =
  params.get("category") || "";


const initialQuery =
  params.get("q") || "";


/* ============================================================
ELEMENTS
============================================================ */

const cat =
  document.getElementById("cat");


const sub =
  document.getElementById("subcat");


const area =
  document.getElementById("area");


const sort =
  document.getElementById("sort");


const clear =
  document.getElementById("clear");


const results =
  document.getElementById("results");


const count =
  document.getElementById("count");


const heading =
  document.getElementById("heading");


const summary =
  document.getElementById("summary");


/* ============================================================
CATEGORY → SUBCATEGORY DATA
============================================================ */

const categorySubcategories = {

  "Vehicles":[
    "Cars",
    "Motorcycles",
    "Bicycles",
    "Auto Rickshaw",
    "Trucks & Buses",
    "Vehicle Parts"
  ],

  "Property":[
    "Land",
    "Apartments",
    "Houses",
    "Shops & Commercial Space",
    "Office Space",
    "Property for Rent"
  ],

  "Phones & Tablets":[
    "Mobile Phones",
    "Tablets",
    "Phone Accessories",
    "Smart Watches"
  ],

  "Electronics":[
    "TV",
    "Laptop & Computer",
    "Camera",
    "Audio",
    "Gaming",
    "Other Electronics"
  ],

  "Home, Furniture & Garden":[
    "Furniture",
    "Home Decor",
    "Kitchen",
    "Garden",
    "Appliances"
  ],

  "Fashion":[
    "Men",
    "Women",
    "Kids",
    "Shoes",
    "Bags & Accessories",
    "Watches"
  ],

  "Beauty & Personal Care":[
    "Cosmetics",
    "Skin Care",
    "Hair Care",
    "Perfume",
    "Health & Personal Care"
  ],

  "Services":[
    "Tutoring",
    "Cleaning",
    "Transport",
    "Photography",
    "IT & Digital",
    "Other Services"
  ],

  "Repair & Construction":[
    "Electrician",
    "Plumber",
    "AC & Fridge Repair",
    "Construction Materials",
    "Mechanic",
    "Painter"
  ],

  "Commercial Equipment & Machinery":[
    "Factory Equipment",
    "Restaurant Equipment",
    "Office Equipment",
    "Tools",
    "Machinery"
  ],

  "Leisure & Activities":[
    "Sports",
    "Gym & Fitness",
    "Music",
    "Books",
    "Tickets & Events",
    "Hobbies"
  ],

  "Babies & Kids":[
    "Baby Products",
    "Toys",
    "Kids Clothing",
    "Strollers",
    "School Items"
  ],

  "Food, Agriculture & Supplies":[
    "Vegetables",
    "Fruits",
    "Fish",
    "Livestock Feed",
    "Seeds",
    "Farm Products"
  ],

  "Animals & Pets":[
    "Cattle",
    "Goat",
    "Poultry",
    "Pets",
    "Pet Supplies"
  ],

  "Jobs":[
    "Full Time",
    "Part Time",
    "Sales Jobs",
    "Driver Jobs",
    "Office Jobs",
    "Other Jobs"
  ],

  "Seeking Work - CVs":[
    "CVs",
    "Job Seekers",
    "Freelancers",
    "Skilled Workers"
  ],

  "Business & Industry":[
    "Business for Sale",
    "Wholesale",
    "Retail",
    "Industrial Products",
    "Agriculture Business"
  ]

};


/* ============================================================
UPDATE SUBCATEGORY DROPDOWN
============================================================ */

function updateSubcategories(){

  const selectedCategory =
    cat.value;


  sub.innerHTML = "";


  if(!selectedCategory){

    sub.disabled = true;


    const option =
      document.createElement(
        "option"
      );


    option.value = "";


    option.textContent =
      "আগে ক্যাটাগরি নির্বাচন করুন";


    sub.appendChild(
      option
    );


    return;

  }


  sub.disabled = false;


  const allOption =
    document.createElement(
      "option"
    );


  allOption.value = "";


  allOption.textContent =
    "সব সাব-ক্যাটাগরি";


  sub.appendChild(
    allOption
  );


  const subcategories =
    categorySubcategories[
      selectedCategory
    ] || [];


  subcategories.forEach(
    function(subcategory){

      const option =
        document.createElement(
          "option"
        );


      option.value =
        subcategory;


      option.textContent =
        subcategory;


      sub.appendChild(
        option
      );

    }
  );

}


/* ============================================================
SUPABASE
============================================================ */

const SUPA_URL =

  window.SUPABASE_URL ||

  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =

  window.SUPABASE_ANON_KEY ||

  window.supabaseAnonKey ||

  "";


/* ============================================================
SET INITIAL CATEGORY
============================================================ */

if(initialCategory){

  const exists =
    Array.from(
      cat.options
    ).some(function(option){

      return option.value ===
        initialCategory;

    });


  if(exists){

    cat.value =
      initialCategory;

  }

}


/* Populate initial subcategories */

updateSubcategories();


/* ============================================================
HELPERS
============================================================ */

function esc(value){

  return String(value ?? "")

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function getImage(ad){

  if(

    Array.isArray(
      ad.image_urls
    ) &&

    ad.image_urls.length

  ){

    return ad.image_urls[0];

  }


  if(

    typeof ad.image_urls ===
    "string" &&

    ad.image_urls.trim()

  ){

    let value =
      ad.image_urls.trim();


    try{

      const parsed =
        JSON.parse(value);


      if(

        Array.isArray(parsed) &&

        parsed.length

      ){

        return parsed[0];

      }

    }catch(error){}


    if(

      value.startsWith("{") &&

      value.endsWith("}")

    ){

      value =

        value
        .slice(1,-1)
        .split(",")[0]
        .replace(/^"/,"")
        .replace(/"$/,"");

    }


    return value;

  }


  return "";

}


/* ============================================================
LOAD ADS DIRECTLY FROM SUPABASE
============================================================ */

async function loadAds(){

  if(!SUPA_KEY){

    throw new Error(
      "Supabase key পাওয়া যায়নি"
    );

  }


  const url =

    SUPA_URL +

    "/rest/v1/ads" +

    "?select=*" +

    "&order=created_at.desc";


  const response =
    await fetch(

      url,

      {

        method:"GET",

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            SUPA_KEY,

          "Content-Type":
            "application/json"

        }

      }

    );


  if(!response.ok){

    throw new Error(
      await response.text()
    );

  }


  const data =
    await response.json();


  return Array.isArray(data)
    ? data
    : [];

}


/* ============================================================
RENDER ADS
============================================================ */

function render(allAds){


  let list =

    Array.isArray(allAds)

    ?

    allAds.filter(function(ad){

      const status =
        String(
          ad.status || ""
        ).toLowerCase();


      return (

        status === "approved" ||

        status === "published"

      );

    })

    :

    [];


  const category =
    cat.value;


  const subcategory =
    sub.value;


  const selectedArea =
    area.value;


  const query =
    initialQuery
    .trim()
    .toLowerCase();


  /* FILTER */

  list =

    list.filter(function(ad){


      const adCategory =
        String(
          ad.category || ""
        );


      const adSubcategory =
        String(
          ad.subcategory || ""
        );


      const location =
        String(
          ad.location ||
          ad.area ||
          ""
        );


      const searchable =

        [

          ad.title,

          ad.category,

          ad.subcategory,

          ad.location,

          ad.area,

          ad.description,

          ad.brand,

          ad.model

        ]

        .map(function(value){

          return String(
            value || ""
          );

        })

        .join(" ")

        .toLowerCase();


      if(

        category &&

        adCategory !== category

      ){

        return false;

      }


      if(

        subcategory &&

        adSubcategory !==
        subcategory

      ){

        return false;

      }


      if(

        selectedArea &&

        !location.includes(
          selectedArea
        )

      ){

        return false;

      }


      if(

        query &&

        !searchable.includes(
          query
        )

      ){

        return false;

      }


      return true;

    });


  /* SORT */

  if(

    sort.value === "low"

  ){

    list.sort(function(a,b){

      return Number(
        a.price || 0
      )

      -

      Number(
        b.price || 0
      );

    });

  }


  else if(

    sort.value === "high"

  ){

    list.sort(function(a,b){

      return Number(
        b.price || 0
      )

      -

      Number(
        a.price || 0
      );

    });

  }


  else{

    list.sort(function(a,b){

      return String(
        b.created_at ||
        ""
      ).localeCompare(

        String(
          a.created_at ||
          ""
        )

      );

    });

  }


  /* COUNT */

  count.textContent =

    list.length +

    "টি বিজ্ঞাপন";


  /* HEADING */

  if(category){

    heading.textContent =
      cat.options[
        cat.selectedIndex
      ].textContent;

  }

  else{

    heading.textContent =
      "সব বিজ্ঞাপন";

  }


  /* SUMMARY */

  if(category && subcategory){

    summary.textContent =

      cat.options[
        cat.selectedIndex
      ].textContent +

      " — " +

      subcategory +

      " এর বিজ্ঞাপন দেখানো হচ্ছে।";

  }


  else if(category){

    summary.textContent =

      cat.options[
        cat.selectedIndex
      ].textContent +

      " ক্যাটাগরির বিজ্ঞাপন দেখানো হচ্ছে।";

  }


  else if(selectedArea){

    summary.textContent =

      selectedArea +

      " এলাকার বিজ্ঞাপন দেখানো হচ্ছে।";

  }


  else{

    summary.textContent =

      "আপনার এলাকার প্রকাশিত বিজ্ঞাপনগুলো দেখুন।";

  }


  /* EMPTY */

  if(!list.length){

    results.innerHTML = `

      <div class="ads-message">

        কোনো বিজ্ঞাপন পাওয়া যায়নি।

        <br>

        <small>

          অন্য ক্যাটাগরি বা filter দিয়ে চেষ্টা করুন।

        </small>

      </div>

    `;

    return;

  }


  /* PRODUCTS */

  results.innerHTML =

    list.map(function(ad){


      const title =
        esc(
          ad.title ||
          "বিজ্ঞাপন"
        );


      const location =
        esc(
          ad.location ||
          ad.area ||
          ""
        );


      const category =
        esc(
          ad.category ||
          "Marketplace"
        );


      const image =
        getImage(ad);


      const price =

        "৳ " +

        Number(
          ad.price || 0
        )

        .toLocaleString(
          "bn-BD"
        );


      const photo =

        image

        ?

        `

        <div class="photo">

          <img
            src="${esc(image)}"
            alt="${title}"
            loading="lazy">

        </div>

        `

        :

        `

        <div class="photo">

          ${category}

        </div>

        `;


      return `

        <article
          class="product"
          data-id="${esc(
            ad.id || ""
          )}">

          ${photo}

          <div class="body">

            <span class="badge">

              ${category}

            </span>


            <h3>

              ${title}

            </h3>


            <div class="price">

              ${price}

            </div>


            <div class="meta">

              📍 ${location}

            </div>

          </div>

        </article>

      `;

    })

    .join("");


  /* CLICK */

  results
  .querySelectorAll(
    ".product"
  )

  .forEach(function(card){

    card.addEventListener(

      "click",

      function(){

        const id =
          card.dataset.id;


        if(id){

          window.location.href =

            "ad-details.html?id=" +

            encodeURIComponent(id);

        }

      }

    );

  });

}


/* ============================================================
LOAD DATA
============================================================ */

let allAds = [];


results.innerHTML = `

<div class="ads-message">

বিজ্ঞাপন লোড হচ্ছে...

</div>

`;


try{


  allAds =
    await loadAds();


  render(allAds);


}catch(error){


  console.error(
    "Search load error:",
    error
  );


  count.textContent =
    "0টি বিজ্ঞাপন";


  results.innerHTML = `

    <div class="ads-message">

      বিজ্ঞাপন লোড করা যাচ্ছে না।

      <br>

      <small>

        একটু পরে আবার চেষ্টা করুন।

      </small>

    </div>

  `;

}


/* ============================================================
EVENTS
============================================================ */

cat.addEventListener(

  "change",

  function(){

    /*
     * Category পরিবর্তন হলে
     * পুরনো subcategory reset হবে
     */

    updateSubcategories();


    render(allAds);

  }

);


sub.addEventListener(

  "change",

  function(){

    render(allAds);

  }

);


area.addEventListener(

  "change",

  function(){

    render(allAds);

  }

);


sort.addEventListener(

  "change",

  function(){

    render(allAds);

  }

);


clear.addEventListener(

  "click",

  function(){


    cat.value = "";


    /*
     * প্রথমে subcategory dropdown reset
     */

    updateSubcategories();


    area.value = "";


    sort.value = "new";


    render(allAds);


    try{

      history.replaceState(
        {},
        document.title,
        "search.html"
      );

    }catch(error){}

  }

);


});

</script>
