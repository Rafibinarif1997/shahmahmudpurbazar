<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | শাহমাহমুদপুর বাজার</title><link rel="stylesheet" href="style.css"></head><body><main class="container" style="padding:25px 0 80px"><a class="brand" href="index.html"><b>শাহমাহমুদপুর</b><strong>বাজার</strong></a><div class="page-top"><small>ADMIN</small><h1>Moderation Dashboard</h1><p>Pending বিজ্ঞাপন review করুন।</p></div><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>async function boot(){const p=await marketplace.profile();if(!p?.is_admin){list.innerHTML='<p>Admin access required.</p>';return}const {data,error}=await sb.from('ads').select('*,profiles(name)').eq('status','pending').order('created_at',{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=(data||[]).map(a=>`<section class="authbox" style="margin:10px 0"><h3>${marketplace.esc(a.title)}</h3><p>${marketplace.money(a.price)} · ${marketplace.esc(a.category)} · ${marketplace.esc(a.location)}</p><p>${marketplace.esc(a.description||'')}</p><button class="btn green" onclick="moderate('${a.id}','approved')">Approve</button> <button class="btn" onclick="moderate('${a.id}','rejected')">Reject</button></section>`).join('')||'<p class="muted">Pending নেই।</p>'}async function moderate(id,status){const {error}=await sb.from('ads').update({status}).eq('id',id);if(error)alert(error.message);else boot()}boot()</script></body></html>
