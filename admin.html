<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="style.css"></head><body><main class="container" style="padding:35px 0"><a class="brand" href="index.html"><b>শাহমাহমুদপুর</b><strong>বাজার</strong></a><div class="section-title" style="margin-top:30px"><h2>Admin Dashboard</h2><p class="muted">Demo moderation panel — production-এ server-side admin authentication লাগবে।</p><span class="eyebrow">LOCAL CONTROL</span></div><div id="list"></div></main><script src="supabase.js"></script><script src="app.js"></script><script>function render(){let a=ads();list.innerHTML=a.map(x=>`<div class="authbox" style="margin:8px 0;padding:15px;display:flex;justify-content:space-between;gap:12px;align-items:center"><div><b>${escapeHtml(x.title)}</b><div class="meta">${escapeHtml(x.category)} · ${escapeHtml(x.location)} · ${money(x.price)} · ${escapeHtml(x.status)}</div></div><div>${x.status==="pending"?`<button class="btn green" onclick="approve('${x.id}')">Approve</button>`:""} <button class="btn" onclick="removeAd('${x.id}')">Delete</button></div></div>`).join("")}function approve(id){let a=ads();let x=a.find(x=>x.id===id);if(x)x.status="approved";save(a);render()}function removeAd(id){save(ads().filter(x=>x.id!==id));render()}document.addEventListener("DOMContentLoaded",render)</script></body></html>
