<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hijama Appointment | শাহমাহমুদপুর বাজার</title><link rel="stylesheet" href="style.css"></head><body><main class="container" style="max-width:700px;padding:28px 0 80px"><a class="brand" href="index.html"><b>শাহমাহমুদপুর</b><strong>বাজার</strong></a><section class="authbox" style="margin-top:18px"><small>HIJAMA CENTER</small><h1>হিজামা Appointment</h1><p class="muted">আপনার পছন্দের তারিখ ও সময়ের অনুরোধ পাঠান।</p><form id="form"><label>নাম<input id="name" required></label><label>মোবাইল<input id="phone" required></label><label>তারিখ<input id="date" type="date" required></label><label>সময়<select id="time"><option>সকাল ৯টা</option><option>সকাল ১১টা</option><option>দুপুর ১টা</option><option>বিকাল ৪টা</option><option>সন্ধ্যা ৬টা</option></select></label><label>নোট<textarea id="note" rows="4"></textarea></label><button class="btn green">Appointment পাঠান →</button></form><p id="msg" class="msg"></p></section></main><nav class="mobile-nav"><a href="index.html"><span>⌂</span>হোম</a><a href="favorites.html"><span>♡</span>সেভড</a><a href="post-ad.html"><span>＋</span>বিজ্ঞাপন</a><a href="messages.html"><span>▤</span>মেসেজ</a><a href="profile.html"><span>♙</span>প্রোফাইল</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const u=await marketplace.user();if(!u){location.href='login.html?next=hijama.html';return}const {error}=await sb.from('hijama_appointments').insert({user_id:u.id,name:name.value.trim(),phone:phone.value.trim(),appointment_date:date.value,appointment_time:time.value,note:note.value.trim()});msg.textContent=error?error.message:'Appointment request পাঠানো হয়েছে।';if(!error)form.reset()}</script></body></html>
