<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ইমেইল ভেরিফিকেশন | শাহমাহমুদপুর বাজার</title><link rel="stylesheet" href="style.css"><style>
.verify-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 35%,rgba(105,245,165,.10),transparent 35%),#030705}.verify-box{width:100%;max-width:450px;text-align:center;padding:42px 28px;border:1px solid rgba(105,245,165,.2);border-radius:18px;background:rgba(8,17,13,.92);box-shadow:0 0 50px rgba(105,245,165,.08)}.verify-icon{width:78px;height:78px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:38px;color:#031008;background:#69f5a5;box-shadow:0 0 35px rgba(105,245,165,.35)}.verify-box h1{margin:0 0 12px;font-size:25px;color:#eef8f2}.verify-box p{color:#8fa197;font-size:10px;line-height:1.8;margin-bottom:24px}.verify-actions{display:flex;gap:8px;justify-content:center}.verify-actions a{text-decoration:none}</style></head><body><div class="verify-page"><div class="verify-box"><div id="icon" class="verify-icon">✓</div><h1 id="title">ইমেইল ভেরিফাই করা হচ্ছে...</h1><p id="text">একটু অপেক্ষা করুন। আপনার ইমেইল ভেরিফিকেশন যাচাই করা হচ্ছে।</p><div id="actions" class="verify-actions" style="display:none"><a href="login.html" class="btn green">Login করুন →</a><a href="index.html" class="btn">হোমপেজে যান</a></div></div></div><script src="supabase.js"></script><script>
(async function(){
const title=document.getElementById("title"),text=document.getElementById("text"),actions=document.getElementById("actions"),icon=document.getElementById("icon");
try{
const h=new URLSearchParams(location.hash.replace(/^#/,"")),q=new URLSearchParams(location.search);
if(h.get("access_token")){
 const token=h.get("access_token"); localStorage.setItem("sb_access_token",token);
 const r=await fetch(window.SUPABASE_URL+"/auth/v1/user",{headers:{"apikey":window.SUPABASE_ANON_KEY,"Authorization":"Bearer "+token}});
 if(r.ok){const u=await r.json();localStorage.setItem("sb_session",JSON.stringify({access_token:token,user:u}));
 try{const pr=await sb("profiles?select=id,name,phone,is_admin&id=eq."+encodeURIComponent(u.id)+"&limit=1");if(pr&&pr[0])localStorage.setItem("smb_user_v1",JSON.stringify(Object.assign({},pr[0],{email:u.email})))}catch(e){}}
}else if(q.get("code")){
 const r=await fetch(window.SUPABASE_URL+"/auth/v1/token?grant_type=pkce",{method:"POST",headers:{"apikey":window.SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({auth_code:q.get("code")})});
 if(r.ok)setSbSession(await r.json());
}
title.textContent="ইমেইল ভেরিফিকেশন সফল! 🎉";
text.innerHTML="আপনার ইমেইল সফলভাবে যাচাই করা হয়েছে।<br>আপনার অ্যাকাউন্ট এখন ব্যবহার করার জন্য প্রস্তুত।";
actions.style.display="flex";
}catch(e){
icon.textContent="✓";title.textContent="ইমেইল ভেরিফিকেশন সফল! 🎉";text.innerHTML="আপনার ইমেইল সফলভাবে যাচাই করা হয়েছে।<br>এখন Login করে অ্যাকাউন্ট ব্যবহার করুন।";actions.style.display="flex";
}
})();
</script></body></html>
