<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ইমেইল ভেরিফাই হয়েছে | শাহমাহমুদপুর বাজার</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .verify-page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:
        radial-gradient(circle at 50% 35%,
        rgba(105,245,165,.10),
        transparent 35%),
        #030705;
    }

    .verify-box{
      width:100%;
      max-width:440px;
      text-align:center;
      padding:42px 28px;
      border:1px solid rgba(105,245,165,.20);
      border-radius:18px;
      background:rgba(8,17,13,.90);
      box-shadow:
        0 0 50px rgba(105,245,165,.08),
        inset 0 0 35px rgba(105,245,165,.025);
    }

    .verify-icon{
      width:78px;
      height:78px;
      margin:0 auto 22px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      font-size:38px;
      color:#031008;
      background:#69f5a5;
      box-shadow:0 0 35px rgba(105,245,165,.35);
      animation:pop .6s ease;
    }

    .verify-box h1{
      margin:0 0 12px;
      font-size:25px;
      color:#eef8f2;
    }

    .verify-box p{
      color:#8fa197;
      font-size:10px;
      line-height:1.8;
      margin-bottom:24px;
    }

    .verify-actions{
      display:flex;
      gap:8px;
      justify-content:center;
    }

    .verify-actions a{
      text-decoration:none;
    }

    @keyframes pop{
      0%{transform:scale(.5);opacity:0}
      70%{transform:scale(1.08)}
      100%{transform:scale(1);opacity:1}
    }

    @media(max-width:520px){
      .verify-box{
        padding:35px 20px;
      }

      .verify-box h1{
        font-size:22px;
      }

      .verify-actions{
        flex-direction:column;
      }
    }
  </style>
</head>

<body>

<div class="verify-page">
  <div class="verify-box">

    <div class="verify-icon">✓</div>

    <h1>ইমেইল ভেরিফিকেশন সফল! 🎉</h1>

    <p>
      আপনার ইমেইল সফলভাবে যাচাই করা হয়েছে।<br>
      এখন আপনি আপনার শাহমাহমুদপুর বাজার অ্যাকাউন্টে লগইন করতে পারবেন।
    </p>

    <div class="verify-actions">
      <a href="login.html" class="btn green">
        Login করুন →
      </a>

      <a href="index.html" class="btn">
        হোমপেজে যান
      </a>
    </div>

  </div>
</div>

</body>
</html>
