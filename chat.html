<title>মেসেজ | শাহমাহমুদপুর বাজার</title>

<style>

/* ==========================================================
   PREMIUM CHAT PAGE
========================================================== */

:root{
  --page-bg:#f5f8f6;
  --card:#ffffff;
  --card-soft:#f8fbf9;
  --border:#dfe9e3;
  --border-strong:#cfe0d6;
  --text:#1f3027;
  --text-secondary:#53645b;
  --muted:#718078;
  --green:#0d7d4a;
  --green-dark:#086b3d;
  --green-soft:#eaf7ef;
}


/* ==========================================================
   BASE
========================================================== */

body{
  background:var(--page-bg);
  color:var(--text);
}


/* ==========================================================
   PAGE
========================================================== */

.chat-page{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:30px 24px 120px;
  box-sizing:border-box;
}


/* ==========================================================
   BRAND
========================================================== */

.chat-page .brand{
  display:inline-flex;
  margin-bottom:20px;
}


/* ==========================================================
   BACK BUTTON
========================================================== */

.back{

  display:inline-flex;

  align-items:center;

  gap:7px;

  padding:9px 13px;

  border:1px solid var(--border);

  border-radius:12px;

  background:#ffffff;

  color:var(--green-dark);

  text-decoration:none;

  font-size:11px;

  font-weight:800;

  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;

}


.back:hover{

  transform:translateY(-2px);

  border-color:#bcdac8;

  box-shadow:
    0 8px 20px rgba(20,70,45,.08);

}


/* ==========================================================
   CHAT BOX
========================================================== */

.chat-box{

  position:relative;

  margin-top:18px;

  overflow:hidden;

  border:1px solid var(--border);

  border-radius:24px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(60,185,110,.10),
      transparent 30%
    ),
    linear-gradient(
      145deg,
      #ffffff,
      #fbfdfc
    );

  box-shadow:
    0 18px 60px rgba(20,70,45,.08);

}


/* ==========================================================
   CHAT HEADER
========================================================== */

.chat-header{

  position:relative;

  padding:22px 24px;

  border-bottom:
    1px solid #e7eee9;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #f9fcfa
    );

}


.chat-header::after{

  content:"";

  position:absolute;

  width:130px;
  height:130px;

  top:-70px;
  right:-50px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(60,185,110,.11),
      transparent 70%
    );

  pointer-events:none;

}


.chat-header small{

  position:relative;

  z-index:1;

  display:inline-flex;

  align-items:center;

  gap:6px;

  padding:6px 10px;

  border-radius:100px;

  background:var(--green-soft);

  border:1px solid #d7ebde;

  color:var(--green-dark);

  font-size:9px;

  font-weight:900;

  letter-spacing:.8px;

}


.chat-header h2{

  position:relative;

  z-index:1;

  margin:12px 0 6px;

  color:#1d3026;

  font-size:22px;

  font-weight:900;

  line-height:1.4;

}


.chat-header p{

  position:relative;

  z-index:1;

  margin:0;

  color:var(--muted);

  font-size:11px;

  font-weight:600;

}


/* ==========================================================
   MESSAGES AREA
========================================================== */

.messages{

  height:500px;

  overflow-y:auto;

  padding:22px;

  box-sizing:border-box;

  background:
    linear-gradient(
      180deg,
      #fbfdfc,
      #f7faf8
    );

  scrollbar-width:thin;

  scrollbar-color:
    #c8d8ce
    transparent;

}


.messages::-webkit-scrollbar{

  width:6px;

}


.messages::-webkit-scrollbar-track{

  background:transparent;

}


.messages::-webkit-scrollbar-thumb{

  border-radius:20px;

  background:#c8d8ce;

}


/* ==========================================================
   EMPTY / LOADING
========================================================== */

.empty,
.loading{

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:var(--muted);

  font-size:12px;

  font-weight:600;

  line-height:1.8;

}


/* ==========================================================
   MESSAGE ROW
========================================================== */

.row{

  display:flex;

  margin-bottom:14px;

  animation:
    messageAppear
    .25s ease;

}


@keyframes messageAppear{

  from{

    opacity:0;

    transform:
      translateY(6px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}


.row.mine{

  justify-content:flex-end;

}


.row.theirs{

  justify-content:flex-start;

}


/* ==========================================================
   MESSAGE BUBBLE
========================================================== */

.bubble{

  max-width:78%;

  padding:11px 14px 9px;

  border-radius:18px;

  font-size:12px;

  font-weight:500;

  line-height:1.65;

  white-space:pre-wrap;

  word-break:break-word;

  box-sizing:border-box;

}


.mine .bubble{

  color:#ffffff;

  background:
    linear-gradient(
      135deg,
      #087443,
      #159358
    );

  border-bottom-right-radius:5px;

  box-shadow:
    0 8px 18px rgba(8,116,67,.15);

}


.theirs .bubble{

  color:#34443b;

  background:#ffffff;

  border:1px solid var(--border);

  border-bottom-left-radius:5px;

  box-shadow:
    0 5px 15px rgba(20,70,45,.04);

}


.time{

  display:block;

  margin-top:4px;

  font-size:8px;

  font-weight:600;

  opacity:.7;

}


.mine .time{

  color:
    rgba(255,255,255,.8);

}


.theirs .time{

  color:#74827a;

}


/* ==========================================================
   FORM
========================================================== */

.form{

  display:flex;

  align-items:center;

  gap:10px;

  padding:16px;

  border-top:
    1px solid #e5ece7;

  background:#ffffff;

}


.form input{

  flex:1;

  min-width:0;

  height:48px;

  padding:
    0
    16px;

  box-sizing:border-box;

  border:
    1px solid #dce8e1;

  border-radius:14px;

  outline:none;

  background:#f8fbf9;

  color:var(--text);

  font-family:inherit;

  font-size:12px;

  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;

}


.form input:focus{

  border-color:
    rgba(13,125,74,.45);

  background:#ffffff;

  box-shadow:
    0 0 0 4px
    rgba(13,125,74,.07);

}


.form input::placeholder{

  color:#9aa79f;

}


.form button{

  flex:none;

  height:48px;

  padding:
    0
    20px;

  border-radius:14px;

  font-size:12px;

  font-weight:850;

}


/* ==========================================================
   ERROR
========================================================== */

.error{

  margin:18px;

  padding:16px;

  border-radius:14px;

  border:
    1px solid #f0d5d5;

  background:#fff8f8;

  color:#b64a4a;

  font-size:11px;

  font-weight:600;

  line-height:1.8;

}


/* ==========================================================
   TABLET
========================================================== */

@media(max-width:900px){

  .chat-page{

    max-width:760px;

    padding:
      20px 14px
      110px;

  }


  .chat-page .brand{

    margin-bottom:16px;

  }


  .chat-box{

    border-radius:20px;

  }


  .chat-header{

    padding:20px;

  }


  .messages{

    height:480px;

    padding:18px;

  }


}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:600px){

  .chat-page{

    padding:
      16px 12px
      105px;

  }


  .back{

    padding:8px 11px;

    font-size:10px;

    border-radius:10px;

  }


  .chat-box{

    margin-top:14px;

    border-radius:18px;

  }


  .chat-header{

    padding:18px 16px;

  }


  .chat-header small{

    font-size:8px;

    padding:5px 9px;

  }


  .chat-header h2{

    margin-top:10px;

    font-size:18px;

  }


  .chat-header p{

    font-size:10px;

  }


  .messages{

    height:430px;

    padding:14px;

  }


  .row{

    margin-bottom:10px;

  }


  .bubble{

    max-width:86%;

    padding:10px 12px 8px;

    border-radius:16px;

    font-size:11px;

    line-height:1.6;

  }


  .time{

    font-size:7px;

  }


  .form{

    gap:8px;

    padding:11px;

  }


  .form input{

    height:44px;

    padding:0 13px;

    border-radius:12px;

    font-size:11px;

  }


  .form button{

    height:44px;

    padding:0 14px;

    border-radius:12px;

    font-size:11px;

  }


  .empty,
  .loading{

    font-size:11px;

  }

}

</style>

</head>

<script src="supabase.js?v=31"></script>


<script>

(function(){

"use strict";


/* ============================================================
   CONFIG
============================================================ */

const SUPA_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


/* ============================================================
   ELEMENTS
============================================================ */

const titleEl =
  document.getElementById("title");


const personEl =
  document.getElementById("person");


const messagesEl =
  document.getElementById("messages");


const form =
  document.getElementById("form");


const input =
  document.getElementById("input");


const send =
  document.getElementById("send");


/* ============================================================
   URL
============================================================ */

const params =
  new URLSearchParams(
    location.search
  );


let conversationId =
  params.get("conversation") || "";


const adId =
  params.get("id") || "";


/* ============================================================
   STATE
============================================================ */

let currentUser = null;

let session = null;

let conversation = null;

let otherUserId = null;

let busy = false;


/* ============================================================
   ESCAPE
============================================================ */

function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ============================================================
   SESSION
============================================================ */

async function getSession(){

  if(
    typeof getSbSession ===
    "function"
  ){

    try{

      const s =
        await getSbSession();

      if(
        s &&
        s.access_token
      ){

        return s;

      }

    }catch(error){

      console.error(
        "SESSION ERROR:",
        error
      );

    }

  }

  return null;

}


/* ============================================================
   USER
============================================================ */

async function getUser(){

  if(
    typeof getCurrentUser ===
    "function"
  ){

    try{

      const user =
        await getCurrentUser();

      if(user){

        return user;

      }

    }catch(error){

      console.error(
        "USER ERROR:",
        error
      );

    }

  }


  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          "smb_user_v1"
        ) || "null"
      );


    if(
      saved &&
      saved.id
    ){

      return {

        id:
          saved.id,

        email:
          saved.email || ""

      };

    }

  }catch(error){

    console.error(
      "LOCAL USER ERROR:",
      error
    );

  }


  return null;

}


/* ============================================================
   API REQUEST
============================================================ */

async function request(
  url,
  options={}
){

  const response =
    await fetch(
      url,
      {

        ...options,

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }
    );


  if(!response.ok){

    const errorText =
      await response.text();


    throw new Error(
      errorText
    );

  }


  const text =
    await response.text();


  return text
    ? JSON.parse(text)
    : null;

}


/* ============================================================
   GET AD
============================================================ */

async function getAd(
  id
){

  const url =

    SUPA_URL +

    "/rest/v1/ads" +

    "?id=eq." +

    encodeURIComponent(id) +

    "&select=*";


  const data =
    await request(url);


  return(

    Array.isArray(data) &&

    data.length

  )

  ? data[0]

  : null;

}


/* ============================================================
   FIND CONVERSATION
============================================================ */

async function findConversation(
  ad
){

  const uid =
    encodeURIComponent(
      currentUser.id
    );


  const sellerId =
    String(
      ad.seller_id || ""
    );


  if(!sellerId){

    throw new Error(
      "বিক্রেতার User ID পাওয়া যায়নি।"
    );

  }


  if(
    sellerId ===
    String(currentUser.id)
  ){

    throw new Error(
      "এটি আপনার নিজের বিজ্ঞাপন।"
    );

  }


  const url =

    SUPA_URL +

    "/rest/v1/conversations" +

    "?ad_id=eq." +

    encodeURIComponent(ad.id) +

    "&buyer_id=eq." +

    uid +

    "&seller_id=eq." +

    encodeURIComponent(sellerId) +

    "&select=*";


  const data =
    await request(url);


  if(
    Array.isArray(data) &&
    data.length
  ){

    return data[0];

  }


  const insertUrl =
    SUPA_URL +
    "/rest/v1/conversations";


  const created =
    await request(
      insertUrl,
      {

        method:"POST",

        headers:{

          "Prefer":
            "return=representation"

        },

        body:
          JSON.stringify({

            ad_id:
              ad.id,

            buyer_id:
              currentUser.id,

            seller_id:
              sellerId

          })

      }
    );


  if(
    Array.isArray(created) &&
    created.length
  ){

    return created[0];

  }


  throw new Error(
    "Conversation তৈরি করা যায়নি।"
  );

}


/* ============================================================
   LOAD CONVERSATION
============================================================ */

async function loadConversation(){


  if(conversationId){

    const url =

      SUPA_URL +

      "/rest/v1/conversations" +

      "?id=eq." +

      encodeURIComponent(
        conversationId
      ) +

      "&select=*";


    const data =
      await request(url);


    if(
      !Array.isArray(data) ||
      !data.length
    ){

      throw new Error(
        "কথোপকথন পাওয়া যায়নি।"
      );

    }


    conversation =
      data[0];

  }


  else if(adId){

    const ad =
      await getAd(adId);


    if(!ad){

      throw new Error(
        "বিজ্ঞাপন পাওয়া যায়নি।"
      );

    }


    if(
      String(ad.seller_id) ===
      String(currentUser.id)
    ){

      throw new Error(
        "নিজের বিজ্ঞাপনে নতুন Buyer chat খুলতে Inbox ব্যবহার করুন।"
      );

    }


    conversation =
      await findConversation(
        ad
      );


    conversationId =
      String(
        conversation.id
      );


    history.replaceState(
      null,
      "",
      "chat.html?conversation=" +
      encodeURIComponent(
        conversationId
      )
    );

  }


  else{

    throw new Error(
      "Chat ID পাওয়া যায়নি।"
    );

  }


  const uid =
    String(
      currentUser.id
    );


  const isParticipant =

    String(
      conversation.buyer_id
    ) === uid

    ||

    String(
      conversation.seller_id
    ) === uid;


  if(!isParticipant){

    throw new Error(
      "এই chat দেখার অনুমতি আপনার নেই।"
    );

  }


  if(
    String(
      conversation.buyer_id
    ) === uid
  ){

    otherUserId =
      conversation.seller_id;

  }else{

    otherUserId =
      conversation.buyer_id;

  }


  try{

    const ad =
      await getAd(
        conversation.ad_id
      );


    if(ad){

      titleEl.textContent =
        ad.title ||
        "বিজ্ঞাপন";

    }

  }catch(error){

    console.error(
      "AD TITLE ERROR:",
      error
    );

  }


  personEl.textContent =
    "ব্যক্তিগত কথোপকথন";

}


/* ============================================================
   MARK INCOMING MESSAGES AS READ
============================================================ */

async function markMessagesAsRead(){

  if(
    !conversationId ||
    !currentUser ||
    !currentUser.id
  ){

    return;

  }


  try{

    const url =

      SUPA_URL +

      "/rest/v1/messages" +

      "?conversation_id=eq." +

      encodeURIComponent(
        conversationId
      ) +

      "&receiver_id=eq." +

      encodeURIComponent(
        currentUser.id
      ) +

      "&is_read=eq.false";


    const response =
      await fetch(
        url,
        {

          method:"PATCH",

          headers:{

            "apikey":
              SUPA_KEY,

            "Authorization":
              "Bearer " +
              session.access_token,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              is_read:true

            })

        }
      );


    if(!response.ok){

      console.warn(
        "MARK READ ERROR:",
        await response.text()
      );

      return;

    }


    console.log(
      "Messages marked as read."
    );


  }catch(error){

    console.error(
      "READ ERROR:",
      error
    );

  }

}


/* ============================================================
   LOAD MESSAGES
============================================================ */

async function loadMessages(){

  if(!conversationId){

    return;

  }


  const url =

    SUPA_URL +

    "/rest/v1/messages" +

    "?conversation_id=eq." +

    encodeURIComponent(
      conversationId
    ) +

    "&select=*" +

    "&order=created_at.asc";


  const data =
    await request(url);


  const messages =
    Array.isArray(data)
    ? data
    : [];


  await markMessagesAsRead();


  if(!messages.length){

    messagesEl.innerHTML = `

      <div class="empty">

        এখনো কোনো মেসেজ নেই।

        <br><br>

        নিচে লিখে কথোপকথন শুরু করুন।

      </div>

    `;

    return;

  }


  messagesEl.innerHTML =

    messages

      .map(
        function(message){

          const mine =

            String(
              message.sender_id
            ) ===

            String(
              currentUser.id
            );


          const time =

            message.created_at

            ?

            new Date(
              message.created_at
            ).toLocaleString(
              "bn-BD",
              {

                day:"numeric",

                month:"short",

                hour:"numeric",

                minute:"2-digit"

              }
            )

            :

            "";


          return `

            <div
              class="
                row
                ${mine
                  ? "mine"
                  : "theirs"}
              ">

              <div class="bubble">

                ${esc(
                  message.body || ""
                )}

                <span class="time">

                  ${esc(time)}

                </span>

              </div>

            </div>

          `;

        }
      )

      .join("");


  messagesEl.scrollTop =
    messagesEl.scrollHeight;

}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage(){

  const text =
    input.value.trim();


  if(!text){

    return;

  }


  if(!conversationId){

    return;

  }


  if(!otherUserId){

    alert(
      "অপর পক্ষের User ID পাওয়া যায়নি।"
    );

    return;

  }


  if(busy){

    return;

  }


  busy = true;

  send.disabled = true;

  send.textContent =
    "পাঠানো হচ্ছে...";


  try{

    const url =
      SUPA_URL +
      "/rest/v1/messages";


    await request(
      url,
      {

        method:"POST",

        headers:{

          "Prefer":
            "return=representation"

        },

        body:
          JSON.stringify({

            conversation_id:
              conversationId,

            sender_id:
              currentUser.id,

            receiver_id:
              otherUserId,

            body:
              text,

            is_read:
              false

          })

      }
    );


    input.value = "";


    await loadMessages();


  }catch(error){

    console.error(
      "SEND ERROR:",
      error
    );


    alert(
      error.message ||
      "মেসেজ পাঠানো যায়নি।"
    );


  }finally{

    busy = false;

    send.disabled = false;

    send.textContent =
      "পাঠান";

    input.focus();

  }

}


/* ============================================================
   FORM
============================================================ */

form.addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    sendMessage();

  }
);


/* ============================================================
   START
============================================================ */

async function start(){

  try{

    currentUser =
      await getUser();


    if(!currentUser){

      messagesEl.innerHTML = `

        <div class="empty">

          মেসেজ দেখতে আগে লগইন করুন।

          <br><br>

          <a
            href="login.html"
            class="btn green">

            লগইন করুন

          </a>

        </div>

      `;

      return;

    }


    session =
      await getSession();


    if(!session){

      throw new Error(
        "Login session পাওয়া যায়নি।"
      );

    }


    await loadConversation();


    await loadMessages();


    setInterval(
      async function(){

        try{

          await loadMessages();

        }catch(error){

          console.error(
            "AUTO MESSAGE LOAD ERROR:",
            error
          );

        }

      },
      3000
    );


  }catch(error){

    console.error(
      "CHAT ERROR:",
      error
    );


    messagesEl.innerHTML = `

      <div class="error">

        ${esc(
          error.message ||
          "Chat চালু করা যায়নি।"
        )}

      </div>

    `;

  }

}


start();


})();

</script>
