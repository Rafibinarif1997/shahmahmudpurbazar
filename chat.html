<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Chat | শাহমাহমুদপুর বাজার</title>

<link rel="stylesheet"
      href="style.css">

<style>

.chat-page{
  max-width:760px;
  padding:30px 16px 110px;
}

.back{
  display:inline-block;
  margin-top:20px;
  color:#69f5a5;
  text-decoration:none;
  font-size:10px;
}

.chat-box{
  margin-top:20px;
  overflow:hidden;
  border:1px solid rgba(105,245,165,.12);
  border-radius:18px;
  background:rgba(5,14,10,.72);
}

.chat-header{
  padding:17px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.chat-header small{
  display:block;
  color:#69f5a5;
  font-size:8px;
  font-weight:800;
  letter-spacing:1.5px;
}

.chat-header h2{
  margin:6px 0;
  color:#edf7f1;
  font-size:18px;
}

.chat-header p{
  margin:0;
  color:#718078;
  font-size:9px;
}

.messages{
  height:430px;
  overflow-y:auto;
  padding:16px;
}

.empty,
.loading{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#718078;
  font-size:11px;
}

.row{
  display:flex;
  margin-bottom:12px;
}

.row.mine{
  justify-content:flex-end;
}

.row.theirs{
  justify-content:flex-start;
}

.bubble{
  max-width:80%;
  padding:10px 12px;
  border-radius:14px;
  font-size:11px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}

.mine .bubble{
  color:#031009;
  background:#69f5a5;
  border-bottom-right-radius:4px;
}

.theirs .bubble{
  color:#dce9e1;
  background:#14231b;
  border:1px solid rgba(255,255,255,.06);
  border-bottom-left-radius:4px;
}

.time{
  display:block;
  margin-top:4px;
  font-size:7px;
  opacity:.65;
}

.form{
  display:flex;
  gap:8px;
  padding:13px;
  border-top:1px solid rgba(255,255,255,.06);
}

.form input{
  flex:1;
  min-width:0;
}

.form button{
  flex:0 0 auto;
}

.error{
  margin:14px;
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(255,90,90,.18);
  color:#ff9d9d;
  font-size:10px;
  line-height:1.7;
}

</style>

</head>


<body>


<main class="container chat-page">


<a
  href="messages.html"
  class="brand">

  <b>শাহমাহমুদপুর</b>

  <strong>বাজার</strong>

  <small>LOCAL MARKETPLACE</small>

</a>


<a
  href="messages.html"
  class="back">

  ← Messages

</a>


<section class="chat-box">


<div class="chat-header">

  <small>
    PRIVATE CHAT
  </small>

  <h2 id="title">
    Chat
  </h2>

  <p id="person">
    কথোপকথন লোড হচ্ছে...
  </p>

</div>


<div
  id="messages"
  class="messages">

  <div class="loading">
    মেসেজ লোড হচ্ছে...
  </div>

</div>


<form
  id="form"
  class="form">

  <input
    id="input"
    type="text"
    maxlength="2000"
    autocomplete="off"
    placeholder="মেসেজ লিখুন...">

  <button
    id="send"
    type="submit"
    class="btn green">

    Send

  </button>

</form>


</section>


</main>

<script src="supabase.js?v=30"></script>


<script>

(function(){

"use strict";


const SUPA_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


const titleEl =
  document.getElementById("title");


const personEl =
  document.getElementById("person");


const messagesEl =
  document.getElementById("messages");


const form =
  document.getElementById("form");


const input =
  document.getElementById("input");


const send =
  document.getElementById("send");


const params =
  new URLSearchParams(
    location.search
  );


let conversationId =
  params.get("conversation") || "";


const adId =
  params.get("id") || "";


let currentUser = null;

let session = null;

let conversation = null;

let otherUserId = null;

let busy = false;



function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}



async function getSession(){

  if(typeof getSbSession === "function"){

    const s =
      await getSbSession();

    if(
      s &&
      s.access_token
    ){

      return s;

    }

  }

  return null;

}



async function getUser(){

  if(typeof getCurrentUser === "function"){

    try{

      const user =
        await getCurrentUser();

      if(user){

        return user;

      }

    }catch(e){

      console.error(e);

    }

  }


  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          "smb_user_v1"
        ) || "null"
      );

    if(saved && saved.id){

      return {
        id:saved.id,
        email:saved.email || ""
      };

    }

  }catch(e){}


  return null;

}



async function request(
  url,
  options={}
){

  const response =
    await fetch(
      url,
      {

        ...options,

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }
    );


  if(!response.ok){

    throw new Error(
      await response.text()
    );

  }


  const text =
    await response.text();


  return text
    ? JSON.parse(text)
    : null;

}



/*
 * পণ্যের তথ্য
 */

async function getAd(
  id
){

  const url =

    SUPA_URL +
    "/rest/v1/ads" +

    "?id=eq." +
    encodeURIComponent(id) +

    "&select=*";


  const data =
    await request(url);


  return(
    Array.isArray(data) &&
    data.length
  )
  ? data[0]
  : null;

}



/*
 * Conversation খুঁজে বের করা
 */

async function findConversation(
  ad
){

  const uid =
    encodeURIComponent(
      currentUser.id
    );


  const sellerId =
    String(
      ad.seller_id || ""
    );


  if(!sellerId){

    throw new Error(
      "বিক্রেতার User ID পাওয়া যায়নি।"
    );

  }


  /*
   * নিজের পণ্যে নিজের সাথে chat নয়
   */

  if(
    sellerId ===
    String(currentUser.id)
  ){

    throw new Error(
      "এটি আপনার নিজের বিজ্ঞাপন।"
    );

  }


  /*
   * Buyer + Seller + Product
   */

  const url =

    SUPA_URL +
    "/rest/v1/conversations" +

    "?ad_id=eq." +
    encodeURIComponent(ad.id) +

    "&buyer_id=eq." +
    uid +

    "&seller_id=eq." +
    encodeURIComponent(sellerId) +

    "&select=*";


  const data =
    await request(url);


  if(
    Array.isArray(data) &&
    data.length
  ){

    return data[0];

  }


  /*
   * Conversation নেই।
   * নতুন conversation তৈরি হবে।
   */

  const insertUrl =
    SUPA_URL +
    "/rest/v1/conversations";


  const created =
    await request(
      insertUrl,
      {

        method:"POST",

        headers:{

          "Prefer":
            "return=representation"

        },

        body:
          JSON.stringify({

            ad_id:
              ad.id,

            buyer_id:
              currentUser.id,

            seller_id:
              sellerId

          })

      }
    );


  if(
    Array.isArray(created) &&
    created.length
  ){

    return created[0];

  }


  throw new Error(
    "Conversation তৈরি করা যায়নি।"
  );

}



/*
 * Conversation যাচাই
 */

async function loadConversation(){

  /*
   * যদি Inbox থেকে conversation ID আসে
   */

  if(conversationId){

    const url =

      SUPA_URL +
      "/rest/v1/conversations" +

      "?id=eq." +
      encodeURIComponent(
        conversationId
      ) +

      "&select=*";


    const data =
      await request(url);


    if(
      !Array.isArray(data) ||
      !data.length
    ){

      throw new Error(
        "কথোপকথন পাওয়া যায়নি।"
      );

    }


    conversation =
      data[0];

  }


  /*
   * যদি Product page থেকে id আসে
   */

  else if(adId){

    const ad =
      await getAd(adId);


    if(!ad){

      throw new Error(
        "বিজ্ঞাপন পাওয়া যায়নি।"
      );

    }


    conversation =
      await findConversation(
        ad
      );


    conversationId =
      String(
        conversation.id
      );


    /*
     * URL-এ conversation ID বসিয়ে দিই
     */

    history.replaceState(
      null,
      "",
      "chat.html?conversation=" +
      encodeURIComponent(
        conversationId
      )
    );

  }


  else{

    throw new Error(
      "Chat ID পাওয়া যায়নি।"
    );

  }


  /*
   * User এই conversation-এর
   * participant কি না
   */

  const uid =
    String(
      currentUser.id
    );


  const isParticipant =

    String(
      conversation.buyer_id
    ) === uid

    ||

    String(
      conversation.seller_id
    ) === uid;


  if(!isParticipant){

    throw new Error(
      "এই chat দেখার অনুমতি আপনার নেই।"
    );

  }


  /*
   * অপর পক্ষ
   */

  if(
    String(
      conversation.buyer_id
    ) === uid
  ){

    otherUserId =
      conversation.seller_id;

  }else{

    otherUserId =
      conversation.buyer_id;

  }


  /*
   * Ad title
   */

  try{

    const ad =
      await getAd(
        conversation.ad_id
      );


    if(ad){

      titleEl.textContent =
        ad.title ||
        "বিজ্ঞাপন";

    }

  }catch(e){

    console.error(e);

  }


  personEl.textContent =
    "Private conversation";

}



/*
 * Message load
 */

async function loadMessages(){

  if(!conversationId){

    return;

  }


  const url =

    SUPA_URL +
    "/rest/v1/messages" +

    "?conversation_id=eq." +
    encodeURIComponent(
      conversationId
    ) +

    "&select=*" +

    "&order=created_at.asc";


  const data =
    await request(url);


  const messages =
    Array.isArray(data)
    ? data
    : [];


  if(!messages.length){

    messagesEl.innerHTML = `

      <div class="empty">

        এখনো কোনো মেসেজ নেই।

        <br><br>

        নিচে লিখে কথোপকথন শুরু করুন।

      </div>

    `;

    return;

  }


  messagesEl.innerHTML =

    messages
      .map(
        function(message){

          const mine =

            String(
              message.sender_id
            ) ===

            String(
              currentUser.id
            );


          const time =

            message.created_at

            ?

            new Date(
              message.created_at
            ).toLocaleString(
              "bn-BD",
              {
                day:"numeric",
                month:"short",
                hour:"numeric",
                minute:"2-digit"
              }
            )

            :

            "";


          return `

            <div
              class="
                row
                ${mine
                  ? "mine"
                  : "theirs"}
              ">

              <div class="bubble">

                ${esc(
                  message.body || ""
                )}

                <span class="time">

                  ${esc(time)}

                </span>

              </div>

            </div>

          `;

        }
      )
      .join("");


  messagesEl.scrollTop =
    messagesEl.scrollHeight;

}



/*
 * Send
 */

async function sendMessage(){

  const text =
    input.value.trim();


  if(!text){

    return;

  }


  if(!conversationId){

    return;

  }


  if(!otherUserId){

    alert(
      "অপর পক্ষের User ID পাওয়া যায়নি।"
    );

    return;

  }


  if(busy){

    return;

  }


  busy = true;

  send.disabled = true;

  send.textContent =
    "Sending...";


  try{

    const url =
      SUPA_URL +
      "/rest/v1/messages";


    await request(
      url,
      {

        method:"POST",

        headers:{

          "Prefer":
            "return=representation"

        },

        body:
          JSON.stringify({

            conversation_id:
              conversationId,

            sender_id:
              currentUser.id,

            receiver_id:
              otherUserId,

            body:
              text

          })

      }
    );


    input.value = "";


    await loadMessages();


  }catch(error){

    console.error(
      "SEND ERROR:",
      error
    );


    alert(
      error.message ||
      "মেসেজ পাঠানো যায়নি।"
    );


  }finally{

    busy = false;

    send.disabled = false;

    send.textContent =
      "Send";

    input.focus();

  }

}



form.addEventListener(
  "submit",
  function(e){

    e.preventDefault();

    sendMessage();

  }
);



async function start(){

  try{

    currentUser =
      await getUser();


    if(!currentUser){

      messagesEl.innerHTML = `

        <div class="empty">

          আগে Login করুন।

          <br><br>

          <a
            href="login.html"
            class="btn green">

            Login

          </a>

        </div>

      `;

      return;

    }


    session =
      await getSession();


    if(!session){

      throw new Error(
        "Login session পাওয়া যায়নি।"
      );

    }


    await loadConversation();

    await loadMessages();


    /*
     * প্রতি ৩ সেকেন্ডে নতুন message
     */

    setInterval(
      async function(){

        try{

          await loadMessages();

        }catch(e){

          console.error(e);

        }

      },
      3000
    );


  }catch(error){

    console.error(
      "CHAT ERROR:",
      error
    );


    messagesEl.innerHTML = `

      <div class="error">

        ${esc(
          error.message ||
          "Chat চালু করা যায়নি।"
        )}

      </div>

    `;

  }

}


start();


})();

</script>
