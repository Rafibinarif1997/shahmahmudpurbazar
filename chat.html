<style>

.chat-page{

  max-width:760px;

  padding:
    30px
    16px
    110px;

}


.chat-card{

  margin-top:25px;

  overflow:hidden;

  border:
    1px solid
    rgba(105,245,165,.12);

  border-radius:18px;

  background:
    rgba(5,14,10,.78);

}


.chat-header{

  padding:17px;

  border-bottom:
    1px solid
    rgba(255,255,255,.06);

}


.chat-header small{

  display:block;

  color:#69f5a5;

  font-size:8px;

  font-weight:800;

  letter-spacing:1.8px;

}


.chat-header h1{

  margin:
    7px
    0
    4px;

  color:#edf7f1;

  font-size:19px;

}


.chat-header p{

  margin:0;

  color:#718078;

  font-size:9px;

}


.messages{

  height:430px;

  overflow-y:auto;

  padding:17px;

}


.loading{

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#718078;

  font-size:11px;

}


.message-row{

  display:flex;

  margin-bottom:12px;

}


.message-row.mine{

  justify-content:flex-end;

}


.message-row.theirs{

  justify-content:flex-start;

}


.bubble{

  max-width:78%;

  padding:
    10px
    13px;

  border-radius:14px;

  font-size:11px;

  line-height:1.6;

  white-space:pre-wrap;

  word-break:break-word;

}


.mine .bubble{

  color:#031009;

  background:#69f5a5;

  border-bottom-right-radius:4px;

}


.theirs .bubble{

  color:#dce9e1;

  background:#14231b;

  border:
    1px solid
    rgba(255,255,255,.06);

  border-bottom-left-radius:4px;

}


.time{

  display:block;

  margin-top:4px;

  font-size:7px;

  opacity:.6;

}


.chat-form{

  display:flex;

  gap:8px;

  padding:13px;

  border-top:
    1px solid
    rgba(255,255,255,.06);

}


.chat-form input{

  flex:1;

  min-width:0;

}


.chat-form button{

  flex:0 0 auto;

}


.error{

  margin:15px;

  padding:12px;

  border:
    1px solid
    rgba(255,90,90,.18);

  border-radius:11px;

  background:
    rgba(255,90,90,.04);

  color:#ff9d9d;

  font-size:10px;

  line-height:1.7;

}


.empty{

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#718078;

  font-size:10px;

  line-height:1.8;

}


@media(max-width:500px){

  .messages{

    height:400px;

  }


  .bubble{

    max-width:85%;

  }

}

</style>

</head>


<body>


<main class="container chat-page">


<a
  href="index.html"
  class="brand">

  <b>
    শাহমাহমুদপুর
  </b>

  <strong>
    বাজার
  </strong>

  <small>
    LOCAL MARKETPLACE
  </small>

</a>



<section
  id="chatCard"
  class="chat-card"
  style="display:none">


  <div class="chat-header">

    <small>
      PRIVATE CHAT
    </small>

    <h1 id="adTitle">
      বিজ্ঞাপন
    </h1>

    <p id="chatPerson">
      বিক্রেতার সাথে যোগাযোগ
    </p>

  </div>



  <div
    id="errorBox"
    class="error"
    style="display:none">
  </div>



  <div
    id="messages"
    class="messages">

    <div class="loading">

      Chat লোড হচ্ছে...

    </div>

  </div>



  <form
    id="chatForm"
    class="chat-form">

    <input
      id="messageInput"
      type="text"
      maxlength="2000"
      autocomplete="off"
      placeholder="মেসেজ লিখুন...">

    <button
      id="sendButton"
      type="submit"
      class="btn green">

      Send

    </button>

  </form>


</section>



<section
  id="loginBox"
  class="authbox"
  style="
    display:none;
    margin-top:25px;
    padding:30px 20px;
    text-align:center;
  ">

  <h2>
    মেসেজ করতে Login করুন
  </h2>

  <p class="muted">

    বিক্রেতার সাথে যোগাযোগ করতে
    আপনার account-এ Login করতে হবে।

  </p>

  <br>

  <a
    href="login.html?next=chat.html"
    class="btn green">

    Google দিয়ে Login করুন

  </a>

</section>



</main>

  <span>⌂</span>

  <span>♡</span>
  Saved

</a>

  <span>⊞</span>
  Sell

</a>

  <span>▤</span>

<script src="supabase.js?v=14"></script>


<script src="app.js?v=14"></script>


<script>

(function(){

"use strict";


/* ============================================================
   CONFIG
============================================================ */

const SUPA_URL =

  window.SUPABASE_URL ||

  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =

  window.SUPABASE_ANON_KEY ||

  window.supabaseAnonKey ||

  "";



/* ============================================================
   ELEMENTS
============================================================ */

const chatCard =
  document.getElementById(
    "chatCard"
  );


const loginBox =
  document.getElementById(
    "loginBox"
  );


const messagesBox =
  document.getElementById(
    "messages"
  );


const chatForm =
  document.getElementById(
    "chatForm"
  );


const messageInput =
  document.getElementById(
    "messageInput"
  );


const sendButton =
  document.getElementById(
    "sendButton"
  );


const errorBox =
  document.getElementById(
    "errorBox"
  );


const adTitle =
  document.getElementById(
    "adTitle"
  );


const chatPerson =
  document.getElementById(
    "chatPerson"
  );



/* ============================================================
   URL
============================================================ */

const params =

  new URLSearchParams(
    window.location.search
  );


const adId =
  params.get("id") || "";



/* ============================================================
   STATE
============================================================ */

let currentUser = null;

let ad = null;

let conversation = null;

let loadingMessages = false;



/* ============================================================
   ESCAPE
============================================================ */

function esc(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}



/* ============================================================
   ERROR
============================================================ */

function showError(text){

  errorBox.style.display =
    "block";

  errorBox.textContent =
    text;

}


function clearError(){

  errorBox.style.display =
    "none";

  errorBox.textContent =
    "";

}



/* ============================================================
   SESSION
============================================================ */

async function getSession(){

  try{

    if(
      typeof getSbSession ===
      "function"
    ){

      const s =
        await getSbSession();


      if(
        s &&
        s.access_token
      ){

        return s;

      }

    }

  }catch(error){

    console.error(
      error
    );

  }


  return null;

}



/* ============================================================
   USER
============================================================ */

async function getUser(){

  try{

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const u =
        await getCurrentUser();


      if(u){

        return u;

      }

    }

  }catch(error){

    console.error(
      error
    );

  }


  try{

    const stored =
      JSON.parse(

        localStorage.getItem(
          "smb_user_v1"
        )

        || "null"

      );


    if(
      stored &&
      stored.id
    ){

      return {

        id:
          stored.id,

        email:
          stored.email || ""

      };

    }

  }catch(error){}


  return null;

}



/* ============================================================
   GET AD
============================================================ */

async function getAd(){

  if(
    typeof window.getAdById ===
    "function"
  ){

    try{

      const result =
        await window.getAdById(
          adId
        );


      if(result){

        return result;

      }

    }catch(error){

      console.error(
        "getAdById error:",
        error
      );

    }

  }


  const session =
    await getSession();


  if(!session){

    return null;

  }


  const response =
    await fetch(

      SUPA_URL +
      "/rest/v1/ads" +
      "?id=eq." +
      encodeURIComponent(adId) +
      "&select=*",

      {

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token

        }

      }

    );


  if(!response.ok){

    return null;

  }


  const data =
    await response.json();


  return data.length
    ? data[0]
    : null;

}



/* ============================================================
   FIND EXISTING CONVERSATION
============================================================ */

async function findConversation(
  session
){

  /*
   * Buyer অথবা Seller —
   * এই ad-এর conversation খুঁজবে।
   */

  const url =

    SUPA_URL +

    "/rest/v1/conversations" +

    "?ad_id=eq." +

    encodeURIComponent(adId) +

    "&or=(" +

    "buyer_id.eq." +
    encodeURIComponent(
      currentUser.id
    ) +

    ",seller_id.eq." +
    encodeURIComponent(
      currentUser.id
    ) +

    ")" +

    "&select=*" +

    "&limit=1";


  const response =
    await fetch(
      url,
      {

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    const text =
      await response.text();

    throw new Error(
      "Conversation খুঁজে পাওয়া যায়নি: " +
      text
    );

  }


  const data =
    await response.json();


  return data.length
    ? data[0]
    : null;

}



/* ============================================================
   CREATE CONVERSATION
============================================================ */

async function createConversation(
  session
){

  const response =
    await fetch(

      SUPA_URL +
      "/rest/v1/conversations",

      {

        method:"POST",

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body:

          JSON.stringify({

            ad_id:
              ad.id,

            buyer_id:
              currentUser.id,

            seller_id:
              ad.seller_id

          })

      }

    );


  if(!response.ok){

    const text =
      await response.text();


    /*
     * একই সময়ে conversation তৈরি হয়ে গেলে
     * আবার existing conversation খুঁজবো।
     */

    const existing =
      await findConversation(
        session
      );


    if(existing){

      return existing;

    }


    throw new Error(
      "Conversation তৈরি করা যায়নি: " +
      text
    );

  }


  const data =
    await response.json();


  return data.length
    ? data[0]
    : null;

}



/* ============================================================
   GET OR CREATE CONVERSATION
============================================================ */

async function getConversation(
  session
){

  /*
   * নিজের বিজ্ঞাপন হলে
   * আগে থেকেই conversation থাকতে হবে।
   */

  const isSeller =

    String(
      ad.seller_id || ""
    ) ===

    String(
      currentUser.id
    );


  let existing =

    await findConversation(
      session
    );


  if(existing){

    return existing;

  }


  /*
   * Buyer হলে প্রথম message-এর আগে
   * conversation তৈরি করা যাবে।
   */

  if(!isSeller){

    return await createConversation(
      session
    );

  }


  /*
   * Seller-এর নতুন conversation
   * নিজে থেকে তৈরি করা হবে না।
   */

  return null;

}



/* ============================================================
   LOAD MESSAGES
============================================================ */

async function loadMessages(){

  if(
    loadingMessages ||
    !conversation
  ){

    return;

  }


  loadingMessages =
    true;


  try{

    const session =
      await getSession();


    if(!session){

      throw new Error(
        "Login session পাওয়া যায়নি।"
      );

    }


    const url =

      SUPA_URL +

      "/rest/v1/messages" +

      "?conversation_id=eq." +

      encodeURIComponent(
        conversation.id
      ) +

      "&select=*" +

      "&order=created_at.asc";


    const response =
      await fetch(
        url,
        {

          headers:{

            "apikey":
              SUPA_KEY,

            "Authorization":
              "Bearer " +
              session.access_token,

            "Content-Type":
              "application/json"

          }

        }
      );


    if(!response.ok){

      const text =
        await response.text();


      throw new Error(
        text
      );

    }


    const data =
      await response.json();


    renderMessages(
      Array.isArray(data)
      ? data
      : []
    );


  }catch(error){

    console.error(
      "LOAD CHAT ERROR:",
      error
    );


    showError(
      "মেসেজ লোড করা যাচ্ছে না।"
    );

  }finally{

    loadingMessages =
      false;

  }

}



/* ============================================================
   RENDER
============================================================ */

function renderMessages(
  data
){

  if(!data.length){

    messagesBox.innerHTML = `

      <div class="empty">

        এখনো কোনো মেসেজ নেই।<br>

        নিচে লিখে কথোপকথন শুরু করুন।

      </div>

    `;

    return;

  }


  messagesBox.innerHTML =

    data.map(
      function(item){

        /*
         * তোমার table-এ column হলো body,
         * message নয়।
         */

        const text =
          item.body || "";


        const mine =

          String(
            item.sender_id
          ) ===

          String(
            currentUser.id
          );


        const date =

          item.created_at

          ?

          new Date(
            item.created_at
          ).toLocaleString(
            "bn-BD",
            {
              day:"numeric",
              month:"short",
              hour:"numeric",
              minute:"2-digit"
            }
          )

          :

          "";


        return `

          <div
            class="
              message-row
              ${mine
                ? "mine"
                : "theirs"}
            ">


            <div
              class="bubble">

              ${esc(text)}


              ${
                date

                ?

                `

                <span
                  class="time">

                  ${esc(date)}

                </span>

                `

                :

                ""

              }

            </div>


          </div>

        `;

      }
    ).join("");


  messagesBox.scrollTop =
    messagesBox.scrollHeight;

}



/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage(
  text
){

  const session =
    await getSession();


  if(!session){

    throw new Error(
      "Login session পাওয়া যায়নি।"
    );

  }


  if(!conversation){

    throw new Error(
      "Conversation পাওয়া যায়নি।"
    );

  }


  let receiverId = "";


  if(

    String(
      conversation.buyer_id
    ) ===

    String(
      currentUser.id
    )

  ){

    receiverId =
      conversation.seller_id;

  }else{

    receiverId =
      conversation.buyer_id;

  }


  if(!receiverId){

    throw new Error(
      "Receiver ID পাওয়া যায়নি।"
    );

  }


  if(

    String(receiverId) ===

    String(currentUser.id)

  ){

    throw new Error(
      "নিজেকে মেসেজ করা যাবে না।"
    );

  }


  const response =

    await fetch(

      SUPA_URL +
      "/rest/v1/messages",

      {

        method:"POST",

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body:

          JSON.stringify({

            conversation_id:
              conversation.id,

            sender_id:
              currentUser.id,

            receiver_id:
              receiverId,

            body:
              text

          })

      }

    );


  if(!response.ok){

    const text =
      await response.text();


    throw new Error(
      "Message send failed: " +
      text
    );

  }


  return await response.json();

}



/* ============================================================
   FORM
============================================================ */

chatForm.addEventListener(

  "submit",

  async function(event){

    event.preventDefault();

    clearError();


    const text =
      messageInput.value.trim();


    if(!text){

      return;

    }


    sendButton.disabled =
      true;

    sendButton.textContent =
      "Sending...";


    try{

      /*
       * Buyer প্রথমবার Send করলে
       * conversation তৈরি হবে।
       */

      if(!conversation){

        const session =
          await getSession();


        conversation =
          await createConversation(
            session
          );


        if(!conversation){

          throw new Error(
            "Conversation তৈরি করা যায়নি।"
          );

        }

      }


      await sendMessage(
        text
      );


      messageInput.value =
        "";


      await loadMessages();


    }catch(error){

      console.error(
        "SEND ERROR:",
        error
      );


      showError(
        error.message ||
        "মেসেজ পাঠানো যায়নি।"
      );


    }finally{

      sendButton.disabled =
        false;

      sendButton.textContent =
        "Send";

      messageInput.focus();

    }

  }

);



/* ============================================================
   INITIALIZE
============================================================ */

async function initialize(){

  try{

    if(!adId){

      throw new Error(
        "বিজ্ঞাপনের ID পাওয়া যায়নি।"
      );

    }


    currentUser =
      await getUser();


    if(!currentUser){

      loginBox.style.display =
        "block";

      return;

    }


    const session =
      await getSession();


    if(!session){

      throw new Error(
        "Login session পাওয়া যায়নি।"
      );

    }


    ad =
      await getAd();


    if(!ad){

      throw new Error(
        "বিজ্ঞাপনটি পাওয়া যায়নি।"
      );

    }


    /*
     * নিজের বিজ্ঞাপন?
     */

    const isSeller =

      String(
        ad.seller_id || ""
      ) ===

      String(
        currentUser.id
      );


    adTitle.textContent =
      ad.title ||
      "বিজ্ঞাপন";


    chatPerson.textContent =

      isSeller

      ?

      "আপনার বিজ্ঞাপন • ক্রেতার মেসেজ"

      :

      "বিক্রেতার সাথে সরাসরি যোগাযোগ";


    /*
     * Conversation খুঁজবো।
     */

    conversation =
      await getConversation(
        session
      );


    /*
     * Buyer হলে conversation না থাকলেও
     * Chat খুলবে।
     *
     * Seller হলে conversation না থাকলে
     * অপেক্ষা করবে।
     */

    chatCard.style.display =
      "block";


    if(
      isSeller &&
      !conversation
    ){

      messagesBox.innerHTML = `

        <div class="empty">

          এখনো কোনো ক্রেতা
          মেসেজ করেনি।

        </div>

      `;

      messageInput.disabled =
        true;

      sendButton.disabled =
        true;

      messageInput.placeholder =
        "ক্রেতা মেসেজ করলে এখানে দেখা যাবে";

      return;

    }


    await loadMessages();


    /*
     * প্রতি ৩ সেকেন্ডে নতুন message check
     */

    setInterval(
      loadMessages,
      3000
    );


  }catch(error){

    console.error(
      "CHAT INITIALIZE ERROR:",
      error
    );


    chatCard.style.display =
      "block";


    messagesBox.innerHTML =
      "";


    showError(
      error.message ||
      "Chat চালু করা যাচ্ছে না।"
    );

  }

}


initialize();


})();

</script>
