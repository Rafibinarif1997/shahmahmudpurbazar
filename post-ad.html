<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>বিজ্ঞাপন দিন | শাহমাহমুদপুর বাজার</title><link rel="stylesheet" href="style.css"></head><body><main class="container" style="max-width:760px;padding:25px 0 80px"><a class="brand" href="index.html"><b>শাহমাহমুদপুর</b><strong>বাজার</strong></a><section class="authbox" style="margin-top:18px"><span class="eyebrow">POST AN AD</span><h1>আপনার বিজ্ঞাপন দিন</h1><form id="adForm"><label>ক্যাটাগরি<select id="category" required><option value="">নির্বাচন করুন</option></select></label><label>সাব-ক্যাটাগরি<select id="subcategory" required><option value="">নির্বাচন করুন</option></select></label><label>শিরোনাম<input id="title" maxlength="100" required></label><label>দাম<input id="price" type="number" min="0" required></label><label>বিস্তারিত<textarea id="description" rows="6"></textarea></label><label>এলাকা<input id="location" required></label><label>মোবাইল নম্বর<input id="phone" required></label><label>ছবি <input id="image" type="file" accept="image/*" multiple></label><div id="preview" class="muted"></div><button class="btn green" style="width:100%;margin-top:12px">বিজ্ঞাপন জমা দিন →</button></form><p id="msg" class="msg"></p></section></main><nav class="mobile-nav"><a href="index.html"><span>⌂</span>হোম</a><a href="favorites.html"><span>♡</span>সেভড</a><a class="active" href="post-ad.html"><span>＋</span>বিজ্ঞাপন দিন</a><a href="messages.html"><span>▤</span>মেসেজ</a><a href="profile.html"><span>♙</span>প্রোফাইল</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>const cats=marketplace.categoryMap;Object.keys(cats).forEach(x=>category.add(new Option(x,x)));category.onchange=()=>{subcategory.innerHTML='<option value="">নির্বাচন করুন</option>';(cats[category.value]||[]).forEach(x=>subcategory.add(new Option(x,x)))};image.onchange=()=>preview.textContent=`${image.files.length}টি ছবি নির্বাচিত হয়েছে`;async function requireUser(){const u=await marketplace.user();if(!u){location.href='login.html?next=post-ad.html';return null}return u}requireUser();adForm.onsubmit=async e=>{e.preventDefault();const u=await requireUser();if(!u)return;msg.textContent='ছবি upload ও বিজ্ঞাপন জমা হচ্ছে...';let urls=[];for(const f of image.files){const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path=`${u.id}/${crypto.randomUUID()}.${ext}`;const up=await sb.storage.from('ads-images').upload(path,f,{upsert:false,contentType:f.type});if(up.error){msg.textContent=up.error.message;return}urls.push(sb.storage.from('ads-images').getPublicUrl(path).data.publicUrl)}const row={seller_id:u.id,title:title.value.trim(),price:Number(price.value),category:category.value,subcategory:subcategory.value,description:description.value.trim(),location:location.value.trim(),phone:phone.value.trim(),image_urls:urls,status:'pending'};const {error}=await sb.from('ads').insert(row);if(error){msg.textContent=error.message;return}msg.textContent='বিজ্ঞাপন জমা হয়েছে। Admin approval-এর পর marketplace-এ দেখা যাবে।';adForm.reset();preview.textContent='';}</script></body></html>
