<script src="supabase.js?v=9"></script>
<script src="app.js?v=9"></script>



<script>

(async function(){


const loading =
document.getElementById(
  "loading"
);


const formBox =
document.getElementById(
  "formBox"
);


const form =
document.getElementById(
  "adForm"
);


const userNote =
document.getElementById(
  "userNote"
);


const message =
document.getElementById(
  "msg"
);


const submitBtn =
document.getElementById(
  "submitBtn"
);


const imageInput =
document.getElementById(
  "image"
);


const preview =
document.getElementById(
  "preview"
);



/* ============================================================
   GET USER
============================================================ */


async function getUser(){

  try{

    const saved =
      localStorage.getItem(
        "smb_user_v1"
      );

    if(saved){

      const user =
        JSON.parse(saved);

      if(
        user &&
        user.email
      ){

        return user;

      }

    }

  }catch(e){}


  try{

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        await getCurrentUser();

      if(user){

        const metadata =
          user.user_metadata || {};


        const profile = {

          id:
            user.id || "",

          name:
            metadata.full_name ||
            metadata.name ||
            "",

          email:
            user.email || "",

          phone:
            metadata.phone || "",

          avatar:
            metadata.avatar_url ||
            metadata.picture ||
            ""

        };


        localStorage.setItem(
          "smb_user_v1",
          JSON.stringify(
            profile
          )
        );


        return profile;

      }

    }

  }catch(error){

    console.error(
      error
    );

  }


  return null;

}



let user =
await getUser();


if(!user){

  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        1000
      )
  );


  user =
    await getUser();

}



if(!user){

  window.location.href =
    "login.html?next=post-ad.html";

  return;

}



loading.style.display =
"none";


formBox.style.display =
"block";



const userName =
user.name ||
"Google User";


const userEmail =
user.email ||
"";


const userId =
user.id ||
"";



userNote.innerHTML =

`
Signed in as
<strong>
${escapeHtml(userEmail)}
</strong>
`;



/* ============================================================
   CATEGORY
============================================================ */


const subMap={

"Vehicles":[
"Cars",
"Motorcycles",
"Bicycles",
"Auto Rickshaw",
"Trucks & Buses",
"Vehicle Parts"
],

"Property":[
"Land",
"Apartments",
"Houses",
"Shops & Commercial Space",
"Office Space",
"Property for Rent"
],

"Phones & Tablets":[
"Mobile Phones",
"Tablets",
"Phone Accessories",
"Smart Watches"
],

"Electronics":[
"TV",
"Laptop & Computer",
"Camera",
"Audio",
"Gaming",
"Other Electronics"
],

"Home, Furniture & Garden":[
"Furniture",
"Home Decor",
"Kitchen",
"Garden",
"Appliances"
],

"Fashion":[
"Men",
"Women",
"Kids",
"Shoes",
"Bags & Accessories",
"Watches"
],

"Beauty & Personal Care":[
"Cosmetics",
"Skin Care",
"Hair Care",
"Perfume",
"Health & Personal Care"
],

"Services":[
"Tutoring",
"Cleaning",
"Transport",
"Photography",
"IT & Digital",
"Other Services"
],

"Repair & Construction":[
"Electrician",
"Plumber",
"AC & Fridge Repair",
"Construction Materials",
"Mechanic",
"Painter"
],

"Commercial Equipment & Machinery":[
"Factory Equipment",
"Restaurant Equipment",
"Office Equipment",
"Tools",
"Machinery"
],

"Leisure & Activities":[
"Sports",
"Gym & Fitness",
"Music",
"Books",
"Tickets & Events",
"Hobbies"
],

"Babies & Kids":[
"Baby Products",
"Toys",
"Kids Clothing",
"Strollers",
"School Items"
],

"Food, Agriculture & Supplies":[
"Vegetables",
"Fruits",
"Fish",
"Livestock Feed",
"Seeds",
"Farm Products"
],

"Animals & Pets":[
"Cattle",
"Goat",
"Poultry",
"Pets",
"Pet Supplies"
],

"Jobs":[
"Full Time",
"Part Time",
"Sales Jobs",
"Driver Jobs",
"Office Jobs",
"Other Jobs"
],

"Seeking Work - CVs":[
"CVs",
"Job Seekers",
"Freelancers",
"Skilled Workers"
],

"Business & Industry":[
"Business for Sale",
"Wholesale",
"Retail",
"Industrial Products",
"Agriculture Business"
]

};



category.onchange =
function(){

  const items =
    subMap[
      category.value
    ] || [];


  subcategory.innerHTML =
    '<option value="">নির্বাচন করুন</option>' +

    items.map(
      x =>
      `<option>${escapeHtml(x)}</option>`
    ).join("");

};



/* ============================================================
   IMAGE PREVIEW
============================================================ */


imageInput.addEventListener(
"change",
function(){

  const files =
    Array.from(
      imageInput.files || []
    );


  if(files.length > 3){

    message.textContent =
      "সর্বোচ্চ ৩টি ছবি আপলোড করা যাবে।";


    imageInput.value =
      "";


    preview.innerHTML =
      "";


    return;

  }


  preview.innerHTML =
    "";


  files.forEach(
    function(file,index){

      const reader =
        new FileReader();


      reader.onload =
        function(e){

          preview.innerHTML += `

            <div
              class="preview-item">

              <img
                src="${e.target.result}"
                alt="Image">

              <span
                class="image-number">

                ${index + 1}

              </span>

            </div>

          `;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

});



/* ============================================================
   UPLOAD IMAGE
============================================================ */


async function uploadImage(
  file,
  adId,
  index
){

  const safeName =
    file.name
      .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


  const path =
    userId +
    "/" +
    adId +
    "/" +
    index +
    "-" +
    Date.now() +
    "-" +
    safeName;


  const response =
    await fetch(

      SUPABASE_URL +
      "/storage/v1/object/ad-images/" +
      path,

      {

        method:"POST",

        headers:{

          "apikey":
            SUPABASE_ANON_KEY,

          "Authorization":
            "Bearer " +
            getSbSession()
              .access_token,

          "Content-Type":
            file.type,

          "x-upsert":
            "false"

        },

        body:file

      }

    );


  if(!response.ok){

    const text =
      await response.text();


    throw new Error(
      "ছবি upload হয়নি: " +
      text
    );

  }


  return (

    SUPABASE_URL +
    "/storage/v1/object/public/ad-images/" +
    path

  );

}



/* ============================================================
   SUBMIT
============================================================ */


form.addEventListener(
"submit",
async function(e){

  e.preventDefault();


  message.textContent =
    "";


  const files =
    Array.from(
      imageInput.files || []
    );


  if(files.length > 3){

    message.textContent =
      "সর্বোচ্চ ৩টি ছবি দেওয়া যাবে।";

    return;

  }


  const titleValue =
    document
      .getElementById("title")
      .value
      .trim();


  const priceValue =
    Number(
      document
        .getElementById("price")
        .value
    );


  const categoryValue =
    document
      .getElementById("category")
      .value;


  const subcategoryValue =
    document
      .getElementById("subcategory")
      .value;


  const descriptionValue =
    document
      .getElementById("description")
      .value
      .trim();


  const locationValue =
    document
      .getElementById("location")
      .value
      .trim();


  const phoneValue =
    document
      .getElementById("phone")
      .value
      .trim();



  if(
    !titleValue ||
    !categoryValue ||
    !priceValue ||
    !locationValue ||
    !phoneValue
  ){

    message.textContent =
      "সব প্রয়োজনীয় তথ্য পূরণ করুন।";

    return;

  }



  submitBtn.disabled =
    true;


  submitBtn.textContent =
    "বিজ্ঞাপন তৈরি হচ্ছে...";



  try{


    const session =
      getSbSession();


    if(
      !session ||
      !session.access_token
    ){

      throw new Error(
        "আপনার Login session পাওয়া যায়নি। আবার Google Login করুন।"
      );

    }



    /*
     * Unique advertisement ID
     */

    const adId =
      crypto.randomUUID
        ? crypto.randomUUID()
        : "ad_" +
          Date.now();



    /*
     * Upload up to 3 images
     */

    const imageUrls = [];


    for(
      let i = 0;
      i < files.length;
      i++
    ){

      submitBtn.textContent =
        "ছবি upload হচ্ছে " +
        (i + 1) +
        "/" +
        files.length;


      const url =
        await uploadImage(
          files[i],
          adId,
          i + 1
        );


      imageUrls.push(
        url
      );

    }



    /*
     * Save advertisement
     * permanently in Supabase
     */

    submitBtn.textContent =
      "বিজ্ঞাপন save হচ্ছে...";


    const adData = {

      id:
        adId,

      user_id:
        userId,

      seller_id:
        userId,

      seller:
        userName,

      seller_email:
        userEmail,

      email:
        userEmail,

      title:
        titleValue,

      price:
        priceValue,

      category:
        categoryValue,

      subcategory:
        subcategoryValue,

      description:
        descriptionValue,

      location:
        locationValue,

      phone:
        phoneValue,

      image_urls:
        imageUrls,

      status:
        "pending",

      created_at:
        new Date().toISOString()

    };



    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/ads",

        {

          method:"POST",

          headers:{

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              "Bearer " +
              session.access_token,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify(
              adData
            )

        }

      );



    if(!response.ok){

      const text =
        await response.text();


      throw new Error(
        "Database error: " +
        text
      );

    }



    message.textContent =
      "✅ বিজ্ঞাপন সফলভাবে জমা হয়েছে। Admin approval-এর পর marketplace-এ দেখা যাবে।";


    form.reset();


    preview.innerHTML =
      "";


    subcategory.innerHTML =
      '<option value="">নির্বাচন করুন</option>';



    /*
     * User চাইলে পরে My Ads-এ দেখতে পারবে
     */

  }catch(error){

    console.error(
      "POST AD ERROR:",
      error
    );


    message.textContent =
      error.message ||
      "বিজ্ঞাপন জমা দেওয়া যায়নি।";


  }finally{

    submitBtn.disabled =
      false;


    submitBtn.textContent =
      "Preview & Publish →";

  }

});



/* ============================================================
   ESCAPE HTML
============================================================ */


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


})();

</script>
