<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>বিজ্ঞাপন দিন | শাহমাহমুদপুর বাজার</title><link rel="stylesheet" href="style.css"></head><body><main class="container" style="max-width:760px;padding:35px 0"><a href="index.html" class="brand"><b>শাহমাহমুদপুর</b><strong>বাজার</strong></a><section class="authbox" style="margin-top:25px"><span class="eyebrow">POST AN AD</span><h1 style="font-size:30px">আপনার বিজ্ঞাপন দিন</h1><p class="muted">পণ্য বা সেবা স্থানীয় ক্রেতাদের কাছে পৌঁছে দিন।</p><form id="adForm"><label>ক্যাটাগরি<select id="category" required><option value="">নির্বাচন করুন</option><option>মোবাইল</option><option>যানবাহন</option><option>সম্পত্তি</option><option>কৃষি</option><option>ইলেকট্রনিক্স</option><option>ফার্নিচার</option><option>ফ্যাশন</option><option>সেবা</option><option>অন্যান্য</option></select></label><label>শিরোনাম<input id="title" maxlength="100" required placeholder="যেমন: iPhone 13 128GB"></label><label>দাম<input id="price" type="number" min="0" required placeholder="৳"></label><label>বিস্তারিত<textarea id="description" rows="6" placeholder="পণ্যের বিস্তারিত লিখুন"></textarea></label><label>এলাকা<input id="location" required placeholder="যেমন: মহামায়া"></label><label>মোবাইল নম্বর<input id="phone" required placeholder="01XXXXXXXXX"></label><label>ছবি <input id="image" type="file" accept="image/*"></label><button class="btn green" style="width:100%;margin-top:12px">Preview & Publish →</button></form><p id="msg" class="msg"></p></section></main><script>const user=JSON.parse(localStorage.getItem("smb_user")||"null");if(!user)location.href="login.html?next=post-ad.html";document.getElementById("adForm").onsubmit=e=>{e.preventDefault();let a=ads();let x={id:"ad_"+Date.now(),title:title.value.trim(),price:Number(price.value),category:category.value,description:description.value.trim(),location:location.value.trim(),phone:phone.value.trim(),seller:user?.name||"User",status:"pending",time:"এখন"};if(!x.title||!x.category||!x.price||!x.location||!x.phone){msg.textContent="সব প্রয়োজনীয় তথ্য পূরণ করুন।";return}a.unshift(x);save(a);msg.textContent="বিজ্ঞাপন জমা হয়েছে। Admin approval-এর পর এটি marketplace-এ দেখা যাবে।";e.target.reset()};</script><script src="app.js"></script></body></html>
