<script src="supabase.js?v=9"></script>


<script>

(function(){

"use strict";


/* ============================================================
   ELEMENTS
============================================================ */

const loading =
document.getElementById("loading");

const formBox =
document.getElementById("formBox");

const form =
document.getElementById("adForm");

const userNote =
document.getElementById("userNote");

const message =
document.getElementById("msg");

const submitBtn =
document.getElementById("submitBtn");

const imageInput =
document.getElementById("image");

const preview =
document.getElementById("preview");

const category =
document.getElementById("category");

const subcategory =
document.getElementById("subcategory");


let currentUser = null;


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ============================================================
   GET GOOGLE USER
============================================================ */

async function getUser(){

  /*
   * 1. Supabase session থেকে সরাসরি user
   */

  try{

    const session =
      typeof getSbSession === "function"
      ? getSbSession()
      : null;


    if(
      session &&
      session.access_token &&
      typeof getCurrentUser === "function"
    ){

      const user =
        await getCurrentUser();


      if(user){

        const metadata =
          user.user_metadata || {};


        const profile = {

          id:
            user.id || "",

          name:
            metadata.full_name ||
            metadata.name ||
            "",

          email:
            user.email || "",

          phone:
            metadata.phone || "",

          avatar:
            metadata.avatar_url ||
            metadata.picture ||
            ""

        };


        localStorage.setItem(
          "smb_user_v1",
          JSON.stringify(profile)
        );


        return profile;

      }

    }

  }catch(error){

    console.error(
      "Supabase user error:",
      error
    );

  }


  /*
   * 2. Local backup
   */

  try{

    const saved =
      localStorage.getItem(
        "smb_user_v1"
      );


    if(saved){

      const profile =
        JSON.parse(saved);


      if(
        profile &&
        profile.id &&
        profile.email
      ){

        return profile;

      }

    }

  }catch(error){

    console.error(
      "Local user error:",
      error
    );

  }


  return null;

}


/* ============================================================
   INITIALIZE
============================================================ */

async function initialize(){

  /*
   * প্রথমে Google callback handle করার চেষ্টা
   */

  try{

    if(
      typeof handleAuthCallback ===
      "function"
    ){

      await handleAuthCallback();

    }

  }catch(error){

    console.error(
      "Callback error:",
      error
    );

  }


  currentUser =
    await getUser();


  /*
   * Session একটু দেরিতে তৈরি হলে retry
   */

  if(!currentUser){

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          800
        )
    );


    currentUser =
      await getUser();

  }


  if(!currentUser){

    loading.innerHTML = `
      <div>
        আপনার Login session পাওয়া যায়নি।
        <br><br>
        <a
          class="btn green"
          href="login.html?next=post-ad.html">
          Google দিয়ে Login করুন
        </a>
      </div>
    `;

    return;

  }


  loading.style.display =
    "none";

  formBox.style.display =
    "block";


  const userName =
    currentUser.name ||
    "Google User";


  userNote.innerHTML = `
    Signed in as
    <strong>
      ${escapeHtml(
        currentUser.email
      )}
    </strong>
  `;

}


initialize();


/* ============================================================
   CATEGORY MAP
============================================================ */

const subMap = {

"Vehicles":[
"Cars",
"Motorcycles",
"Bicycles",
"Auto Rickshaw",
"Trucks & Buses",
"Vehicle Parts"
],

"Property":[
"Land",
"Apartments",
"Houses",
"Shops & Commercial Space",
"Office Space",
"Property for Rent"
],

"Phones & Tablets":[
"Mobile Phones",
"Tablets",
"Phone Accessories",
"Smart Watches"
],

"Electronics":[
"TV",
"Laptop & Computer",
"Camera",
"Audio",
"Gaming",
"Other Electronics"
],

"Home, Furniture & Garden":[
"Furniture",
"Home Decor",
"Kitchen",
"Garden",
"Appliances"
],

"Fashion":[
"Men",
"Women",
"Kids",
"Shoes",
"Bags & Accessories",
"Watches"
],

"Beauty & Personal Care":[
"Cosmetics",
"Skin Care",
"Hair Care",
"Perfume",
"Health & Personal Care"
],

"Services":[
"Tutoring",
"Cleaning",
"Transport",
"Photography",
"IT & Digital",
"Other Services"
],

"Repair & Construction":[
"Electrician",
"Plumber",
"AC & Fridge Repair",
"Construction Materials",
"Mechanic",
"Painter"
],

"Commercial Equipment & Machinery":[
"Factory Equipment",
"Restaurant Equipment",
"Office Equipment",
"Tools",
"Machinery"
],

"Leisure & Activities":[
"Sports",
"Gym & Fitness",
"Music",
"Books",
"Tickets & Events",
"Hobbies"
],

"Babies & Kids":[
"Baby Products",
"Toys",
"Kids Clothing",
"Strollers",
"School Items"
],

"Food, Agriculture & Supplies":[
"Vegetables",
"Fruits",
"Fish",
"Livestock Feed",
"Seeds",
"Farm Products"
],

"Animals & Pets":[
"Cattle",
"Goat",
"Poultry",
"Pets",
"Pet Supplies"
],

"Jobs":[
"Full Time",
"Part Time",
"Sales Jobs",
"Driver Jobs",
"Office Jobs",
"Other Jobs"
],

"Seeking Work - CVs":[
"CVs",
"Job Seekers",
"Freelancers",
"Skilled Workers"
],

"Business & Industry":[
"Business for Sale",
"Wholesale",
"Retail",
"Industrial Products",
"Agriculture Business"
]

};


/* ============================================================
   CATEGORY CHANGE
============================================================ */

category.addEventListener(
"change",
function(){

  const items =
    subMap[
      category.value
    ] || [];


  subcategory.innerHTML =
    '<option value="">নির্বাচন করুন</option>' +

    items.map(
      function(item){

        return `
          <option value="${escapeHtml(item)}">
            ${escapeHtml(item)}
          </option>
        `;

      }
    ).join("");

});


/* ============================================================
   IMAGE PREVIEW
============================================================ */

imageInput.addEventListener(
"change",
function(){

  const files =
    Array.from(
      imageInput.files || []
    );


  message.textContent =
    "";


  if(files.length > 3){

    message.textContent =
      "সর্বোচ্চ ৩টি ছবি আপলোড করা যাবে।";


    imageInput.value =
      "";


    preview.innerHTML =
      "";


    return;

  }


  preview.innerHTML =
    "";


  files.forEach(
    function(file,index){

      if(
        ![
          "image/jpeg",
          "image/png",
          "image/webp"
        ].includes(file.type)
      ){

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(event){

          preview.innerHTML += `

            <div class="preview-item">

              <img
                src="${event.target.result}"
                alt="Image ${index + 1}">

              <span
                class="image-number">

                ${index + 1}

              </span>

            </div>

          `;

        };


      reader.readAsDataURL(file);

    }
  );

});


/* ============================================================
   UPLOAD IMAGE
============================================================ */

async function uploadImage(
  file,
  adId,
  index,
  session
){

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase()
      .replace(
        /[^a-z0-9]/g,
        ""
      ) || "jpg";


  const path =
    currentUser.id +
    "/" +
    adId +
    "/" +
    index +
    "-" +
    Date.now() +
    "." +
    extension;


  const response =
    await fetch(

      SUPABASE_URL +
      "/storage/v1/object/ad-images/" +
      path,

      {

        method:"POST",

        headers:{

          "apikey":
            SUPABASE_ANON_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            file.type || "image/jpeg",

          "x-upsert":
            "false"

        },

        body:file

      }

    );


  if(!response.ok){

    const errorText =
      await response.text();


    throw new Error(
      "ছবি upload করা যায়নি: " +
      errorText
    );

  }


  return (

    SUPABASE_URL +
    "/storage/v1/object/public/ad-images/" +
    path

  );

}


/* ============================================================
   SUBMIT
============================================================ */

form.addEventListener(
"submit",
async function(event){

  event.preventDefault();


  message.textContent =
    "";


  if(!currentUser){

    message.textContent =
      "আপনার Google Login পাওয়া যাচ্ছে না।";


    return;

  }


  const session =
    typeof getSbSession === "function"
    ? getSbSession()
    : null;


  if(
    !session ||
    !session.access_token
  ){

    message.textContent =
      "Login session পাওয়া যায়নি। আবার Google Login করুন।";


    return;

  }


  const files =
    Array.from(
      imageInput.files || []
    );


  if(files.length > 3){

    message.textContent =
      "সর্বোচ্চ ৩টি ছবি দেওয়া যাবে।";


    return;

  }


  const titleValue =
    document
      .getElementById("title")
      .value
      .trim();


  const priceValue =
    Number(
      document
        .getElementById("price")
        .value
    );


  const categoryValue =
    category.value;


  const subcategoryValue =
    subcategory.value;


  const descriptionValue =
    document
      .getElementById("description")
      .value
      .trim();


  const locationValue =
    document
      .getElementById("location")
      .value
      .trim();


  const phoneValue =
    document
      .getElementById("phone")
      .value
      .trim();


  if(
    !titleValue ||
    !categoryValue ||
    !priceValue ||
    !locationValue ||
    !phoneValue
  ){

    message.textContent =
      "সব প্রয়োজনীয় তথ্য পূরণ করুন।";


    return;

  }


  submitBtn.disabled =
    true;


  try{

    /*
     * --------------------------------------------------------
     * PROFILE নিশ্চিত করা
     * --------------------------------------------------------
     */

    submitBtn.textContent =
      "Account প্রস্তুত হচ্ছে...";


    const profileResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/profiles?on_conflict=id",

        {

          method:"POST",

          headers:{

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              "Bearer " +
              session.access_token,

            "Content-Type":
              "application/json",

            "Prefer":
              "resolution=merge-duplicates,return=minimal"

          },

          body:
            JSON.stringify({

              id:
                currentUser.id,

              name:
                currentUser.name ||
                "",

              phone:
                phoneValue,

              avatar_url:
                currentUser.avatar ||
                null

            })

        }

      );


    if(
      !profileResponse.ok
    ){

      const text =
        await profileResponse.text();


      throw new Error(
        "Profile save error: " +
        text
      );

    }


    /*
     * --------------------------------------------------------
     * Advertisement ID
     * --------------------------------------------------------
     */

    const adId =
      (
        crypto &&
        typeof crypto.randomUUID ===
        "function"
      )
      ? crypto.randomUUID()
      : "ad_" +
        Date.now();


    /*
     * --------------------------------------------------------
     * Upload images
     * --------------------------------------------------------
     */

    const imageUrls = [];


    for(
      let i = 0;
      i < files.length;
      i++
    ){

      submitBtn.textContent =
        "ছবি upload হচ্ছে " +
        (i + 1) +
        "/" +
        files.length;


      const url =
        await uploadImage(
          files[i],
          adId,
          i + 1,
          session
        );


      imageUrls.push(url);

    }


    /*
     * --------------------------------------------------------
     * ADS DATA
     *
     * শুধু তোমার ads table-এর column ব্যবহার করা হচ্ছে।
     * --------------------------------------------------------
     */

    const adData = {

      id:
        adId,

      seller_id:
        currentUser.id,

      user_id:
        currentUser.id,

      seller_email:
        currentUser.email,

      email:
        currentUser.email,

      title:
        titleValue,

      price:
        priceValue,

      category:
        categoryValue,

      subcategory:
        subcategoryValue,

      description:
        descriptionValue,

      location:
        locationValue,

      phone:
        phoneValue,

      image_urls:
        imageUrls,

      status:
        "pending",

      created_at:
        new Date().toISOString()

    };


    /*
     * --------------------------------------------------------
     * SAVE ADS
     * --------------------------------------------------------
     */

    submitBtn.textContent =
      "বিজ্ঞাপন save হচ্ছে...";


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/ads",

        {

          method:"POST",

          headers:{

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              "Bearer " +
              session.access_token,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify(
              adData
            )

        }

      );


    if(!response.ok){

      const text =
        await response.text();


      throw new Error(
        "Database error: " +
        text
      );

    }


    /*
     * SUCCESS
     */

    message.innerHTML = `
      <span style="color:#69f5a5">
        ✅ বিজ্ঞাপন সফলভাবে জমা হয়েছে।
      </span>
      <br>
      <small>
        Admin approval-এর পর এটি marketplace-এ দেখা যাবে।
      </small>
    `;


    form.reset();


    preview.innerHTML =
      "";


    subcategory.innerHTML =
      '<option value="">নির্বাচন করুন</option>';


  }catch(error){

    console.error(
      "POST AD ERROR:",
      error
    );


    message.textContent =
      error.message ||
      "বিজ্ঞাপন জমা দেওয়া যায়নি।";


  }finally{

    submitBtn.disabled =
      false;


    submitBtn.textContent =
      "Preview & Publish →";

  }

});

})();

</script>
