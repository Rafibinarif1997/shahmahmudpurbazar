<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>ট্রেন্ডিং বিজ্ঞাপন | শাহমাহমুদপুর বাজার</title>

<link
  rel="stylesheet"
  href="style.css">


<style>

/* ==========================================================
   TRENDING PAGE
========================================================== */

:root{
  --page-bg:#f5f8f6;
  --card:#ffffff;
  --border:#dfe9e3;
  --text:#1f3027;
  --text-secondary:#64736b;
  --muted:#7b8982;
  --green:#0d7d4a;
  --green-dark:#086b3d;
  --green-soft:#eaf7ef;
}


body{
  background:var(--page-bg);
  color:var(--text);
}


/* ==========================================================
   PAGE
========================================================== */

.trending-page{

  width:100%;
  max-width:1280px;

  margin:0 auto;

  padding:
    30px 24px
    120px;

}


/* ==========================================================
   BRAND
========================================================== */

.trending-page .brand{

  display:inline-flex;

  margin-bottom:24px;

}


/* ==========================================================
   HEADER
========================================================== */

.trending-header{

  position:relative;

  overflow:hidden;

  padding:30px;

  border:1px solid var(--border);

  border-radius:24px;

  background:
    radial-gradient(
      circle at 90% 10%,
      rgba(40,180,100,.13),
      transparent 30%
    ),
    linear-gradient(
      145deg,
      #ffffff,
      #f8fcf9
    );

  box-shadow:
    0 14px 45px
    rgba(20,70,45,.06);

}


.trending-header::after{

  content:"";

  position:absolute;

  width:180px;
  height:180px;

  right:-80px;
  bottom:-100px;

  border-radius:50%;

  border:1px solid
  rgba(20,150,80,.10);

}


.trending-label{

  display:inline-flex;

  align-items:center;

  gap:7px;

  padding:7px 12px;

  border-radius:100px;

  background:var(--green-soft);

  border:1px solid #d4eadb;

  color:var(--green-dark);

  font-size:10px;

  font-weight:900;

}


.trending-header h1{

  position:relative;

  z-index:1;

  margin:
    14px 0 8px;

  font-size:32px;

  font-weight:900;

  line-height:1.3;

}


.trending-header p{

  position:relative;

  z-index:1;

  margin:0;

  color:var(--text-secondary);

  font-size:13px;

  line-height:1.8;

}


/* ==========================================================
   SECTION
========================================================== */

.trending-section{

  margin-top:28px;

}


.section-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:16px;

}


.section-title h2{

  margin:0;

  font-size:20px;

  font-weight:900;

}


.section-title span{

  font-size:11px;

  color:var(--muted);

}


/* ==========================================================
   GRID
========================================================== */

.trending-grid{

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:16px;

}


/* ==========================================================
   AD CARD
========================================================== */

.trending-card{

  position:relative;

  overflow:hidden;

  display:flex;

  flex-direction:column;

  min-width:0;

  border:1px solid var(--border);

  border-radius:20px;

  background:#fff;

  text-decoration:none;

  color:inherit;

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;

}


.trending-card:hover{

  transform:translateY(-5px);

  border-color:#c8dfd0;

  box-shadow:
    0 18px 40px
    rgba(20,70,45,.10);

}


/* ==========================================================
   IMAGE
========================================================== */

.card-image{

  position:relative;

  width:100%;

  aspect-ratio:4 / 3;

  overflow:hidden;

  background:#eef4f0;

}


.card-image img{

  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  transition:
    transform .35s ease;

}


.trending-card:hover
.card-image img{

  transform:scale(1.05);

}


/* ==========================================================
   RANK
========================================================== */

.rank-badge{

  position:absolute;

  top:10px;
  left:10px;

  z-index:2;

  display:flex;

  align-items:center;

  justify-content:center;

  min-width:32px;
  height:32px;

  padding:0 7px;

  box-sizing:border-box;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      #087443,
      #18a963
    );

  color:#fff;

  font-size:11px;

  font-weight:900;

  box-shadow:
    0 7px 18px
    rgba(10,120,70,.25);

}


/* TOP 3 */

.rank-1{

  background:
    linear-gradient(
      135deg,
      #d69b00,
      #f5c542
    );

}


.rank-2{

  background:
    linear-gradient(
      135deg,
      #75808a,
      #aeb7be
    );

}


.rank-3{

  background:
    linear-gradient(
      135deg,
      #a85d2c,
      #d68a52
    );

}


/* ==========================================================
   CARD CONTENT
========================================================== */

.card-content{

  display:flex;

  flex-direction:column;

  flex:1;

  padding:15px;

}


.card-category{

  display:inline-flex;

  width:max-content;

  max-width:100%;

  margin-bottom:8px;

  padding:5px 8px;

  border-radius:100px;

  background:#edf8f1;

  color:#087443;

  font-size:8px;

  font-weight:850;

}


.card-title{

  display:-webkit-box;

  overflow:hidden;

  margin:0;

  color:#203229;

  font-size:14px;

  font-weight:850;

  line-height:1.5;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

}


.card-price{

  margin-top:11px;

  color:#087443;

  font-size:17px;

  font-weight:900;

}


.card-bottom{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;

  margin-top:auto;

  padding-top:14px;

}


.card-location{

  overflow:hidden;

  color:#718078;

  font-size:9px;

  font-weight:650;

  text-overflow:ellipsis;

  white-space:nowrap;

}


.card-views{

  flex:none;

  padding:5px 8px;

  border-radius:9px;

  background:#f4f7f5;

  color:#65746c;

  font-size:9px;

  font-weight:800;

}


/* ==========================================================
   LOADING
========================================================== */

.loading-box{

  grid-column:1 / -1;

  padding:70px 20px;

  text-align:center;

  border:1px solid var(--border);

  border-radius:20px;

  background:#fff;

  color:var(--muted);

  font-size:13px;

  font-weight:700;

}


.loader{

  width:32px;
  height:32px;

  margin:
    0 auto 15px;

  border:3px solid #dfece4;

  border-top-color:var(--green);

  border-radius:50%;

  animation:spin .8s linear infinite;

}


@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* ==========================================================
   EMPTY
========================================================== */

.empty-box{

  grid-column:1 / -1;

  padding:70px 20px;

  text-align:center;

  border:1px solid var(--border);

  border-radius:20px;

  background:#fff;

}


.empty-box .icon{

  font-size:40px;

}


.empty-box h3{

  margin:
    14px 0 8px;

  font-size:19px;

  font-weight:900;

}


.empty-box p{

  margin:0;

  color:var(--text-secondary);

  font-size:12px;

}


/* ==========================================================
   TABLET
========================================================== */

@media(max-width:1100px){

  .trending-page{

    max-width:980px;

  }


  .trending-grid{

    grid-template-columns:
      repeat(3,minmax(0,1fr));

  }

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:800px){

  .trending-page{

    padding:
      20px 14px
      110px;

  }


  .trending-page .brand{

    margin-bottom:18px;

  }


  .trending-header{

    padding:22px;

    border-radius:20px;

  }


  .trending-header h1{

    font-size:25px;

  }


  .trending-header p{

    font-size:11px;

  }


  .trending-grid{

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:11px;

  }


  .section-title h2{

    font-size:17px;

  }


  .card-content{

    padding:12px;

  }


  .card-title{

    font-size:12px;

  }


  .card-price{

    font-size:15px;

  }

}


/* ==========================================================
   SMALL MOBILE
========================================================== */

@media(max-width:480px){

  .trending-page{

    padding:
      16px 12px
      105px;

  }


  .trending-header{

    padding:18px;

    border-radius:18px;

  }


  .trending-header h1{

    margin-top:12px;

    font-size:22px;

  }


  .trending-label{

    font-size:8px;

  }


  .section-title{

    margin-bottom:12px;

  }


  .section-title h2{

    font-size:16px;

  }


  .trending-grid{

    gap:9px;

  }


  .trending-card{

    border-radius:15px;

  }


  .card-image{

    aspect-ratio:1 / 1;

  }


  .rank-badge{

    top:7px;
    left:7px;

    min-width:27px;
    height:27px;

    border-radius:9px;

    font-size:9px;

  }


  .card-content{

    padding:10px;

  }


  .card-category{

    margin-bottom:6px;

    padding:4px 6px;

    font-size:7px;

  }


  .card-title{

    font-size:11px;

  }


  .card-price{

    margin-top:8px;

    font-size:14px;

  }


  .card-bottom{

    margin-top:10px;

    padding-top:9px;

  }


  .card-location{

    font-size:8px;

  }


  .card-views{

    padding:4px 6px;

    font-size:8px;

  }

}

</style>

</head>


<body>


<main class="container trending-page">


<a
  href="index.html"
  class="brand">

  <b>শাহমাহমুদপুর</b>

  <strong>বাজার</strong>

  <small>
    স্থানীয় অনলাইন বাজার
  </small>

</a>



<!-- HEADER -->

<section class="trending-header">

  <span class="trending-label">

    🔥 জনপ্রিয় বিজ্ঞাপন

  </span>


  <h1>

    ট্রেন্ডিং বিজ্ঞাপন

  </h1>


  <p>

    সবচেয়ে বেশি দেখা হয়েছে এমন
    সেরা ১০টি বিজ্ঞাপন দেখুন।

  </p>

</section>



<!-- ADS -->

<section class="trending-section">


  <div class="section-title">

    <h2>

      🔥 সবচেয়ে জনপ্রিয়

    </h2>


    <span>

      Top 10 বিজ্ঞাপন

    </span>

  </div>



  <div
    id="trendingGrid"
    class="trending-grid">


    <div class="loading-box">

      <div class="loader"></div>

      ট্রেন্ডিং বিজ্ঞাপন লোড হচ্ছে...

    </div>


  </div>


</section>


</main>

<script src="supabase.js?v=13"></script>

<script src="app.js?v=13"></script>



<script>

document.addEventListener(
"DOMContentLoaded",
async function(){

"use strict";


const grid =
document.getElementById(
  "trendingGrid"
);



/* ==========================================================
   LOAD TRENDING ADS
========================================================== */

try{


  let ads = [];


  /*
    Supabase থেকে বিজ্ঞাপন আনা
  */

  const result =
  await window.sbFetch(

   "/rest/v1/ads?select=*&order=views.desc&limit=10",

    {
      method:"GET"
    }

  );


  if(
    Array.isArray(result)
  ){

    ads = result;

  }


  /*
    যদি কোনো বিজ্ঞাপন না পাওয়া যায়
  */

  if(!ads.length){

    grid.innerHTML = `

      <div class="empty-box">

        <div class="icon">

          📭

        </div>


        <h3>

          কোনো ট্রেন্ডিং বিজ্ঞাপন পাওয়া যায়নি

        </h3>


        <p>

          নতুন বিজ্ঞাপন প্রকাশিত হলে
          এখানে দেখা যাবে।

        </p>

      </div>

    `;

    return;

  }



  /* ==========================================================
     RENDER ADS
  ========================================================== */

  grid.innerHTML =
  ads.map(
    function(ad,index){


      /* TITLE */

      const title =
      ad.title ||
      "বিজ্ঞাপন";



      /* CATEGORY */

      const category =
      ad.category ||
      "অন্যান্য";



      /* LOCATION */

      const location =
      ad.location ||
      "এলাকা উল্লেখ নেই";



      /* VIEWS */

      const views =
      Number(
        ad.views || 0
      );



      /* IMAGE */

      let image = "";


      if(
        Array.isArray(
          ad.image_urls
        )
      ){

        image =
        ad.image_urls[0] ||
        "";

      }


      else if(
        typeof ad.image_urls ===
        "string"
      ){

        try{

          const parsed =
          JSON.parse(
            ad.image_urls
          );


          if(
            Array.isArray(parsed)
          ){

            image =
            parsed[0] ||
            "";

          }

          else{

            image =
            ad.image_urls;

          }


        }catch(error){

          image =
          ad.image_urls;

        }

      }



      /*
        Rank Class
      */

      let rankClass = "";


      if(index === 0){

        rankClass =
        "rank-1";

      }

      else if(index === 1){

        rankClass =
        "rank-2";

      }

      else if(index === 2){

        rankClass =
        "rank-3";

      }



      /*
        Image HTML
      */

      const imageHtml =
      image

      ?

      `

      <img
        src="${escapeHtml(image)}"
        alt="${escapeHtml(title)}"
        loading="lazy"
        onerror="
          this.style.display='none'
        "
      >

      `

      :

      `

      <div
        style="
          width:100%;
          height:100%;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:42px;
        ">

        📦

      </div>

      `;



      return `

      <a
        href="ad-details.html?id=${encodeURIComponent(
          ad.id
        )}"
        class="trending-card">


        <div class="card-image">


          <div
            class="rank-badge ${rankClass}">

            #${index + 1}

          </div>


          ${imageHtml}


        </div>



        <div class="card-content">


          <div class="card-category">

            ${escapeHtml(category)}

          </div>


          <h3 class="card-title">

            ${escapeHtml(title)}

          </h3>


          <div class="card-price">

            ${money(ad.price)}

          </div>



          <div class="card-bottom">


            <span class="card-location">

              📍 ${escapeHtml(location)}

            </span>


            <span class="card-views">

              👁 ${views}

            </span>


          </div>


        </div>


      </a>

      `;


    }
  ).join("");


}

catch(error){


  console.error(
    "TRENDING ADS ERROR:",
    error
  );


  grid.innerHTML = `

    <div class="empty-box">

      <div class="icon">

        ⚠️

      </div>


      <h3>

        বিজ্ঞাপন লোড করা যায়নি

      </h3>


      <p>

        অনুগ্রহ করে পরে আবার চেষ্টা করুন।

      </p>

    </div>

  `;


}


});

</script>


</body>

</html>
