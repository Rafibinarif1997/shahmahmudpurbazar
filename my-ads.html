<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আমার বিজ্ঞাপন</title><link rel="stylesheet" href="style.css"></head><body><main class="container" style="padding:35px 0"><a href="index.html" class="brand"><b>শাহমাহমুদপুর</b><strong>বাজার</strong></a><div class="section-title" style="margin-top:30px"><h2>আমার বিজ্ঞাপন</h2><a class="btn green" href="post-ad.html">＋ বিজ্ঞাপন দিন</a></div><div id="list" class="products"></div></main><script src="app.js"></script><script>let u=JSON.parse(localStorage.getItem("smb_user")||"null");if(!u)location.href="login.html";let a=ads().filter(x=>x.seller===u.name);list.innerHTML=a.length?a.map(x=>`<article class="product"><div class="photo">${escapeHtml(x.category)}</div><div class="body"><span class="badge">${escapeHtml(x.status)}</span><h3>${escapeHtml(x.title)}</h3><div class="price">${money(x.price)}</div><div class="meta">${escapeHtml(x.location)}</div></div></article>`).join(""):"<p class='muted'>আপনার কোনো বিজ্ঞাপন নেই।</p>"</script></body></html>
