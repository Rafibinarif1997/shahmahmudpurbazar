<!doctype html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>আমার বিজ্ঞাপন | শাহমাহমুদপুর বাজার</title>

<link rel="stylesheet" href="style.css">

<style>

.page{
  padding:35px 16px 100px;
}

.page-wrap{
  max-width:900px;
  margin:30px auto 0;
}

.ads-loading{
  padding:50px 20px;
  text-align:center;
  color:#718078;
}

.empty-ads{
  padding:45px 20px;
  text-align:center;
  border:1px solid rgba(105,245,165,.12);
  border-radius:18px;
  background:rgba(5,14,10,.7);
}

.empty-ads strong{
  display:block;
  color:#eaf5ef;
  margin-bottom:8px;
}

.empty-ads span{
  color:#718078;
  font-size:10px;
}

.product .photo{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100px;
  color:#69f5a5;
}

</style>
</head>


<body>


<main class="container page">

  <a href="index.html" class="brand">

    <b>শাহমাহমুদপুর</b>
    <strong>বাজার</strong>

    <small>LOCAL MARKETPLACE</small>

  </a>


  <div class="page-wrap">

    <div
      class="section-title"
      style="margin-top:30px">

      <div>

        <small>MY MARKETPLACE</small>

        <h2>আমার বিজ্ঞাপন</h2>

      </div>


      <a
        class="btn green"
        href="post-ad.html">

        ＋ বিজ্ঞাপন দিন

      </a>

    </div>


    <div
      id="list"
      class="products">

      <div class="ads-loading">
        বিজ্ঞাপন লোড হচ্ছে...
      </div>

    </div>

  </div>

</main>



<nav class="mobile-nav">

  <a href="index.html">
    <span>⌂</span>
    Home
  </a>

  <a href="favorites.html">
    <span>♡</span>
    Saved
  </a>

  <a href="post-ad.html">
    <span>⊞</span>
    Sell
  </a>

  <a href="messages.html">
    <span>▤</span>
    Messages
  </a>

  <a
    class="active"
    href="profile.html">

    <span>♙</span>
    Profile

  </a>

</nav>



<script src="supabase.js?v=9"></script>
<script src="app.js?v=9"></script>


<script>

(async function(){


  const list =
    document.getElementById("list");


  // ----------------------------------------------------------
  // Escape HTML
  // ----------------------------------------------------------

  function escapeHTML(value){

    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  // ----------------------------------------------------------
  // Get saved Google user
  // ----------------------------------------------------------

  function getSavedUser(){

    try{

      const raw =
        localStorage.getItem(
          "smb_user_v1"
        );

      if(!raw) return null;

      const data =
        JSON.parse(raw);

      if(
        data &&
        data.email
      ){

        return data;

      }

    }catch(error){

      console.error(
        "Saved user error:",
        error
      );

    }

    return null;

  }


  // ----------------------------------------------------------
  // Get user
  // ----------------------------------------------------------

  async function getUser(){

    /*
     * প্রথমে local profile নেওয়া হচ্ছে।
     * কারণ Google login-এর পরে এটিই আমাদের
     * reliable browser profile।
     */

    const savedUser =
      getSavedUser();


    if(savedUser){

      return savedUser;

    }


    /*
     * local profile না থাকলে Supabase session
     * থেকে user নেওয়া হবে।
     */

    try{

      if(
        typeof window.getCurrentUser ===
        "function"
      ){

        const user =
          await window.getCurrentUser();


        if(user){

          const metadata =
            user.user_metadata || {};


          const profile = {

            id:
              user.id || "",

            name:
              metadata.full_name ||
              metadata.name ||
              "",

            email:
              user.email || "",

            phone:
              metadata.phone || "",

            avatar:
              metadata.avatar_url ||
              metadata.picture ||
              ""

          };


          localStorage.setItem(
            "smb_user_v1",
            JSON.stringify(profile)
          );


          return profile;

        }

      }

    }catch(error){

      console.error(
        "Supabase user error:",
        error
      );

    }


    return null;

  }


  // ----------------------------------------------------------
  // Load user
  // ----------------------------------------------------------

  const user =
    await getUser();


  /*
   * User না পাওয়া গেলে Login page।
   *
   * কিন্তু সঙ্গে সঙ্গে redirect নয়।
   * Browser storage/session initialize হওয়ার জন্য
   * একটু সময় দেওয়া হচ্ছে।
   */

  if(!user){

    await new Promise(
      function(resolve){
        setTimeout(resolve,1200);
      }
    );


    const retryUser =
      await getUser();


    if(!retryUser){

      window.location.href =
        "login.html";

      return;

    }

  }


  const currentUser =
    user || await getUser();


  if(!currentUser){

    window.location.href =
      "login.html";

    return;

  }


  // ----------------------------------------------------------
  // User information
  // ----------------------------------------------------------

  const userId =
    String(
      currentUser.id || ""
    );


  const userEmail =
    String(
      currentUser.email || ""
    ).trim().toLowerCase();


  const userName =
    String(
      currentUser.name || ""
    ).trim().toLowerCase();


  // ----------------------------------------------------------
  // Get local advertisements
  // ----------------------------------------------------------

  let allAds = [];


  try{

    if(
      typeof window.ads ===
      "function"
    ){

      allAds =
        window.ads() || [];

    }

  }catch(error){

    console.error(
      "Ads function error:",
      error
    );

  }


  /*
   * যদি ads() না থাকে তাহলে localStorage থেকেও
   * সরাসরি নেওয়া হবে।
   */

  if(!Array.isArray(allAds)){

    allAds = [];

  }


  if(!allAds.length){

    try{

      const raw =
        localStorage.getItem(
          "smb_ads_v1"
        );

      if(raw){

        const storedAds =
          JSON.parse(raw);

        if(
          Array.isArray(storedAds)
        ){

          allAds =
            storedAds;

        }

      }

    }catch(error){

      console.error(
        "Direct ads load error:",
        error
      );

    }

  }


  // ----------------------------------------------------------
  // Match user's advertisements
  // ----------------------------------------------------------

  const myAds =
    allAds.filter(
      function(ad){

        if(!ad) return false;


        /*
         * 1. seller_id
         */

        if(
          ad.seller_id &&
          userId
        ){

          if(
            String(ad.seller_id) ===
            userId
          ){

            return true;

          }

        }


        /*
         * 2. user_id
         */

        if(
          ad.user_id &&
          userId
        ){

          if(
            String(ad.user_id) ===
            userId
          ){

            return true;

          }

        }


        /*
         * 3. seller_email
         */

        if(
          ad.seller_email &&
          userEmail
        ){

          if(
            String(ad.seller_email)
              .trim()
              .toLowerCase() ===
            userEmail
          ){

            return true;

          }

        }


        /*
         * 4. email
         */

        if(
          ad.email &&
          userEmail
        ){

          if(
            String(ad.email)
              .trim()
              .toLowerCase() ===
            userEmail
          ){

            return true;

          }

        }


        /*
         * 5. seller name
         */

        if(
          ad.seller &&
          userName
        ){

          if(
            String(ad.seller)
              .trim()
              .toLowerCase() ===
            userName
          ){

            return true;

          }

        }


        return false;

      }
    );


  // ----------------------------------------------------------
  // No ads
  // ----------------------------------------------------------

  if(!myAds.length){

    list.innerHTML = `

      <div class="empty-ads">

        <strong>
          আপনার কোনো বিজ্ঞাপন নেই।
        </strong>

        <span>
          নতুন পণ্য বিক্রি করতে একটি বিজ্ঞাপন দিন।
        </span>

        <br><br>

        <a
          class="btn green"
          href="post-ad.html">

          ＋ বিজ্ঞাপন দিন

        </a>

      </div>

    `;

    return;

  }


  // ----------------------------------------------------------
  // Render ads
  // ----------------------------------------------------------

  list.innerHTML =
    myAds.map(
      function(ad){

        let price = "";


        try{

          if(
            typeof window.money ===
            "function"
          ){

            price =
              window.money(
                ad.price
              );

          }else{

            price =
              "৳ " +
              Number(
                ad.price || 0
              ).toLocaleString(
                "bn-BD"
              );

          }

        }catch(error){

          price =
            "৳ " +
            Number(
              ad.price || 0
            ).toLocaleString(
              "bn-BD"
            );

        }


        return `

          <article class="product">

            <div class="photo">

              ${escapeHTML(
                ad.category ||
                "বিজ্ঞাপন"
              )}

            </div>


            <div class="body">

              <span class="badge">

                ${escapeHTML(
                  ad.status ||
                  "ACTIVE"
                )}

              </span>


              <h3>

                ${escapeHTML(
                  ad.title ||
                  "Untitled"
                )}

              </h3>


              <div class="price">

                ${price}

              </div>


              <div class="meta">

                ${escapeHTML(
                  ad.location ||
                  ""
                )}

              </div>

            </div>

          </article>

        `;

      }
    ).join("");


})();

</script>


</body>
</html>
