<style>

/* ============================================================
   ROOT
============================================================ */

:root{

  --green:#0b8f4b;
  --green-dark:#05743a;
  --green-light:#eaf8ef;

  --text:#1d2923;
  --muted:#758078;

  --border:#e2eae5;
  --bg:#f7faf8;
  --card:#ffffff;

}


/* ============================================================
   BODY
============================================================ */

body{

  margin:0;

  background:
    linear-gradient(
      180deg,
      #f7faf8 0%,
      #ffffff 45%,
      #f7faf8 100%
    );

  color:var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  padding-bottom:40px;

}


a{

}


/* ============================================================
   PAGE
============================================================ */

.page{

  max-width:900px;

  margin:auto;

  padding:
    35px
    16px
    60px;

}


/* ============================================================
   BRAND
============================================================ */

.page .brand{

  display:flex;

  flex-wrap:wrap;

  align-items:center;

  width:250px;

  position:relative;

  padding-left:58px;

  color:var(--text);

}


.page .brand:before{

  content:"🛍";

  position:absolute;

  left:0;

  top:50%;

  transform:translateY(-50%);

  width:45px;

  height:45px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #0d9b55,
      #05743a
    );

  font-size:25px;

  box-shadow:
    0 8px 20px
    rgba(11,143,75,.22);

}


.page .brand b{

  width:100%;

  color:#27352e;

  font-size:19px;

  font-weight:900;

  letter-spacing:-.5px;

}


.page .brand strong{

  position:absolute;

  left:188px;

  top:0;

  color:var(--green);

  font-size:19px;

  font-weight:900;

}


.page .brand small{

  width:100%;

  margin-top:3px;

  color:#66726b;

  font-size:9px;

  font-weight:800;

  letter-spacing:1.5px;

}


/* ============================================================
   PAGE WRAP
============================================================ */

.page-wrap{

  margin-top:30px;

}


/* ============================================================
   HEADER CARD
============================================================ */

.myads-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  padding:
    25px
    28px;

  border:
    1px solid
    var(--border);

  border-radius:22px;

  background:

    radial-gradient(
      circle at 90% 20%,
      rgba(105,245,165,.16),
      transparent 35%

    linear-gradient(
      135deg,
      #ffffff,
      #f2fbf5
    );

  box-shadow:
    0 15px 40px
    rgba(30,55,42,.06);

}


.header-eyebrow{

  display:inline-block;

  margin-bottom:8px;

  padding:
    6px
    10px;

  border-radius:50px;

  background:
    var(--green-light);

  color:
    var(--green);

  font-size:8px;

  font-weight:900;

  letter-spacing:1.4px;

}


.myads-header h2{

  margin:0;

  color:#26362d;

  font-size:25px;

  font-weight:900;

}


.myads-header p{

  margin:
    7px
    0
    0;

  color:
    var(--muted);

  font-size:11px;

}


/* ============================================================
   BUTTON
============================================================ */

.add-ad-btn{

  flex-shrink:0;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  min-height:46px;

  padding:
    0
    18px;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #0d9b55,
      #05743a
    );

  color:#fff;

  font-size:11px;

  font-weight:900;

  box-shadow:
    0 10px 22px
    rgba(11,143,75,.20);

  transition:.2s ease;

}


.add-ad-btn:hover{

  transform:
    translateY(-2px);

}


/* ============================================================
   LOADING
============================================================ */

.ads-loading{

  margin-top:22px;

  padding:
    55px
    20px;

  text-align:center;

  color:
    var(--muted);

  font-size:12px;

  border:
    1px solid
    var(--border);

  border-radius:20px;

  background:#fff;

  box-shadow:
    0 12px 35px
    rgba(30,55,42,.05);

}


/* ============================================================
   PRODUCTS GRID
============================================================ */

.products{

  display:grid;

  grid-template-columns:
    repeat(
      3,
      minmax(0,1fr)
    );

  gap:18px;

  margin-top:22px;

}


/* ============================================================
   PRODUCT CARD
============================================================ */

.product{

  position:relative;

  overflow:hidden;

  border:
    1px solid
    var(--border);

  border-radius:19px;

  background:
    var(--card);

  box-shadow:
    0 8px 25px
    rgba(30,55,42,.05);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    border-color .2s ease;

}


/* ============================================================
   PUBLISHED
============================================================ */

.published-ad{

  cursor:pointer;

}


.published-ad:hover{

  transform:
    translateY(-4px);

  border-color:
    rgba(11,143,75,.35);

  box-shadow:
    0 18px 35px
    rgba(30,55,42,.10);

}


/* ============================================================
   PENDING
============================================================ */

.pending-ad{

  background:
    linear-gradient(
      180deg,
      #fff,
      #fffcf5
    );

}


/* ============================================================
   PHOTO
============================================================ */

.product .photo{

  position:relative;

  width:100%;

  aspect-ratio:
    4 / 3;

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    #f1f6f3;

  color:
    var(--green);

}


.product .photo img{

  width:100%;

  height:100%;

  display:block;

  object-fit:cover;

}


/* ============================================================
   PRODUCT BODY
============================================================ */

.product .body{

  padding:
    15px;

}


/* ============================================================
   BADGE
============================================================ */

.badge{

  display:inline-flex;

  align-items:center;

  padding:
    5px
    8px;

  border-radius:50px;

  font-size:8px;

  font-weight:900;

  letter-spacing:.6px;

  color:
    var(--green);

  background:
    var(--green-light);

  border:
    1px solid
    rgba(11,143,75,.10);

}


.pending-ad .badge{

  color:
    #b57b00;

  background:
    #fff7df;

  border-color:
    #f1dfa9;

}


/* ============================================================
   TITLE
============================================================ */

.product h3{

  margin:
    11px
    0
    7px;

  color:
    #26362d;

  font-size:14px;

  line-height:1.45;

  font-weight:850;

  overflow:hidden;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

}


/* ============================================================
   PRICE
============================================================ */

.price{

  color:
    var(--green);

  font-size:16px;

  font-weight:900;

}


/* ============================================================
   META
============================================================ */

.meta{

  margin-top:8px;

  color:
    var(--muted);

  font-size:9px;

}


/* ============================================================
   PENDING MESSAGE
============================================================ */

.pending-message{

  margin-top:12px;

  padding:
    9px
    10px;

  border-radius:10px;

  background:
    #fff9ea;

  border:
    1px solid
    #f3e3b8;

  color:
    #92752d;

  font-size:9px;

  line-height:1.5;

}


/* ============================================================
   EMPTY
============================================================ */

.empty-ads{

  grid-column:
    1 / -1;

  padding:
    55px
    20px;

  text-align:center;

  border:
    1px solid
    var(--border);

  border-radius:20px;

  background:#fff;

  box-shadow:
    0 12px 35px
    rgba(30,55,42,.05);

}


.empty-icon{

  width:58px;

  height:58px;

  margin:
    0
    auto
    15px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:
    var(--green-light);

  font-size:26px;

}


.empty-ads strong{

  display:block;

  color:
    #26362d;

  margin-bottom:8px;

  font-size:15px;

}


.empty-ads span{

  color:
    var(--muted);

  font-size:10px;

}


/* ============================================================
   BACK BUTTON
============================================================ */

.back-link{

  display:inline-flex;

  align-items:center;

  gap:6px;

  margin-bottom:18px;

  color:
    var(--muted);

  font-size:11px;

  font-weight:700;

}


.back-link:hover{

  color:
    var(--green);

}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:700px){

  .products{

    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)

  }

  }

}


@media(max-width:600px){

  .page{

    padding:
      22px

  }


  .page .brand{

    width:190px;

  }


  .page .brand:before{

    width:38px;

    height:38px;

  }


  .page .brand b{

  }


  .page .brand strong{

    position:static;

    width:auto;

    margin-left:4px;

    font-size:14px;

  }


  .page .brand small{

  }


  .page-wrap{

  }


  .myads-header{

    align-items:flex-start;

    gap:16px;

  }


  .myads-header h2{

  .myads-header p{

  }


  .add-ad-btn{

  }

    gap:10px;

    margin-top:16px;

  }

  }


  .product .body{

  }

    font-size:8px;

  }


  .pending-message{

    font-size:8px;

    padding:7px;

  }

}

</style>

<script src="supabase.js?v=12"></script>


<script>

(async function(){

"use strict";


/* ============================================================
   CONFIG
==================================== */

const SUPA_URL =
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


/* ============================================================
   ELEMENT
============================================================ */

const list =
  document.getElementById(
    "list"
  );


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* ============================================================
   GET CURRENT USER
============================================================ */

async function getUser(){

  /* ----------------------------------------------------------
     Supabase user
  ---------------------------------------------------------- */

  try{

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        await getCurrentUser();


      if(user){

        const metadata =
          user.user_metadata || {};


        const profile = {

          id:
            user.id || "",

          name:
            metadata.full_name ||
            metadata.name ||
            "",

          email:
            user.email ||
            "",

          phone:
            metadata.phone ||
            "",

          avatar:
            metadata.avatar_url ||
            metadata.picture ||
            ""

        };


        localStorage.setItem(
          "smb_user_v1",
          JSON.stringify(
            profile
          )
        );


        return profile;

      }

    }

  }catch(error){

    console.error(
      "Current user error:",
      error
    );

  }


  /* ----------------------------------------------------------
     Local backup
  ---------------------------------------------------------- */

  try{

    const raw =
      localStorage.getItem(
        "smb_user_v1"
      );


    if(raw){

      const user =
        JSON.parse(raw);


      if(
        user &&
        user.id
      ){

        return user;

      }

    }

  }catch(error){

    console.error(
      "Local user error:",
      error
    );

  }


  return null;

}


/* ============================================================
   GET SESSION
============================================================ */

async function getSession(){

  try{

    if(
      typeof getSbSession ===
      "function"
    ){

      const session =
        await getSbSession();


      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }

  }catch(error){

    console.error(
      "Session error:",
      error
    );

  }


  return null;

}


/* ============================================================
   LOAD USER ADS
============================================================ */

async function loadMyAds(
  user
){

  const session =
    await getSession();


  if(
    !session ||
    !session.access_token
  ){

    throw new Error(
      "Login session পাওয়া যায়নি। আবার Google Login করুন।"
    );

  }


  /*
   * seller_id অথবা user_id —
   * যেকোনো একটিতে current user থাকলেই
   * বিজ্ঞাপনটি দেখানো হবে।
   */

  const userId =
    encodeURIComponent(
      user.id
    );


  const url =
    SUPA_URL +
    "/rest/v1/ads" +
    "?or=" +
    encodeURIComponent(
      "(seller_id.eq." +
      userId +
      ",user_id.eq." +
      userId +
      ")"
    ) +
    "&order=created_at.desc";


  const response =
    await fetch(
      url,
      {

        method:"GET",

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    const text =
      await response.text();


    throw new Error(
      "বিজ্ঞাপন লোড করা যায়নি: " +
      text
    );

  }


  return await response.json();

}


/* ============================================================
   GET FIRST IMAGE
============================================================ */

function getFirstImage(ad){

  const images =
    ad.image_urls;


  /*
   * Supabase ARRAY
   */

  if(
    Array.isArray(images) &&
    images.length > 0
  ){

    return images[0];

  }


  /*
   * যদি JSON string হয়
   */

  if(
    typeof images ===
    "string"
  ){

    try{

      const parsed =
        JSON.parse(
          images
        );


      if(
        Array.isArray(parsed) &&
        parsed.length > 0
      ){

        return parsed[0];

      }

    }catch(error){

      /*
       * সরাসরি URL হলে
       */

      if(
        images.startsWith(
          "http"
        )
      ){

        return images;

      }

    }

  }


  return "";

}


/* ============================================================
   STATUS
============================================================ */

function normalizeStatus(
  status
){

  return String(
    status ||
    "pending"
  )
  .trim()
  .toLowerCase();

}


/* ============================================================
   STATUS TEXT
============================================================ */

function statusText(
  status
){

  if(
    status ===
    "pending"
  ){

    return "PENDING";

  }


  if(
    status ===
    "approved" ||

    status ===
    "published" ||

    status ===
    "active"
  ){

    return "PUBLISHED";

  }


  if(
    status ===
    "rejected"
  ){

    return "REJECTED";

  }


  return status.toUpperCase();

}


/* ============================================================
   MONEY
============================================================ */

function money(
  value
){

  try{

    if(
      typeof window.money ===
      "function"
    ){

      return window.money(
        value
      );

    }

  }catch(error){}


  return (
    "৳ " +
    Number(
      value || 0
    ).toLocaleString(
      "bn-BD"
    )
  );

}


/* ============================================================
   RENDER ADS
============================================================ */

function renderAds(
  ads
){

  if(
    !Array.isArray(ads) ||
    ads.length === 0
  ){

    list.innerHTML = `

      <div class="empty-ads">

        <strong>
          আপনার কোনো বিজ্ঞাপন নেই।
        </strong>

        <span>
          নতুন পণ্য বিক্রি করতে একটি বিজ্ঞাপন দিন।
        </span>

        <br><br>

        <a
          class="btn green"
          href="post-ad.html">

          ＋ বিজ্ঞাপন দিন

        </a>

      </div>

    `;

    return;

  }


  list.innerHTML =
    ads.map(
      function(ad){

        const status =
          normalizeStatus(
            ad.status
          );


        const isPending =
          status ===
          "pending";


        const isPublished =
          status ===
            "approved" ||

          status ===
            "published" ||

          status ===
            "active";


        const image =
          getFirstImage(
            ad
          );


        const statusClass =
          isPending
          ? "pending-ad"
          : isPublished
          ? "published-ad"
          : "";


        /* ----------------------------------------------------
           IMAGE
        ---------------------------------------------------- */

        let photoHTML;


        if(image){

          photoHTML = `

            <div class="photo">

              <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(
                  ad.title ||
                  "বিজ্ঞাপন"
                )}"
                loading="lazy"
              >

            </div>

          `;

        }else{

          photoHTML = `

            <div class="photo">

              <span>

                ${escapeHTML(
                  ad.category ||
                  "বিজ্ঞাপন"
                )}

              </span>

            </div>

          `;

        }


        /* ----------------------------------------------------
           CLICK
        ---------------------------------------------------- */

        let clickAttribute =
          "";


        /*
         * Pending:
         * কোনো onclick থাকবে না।
         */

        if(
          isPublished
        ){

          /*
           * Approved হলে homepage-এ যাবে।
           * Hash হিসেবে ad.id পাঠানো হচ্ছে।
           */

          clickAttribute = `

            onclick="
              window.location.href =
              'index.html#${encodeURIComponent(
                ad.id
              )}'
            "

          `;

        }


        /* ----------------------------------------------------
           PENDING MESSAGE
        ---------------------------------------------------- */

        const pendingMessage =
          isPending

          ?

          `

            <div
              class="pending-message"
            >

              ⏳ Admin approval-এর অপেক্ষায়

            </div>

          `

          :

          "";


        /* ----------------------------------------------------
           CARD
        ---------------------------------------------------- */

        return `

          <article
            class="product ${statusClass}"
            ${clickAttribute}
          >

            ${photoHTML}


            <div class="body">


              <span
                class="badge"
              >

                ${escapeHTML(
                  statusText(
                    status
                  )
                )}

              </span>


              <h3>

                ${escapeHTML(
                  ad.title ||
                  "Untitled"
                )}

              </h3>


              <div class="price">

                ${money(
                  ad.price
                )}

              </div>


              <div class="meta">

                ${escapeHTML(
                  ad.location ||
                  ""
                )}

              </div>


              ${pendingMessage}


            </div>

          </article>

        `;

      }
    ).join("");

}


/* ============================================================
   INITIALIZE
============================================================ */

async function initialize(){

  let user =
    await getUser();


  /*
   * Session একটু দেরিতে তৈরি হলে
   * আবার চেষ্টা করবে।
   */

  if(!user){

    await new Promise(
      function(resolve){

        setTimeout(
          resolve,
          1000
        );

      }
    );


    user =
      await getUser();

  }


  /*
   * Login না থাকলে
   */

  if(!user){

    list.innerHTML = `

      <div class="empty-ads">

        <strong>
          আপনার বিজ্ঞাপন দেখতে Login করুন
        </strong>

        <span>
          আপনার নিজের বিজ্ঞাপনগুলো এখানে দেখা যাবে।
        </span>

        <br><br>

        <a
          class="btn green"
          href="login.html?next=my-ads.html">

          Google দিয়ে Login করুন

        </a>

      </div>

    `;

    return;

  }


  /*
   * Ads load
   */

  try{

    const ads =
      await loadMyAds(
        user
      );


    renderAds(
      ads
    );


  }catch(error){

    console.error(
      "MY ADS ERROR:",
      error
    );


    list.innerHTML = `

      <div class="empty-ads">

        <strong>
          বিজ্ঞাপন লোড করা যায়নি
        </strong>

        <span>
          ${escapeHTML(
            error.message ||
            "দয়া করে আবার চেষ্টা করুন।"
          )}
        </span>

        <br><br>

        <button
          class="btn green"
          type="button"
          onclick="location.reload()"
        >

          আবার চেষ্টা করুন

        </button>

      </div>

    `;

  }

}


/* ============================================================
   START
============================================================ */

initialize();


})();

</script>

</body>
</html>
