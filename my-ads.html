/* ============================================================
   PAGE
============================================================ */

.page{
  padding:35px 16px 110px;
}

.page-wrap{
  max-width:900px;
  margin:30px auto 0;
}


/* ============================================================
   LOADING
============================================================ */

.ads-loading{
  padding:55px 20px;
  text-align:center;
  color:#718078;
}


/* ============================================================
   EMPTY
============================================================ */

.empty-ads{
  padding:45px 20px;
  text-align:center;

  border:1px solid
    rgba(105,245,165,.12);

  border-radius:18px;

  background:
    rgba(5,14,10,.7);
}

.empty-ads strong{
  display:block;

  color:#eaf5ef;

  margin-bottom:8px;
}

.empty-ads span{
  color:#718078;
  font-size:10px;
}


/* ============================================================
   PRODUCT
============================================================ */

.product{
  position:relative;
  overflow:hidden;

  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}


/* ============================================================
   CLICKABLE PUBLISHED ADS
============================================================ */

.published-ad{
  cursor:pointer;
}

.published-ad:hover{
  transform:translateY(-2px);

  border-color:
    rgba(105,245,165,.28);

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.22);
}


/* ============================================================
   PENDING ADS
============================================================ */

.pending-ad{
  cursor:default !important;
}

.pending-ad *{
  cursor:default !important;
}


/* ============================================================
   PHOTO
============================================================ */

.product .photo{

  position:relative;

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:center;

  min-height:180px;

  background:#07110c;

  color:#69f5a5;
}


/* ============================================================
   PHOTO IMAGE
============================================================ */

.product .photo img{

  width:100%;

  height:100%;

  min-height:180px;

  display:block;

  object-fit:cover;

}


/* ============================================================
   PENDING IMAGE
============================================================ */

.pending-ad .photo{

  border-bottom:
    1px solid
    rgba(242,201,76,.10);

}


/* ============================================================
   BADGE
============================================================ */

.pending-ad .badge{

  color:#f2c94c;

  border-color:
    rgba(242,201,76,.25);

  background:
    rgba(242,201,76,.07);

}


/* ============================================================
   PUBLISHED BADGE
============================================================ */

.published-ad .badge{

  color:#69f5a5;

}


/* ============================================================
   PENDING MESSAGE
============================================================ */

.pending-message{

  margin-top:9px;

  padding:7px 9px;

  border-radius:8px;

  background:
    rgba(242,201,76,.055);

  border:
    1px solid
    rgba(242,201,76,.10);

  color:#bca85f;

  font-size:9px;

  line-height:1.5;

}


/* ============================================================
   MOBILE
============================================================ */

  .product .photo{

    min-height:150px;

  }

  .product .photo img{

    min-height:150px;

<script src="supabase.js?v=12"></script>


<script>

(async function(){

"use strict";


/* ============================================================
   CONFIG
============================================================ */

const SUPA_URL =
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SUPA_KEY =
  window.SUPABASE_ANON_KEY ||
  window.supabaseAnonKey ||
  "";


/* ============================================================
   ELEMENT
============================================================ */

const list =
  document.getElementById(
    "list"
  );


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* ============================================================
   GET CURRENT USER
============================================================ */

async function getUser(){

  /* ----------------------------------------------------------
     Supabase user
  ---------------------------------------------------------- */

  try{

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        await getCurrentUser();


      if(user){

        const metadata =
          user.user_metadata || {};


        const profile = {

          id:
            user.id || "",

          name:
            metadata.full_name ||
            metadata.name ||
            "",

          email:
            user.email ||
            "",

          phone:
            metadata.phone ||
            "",

          avatar:
            metadata.avatar_url ||
            metadata.picture ||
            ""

        };


        localStorage.setItem(
          "smb_user_v1",
          JSON.stringify(
            profile
          )
        );


        return profile;

      }

    }

  }catch(error){

    console.error(
      "Current user error:",
      error
    );

  }


  /* ----------------------------------------------------------
     Local backup
  ---------------------------------------------------------- */

  try{

    const raw =
      localStorage.getItem(
        "smb_user_v1"
      );


    if(raw){

      const user =
        JSON.parse(raw);


      if(
        user &&
        user.id
      ){

        return user;

      }

    }

  }catch(error){

    console.error(
      "Local user error:",
      error
    );

  }


  return null;

}


/* ============================================================
   GET SESSION
============================================================ */

async function getSession(){

  try{

    if(
      typeof getSbSession ===
      "function"
    ){

      const session =
        await getSbSession();


      if(
        session &&
        session.access_token
      ){

        return session;

      }

    }

  }catch(error){

    console.error(
      "Session error:",
      error
    );

  }


  return null;

}


/* ============================================================
   LOAD USER ADS
============================================================ */

async function loadMyAds(
  user
){

  const session =
    await getSession();


  if(
    !session ||
    !session.access_token
  ){

    throw new Error(
      "Login session পাওয়া যায়নি। আবার Google Login করুন।"
    );

  }


  /*
   * seller_id অথবা user_id —
   * যেকোনো একটিতে current user থাকলেই
   * বিজ্ঞাপনটি দেখানো হবে।
   */

  const userId =
    encodeURIComponent(
      user.id
    );


  const url =
    SUPA_URL +
    "/rest/v1/ads" +
    "?or=" +
    encodeURIComponent(
      "(seller_id.eq." +
      userId +
      ",user_id.eq." +
      userId +
      ")"
    ) +
    "&order=created_at.desc";


  const response =
    await fetch(
      url,
      {

        method:"GET",

        headers:{

          "apikey":
            SUPA_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    const text =
      await response.text();


    throw new Error(
      "বিজ্ঞাপন লোড করা যায়নি: " +
      text
    );

  }


  return await response.json();

}


/* ============================================================
   GET FIRST IMAGE
============================================================ */

function getFirstImage(ad){

  const images =
    ad.image_urls;


  /*
   * Supabase ARRAY
   */

  if(
    Array.isArray(images) &&
    images.length > 0
  ){

    return images[0];

  }


  /*
   * যদি JSON string হয়
   */

  if(
    typeof images ===
    "string"
  ){

    try{

      const parsed =
        JSON.parse(
          images
        );


      if(
        Array.isArray(parsed) &&
        parsed.length > 0
      ){

        return parsed[0];

      }

    }catch(error){

      /*
       * সরাসরি URL হলে
       */

      if(
        images.startsWith(
          "http"
        )
      ){

        return images;

      }

    }

  }


  return "";

}


/* ============================================================
   STATUS
============================================================ */

function normalizeStatus(
  status
){

  return String(
    status ||
    "pending"
  )
  .trim()
  .toLowerCase();

}


/* ============================================================
   STATUS TEXT
============================================================ */

function statusText(
  status
){

  if(
    status ===
    "pending"
  ){

    return "PENDING";

  }


  if(
    status ===
    "approved" ||

    status ===
    "published" ||

    status ===
    "active"
  ){

    return "PUBLISHED";

  }


  if(
    status ===
    "rejected"
  ){

    return "REJECTED";

  }


  return status.toUpperCase();

}


/* ============================================================
   MONEY
============================================================ */

function money(
  value
){

  try{

    if(
      typeof window.money ===
      "function"
    ){

      return window.money(
        value
      );

    }

  }catch(error){}


  return (
    "৳ " +
    Number(
      value || 0
    ).toLocaleString(
      "bn-BD"
    )
  );

}


/* ============================================================
   RENDER ADS
============================================================ */

function renderAds(
  ads
){

  if(
    !Array.isArray(ads) ||
    ads.length === 0
  ){

    list.innerHTML = `

      <div class="empty-ads">

        <strong>
          আপনার কোনো বিজ্ঞাপন নেই।
        </strong>

        <span>
          নতুন পণ্য বিক্রি করতে একটি বিজ্ঞাপন দিন।
        </span>

        <br><br>

        <a
          class="btn green"
          href="post-ad.html">

          ＋ বিজ্ঞাপন দিন

        </a>

      </div>

    `;

    return;

  }


  list.innerHTML =
    ads.map(
      function(ad){

        const status =
          normalizeStatus(
            ad.status
          );


        const isPending =
          status ===
          "pending";


        const isPublished =
          status ===
            "approved" ||

          status ===
            "published" ||

          status ===
            "active";


        const image =
          getFirstImage(
            ad
          );


        const statusClass =
          isPending
          ? "pending-ad"
          : isPublished
          ? "published-ad"
          : "";


        /* ----------------------------------------------------
           IMAGE
        ---------------------------------------------------- */

        let photoHTML;


        if(image){

          photoHTML = `

            <div class="photo">

              <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(
                  ad.title ||
                  "বিজ্ঞাপন"
                )}"
                loading="lazy"
              >

            </div>

          `;

        }else{

          photoHTML = `

            <div class="photo">

              <span>

                ${escapeHTML(
                  ad.category ||
                  "বিজ্ঞাপন"
                )}

              </span>

            </div>

          `;

        }


        /* ----------------------------------------------------
           CLICK
        ---------------------------------------------------- */

        let clickAttribute =
          "";


        /*
         * Pending:
         * কোনো onclick থাকবে না।
         */

        if(
          isPublished
        ){

          /*
           * Approved হলে homepage-এ যাবে।
           * Hash হিসেবে ad.id পাঠানো হচ্ছে।
           */

          clickAttribute = `

            onclick="
              window.location.href =
              'index.html#${encodeURIComponent(
                ad.id
              )}'
            "

          `;

        }


        /* ----------------------------------------------------
           PENDING MESSAGE
        ---------------------------------------------------- */

        const pendingMessage =
          isPending

          ?

          `

            <div
              class="pending-message"
            >

              ⏳ Admin approval-এর অপেক্ষায়

            </div>

          `

          :

          "";


        /* ----------------------------------------------------
           CARD
        ---------------------------------------------------- */

        return `

          <article
            class="product ${statusClass}"
            ${clickAttribute}
          >

            ${photoHTML}


            <div class="body">


              <span
                class="badge"
              >

                ${escapeHTML(
                  statusText(
                    status
                  )
                )}

              </span>


              <h3>

                ${escapeHTML(
                  ad.title ||
                  "Untitled"
                )}

              </h3>


              <div class="price">

                ${money(
                  ad.price
                )}

              </div>


              <div class="meta">

                ${escapeHTML(
                  ad.location ||
                  ""
                )}

              </div>


              ${pendingMessage}


            </div>

          </article>

        `;

      }
    ).join("");

}


/* ============================================================
   INITIALIZE
============================================================ */

async function initialize(){

  let user =
    await getUser();


  /*
   * Session একটু দেরিতে তৈরি হলে
   * আবার চেষ্টা করবে।
   */

  if(!user){

    await new Promise(
      function(resolve){

        setTimeout(
          resolve,
          1000
        );

      }
    );


    user =
      await getUser();

  }


  /*
   * Login না থাকলে
   */

  if(!user){

    list.innerHTML = `

      <div class="empty-ads">

        <strong>
          আপনার বিজ্ঞাপন দেখতে Login করুন
        </strong>

        <span>
          আপনার নিজের বিজ্ঞাপনগুলো এখানে দেখা যাবে।
        </span>

        <br><br>

        <a
          class="btn green"
          href="login.html?next=my-ads.html">

          Google দিয়ে Login করুন

        </a>

      </div>

    `;

    return;

  }


  /*
   * Ads load
   */

  try{

    const ads =
      await loadMyAds(
        user
      );


    renderAds(
      ads
    );


  }catch(error){

    console.error(
      "MY ADS ERROR:",
      error
    );


    list.innerHTML = `

      <div class="empty-ads">

        <strong>
          বিজ্ঞাপন লোড করা যায়নি
        </strong>

        <span>
          ${escapeHTML(
            error.message ||
            "দয়া করে আবার চেষ্টা করুন।"
          )}
        </span>

        <br><br>

        <button
          class="btn green"
          type="button"
          onclick="location.reload()"
        >

          আবার চেষ্টা করুন

        </button>

      </div>

    `;

  }

}


/* ============================================================
   START
============================================================ */

initialize();


})();

</script>
