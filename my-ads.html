<!doctype html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>আমার বিজ্ঞাপন | শাহমাহমুদপুর বাজার</title>

<link rel="stylesheet" href="style.css">

<style>
.page{
  padding:35px 16px 100px;
}

.page-wrap{
  max-width:900px;
  margin:30px auto 0;
}

.ads-loading{
  padding:50px 20px;
  text-align:center;
  color:#718078;
}

.empty-ads{
  padding:45px 20px;
  text-align:center;
  border:1px solid rgba(105,245,165,.12);
  border-radius:18px;
  background:rgba(5,14,10,.7);
}

.empty-ads strong{
  display:block;
  color:#eaf5ef;
  margin-bottom:8px;
}

.empty-ads span{
  color:#718078;
  font-size:10px;
}

.product .photo{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100px;
  color:#69f5a5;
}
</style>
</head>


<body>

<main class="container page">

  <a href="index.html" class="brand">

    <b>শাহমাহমুদপুর</b>
    <strong>বাজার</strong>

    <small>LOCAL MARKETPLACE</small>

  </a>


  <div class="page-wrap">

    <div
      class="section-title"
      style="margin-top:30px">

      <div>
        <small>MY MARKETPLACE</small>
        <h2>আমার বিজ্ঞাপন</h2>
      </div>

      <a
        class="btn green"
        href="post-ad.html">
        ＋ বিজ্ঞাপন দিন
      </a>

    </div>


    <div
      id="list"
      class="products">

      <div class="ads-loading">
        বিজ্ঞাপন লোড হচ্ছে...
      </div>

    </div>

  </div>

</main>


<nav class="mobile-nav">

  <a href="index.html">
    <span>⌂</span>
    Home
  </a>

  <a href="favorites.html">
    <span>♡</span>
    Saved
  </a>

  <a href="post-ad.html">
    <span>⊞</span>
    Sell
  </a>

  <a href="messages.html">
    <span>▤</span>
    Messages
  </a>

  <a
    class="active"
    href="profile.html">
    <span>♙</span>
    Profile
  </a>

</nav>


<script src="supabase.js?v=9"></script>
<script src="app.js?v=9"></script>


<script>

(async function(){

  const list =
    document.getElementById("list");


  function escapeHTML(value){

    return String(value || "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  /*
   * প্রথমে আমাদের নতুন Supabase session নেওয়া হবে।
   */

  let user = null;


  try{

    if(
      typeof getCurrentUser ===
      "function"
    ){

      user =
        await getCurrentUser();

    }


    /*
     * Supabase থেকে user না পেলে
     * local Google profile backup ব্যবহার।
     */

    if(!user){

      const saved =
        localStorage.getItem(
          "smb_user_v1"
        );

      if(saved){

        try{

          const localUser =
            JSON.parse(saved);

          if(
            localUser &&
            localUser.email
          ){

            user = {

              id:
                localUser.id || "",

              email:
                localUser.email,

              user_metadata:{
                name:
                  localUser.name || ""
              }

            };

          }

        }catch(e){}

      }

    }


    /*
     * কোনো user না থাকলে Login page।
     */

    if(!user){

      window.location.href =
        "login.html";

      return;

    }


    /*
     * User information
     */

    const metadata =
      user.user_metadata || {};

    const userName =
      metadata.full_name ||
      metadata.name ||
      "";

    const userEmail =
      user.email ||
      "";


    /*
     * app.js-এর ads() ব্যবহার করছি।
     */

    let allAds = [];


    if(
      typeof ads ===
      "function"
    ){

      allAds = ads() || [];

    }


    /*
     * Google account-এর email অথবা
     * user ID দিয়ে matching করার চেষ্টা।
     */

    const myAds =
      allAds.filter(function(ad){

        if(!ad) return false;


        /*
         * যদি seller_id থাকে,
         * সেটাকে অগ্রাধিকার।
         */

        if(
          ad.seller_id &&
          user.id
        ){

          return String(ad.seller_id) ===
                 String(user.id);

        }


        /*
         * Email দিয়ে match।
         */

        if(
          ad.seller_email &&
          userEmail
        ){

          return String(
            ad.seller_email
          ).toLowerCase() ===
          String(
            userEmail
          ).toLowerCase();

        }


        /*
         * পুরোনো data হলে seller name
         * দিয়ে match করার চেষ্টা।
         */

        if(
          ad.seller &&
          userName
        ){

          return String(ad.seller)
            .trim()
            .toLowerCase() ===
          String(userName)
            .trim()
            .toLowerCase();

        }


        return false;

      });


    /*
     * কোনো বিজ্ঞাপন নেই
     */

    if(!myAds.length){

      list.innerHTML = `
        <div class="empty-ads">

          <strong>
            আপনার কোনো বিজ্ঞাপন নেই।
          </strong>

          <span>
            নতুন পণ্য বিক্রি করতে একটি বিজ্ঞাপন দিন।
          </span>

          <br><br>

          <a
            class="btn green"
            href="post-ad.html">
            ＋ বিজ্ঞাপন দিন
          </a>

        </div>
      `;

      return;

    }


    /*
     * বিজ্ঞাপন দেখানো
     */

    list.innerHTML =
      myAds.map(function(x){

        let price = "";

        try{

          if(
            typeof money ===
            "function"
          ){

            price =
              money(x.price);

          }else{

            price =
              "৳ " +
              Number(x.price || 0)
                .toLocaleString("bn-BD");

          }

        }catch(e){

          price =
            "৳ " +
            Number(x.price || 0)
              .toLocaleString("bn-BD");

        }


        return `
          <article class="product">

            <div class="photo">
              ${escapeHTML(
                x.category ||
                "বিজ্ঞাপন"
              )}
            </div>

            <div class="body">

              <span class="badge">
                ${escapeHTML(
                  x.status ||
                  "ACTIVE"
                )}
              </span>

              <h3>
                ${escapeHTML(
                  x.title ||
                  "Untitled"
                )}
              </h3>

              <div class="price">
                ${price}
              </div>

              <div class="meta">
                ${escapeHTML(
                  x.location ||
                  ""
                )}
              </div>

            </div>

          </article>
        `;

      }).join("");


  }catch(error){

    console.error(
      "My Ads Error:",
      error
    );

    list.innerHTML = `
      <div class="empty-ads">

        <strong>
          বিজ্ঞাপন লোড করা যায়নি।
        </strong>

        <span>
          একটু পরে আবার চেষ্টা করুন।
        </span>

      </div>
    `;

  }

})();

</script>

</body>
</html>
