<script src="supabase.js?v=10"></script>


<script>

(async function(){

"use strict";


/* ============================================================
   ELEMENTS
============================================================ */

const loading =
document.getElementById("loading");

const content =
document.getElementById("content");

const empty =
document.getElementById("empty");

const pendingSection =
document.getElementById("pendingSection");

const publishedSection =
document.getElementById("publishedSection");

const rejectedSection =
document.getElementById("rejectedSection");

const pendingList =
document.getElementById("pendingList");

const publishedList =
document.getElementById("publishedList");

const rejectedList =
document.getElementById("rejectedList");

const pendingCount =
document.getElementById("pendingCount");

const publishedCount =
document.getElementById("publishedCount");

const rejectedCount =
document.getElementById("rejectedCount");


/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ============================================================
   MONEY
============================================================ */

function formatMoney(value){

  return "৳ " +
    Number(value || 0)
      .toLocaleString("bn-BD");

}


/* ============================================================
   IMAGE
============================================================ */

function getImage(ad){

  if(
    Array.isArray(ad.image_urls) &&
    ad.image_urls.length
  ){

    return ad.image_urls[0];

  }


  if(
    typeof ad.image_urls === "string" &&
    ad.image_urls.trim()
  ){

    let value =
      ad.image_urls.trim();


    if(
      value.startsWith("{") &&
      value.endsWith("}")
    ){

      value =
        value
          .slice(1,-1)
          .split(",")[0]
          .replace(/^"/,"")
          .replace(/"$/,"");

    }


    return value;

  }


  return "";

}


/* ============================================================
   STATUS
============================================================ */

function normalizeStatus(status){

  return String(
    status || ""
  )
  .trim()
  .toLowerCase();

}


/* ============================================================
   STATUS LABEL
============================================================ */

function statusLabel(status){

  const value =
    normalizeStatus(status);


  if(value === "approved"){

    return "✓ Published";

  }


  if(value === "rejected"){

    return "✕ Rejected";

  }


  return "⏳ Pending Approval";

}


/* ============================================================
   STATUS MESSAGE
============================================================ */

function statusMessage(status){

  const value =
    normalizeStatus(status);


  if(value === "approved"){

    return "আপনার বিজ্ঞাপন Marketplace-এ প্রকাশিত হয়েছে।";

  }


  if(value === "rejected"){

    return "এই বিজ্ঞাপনটি Admin approve করেনি।";

  }


  return "আপনার বিজ্ঞাপনটি Admin approval-এর অপেক্ষায় আছে।";

}


/* ============================================================
   RENDER CARD
============================================================ */

function renderCard(ad){

  const image =
    getImage(ad);


  const status =
    normalizeStatus(
      ad.status
    );


  let statusClass =
    "status-pending";


  if(status === "approved"){

    statusClass =
      "status-approved";

  }


  if(status === "rejected"){

    statusClass =
      "status-rejected";

  }


  const photo =

    image

    ?

    `
    <div class="photo">

      <img
        class="ad-photo"
        src="${escapeHtml(image)}"
        alt="${escapeHtml(
          ad.title ||
          "বিজ্ঞাপন"
        )}"
        loading="lazy">

    </div>
    `

    :

    `
    <div class="photo">

      ${escapeHtml(
        ad.category ||
        "বিজ্ঞাপন"
      )}

    </div>
    `;


  return `

    <article
      class="product"
      onclick="
        window.location.href =
        'ad.html?id=${encodeURIComponent(
          ad.id
        )}'
      ">


      ${photo}


      <div class="body">


        <span
          class="badge ${statusClass}">

          ${statusLabel(
            ad.status
          )}

        </span>


        <h3>

          ${escapeHtml(
            ad.title ||
            "Untitled"
          )}

        </h3>


        <div class="price">

          ${formatMoney(
            ad.price
          )}

        </div>


        <div class="meta">

          📍
          ${escapeHtml(
            ad.location ||
            ""
          )}

        </div>


        <div class="status-text">

          ${statusMessage(
            ad.status
          )}

        </div>


      </div>


    </article>

  `;

}


/* ============================================================
   GET USER
============================================================ */

async function getUser(){

  /*
   * প্রথমে Supabase session
   */

  try{

    if(
      typeof window.getSbSession ===
      "function" &&

      typeof window.getCurrentUser ===
      "function"
    ){

      const session =
        window.getSbSession();


      if(
        session &&
        session.access_token
      ){

        const user =
          await window.getCurrentUser();


        if(user){

          const metadata =
            user.user_metadata || {};


          const profile = {

            id:
              user.id || "",

            name:
              metadata.full_name ||
              metadata.name ||
              "",

            email:
              user.email || "",

            phone:
              metadata.phone || "",

            avatar:
              metadata.avatar_url ||
              metadata.picture ||
              ""

          };


          localStorage.setItem(
            "smb_user_v1",
            JSON.stringify(profile)
          );


          return profile;

        }

      }

    }

  }catch(error){

    console.error(
      "Supabase user error:",
      error
    );

  }


  /*
   * Local backup
   */

  try{

    const saved =
      localStorage.getItem(
        "smb_user_v1"
      );


    if(saved){

      const user =
        JSON.parse(saved);


      if(
        user &&
        user.id &&
        user.email
      ){

        return user;

      }

    }

  }catch(error){

    console.error(
      "Local user error:",
      error
    );

  }


  return null;

}


/* ============================================================
   LOAD ADS FROM SUPABASE
============================================================ */

async function loadMyAds(user){

  const session =
    typeof window.getSbSession ===
    "function"
    ? window.getSbSession()
    : null;


  if(
    !session ||
    !session.access_token
  ){

    throw new Error(
      "আপনার Login session পাওয়া যায়নি।"
    );

  }


  const userId =
    String(
      user.id || ""
    );


  const email =
    String(
      user.email || ""
    )
    .trim()
    .toLowerCase();


  /*
   * প্রথমে seller_id দিয়ে search
   */

  let ads = [];


  const sellerUrl =
    SB_URL +
    "/rest/v1/ads" +
    "?select=*" +
    "&seller_id=eq." +
    encodeURIComponent(userId) +
    "&order=created_at.desc";


  const sellerResponse =
    await fetch(
      sellerUrl,
      {

        headers:{

          "apikey":
            SB_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(
    sellerResponse.ok
  ){

    const sellerAds =
      await sellerResponse.json();


    if(
      Array.isArray(sellerAds)
    ){

      ads =
        sellerAds;

    }

  }


  /*
   * user_id দিয়ে search
   */

  const userUrl =
    SB_URL +
    "/rest/v1/ads" +
    "?select=*" +
    "&user_id=eq." +
    encodeURIComponent(userId) +
    "&order=created_at.desc";


  const userResponse =
    await fetch(
      userUrl,
      {

        headers:{

          "apikey":
            SB_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(
    userResponse.ok
  ){

    const userAds =
      await userResponse.json();


    if(
      Array.isArray(userAds)
    ){

      ads =
        ads.concat(
          userAds
        );

    }

  }


  /*
   * Email দিয়ে search
   */

  if(email){

    const emailUrl =
      SB_URL +
      "/rest/v1/ads" +
      "?select=*" +
      "&email=eq." +
      encodeURIComponent(email) +
      "&order=created_at.desc";


    const emailResponse =
      await fetch(
        emailUrl,
        {

          headers:{

            "apikey":
              SB_KEY,

            "Authorization":
              "Bearer " +
              session.access_token,

            "Content-Type":
              "application/json"

          }

        }
      );


    if(
      emailResponse.ok
    ){

      const emailAds =
        await emailResponse.json();


      if(
        Array.isArray(emailAds)
      ){

        ads =
          ads.concat(
            emailAds
          );

      }

    }

  }


  /*
   * seller_email দিয়ে search
   */

  if(email){

    const sellerEmailUrl =
      SB_URL +
      "/rest/v1/ads" +
      "?select=*" +
      "&seller_email=eq." +
      encodeURIComponent(email) +
      "&order=created_at.desc";


    const sellerEmailResponse =
      await fetch(
        sellerEmailUrl,
        {

          headers:{

            "apikey":
              SB_KEY,

            "Authorization":
              "Bearer " +
              session.access_token,

            "Content-Type":
              "application/json"

          }

        }
      );


    if(
      sellerEmailResponse.ok
    ){

      const sellerEmailAds =
        await sellerEmailResponse.json();


      if(
        Array.isArray(
          sellerEmailAds
        )
      ){

        ads =
          ads.concat(
            sellerEmailAds
          );

      }

    }

  }


  /*
   * Duplicate remove
   */

  const unique =
    new Map();


  ads.forEach(
    function(ad){

      if(
        ad &&
        ad.id
      ){

        unique.set(
          String(ad.id),
          ad
        );

      }

    }
  );


  return Array.from(
    unique.values()
  )
  .sort(
    function(a,b){

      return new Date(
        b.created_at || 0
      ) -
      new Date(
        a.created_at || 0
      );

    }
  );

}


/* ============================================================
   SHOW ADS
============================================================ */

function showAds(ads){

  const pending =
    ads.filter(
      ad =>
        normalizeStatus(
          ad.status
        ) !== "approved" &&
        normalizeStatus(
          ad.status
        ) !== "rejected"
    );


  const published =
    ads.filter(
      ad =>
        normalizeStatus(
          ad.status
        ) === "approved"
    );


  const rejected =
    ads.filter(
      ad =>
        normalizeStatus(
          ad.status
        ) === "rejected"
    );


  /*
   * Pending
   */

  if(pending.length){

    pendingSection.style.display =
      "block";


    pendingCount.textContent =
      "(" +
      pending.length +
      ")";


    pendingList.innerHTML =
      pending
        .map(renderCard)
        .join("");

  }


  /*
   * Published
   */

  if(published.length){

    publishedSection.style.display =
      "block";


    publishedCount.textContent =
      "(" +
      published.length +
      ")";


    publishedList.innerHTML =
      published
        .map(renderCard)
        .join("");

  }


  /*
   * Rejected
   */

  if(rejected.length){

    rejectedSection.style.display =
      "block";


    rejectedCount.textContent =
      "(" +
      rejected.length +
      ")";


    rejectedList.innerHTML =
      rejected
        .map(renderCard)
        .join("");

  }


  /*
   * Nothing
   */

  if(!ads.length){

    empty.style.display =
      "block";

  }


  content.style.display =
    "block";


  loading.style.display =
    "none";

}


/* ============================================================
   SUPABASE CONFIG
============================================================ */

const SB_URL =
  window.SUPABASE_URL ||
  "https://jeupbfoceqmnpwlklche.supabase.co";


const SB_KEY =
  window.SUPABASE_ANON_KEY ||
  "";


/* ============================================================
   START
============================================================ */

try{

  const user =
    await getUser();


  if(!user){

    window.location.href =
      "login.html?next=my-ads.html";

    return;

  }


  const ads =
    await loadMyAds(
      user
    );


  showAds(ads);


}catch(error){

  console.error(
    "MY ADS ERROR:",
    error
  );


  loading.innerHTML = `

    <div>

      <strong
        style="color:#eaf5ef">

        বিজ্ঞাপন লোড করা যায়নি।

      </strong>

      <br><br>

      <small>

        ${escapeHtml(
          error.message ||
          "Unknown error"
        )}

      </small>

      <br><br>

      <a
        class="btn green"
        href="post-ad.html">

        ＋ বিজ্ঞাপন দিন

      </a>

    </div>

  `;

}


})();
</script>
