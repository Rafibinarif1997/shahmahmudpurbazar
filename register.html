<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | শাহমাহমুদপুর বাজার</title><link rel="stylesheet" href="style.css"></head><body><main class="auth"><div class="authbox"><a class="brand" href="index.html"><b>শাহমাহমুদপুর</b><strong>বাজার</strong><small>LOCAL MARKETPLACE</small></a><h1>Account তৈরি করুন</h1><form id="form"><label>পূর্ণ নাম<input id="name" required maxlength="80"></label><label>Email<input id="email" type="email" required></label><label>মোবাইল<input id="phone" required placeholder="01XXXXXXXXX"></label><label>Password<input id="password" type="password" minlength="6" required></label><label>Confirm Password<input id="confirm" type="password" minlength="6" required></label><label><input id="terms" type="checkbox" required> Terms & Conditions মেনে নিচ্ছি</label><button class="btn green">CREATE ACCOUNT →</button></form><p id="msg" class="msg"></p><p class="center"><a href="login.html">আগে account আছে? Login</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>form.onsubmit=async e=>{e.preventDefault();if(password.value!==confirm.value){msg.textContent='Password মিলছে না।';return}msg.textContent='Account তৈরি হচ্ছে...';const {data,error}=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{name:name.value.trim(),phone:phone.value.trim()}}});if(error){msg.textContent=error.message;return}if(data.session){location.href='index.html'}else{msg.textContent='Registration সফল। Email verification চালু থাকলে email verify করে login করুন।';}}</script></body></html>
