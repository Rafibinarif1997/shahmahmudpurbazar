<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | শাহমাহমুদপুর বাজার</title><link rel="stylesheet" href="style.css"></head><body><main class="auth"><div class="authbox"><a class="brand" href="index.html"><b>শাহমাহমুদপুর</b><strong>বাজার</strong><small>LOCAL MARKETPLACE</small></a><h1>Account তৈরি করুন</h1><p class="muted">কয়েকটি তথ্য দিয়ে account তৈরি করুন।</p><form id="form"><label>পূর্ণ নাম<input id="name" required maxlength="80"></label><label>Email<input id="email" type="email" required></label><label>মোবাইল<input id="phone" required placeholder="01XXXXXXXXX"></label><label>Password<input id="password" type="password" minlength="6" required></label><label>Confirm Password<input id="confirm" type="password" minlength="6" required></label><label><input id="terms" type="checkbox" required> আমি Terms & Conditions মেনে নিচ্ছি।</label><button class="btn green" style="width:100%">CREATE ACCOUNT →</button></form><p id="msg" class="msg"></p><p class="center"><a href="login.html">আগে account আছে? Login করুন</a></p></div></main><script>const USERS_KEY="smb_users_v1",USER_KEY="smb_user_v1";form.onsubmit=e=>{e.preventDefault();if(password.value!==confirm.value){msg.textContent="Password মিলছে না।";return}let u=JSON.parse(localStorage.getItem(USERS_KEY)||"[]"),em=email.value.trim().toLowerCase();if(u.some(x=>x.email===em)){msg.textContent="এই email দিয়ে account আছে।";return}let x={id:"u_"+Date.now(),name:name.value.trim(),email:em,phone:phone.value.trim(),password:password.value};u.push(x);localStorage.setItem(USERS_KEY,JSON.stringify(u));localStorage.setItem(USER_KEY,JSON.stringify(x));location.href="index.html"}</script></body></html>
