<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | শাহমাহমুদপুর বাজার</title><link rel="stylesheet" href="style.css"></head><body><main class="auth"><div class="authbox"><a class="brand" href="index.html"><b>শাহমাহমুদপুর</b><strong>বাজার</strong><small>LOCAL MARKETPLACE</small></a><h1>Account তৈরি করুন</h1><p class="muted">কয়েকটি তথ্য দিয়ে account তৈরি করুন।</p><form id="registerForm"><label>পূর্ণ নাম<input id="fullName" required maxlength="80"></label><label>Email<input id="email" type="email" required></label><label>মোবাইল<input id="phone" required placeholder="01XXXXXXXXX"></label><label>Password<input id="passwordInput" type="password" minlength="6" required></label><label>Confirm Password<input id="confirmPassword" type="password" minlength="6" required></label><label><input id="terms" type="checkbox" required> আমি Terms & Conditions মেনে নিচ্ছি।</label><button id="submitBtn" class="btn green" style="width:100%">CREATE ACCOUNT →</button></form><p id="msg" class="msg"></p><p class="center"><a href="login.html">আগে account আছে? Login করুন</a></p></div></main><script src="supabase.js"></script><script>
const form=document.getElementById("registerForm"),msg=document.getElementById("msg"),btn=document.getElementById("submitBtn");
form.addEventListener("submit",async e=>{
 e.preventDefault(); msg.textContent="";
 const password=document.getElementById("passwordInput").value;
 const confirmPassword=document.getElementById("confirmPassword").value;
 if(password!==confirmPassword){msg.textContent="Password মিলছে না।";return}
 btn.disabled=true;btn.textContent="ACCOUNT তৈরি হচ্ছে...";
 try{
const data=await auth("signup",{email:document.getElementById("email").value.trim().toLowerCase(),password,options:{email_redirect_to:"https://rafibinarif1997.github.io/shahmahmudpurbazar/verify.html"},data:{name:document.getElementById("fullName").value.trim(),phone:document.getElementById("phone").value.trim()}});
  if(data.access_token) setSbSession(data);
  if(data.user) localStorage.setItem("smb_user_v1",JSON.stringify({id:data.user.id,name:document.getElementById("fullName").value.trim(),email:data.user.email,phone:document.getElementById("phone").value.trim()}));
  msg.textContent=data.access_token?"Account তৈরি হয়েছে!":"Account তৈরি হয়েছে। Email confirmation প্রয়োজন হতে পারে।";
  if(data.access_token)setTimeout(()=>location.href="index.html",700);
 }catch(err){msg.textContent=err.message||"Registration failed."}
 finally{btn.disabled=false;btn.textContent="CREATE ACCOUNT →"}
});
</script></body></html>
